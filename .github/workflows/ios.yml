# 📱 MyPlanner 아이폰 앱 빌드
#
# 맥이 없어서 GitHub 의 맥 빌드 서버에서 앱 파일(.ipa)을 만든다.
# 서명은 하지 않는다 — 사용자가 윈도우 PC 의 AltStore 로 '무료 애플 ID' 서명을 해서 폰에 깐다.
# (무료 서명은 7일짜리라 AltStore 가 와이파이로 알아서 다시 서명한다)
#
# 결과물은 GitHub Release 에 올라가고, 폰의 사파리에서 바로 받을 수 있다:
#   https://github.com/qorwl503/Life-planner/releases/latest/download/MyPlanner.ipa
#
# 앱 화면은 GitHub Pages 사이트를 그대로 불러오므로(index.html 수정은 앱 재설치 없이 반영),
# 이 빌드는 native/ 나 이 파일이 바뀔 때만 다시 돈다.

name: iOS 앱 빌드

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - '.github/workflows/ios.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 앱 껍데기 만들기 (Capacitor)
        working-directory: native
        run: |
          npm install
          npx cap add ios
          npx cap sync ios

      # ❤️ 건강 앱(운동 기록) 읽기 — 아이폰이 '왜 필요한지' 문구를 반드시 요구한다
      - name: 건강 앱 권한 문구 넣기
        working-directory: native/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :NSHealthShareUsageDescription string '워치로 한 운동 기록(종목·시간·칼로리·거리)을 플래너 운동 탭에 자동으로 넣기 위해 읽습니다.'" Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSHealthUpdateUsageDescription string '플래너는 건강 앱에 아무것도 쓰지 않습니다.'" Info.plist

      - name: 서명 없이 빌드
        working-directory: native/ios/App
        run: |
          set -eo pipefail
          # Capacitor 버전에 따라 CocoaPods(workspace) 또는 SPM(project) 구조가 나온다
          if [ -d App.xcworkspace ]; then
            TARGET=(-workspace App.xcworkspace)
          else
            TARGET=(-project App.xcodeproj)
          fi
          xcodebuild "${TARGET[@]}" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -40

          APP=$(find build/Build/Products -maxdepth 2 -name 'App.app' -type d | head -1)
          if [ -z "$APP" ]; then echo "App.app 을 찾지 못했습니다"; exit 1; fi
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry MyPlanner.ipa Payload

          # 건강 앱 권한을 붙인 판 — 무료 애플 ID 로 이 권한이 허용되는지 시험한다.
          # 서명은 하지 않고 '권한 목록' 만 실어 둔다. AltStore 가 설치할 때 이걸 보고 권한을 요청한다.
          brew install ldid >/dev/null
          cat > health.entitlements <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.healthkit</key><true/>
            <key>com.apple.developer.healthkit.access</key><array/>
          </dict></plist>
          XML
          sed -i '' 's/^          //' health.entitlements
          ldid -Shealth.entitlements Payload/App.app/App
          ldid -e Payload/App.app/App | grep -q healthkit
          zip -qry MyPlanner-health.ipa Payload
          ls -la MyPlanner.ipa MyPlanner-health.ipa

      - name: 릴리스에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: MyPlanner 앱 ${{ github.run_number }}
          make_latest: true
          body: |
            먼저 MyPlanner-health.ipa 를 AltStore 에서 + 로 설치해 보세요 (건강 앱 운동 기록 읽기 포함).
            AltStore 가 권한 오류로 설치를 거부하면 MyPlanner.ipa 를 설치하세요 (건강 앱 연동만 빠짐).
            (화면 내용은 사이트에서 불러오므로, 사이트가 바뀌어도 앱을 다시 깔 필요는 없습니다)
          files: |
            native/ios/App/MyPlanner.ipa
            native/ios/App/MyPlanner-health.ipa
