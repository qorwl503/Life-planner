// ====== 운동 (수기 체크) ======
// 운동 탭이 보는 월 (캘린더와 별도)
let workoutViewYear = currentYear;
let workoutViewMonth = currentMonth;

function prevWorkoutMonth() {
  if (workoutViewMonth === 0) { workoutViewMonth = 11; workoutViewYear--; }
  else workoutViewMonth--;
  renderWorkout();
}
function nextWorkoutMonth() {
  if (workoutViewMonth === 11) { workoutViewMonth = 0; workoutViewYear++; }
  else workoutViewMonth++;
  renderWorkout();
}
function isWorkoutCurrentMonth() {
  return workoutViewYear === currentYear && workoutViewMonth === currentMonth;
}
function woKey(d) {
  return dateKey(workoutViewYear, workoutViewMonth, d);
}

function renderWorkout() {
  header.innerHTML = `
    <h1>운동</h1>
    <div class="header-actions">
      <button onclick="openWorkoutModal()" aria-label="추가"><i class="ti ti-plus"></i></button>
    </div>
  `;

  // 운동 탭 월 네비게이션
  const woDaysInMonth = new Date(workoutViewYear, workoutViewMonth + 1, 0).getDate();
  const woMonthStart = new Date(workoutViewYear, workoutViewMonth, 1);
  const woStartOffset = woMonthStart.getDay();

  // 통계
  const monthDone = Object.entries(workoutLog).filter(([k, v]) => k.startsWith(`${workoutViewYear}-${String(workoutViewMonth+1).padStart(2,'0')}`) && v.done);
  const monthDoneCount = monthDone.length;
  const totalKcal = monthDone.reduce((s, [k, v]) => s + (Number(v.kcal) || 0), 0);
  const totalMinutes = monthDone.reduce((s, [k, v]) => s + (Number(v.minutes) || 0), 0);

  // 이번 주 통계 (현재 보는 월이 *지금* 달일 때만)
  let weekDone = [], weekKcal = 0, streak = 0;
  if (isWorkoutCurrentMonth()) {
    const todayDow = new Date(currentYear, currentMonth, today).getDay();
    const weekStart = today - todayDow;
    const weekDays = [];
    for (let i = 0; i < 7; i++) weekDays.push(weekStart + i);
    weekDone = weekDays.filter(d => d >= 1 && d <= woDaysInMonth && workoutLog[woKey(d)]?.done);
    weekKcal = weekDone.reduce((s, d) => s + (Number(workoutLog[woKey(d)]?.kcal) || 0), 0);

    // 연속일
    for (let d = today; d >= 1; d--) {
      if (workoutLog[woKey(d)]?.done) streak++;
      else if (d < today) break;
    }
  }

  // 월 네비게이션 헤더
  let html = `
    <div style="display:flex; align-items:center; justify-content:space-between; padding:10px 14px; background:var(--bg-secondary); border-radius:var(--radius-md); margin-bottom:14px;">
      <button onclick="prevWorkoutMonth()" style="background:transparent; border:none; padding:6px 10px; cursor:pointer; color:var(--text-secondary); font-family:inherit;">
        <i class="ti ti-chevron-left" style="font-size:18px;"></i>
      </button>
      <div style="text-align:center;">
        <div style="font-size:10px; color:var(--text-tertiary);">${workoutViewYear}</div>
        <div style="font-size:16px; font-weight:600;">${monthLabels[workoutViewMonth]}</div>
      </div>
      <button onclick="nextWorkoutMonth()" style="background:transparent; border:none; padding:6px 10px; cursor:pointer; color:var(--text-secondary); font-family:inherit;">
        <i class="ti ti-chevron-right" style="font-size:18px;"></i>
      </button>
    </div>
  `;

  // 통계
  html += `
    <div style="display:flex; gap:8px; margin: 8px 0 14px;">
      <div class="stat-card" style="flex:1;">
        <div class="label">${isWorkoutCurrentMonth() ? '이번 달' : monthLabels[workoutViewMonth]}</div>
        <div class="value" style="color:var(--text-success);">${monthDoneCount}<span style="font-size:11px; color:var(--text-tertiary); font-weight:400;">/${woDaysInMonth}일</span></div>
        <div class="sub">${totalKcal.toLocaleString()} kcal</div>
      </div>`;
  if (isWorkoutCurrentMonth()) {
    html += `
      <div class="stat-card" style="flex:1;">
        <div class="label">이번 주</div>
        <div class="value" style="color:var(--text-info);">${weekDone.length}<span style="font-size:11px; color:var(--text-tertiary); font-weight:400;">/7일</span></div>
        <div class="sub">${weekKcal.toLocaleString()} kcal</div>
      </div>
      <div class="stat-card" style="flex:1;">
        <div class="label">연속</div>
        <div class="value" style="color:var(--text-warning);">${streak}<span style="font-size:11px; color:var(--text-tertiary); font-weight:400;">일</span></div>
        <div class="sub">${streak >= 3 ? '🔥 굿!' : '계속 가요'}</div>
      </div>`;
  } else {
    html += `
      <div class="stat-card" style="flex:1;">
        <div class="label">총 운동시간</div>
        <div class="value" style="color:var(--text-info); font-size:18px;">${totalMinutes}<span style="font-size:11px; color:var(--text-tertiary); font-weight:400;">분</span></div>
        <div class="sub">${Math.floor(totalMinutes/60)}시간 ${totalMinutes%60}분</div>
      </div>
      <div class="stat-card" style="flex:1;">
        <div class="label">평균</div>
        <div class="value" style="color:var(--text-warning); font-size:18px;">${monthDoneCount > 0 ? Math.round(totalKcal/monthDoneCount) : 0}<span style="font-size:11px; color:var(--text-tertiary); font-weight:400;">kcal</span></div>
        <div class="sub">/회</div>
      </div>`;
  }
  html += `</div>`;

  // 오늘 빠른 체크 (현재 월일 때만)
  if (isWorkoutCurrentMonth()) {
    const todayLog = workoutLog[todayKey()];
    html += `
      <div style="margin-bottom:14px; padding:14px; border-radius:12px; background:${todayLog?.done ? 'var(--bg-success)' : 'var(--bg-secondary)'}; border:0.5px solid ${todayLog?.done ? 'var(--text-success)' : 'var(--border-tertiary)'};">
        <div style="display:flex; align-items:center; gap:12px;">
          <div style="width:42px; height:42px; border-radius:50%; background:white; display:flex; align-items:center; justify-content:center; color:${todayLog?.done ? 'var(--text-success)' : 'var(--text-tertiary)'}; cursor:pointer;" onclick="quickToggleToday()">
            <i class="ti ${todayLog?.done ? 'ti-check' : 'ti-plus'}" style="font-size:22px;"></i>
          </div>
          <div style="flex:1;">
            <div style="font-size:14px; font-weight:600; color:${todayLog?.done ? 'var(--text-success)' : 'var(--text-primary)'};">
              ${todayLog?.done ? '오늘 운동 완료!' : '오늘 운동했어요?'}
            </div>
            <div style="font-size:11px; color:${todayLog?.done ? 'var(--text-success)' : 'var(--text-tertiary)'}; margin-top:2px; opacity:0.8;">
              ${todayLog?.done ? `${todayLog.minutes || 0}분 · ${todayLog.kcal || 0} kcal${todayLog.note ? ' · ' + todayLog.note : ''}` : '동그라미를 탭하면 바로 체크'}
            </div>
          </div>
          ${todayLog?.done ? `<button onclick="openWorkoutModal('${todayKey()}')" style="border:none; background:white; color:var(--text-success); padding:6px 12px; border-radius:999px; font-size:11px; font-weight:500; cursor:pointer; font-family:inherit;">수정</button>` : `<button onclick="openWorkoutModal('${todayKey()}')" style="border:none; background:var(--text-info); color:white; padding:6px 12px; border-radius:999px; font-size:11px; font-weight:500; cursor:pointer; font-family:inherit;">상세</button>`}
        </div>
      </div>
    `;
  }

  // 월간 체크 그리드
  html += `<div style="font-size:14px; font-weight:600; margin-bottom:8px;">${monthLabels[workoutViewMonth]} O/X 체크</div>`;
  html += `<div class="workout-month">
    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <div style="width:18px;"></div>
      <div style="flex:1; display:grid; grid-template-columns: repeat(6, 1fr); gap:4px; font-size:9px; color:var(--text-tertiary); text-align:center;">
        <span>1주</span><span>2주</span><span>3주</span><span>4주</span><span>5주</span><span>6주</span>
      </div>
    </div>`;

  for (let dow = 0; dow < 7; dow++) {
    html += `<div class="workout-row"><div class="wlb">${dayLabels[dow]}</div><div class="wcells" style="grid-template-columns: repeat(6, 1fr);">`;
    for (let week = 0; week < 6; week++) {
      const cellIdx = week * 7 + dow;
      const dayNum = cellIdx - woStartOffset + 1;
      if (cellIdx < woStartOffset || dayNum > woDaysInMonth) {
        html += `<div class="wcell empty"></div>`;
        continue;
      }
      const log = workoutLog[woKey(dayNum)];
      const isToday = dayNum === today && isWorkoutCurrentMonth();
      const isFuture = isWorkoutCurrentMonth() && dayNum > today;
      const done = log?.done;
      html += `<button class="wcell ${done?'done':''} ${isToday?'today':''} ${isFuture?'future':''}" onclick="toggleWorkoutDay(${dayNum})">${dayNum}</button>`;
    }
    html += `</div></div>`;
  }
  html += `</div>`;

  html += `<div style="font-size:10px; color:var(--text-tertiary); text-align:center; margin-bottom:14px;">
    셀을 탭하면 운동 O/X 토글 · 자세한 입력은 + 버튼
  </div>`;

  // 이번 주 일별 (현재 월일 때만)
  if (isWorkoutCurrentMonth()) {
    const todayDow = new Date(currentYear, currentMonth, today).getDay();
    const weekStart = today - todayDow;
    const weekDays = [];
    for (let i = 0; i < 7; i++) weekDays.push(weekStart + i);

    html += `<div style="font-size:14px; font-weight:600; margin: 18px 0 8px;">이번 주 상세</div>`;
    html += `<div class="card" style="padding:0 14px;">`;
    weekDays.forEach((d, i) => {
      if (d < 1 || d > woDaysInMonth) return;
      const log = workoutLog[woKey(d)];
      const isToday = d === today;
      html += `<div style="display:flex; align-items:center; gap:12px; padding:12px 0; ${i < 6 ? 'border-bottom:0.5px solid var(--border-tertiary);' : ''} cursor:pointer;" onclick="openWorkoutModal('${woKey(d)}')">
        <div style="width:30px; text-align:center;">
          <div style="font-size:10px; color:${i===0?'var(--text-danger)':i===6?'var(--text-info)':'var(--text-tertiary)'};">${dayLabels[i]}</div>
          <div style="font-size:14px; font-weight:600; ${isToday?'color:var(--text-info);':''}">${d}</div>
        </div>
        <div style="width:24px; height:24px; border-radius:50%; background:${log?.done?'var(--text-success)':'var(--bg-secondary)'}; display:flex; align-items:center; justify-content:center; color:${log?.done?'white':'var(--text-tertiary)'};">
          <i class="ti ${log?.done?'ti-check':'ti-x'}" style="font-size:12px;"></i>
        </div>
        <div style="flex:1;">
          <div style="font-size:13px; font-weight:500;">${log?.done ? (log.note || '운동 완료') : (d > today ? '예정' : '쉼')}</div>
          ${log?.done ? `<div style="font-size:10px; color:var(--text-tertiary);">${log.minutes || 0}분 · ${log.kcal || 0} kcal</div>` : ''}
        </div>
        <i class="ti ti-chevron-right" style="font-size:14px; color:var(--text-tertiary);"></i>
      </div>`;
    });
    html += `</div>`;
  } else {
    // 과거 월 - 운동한 날 목록만 보여주기
    html += `<div style="font-size:14px; font-weight:600; margin: 18px 0 8px;">${monthLabels[workoutViewMonth]} 운동 기록</div>`;
    if (monthDone.length === 0) {
      html += `<div class="empty-state"><i class="ti ti-barbell-off"></i>이 달 운동 기록이 없어요</div>`;
    } else {
      html += `<div class="card" style="padding:0 14px;">`;
      monthDone.sort(([a], [b]) => b.localeCompare(a)).forEach(([k, log], i) => {
        const [, , dStr] = k.split('-');
        const d = parseInt(dStr);
        const dow = new Date(workoutViewYear, workoutViewMonth, d).getDay();
        html += `<div style="display:flex; align-items:center; gap:12px; padding:12px 0; ${i < monthDone.length - 1 ? 'border-bottom:0.5px solid var(--border-tertiary);' : ''} cursor:pointer;" onclick="openWorkoutModal('${k}')">
          <div style="width:30px; text-align:center;">
            <div style="font-size:10px; color:var(--text-tertiary);">${dayLabels[dow]}</div>
            <div style="font-size:14px; font-weight:600;">${d}</div>
          </div>
          <div style="width:24px; height:24px; border-radius:50%; background:var(--text-success); display:flex; align-items:center; justify-content:center; color:white;">
            <i class="ti ti-check" style="font-size:12px;"></i>
          </div>
          <div style="flex:1;">
            <div style="font-size:13px; font-weight:500;">${log.note || '운동 완료'}</div>
            <div style="font-size:10px; color:var(--text-tertiary);">${log.minutes || 0}분 · ${log.kcal || 0} kcal</div>
          </div>
          <i class="ti ti-chevron-right" style="font-size:14px; color:var(--text-tertiary);"></i>
        </div>`;
      });
      html += `</div>`;
    }
  }

  // 동기부여 메시지 (현재 월일 때만)
  if (isWorkoutCurrentMonth() && monthDoneCount > 0) {
    const avgPerWeek = (monthDoneCount / Math.ceil(today / 7)).toFixed(1);
    html += `<div style="margin-top:14px; padding:12px; background:var(--bg-success); border-radius:var(--radius-md); display:flex; gap:10px; align-items:flex-start;">
      <i class="ti ti-trophy" style="font-size:16px; color:var(--text-success);"></i>
      <div style="font-size:11px; color:var(--text-success); line-height:1.6;">
        평균 주 <b style="font-weight:600;">${avgPerWeek}회</b> 운동 중! ${monthDoneCount >= 12 ? '대단해요, 이번 달 목표 달성권이에요.' : `이번 달 ${Math.max(0, 12 - monthDoneCount)}회 더 하면 목표 12회 달성!`}
      </div>
    </div>`;
  }

  // ★ 운동 유튜브 섹션
  html += `<div style="font-size:14px; font-weight:600; margin: 24px 0 8px; display:flex; align-items:center; gap:6px;">
    <i class="ti ti-brand-youtube" style="font-size:16px; color:var(--text-danger);"></i>
    운동 영상 추천
  </div>`;

  const workoutChannels = userChannels.workout;

  // 검색창
  html += `<div style="display:flex; gap:6px; margin-bottom:12px;">
    <input type="text" id="wo-yt-search" placeholder="예: 10분 복근 운동" value="${currentWorkoutYtQuery}" style="flex:1; padding:11px 12px; border:0.5px solid var(--border-tertiary); border-radius:var(--radius-md); font-size:13px; background:white; color:var(--text-primary); font-family:inherit; -webkit-appearance:none;" onkeypress="if(event.key==='Enter') woYtSearch()" />
    <button onclick="woYtSearch()" style="padding:11px 16px; border:none; border-radius:var(--radius-md); background:var(--text-danger); color:white; font-size:13px; font-weight:500; cursor:pointer; font-family:inherit;">
      <i class="ti ti-search" style="font-size:14px;"></i>
    </button>
  </div>`;

  html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
    <div style="font-size:12px; color:var(--text-secondary);">내 운동 채널 ${workoutChannels.length}개</div>
    <button onclick="openAddChannelModal('workout')" style="border:none; background:var(--text-info); color:white; padding:6px 12px; border-radius:999px; font-size:11px; font-weight:500; cursor:pointer; font-family:inherit;">+ 채널 추가</button>
  </div>`;

  if (workoutChannels.length === 0) {
    html += `<div class="empty-state" style="padding:24px 20px; margin-bottom:14px;">
      <i class="ti ti-brand-youtube"></i>
      등록된 채널이 없어요<br>
      <span style="font-size:11px; opacity:0.7;">+ 채널 추가로 등록하세요</span>
    </div>`;
  } else {
    html += `<div style="display:grid; grid-template-columns: repeat(3, 1fr); gap:8px; margin-bottom:16px;">`;
    workoutChannels.forEach(c => {
      html += `
        <div style="position:relative;">
          <button onclick="setWorkoutYtQuery('${c.q}')" style="width:100%; display:flex; flex-direction:column; align-items:center; gap:6px; padding:12px 4px; border:0.5px solid ${currentWorkoutYtQuery === c.q ? 'var(--text-danger)' : 'var(--border-tertiary)'}; border-radius:var(--radius-md); background:${currentWorkoutYtQuery === c.q ? 'var(--bg-danger)' : 'white'}; cursor:pointer; font-family:inherit;">
            <div style="width:44px; height:44px; border-radius:50%; background:var(--bg-secondary); display:flex; align-items:center; justify-content:center; font-size:20px;">
              ${c.emoji || '💪'}
            </div>
            <span style="font-size:10px; color:var(--text-primary); text-align:center; line-height:1.3; word-break:break-all;">${c.name}</span>
          </button>
          <button onclick="deleteChannel('workout', ${c.id})" style="position:absolute; top:-4px; right:-4px; width:20px; height:20px; border-radius:50%; background:var(--text-danger); color:white; border:2px solid white; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:inherit; padding:0;" aria-label="삭제">
            <i class="ti ti-x" style="font-size:11px;"></i>
          </button>
        </div>
      `;
    });
    html += `</div>`;
  }

  // 카테고리별 빠른 검색
  html += `<div style="font-size:12px; color:var(--text-secondary); margin-bottom:8px;">카테고리별 빠른 검색</div>`;
  const workoutCats = [
    { t:'10분 홈트', q:'10분 홈트 초보' },
    { t:'러닝 워밍업', q:'러닝 워밍업 스트레칭' },
    { t:'복근 운동', q:'복근 운동 홈트' },
    { t:'하체 강화', q:'하체 강화 운동' },
    { t:'요가 초보', q:'요가 초보자 입문' },
    { t:'어깨 통증', q:'어깨 통증 스트레칭' },
    { t:'다이어트', q:'다이어트 유산소 홈트' },
    { t:'아침 스트레칭', q:'아침 스트레칭 5분' },
  ];

  html += `<div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;">`;
  workoutCats.forEach(c => {
    html += `<button onclick="setWorkoutYtQuery('${c.q}')" style="padding:8px 14px; border:0.5px solid ${currentWorkoutYtQuery === c.q ? 'var(--text-danger)' : 'var(--border-tertiary)'}; border-radius:999px; background:${currentWorkoutYtQuery === c.q ? 'var(--bg-danger)' : 'white'}; color:${currentWorkoutYtQuery === c.q ? 'var(--text-danger)' : 'var(--text-secondary)'}; font-size:12px; font-weight:${currentWorkoutYtQuery === c.q ? '600' : '400'}; cursor:pointer; font-family:inherit;">${c.t}</button>`;
  });
  html += `</div>`;

  // 영상 결과
  if (currentWorkoutYtQuery) {
    html += `<div style="font-size:13px; font-weight:600; margin: 16px 0 8px;">"${currentWorkoutYtQuery}" 검색 결과</div>
    <div style="display:flex; gap:6px; margin-bottom:10px; overflow-x:auto;">
      <button onclick="setWorkoutYtOrder('relevance')" style="padding:6px 12px; border:0.5px solid ${currentWorkoutYtOrder === 'relevance' ? 'var(--text-danger)' : 'var(--border-tertiary)'}; border-radius:999px; background:${currentWorkoutYtOrder === 'relevance' ? 'var(--bg-danger)' : 'white'}; color:${currentWorkoutYtOrder === 'relevance' ? 'var(--text-danger)' : 'var(--text-secondary)'}; font-size:11px; cursor:pointer; font-family:inherit; white-space:nowrap;">⚡ 관련성순</button>
      <button onclick="setWorkoutYtOrder('date')" style="padding:6px 12px; border:0.5px solid ${currentWorkoutYtOrder === 'date' ? 'var(--text-danger)' : 'var(--border-tertiary)'}; border-radius:999px; background:${currentWorkoutYtOrder === 'date' ? 'var(--bg-danger)' : 'white'}; color:${currentWorkoutYtOrder === 'date' ? 'var(--text-danger)' : 'var(--text-secondary)'}; font-size:11px; cursor:pointer; font-family:inherit; white-space:nowrap;">🆕 최신순</button>
      <button onclick="setWorkoutYtOrder('viewCount')" style="padding:6px 12px; border:0.5px solid ${currentWorkoutYtOrder === 'viewCount' ? 'var(--text-danger)' : 'var(--border-tertiary)'}; border-radius:999px; background:${currentWorkoutYtOrder === 'viewCount' ? 'var(--bg-danger)' : 'white'}; color:${currentWorkoutYtOrder === 'viewCount' ? 'var(--text-danger)' : 'var(--text-secondary)'}; font-size:11px; cursor:pointer; font-family:inherit; white-space:nowrap;">🔥 조회수순</button>
    </div>
      <div id="wo-yt-results">
        <div style="text-align:center; padding:30px 20px; color:var(--text-tertiary); font-size:12px;">
          <div class="spinner" style="margin:0 auto 10px;"></div>
          영상 불러오는 중...
        </div>
      </div>
    `;
  } else {
    html += `<div id="wo-yt-results"></div>`;
  }

  screen.innerHTML = html;

  // drawGrass 함수가 있으면 호출
  if (typeof drawGrass === 'function') {
    try { drawGrass(); } catch(e) { console.error('drawGrass 에러:', e); }
  }

  // 운동 영상 자동 로드 (검색어 있을 때만)
  if (currentWorkoutYtQuery) {
    setTimeout(() => loadVideosInto('wo-yt-results', currentWorkoutYtQuery, 10, currentWorkoutYtOrder), 50);
  }
}

function setWorkoutYtOrder(order) {
  currentWorkoutYtOrder = order;
  renderWorkout();
}

let currentWorkoutYtQuery = '';
let currentWorkoutYtOrder = 'relevance';

function setWorkoutYtQuery(q) {
  currentWorkoutYtQuery = q;
  renderWorkout();
}

function woYtSearch() {
  const q = document.getElementById('wo-yt-search').value.trim();
  if (!q) { showToast('검색어를 입력해주세요'); return; }
  currentWorkoutYtQuery = q;
  renderWorkout();
}

function quickToggleToday() {
  const k = todayKey();
  if (!workoutLog[k]) workoutLog[k] = { done: false };
  workoutLog[k].done = !workoutLog[k].done;
  if (workoutLog[k].done && !workoutLog[k].kcal) {
    workoutLog[k].kcal = 300;
    workoutLog[k].minutes = 30;
  }
  saveData();
  showToast(workoutLog[k].done ? '오늘 운동 ✓' : '체크 해제됨');
  renderWorkout();
}

function toggleWorkoutDay(d) {
  const k = woKey(d);
  if (!workoutLog[k]) workoutLog[k] = { done: false };
  workoutLog[k].done = !workoutLog[k].done;
  if (workoutLog[k].done && !workoutLog[k].kcal) {
    workoutLog[k].kcal = 300;
    workoutLog[k].minutes = 30;
  }
  saveData();
  showToast(workoutLog[k].done ? `${d}일 운동 ✓` : `${d}일 해제`);
  renderWorkout();
}

function openWorkoutModal(dateKeyStr) {
  const key = dateKeyStr || todayKey();
  const log = workoutLog[key] || { done: false, kcal: 0, minutes: 0, note: '' };

  modal.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-cancel" onclick="closeModal()">취소</button>
        <h2>운동 기록</h2>
        <button class="modal-save" onclick="saveWorkout(document.getElementById('w-date').value)">저장</button>
      </div>

      <div class="field">
        <div class="field-label">📅 날짜</div>
        <input type="date" id="w-date" value="${key}" style="width:100%; padding:11px 12px; border:0.5px solid var(--border-tertiary); border-radius:var(--radius-md); font-size:13px; background:white; color:var(--text-primary); font-family:inherit;" />
      </div>

      <div class="row-flex" style="margin-bottom:14px;">
        <div class="lb"><i class="ti ti-check"></i>운동했어요?</div>
        <div class="toggle ${log.done?'on':''}" onclick="this.classList.toggle('on')"><div class="knob"></div></div>
      </div>

      <div class="field">
        <div class="field-label">운동 종류 (선택)</div>
        <input type="text" id="w-note" placeholder="예: 러닝, 헬스, 요가" value="${log.note || ''}" />
      </div>

      <div class="field" style="display:flex; gap:8px;">
        <div style="flex:1;">
          <div class="field-label">운동 시간 (분)</div>
          <input type="number" id="w-min" placeholder="30" value="${log.minutes || ''}" />
        </div>
        <div style="flex:1;">
          <div class="field-label">활동 칼로리 (kcal)</div>
          <input type="number" id="w-kcal" placeholder="300" value="${log.kcal || ''}" />
        </div>
      </div>

      <div style="padding:10px 12px; background:var(--bg-info); border-radius:var(--radius-md); font-size:11px; color:var(--text-info); line-height:1.5;">
        <i class="ti ti-info-circle" style="font-size:13px; vertical-align:-1px;"></i>
        Apple Fitness/건강 앱에서 활동 칼로리를 확인하고 옮겨 적어주세요. 시간이 흐를수록 본인 데이터가 쌓여서 평균을 자동으로 추천해드릴게요.
      </div>

      ${log.done ? `<button onclick="deleteWorkout('${key}')" style="width:100%; margin-top:14px; padding:12px; border:none; border-radius:var(--radius-md); background:var(--bg-danger); color:var(--text-danger); font-size:13px; font-weight:500; cursor:pointer; font-family:inherit;">이날 기록 삭제</button>` : ''}
    </div>
  `;
  modal.classList.add('show');
}

function saveWorkout(key) {
  const done = modal.querySelector('.toggle').classList.contains('on');
  const note = document.getElementById('w-note').value.trim();
  const min = Number(document.getElementById('w-min').value) || 0;
  const kcal = Number(document.getElementById('w-kcal').value) || 0;

  workoutLog[key] = { done, note, minutes: min, kcal };
  saveData();
  showToast(done ? '운동 기록 저장됨' : '체크 해제됨');
  closeModal();
  if (currentTab === 'workout') renderWorkout();
  if (currentTab === 'calendar') renderCalendar();
}

function deleteWorkout(key) {
  if (confirm('이 날 운동 기록을 삭제할까요?')) {
    delete workoutLog[key];
    saveData();
    closeModal();
    showToast('삭제됨');
    if (currentTab === 'workout') renderWorkout();
  }
}

// ====== 가계부 ======
function renderMoney() {
  // 가계부에서 보고 있는 월 (기본: 현재 월)
  if (typeof budgetViewYear === 'undefined') budgetViewYear = currentYear;
  if (typeof budgetViewMonth === 'undefined') budgetViewMonth = currentMonth;

  const isCurrentMonth = budgetViewYear === currentYear && budgetViewMonth === currentMonth;
  const monthLabel = `${budgetViewYear}년 ${budgetViewMonth + 1}월`;

  header.innerHTML = `
    <h1>가계부</h1>
    <div class="header-actions">
      <button onclick="openBudgetModal()" aria-label="예산"><i class="ti ti-target"></i></button>
      <button onclick="openExpenseModal()" aria-label="추가"><i class="ti ti-plus"></i></button>
    </div>
  `;

  const fixedTotal = budget.fixed.reduce((s, f) => s + Number(f.amt), 0);
  const fixedPaid = budget.fixed.filter(f => f.paid).reduce((s, f) => s + Number(f.amt), 0);
  const fixedRemaining = fixedTotal - fixedPaid;
  const variableBudget = budget.total - fixedTotal;

  // 보고 있는 월의 지출 합산
  const viewMonthPrefix = `${budgetViewYear}-${String(budgetViewMonth+1).padStart(2,'0')}`;
  const viewMonthExpenses = budget.expenses.filter(e =>
    e.dateKey && e.dateKey.startsWith(viewMonthPrefix)
  );
  const variableSpent = viewMonthExpenses.reduce((s, e) => s + Number(e.amt), 0);
  const variableRemaining = variableBudget - variableSpent;
  const variableUsedPct = variableBudget > 0 ? Math.round((variableSpent / variableBudget) * 100) : 0;

  // 보고 있는 월 기준
  const daysInMonth = new Date(budgetViewYear, budgetViewMonth + 1, 0).getDate();
  const dayInMonth = isCurrentMonth ? today : daysInMonth; // 과거 월이면 월 전체 일수
  const daysLeft = isCurrentMonth ? (daysInMonth - today) : 0;
  const daysPassed = isCurrentMonth ? today : daysInMonth;
  const idealDaily = Math.round(variableBudget / daysInMonth);
  const actualDaily = daysPassed > 0 ? Math.round(variableSpent / daysPassed) : 0;
  const projectedTotal = isCurrentMonth ? (actualDaily * daysInMonth) : variableSpent;
  const isOverPace = actualDaily > idealDaily;
  const safeDaily = daysLeft > 0 ? Math.round(variableRemaining / daysLeft) : 0;

  let heroClass = '';
  if (variableUsedPct >= 90) heroClass = 'danger';
  else if (variableUsedPct >= 70) heroClass = 'warning';

  let html = `
    <!-- 월 이동 -->
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; background:var(--bg-secondary); border-radius:var(--radius-md); padding:6px;">
      <button onclick="prevBudgetMonth()" style="border:none; background:transparent; padding:6px 10px; cursor:pointer; font-family:inherit; color:var(--text-secondary);">
        <i class="ti ti-chevron-left" style="font-size:16px;"></i>
      </button>
      <button onclick="openBudgetMonthPicker()" style="border:none; background:transparent; padding:6px 10px; cursor:pointer; font-family:inherit; font-size:13px; font-weight:600; color:var(--text-primary);">
        ${monthLabel} ${!isCurrentMonth ? '<span style="font-size:10px; color:var(--text-tertiary); margin-left:4px;">(과거)</span>' : ''}
      </button>
      <button onclick="nextBudgetMonth()" style="border:none; background:transparent; padding:6px 10px; cursor:pointer; font-family:inherit; color:var(--text-secondary); ${isCurrentMonth ? 'opacity:0.3; pointer-events:none;' : ''}">
        <i class="ti ti-chevron-right" style="font-size:16px;"></i>
      </button>
    </div>

    <div class="budget-hero ${heroClass}">
      <div class="label">${isCurrentMonth ? '변동 생활비 (남은 금액)' : `${monthLabel} 지출 내역`}</div>
      <div class="big-num">${isCurrentMonth ? variableRemaining.toLocaleString() + '원' : variableSpent.toLocaleString() + '원'}</div>
      <div class="sub">${variableBudget.toLocaleString()}원 중 ${variableSpent.toLocaleString()}원 사용 · ${variableUsedPct}%</div>
      <div class="budget-bar"><div style="width:${Math.min(variableUsedPct,100)}%;"></div></div>
      <div class="budget-bar-labels"><span>0</span><span>${variableBudget.toLocaleString()}원</span></div>
      ${isCurrentMonth ? `<div class="day-pace">
        <div class="item"><div class="pn">${safeDaily.toLocaleString()}원</div><div class="pl">남은 ${daysLeft}일 일일 한도</div></div>
        <div class="item"><div class="pn">${actualDaily.toLocaleString()}원</div><div class="pl">현재 일평균</div></div>
      </div>` : `<div class="day-pace">
        <div class="item"><div class="pn">${actualDaily.toLocaleString()}원</div><div class="pl">일평균 지출</div></div>
        <div class="item"><div class="pn">${daysInMonth}일</div><div class="pl">총 일수</div></div>
      </div>`}
    </div>
  `;

  if (variableSpent > 0 && isCurrentMonth) {
    if (isOverPace) {
      html += `<div style="padding:12px 14px; background:var(--bg-warning); border-radius:var(--radius-md); margin-bottom:14px; display:flex; gap:8px; align-items:flex-start;">
        <i class="ti ti-alert-triangle" style="font-size:14px; color:var(--text-warning); margin-top:1px;"></i>
        <div style="font-size:11px; color:var(--text-warning); line-height:1.6;">
          이 페이스라면 월말에 <b style="font-weight:600;">${projectedTotal.toLocaleString()}원</b> 예상. 일일 ${(actualDaily - safeDaily).toLocaleString()}원씩 줄이면 안전.
        </div>
      </div>`;
    } else {
      html += `<div style="padding:12px 14px; background:var(--bg-success); border-radius:var(--radius-md); margin-bottom:14px; display:flex; gap:8px; align-items:flex-start;">
        <i class="ti ti-check" style="font-size:14px; color:var(--text-success); margin-top:1px;"></i>
        <div style="font-size:11px; color:var(--text-success); line-height:1.6;">
          페이스 좋아요! 이대로면 <b style="font-weight:600;">${(variableBudget - projectedTotal).toLocaleString()}원</b> 남길 수 있어요.
        </div>
      </div>`;
    }
  }

  // ★ AI 분석 카드
  html += renderMoneyAI(variableSpent, projectedTotal);

  html += `<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
    <span style="font-size:14px; font-weight:600;">고정지출 ${budget.fixed.length}개</span>
    <button onclick="openFixedAddModal()" style="border:none; background:transparent; font-size:12px; color:var(--text-info); cursor:pointer; font-family:inherit; font-weight:500;">+ 추가</button>
  </div>`;

  html += `<div class="card" style="padding:0 14px; margin-bottom:10px;">${renderFixedRows()}</div>`;

  html += `<div style="display:flex; gap:8px; margin-bottom:14px;">
    <div class="stat-card" style="flex:1;">
      <div class="label">납부 완료</div>
      <div class="value" style="color:var(--text-success); font-size:15px;">${fixedPaid.toLocaleString()}원</div>
    </div>
    <div class="stat-card" style="flex:1;">
      <div class="label">미납</div>
      <div class="value" style="color:var(--text-warning); font-size:15px;">${fixedRemaining.toLocaleString()}원</div>
    </div>
  </div>`;

  // 보고 있는 월의 지출
  const recentExp = isCurrentMonth
    ? viewMonthExpenses.slice(-10).reverse()
    : viewMonthExpenses.slice().reverse();
  html += `<div style="font-size:14px; font-weight:600; margin: 18px 0 8px;">${isCurrentMonth ? '최근 변동 지출' : `${monthLabel} 전체 지출 (${viewMonthExpenses.length}건)`}</div>`;
  if (recentExp.length === 0) {
    html += `<div class="empty-state" style="padding:30px 20px;">
      <i class="ti ti-receipt"></i>
      ${isCurrentMonth ? '아직 입력된 지출이 없어요' : '이 달엔 입력된 지출이 없어요'}<br>
      ${isCurrentMonth ? '<span style="font-size:11px; opacity:0.7;">+ 버튼으로 지출을 추가하세요</span>' : ''}
    </div>`;
  } else {
    html += `<div class="card" style="padding:6px 14px;">`;
    recentExp.forEach(e => {
      // dateKey 우선, 옛 date(일자만) 호환
      let dateStr = '';
      if (e.dateKey) {
        const [, m, d] = e.dateKey.split('-');
        dateStr = `${parseInt(m)}/${parseInt(d)}`;
      } else if (e.date) {
        dateStr = `${currentMonth+1}/${e.date}`;
      }
      html += `<div style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:0.5px solid var(--border-tertiary); font-size:13px;">
        <div style="flex:1; min-width:0;">
          <div style="font-weight:500;">${e.memo || e.cat}</div>
          <div style="font-size:10px; color:var(--text-tertiary); margin-top:2px;">${e.cat} · ${dateStr}</div>
        </div>
        <span style="font-weight:600;">-${Number(e.amt).toLocaleString()}원</span>
      </div>`;
    });
    html += `</div>`;
  }

  screen.innerHTML = html;
}

function renderFixedRows() {
  const order = ['주거', '공과금', '보험', '구독', '기타'];
  const sorted = [...budget.fixed].sort((a, b) => {
    const oa = order.indexOf(a.cat);
    const ob = order.indexOf(b.cat);
    if (oa !== ob) return oa - ob;
    return a.day - b.day;
  });

  return sorted.map(f => `
    <div class="fixed-row">
      <div class="ic" style="background:${f.paid?'var(--bg-success)':'var(--bg-secondary)'}; color:${f.paid?'var(--text-success)':'var(--text-secondary)'}; cursor:pointer;" onclick="toggleFixedPaid(${f.id})">
        <i class="ti ${f.icon}"></i>
      </div>
      <div style="flex:1; min-width:0; cursor:pointer;" onclick="toggleFixedPaid(${f.id})">
        <div class="nm">${f.name}</div>
        <div class="meta">${f.cat} · 매월 ${f.day}일</div>
      </div>
      <div style="text-align:right; cursor:pointer;" onclick="toggleFixedPaid(${f.id})">
        <div class="amt ${f.paid?'paid':'upcoming'}">${Number(f.amt).toLocaleString()}원</div>
        <div class="meta" style="color:${f.paid?'var(--text-success)':f.day < today?'var(--text-danger)':'var(--text-tertiary)'};">
          ${f.paid ? '✓ 완료' : f.day < today ? '⚠ 연체' : `${f.day - today}일 후`}
        </div>
      </div>
      <button onclick="editFixed(${f.id})" style="border:none; background:transparent; cursor:pointer; padding:6px 4px 6px 8px; color:var(--text-tertiary); font-family:inherit; flex-shrink:0;" aria-label="수정">
        <i class="ti ti-dots-vertical" style="font-size:16px;"></i>
      </button>
    </div>
  `).join('');
}

function editFixed(id) {
  const f = budget.fixed.find(x => x.id === id);
  if (!f) return;

  modal.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-cancel" onclick="closeModal()">취소</button>
        <h2>고정지출 수정</h2>
        <button class="modal-save" onclick="updateFixed(${id})">저장</button>
      </div>

      <div class="field">
        <div class="field-label">이름</div>
        <input type="text" id="ef-name" value="${f.name}" />
      </div>

      <div class="field">
        <div class="field-label">금액 (월)</div>
        <input type="number" id="ef-amt" value="${f.amt}" />
      </div>

      <div class="field">
        <div class="field-label">매월 결제일</div>
        <input type="number" id="ef-day" value="${f.day}" min="1" max="31" />
      </div>

      <div class="field">
        <div class="field-label">카테고리</div>
        <div style="display:flex; gap:6px; flex-wrap:wrap;" id="ef-cat">
          <button class="chip ${f.cat==='주거'?'active':''}" data-c="주거" data-icon="ti-home">주거</button>
          <button class="chip ${f.cat==='공과금'?'active':''}" data-c="공과금" data-icon="ti-bolt">공과금</button>
          <button class="chip ${f.cat==='보험'?'active':''}" data-c="보험" data-icon="ti-shield">보험</button>
          <button class="chip ${f.cat==='구독'?'active':''}" data-c="구독" data-icon="ti-device-tv">구독</button>
          <button class="chip ${f.cat==='기타'?'active':''}" data-c="기타" data-icon="ti-dots">기타</button>
        </div>
      </div>

      <div class="row-flex">
        <div class="lb"><i class="ti ti-check"></i>이번 달 납부 완료</div>
        <div class="toggle ${f.paid?'on':''}" onclick="this.classList.toggle('on')"><div class="knob"></div></div>
      </div>

      <button onclick="deleteFixed(${id})" style="width:100%; padding:12px; border:none; border-radius:var(--radius-md); background:var(--bg-danger); color:var(--text-danger); font-size:13px; font-weight:500; cursor:pointer; font-family:inherit; margin-top:8px;">
        <i class="ti ti-trash" style="font-size:14px; vertical-align:-2px;"></i> 이 고정지출 삭제
      </button>
    </div>
  `;
  modal.classList.add('show');

  setTimeout(() => {
    document.querySelectorAll('#ef-cat .chip').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('#ef-cat .chip').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
      });
    });
  }, 50);
}

function updateFixed(id) {
  const f = budget.fixed.find(x => x.id === id);
  if (!f) return;

  const name = document.getElementById('ef-name').value.trim();
  const amt = Number(document.getElementById('ef-amt').value);
  const day = Number(document.getElementById('ef-day').value);
  const catBtn = document.querySelector('#ef-cat .chip.active');
  const paid = modal.querySelector('.toggle').classList.contains('on');

  if (!name || !amt || !day) { showToast('모든 항목을 입력해주세요'); return; }

  f.name = name;
  f.amt = amt;
  f.day = day;
  f.cat = catBtn.dataset.c;
  f.icon = catBtn.dataset.icon;
  f.paid = paid;

  saveData();
  showToast('수정됨');
  closeModal();
  renderMoney();
}

function deleteFixed(id) {
  if (confirm('이 고정지출을 삭제할까요?')) {
    budget.fixed = budget.fixed.filter(x => x.id !== id);
    saveData();
    closeModal();
    showToast('삭제됨');
    renderMoney();
  }
}

function toggleFixedPaid(id) {
  const f = budget.fixed.find(x => x.id === id);
  if (f) {
    f.paid = !f.paid;
    saveData();
    showToast(f.paid ? `${f.name} 납부 완료` : `${f.name} 미납 변경`);
  }
  renderMoney();
}

// ★★★ 가계부 AI 분석 ★★★
function renderMoneyAI(spent, projected) {
  // 카테고리별 합계 (이번 달만)
  const thisMonthPrefix = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  const byCategory = {};
  budget.expenses.forEach(e => {
    if (e.dateKey && !e.dateKey.startsWith(thisMonthPrefix)) return;
    byCategory[e.cat] = (byCategory[e.cat] || 0) + Number(e.amt);
  });

  const ranked = Object.entries(byCategory).sort((a,b) => b[1] - a[1]);
  const topCat = ranked[0];
  const lastMonth = budget.history?.[budget.history.length - 1];

  // AI 코치 카드 (진짜 AI)
  let html = `<div id="ai-budget-coach"></div>`;

  // 카테고리별 통계 (이건 데이터 분석이라 그대로 유지)
  if (ranked.length >= 2) {
    html += `<div class="ai-card" style="margin-bottom:14px;">
      <div class="ai-badge" style="background:rgba(255,255,255,0.15); color:white;"><i class="ti ti-chart-bar" style="font-size:11px;"></i> 카테고리별 지출</div>
      <div style="margin-top:10px;">`;

    ranked.slice(0, 5).forEach(([cat, amt]) => {
      const pct = Math.round((amt / spent) * 100);
      let compare = '';
      if (lastMonth?.byCategory?.[cat]) {
        const lastAmt = lastMonth.byCategory[cat];
        const diffPct = Math.round(((amt - lastAmt) / lastAmt) * 100);
        if (diffPct > 10) compare = `<span style="color:#FFA0A0;">↑${diffPct}%</span>`;
        else if (diffPct < -10) compare = `<span style="color:#90EE90;">↓${Math.abs(diffPct)}%</span>`;
      }
      html += `<div style="display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12px;">
        <div style="width:80px;">${cat}</div>
        <div style="flex:1; height:6px; background:rgba(255,255,255,0.15); border-radius:3px; overflow:hidden;">
          <div style="height:100%; width:${pct}%; background:#FFD66E;"></div>
        </div>
        <div style="font-size:11px; text-align:right; min-width:80px;">${amt.toLocaleString()}원 ${compare}</div>
      </div>`;
    });
    html += `</div></div>`;
  }

  // 비동기로 AI 코치 호출
  setTimeout(() => loadAIBudgetCoach(spent, projected, byCategory, lastMonth), 100);

  return html;
}

// AI 가계부 코치 - 진짜 Gemini 분석
async function loadAIBudgetCoach(spent, projected, byCategory, lastMonth) {
  const container = document.getElementById('ai-budget-coach');
  if (!container) return;

  // 키 없으면 안내
  if (!window.GEMINI_API_KEY) {
    container.innerHTML = `<div class="ai-card" style="margin-bottom:14px;">
      <div class="ai-badge"><i class="ti ti-sparkles" style="font-size:11px;"></i> AI 가계부 코치</div>
      <div class="ai-text" style="margin-bottom:10px;">
        AI 가계부 분석을 사용하려면 본인 Gemini API 키를 입력해주세요.
      </div>
      <button onclick="openAIKeyModal()" style="padding:8px 14px; border:none; border-radius:6px; background:#FFD700; color:black; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit;">
        <i class="ti ti-key" style="font-size:12px; vertical-align:-2px;"></i> AI 키 입력하기
      </button>
    </div>`;
    return;
  }

  const cacheKey = 'budget-coach-' + new Date().toDateString();

  // 캐시 있으면 즉시 표시
  if (aiCache[cacheKey] && Date.now() - aiCache[cacheKey].time < AI_CACHE_TIME) {
    const text = aiCache[cacheKey].text;
    container.innerHTML = `<div class="ai-card" style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div class="ai-badge"><i class="ti ti-sparkles" style="font-size:11px;"></i> AI 가계부 코치</div>
        <button onclick="delete aiCache['${cacheKey}']; loadAIBudgetCoach(${spent}, ${projected}, ${JSON.stringify(byCategory).replace(/"/g, '&quot;')}, ${lastMonth ? JSON.stringify(lastMonth).replace(/"/g, '&quot;') : 'null'});" style="border:none; background:transparent; color:white; opacity:0.7; padding:2px 6px; font-size:10px; cursor:pointer; font-family:inherit;">
          <i class="ti ti-refresh" style="font-size:11px;"></i>
        </button>
      </div>
      <div class="ai-text"><p style="margin:0;">${renderAIText(text)}</p></div>
    </div>`;
    return;
  }

  if (spent === 0) {
    container.innerHTML = `<div class="ai-card" style="margin-bottom:14px;">
      <div class="ai-badge"><i class="ti ti-sparkles" style="font-size:11px;"></i> AI 가계부 코치</div>
      <h3 style="margin: 8px 0 4px;">아직 지출 기록이 없어요</h3>
      <div class="ai-text">지출을 입력하면 AI가 카테고리 분석, 지난달 비교, 절약 조언을 해드릴게요.</div>
    </div>`;
    return;
  }

  container.innerHTML = `<div class="ai-card" style="margin-bottom:14px;">
    <div class="ai-badge"><i class="ti ti-sparkles" style="font-size:11px;"></i> AI 분석 중</div>
    <div style="display:flex; align-items:center; gap:8px; padding:8px 0;">
      <div class="spinner" style="border-color:rgba(255,255,255,0.3); border-top-color:white;"></div>
      <span style="font-size:11px; opacity:0.8;">가계부 패턴 분석 중...</span>
    </div>
  </div>`;

  const categoryList = Object.entries(byCategory)
    .sort((a, b) => b[1] - a[1])
    .map(([cat, amt]) => `- ${cat}: ${amt.toLocaleString()}원`)
    .join('\n');

  const lastMonthInfo = lastMonth
    ? `\n## 지난달 비교\n- 지난달 총 지출: ${lastMonth.total?.toLocaleString() || 0}원\n- 지난달 카테고리: ${lastMonth.byCategory ? Object.entries(lastMonth.byCategory).map(([c, v]) => `${c} ${v.toLocaleString()}원`).join(', ') : '데이터 없음'}`
    : '';

  const prompt = `한국 개인 사용자의 가계부 분석 AI 코치입니다. 이번 달 지출 패턴을 분석해 실용적인 조언을 해주세요.

## 이번 달 지출 (${currentMonth+1}월 ${today}일 기준)
- 총 지출: ${spent.toLocaleString()}원
- 월말 예상 지출 (현재 페이스): ${projected.toLocaleString()}원

## 카테고리별 지출
${categoryList || '(데이터 없음)'}

function archiveLastMonthIfNeeded() {
  const lastArchiveKey = budget.lastArchive;
  const thisMonthKey = `${currentYear}-${currentMonth+1}`;

  if (lastArchiveKey === thisMonthKey) return; // 이미 이번 달은 처리됨

  // 처음 사용자거나 새 달이 시작됐을 때
  if (lastArchiveKey && lastArchiveKey !== thisMonthKey && budget.expenses.length > 0) {
    // 이전 달 데이터를 history에 저장
    const byCategory = {};
    let total = 0;
    budget.expenses.forEach(e => {
      byCategory[e.cat] = (byCategory[e.cat] || 0) + Number(e.amt);
      total += Number(e.amt);
    });

    if (!budget.history) budget.history = [];
    budget.history.push({
      month: lastArchiveKey,
      total,
      byCategory,
      expenses: budget.expenses
    });

    // 최근 6개월만 유지
    if (budget.history.length > 6) {
      budget.history = budget.history.slice(-6);
    }

    // 이번달 지출 초기화 (고정지출 paid는 모두 false로)
    budget.expenses = [];
    budget.fixed.forEach(f => { f.paid = false; });
  }

  budget.lastArchive = thisMonthKey;
  saveData();
}

// 앱 시작 시 한 번 체크

function setTodoDate(preset) {
  const input = document.getElementById('todo-date');
  const n = new Date();
  let d = new Date(n);
  if (preset === 'today') d = n;
  else if (preset === 'tomorrow') d.setDate(n.getDate() + 1);
  else if (preset === 'week') d.setDate(n.getDate() + 7);
  else if (preset === 'month') d.setMonth(n.getMonth() + 1);
  input.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function saveTodo(editId) {
  const title = document.getElementById('todo-title').value.trim();
  if (!title) { showToast('내용을 입력해주세요'); return; }
  const dateKeyVal = document.getElementById('todo-date').value || todayKey();
  const tag = document.querySelector('#tag-grid .chip.active')?.dataset.tag || '업무';
  const flag = modal.querySelector('.toggle').classList.contains('on');

  if (editId) {
    // 수정
    const t = todos.find(x => x.id === Number(editId));
    if (t) {
      t.title = title;
      t.dateKey = dateKeyVal;
      t.tag = tag;
      t.flag = flag;
    }
    showToast('수정됨');
  } else {
    // 새로 추가
    todos.unshift({
      id: Date.now(),
      title,
      tag,
      dateKey: dateKeyVal,
      flag,
      done: false,
    });
    showToast(`"${title}" 추가됨`);
  }
  saveData();
  closeModal();
  render();
}

  const total = assets.reduce((s, a) => {
    const live = liveAssetData[a.id];
    if (live?.hasLive && live.krwValue) {
      return s + live.krwValue;
    }
    return s + (Number(a.qty) * Number(a.price));
  }, 0);

  const byType = {};
  assets.forEach(a => {
    const live = liveAssetData[a.id];
    const v = live?.hasLive && live.krwValue
      ? live.krwValue
      : Number(a.qty) * Number(a.price);
    byType[a.type] = (byType[a.type] || 0) + v;
  });

  const typeColors = {
    '주식':'var(--text-info)', '예적금':'var(--text-success)',
    '현금':'var(--text-secondary)', '코인':'var(--text-warning)',
    '부동산':'var(--text-danger)', '펀드':'var(--text-info)',
    '채권':'var(--text-success)', '기타':'var(--text-tertiary)'

  let html = '';

  // 시장 지수 카드 (라이브)
  html += `<div id="market-indices" style="margin-bottom:14px;"></div>`;

  // 자산 비중 도넛 차트
  if (total > 0) {
    const size = 180;
    const cx = size / 2;
    const cy = size / 2;
    const r = 68;
    const strokeWidth = 28;
    const circumference = 2 * Math.PI * r;

    let cumPct = 0;
    let segments = '';
    const entries = Object.entries(byType);
    entries.forEach(([type, val]) => {
      const pct = val / total;
      const dashLength = circumference * pct;
      const dashOffset = circumference - dashLength;

      segments += `<circle

        fill="none"
        stroke="${typeColors[type] || 'var(--text-tertiary)'}"
        stroke-width="${strokeWidth}"
        stroke-dasharray="${dashLength} ${circumference}"
        transform="rotate(${rotation - 90} ${cx} ${cy})"
      />`;
      cumPct += pct;
    });

    html += `

          </div>

        <div style="flex:1; min-width:0;">

            const pct = Math.round((val/total)*100);
            return `<div style="display:flex; align-items:center; gap:8px; padding:4px 0;">
              <span style="width:10px; height:10px; border-radius:2px; background:${typeColors[type] || 'var(--text-tertiary)'}; flex-shrink:0;"></span>
              <div style="flex:1; min-width:0;">
                <div style="font-size:12px; font-weight:500;">${type}</div>
                <div style="font-size:10px; color:var(--text-tertiary);">${val.toLocaleString()}원</div>

              <div style="font-size:13px; font-weight:600;">${pct}%</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    `;
  } else {
    html += `
      <div style="margin: 6px 0 12px;">
        <div style="font-size:11px; color:var(--text-tertiary);">총 자산</div>
        <div style="font-size:26px; font-weight:600;">0원</div>
      </div>
    `;
  }

  // ★ AI 코칭 카드
  html += renderAICoaching(total, byType);

  // 탭
  const tabs = [
    { id:'holdings', label:'보유' },

// ====== Gemini AI ======
// 캐시: 같은 프롬프트는 1시간 동안 재사용 (토큰 절약)
const aiCache = {};
const AI_CACHE_TIME = 60 * 60 * 1000; // 1시간

// 분당 호출 카운터 (429 방지)
let aiCallsThisMinute = 0;
let aiMinuteResetTime = Date.now() + 60000;
const MAX_CALLS_PER_MINUTE = 10; // 안전하게 10회로 제한 (Gemini 한도는 15)

async function askGemini(prompt, options = {}) {
  const { useCache = true, cacheKey = null, maxRetries = 2 } = options;

  // 캐시 확인
  const cKey = cacheKey || prompt;
  if (useCache && aiCache[cKey] && Date.now() - aiCache[cKey].time < AI_CACHE_TIME) {
    return { text: aiCache[cKey].text, cached: true };
  }

  // 분당 호출 제한 체크
  if (Date.now() > aiMinuteResetTime) {
    aiCallsThisMinute = 0;
    aiMinuteResetTime = Date.now() + 60000;
  }
  if (aiCallsThisMinute >= MAX_CALLS_PER_MINUTE) {
    const waitSec = Math.ceil((aiMinuteResetTime - Date.now()) / 1000);
    return { error: `잠시 후 다시 시도해주세요 (${waitSec}초 대기)` };
  }

  const apiKey = window.GEMINI_API_KEY;
  if (!apiKey) {
    return { error: 'AI 키가 설정되지 않았어요. 아래 버튼을 눌러 키를 입력하세요.', needsKey: true };
  }

  // 여러 모델 시도 (3.1 Pro 우선, 안 되면 대체)
  const models = [
    'gemini-3.1-pro',          // 본인 Pro 키면 최우선
    'gemini-2.5-flash',
    'gemini-2.0-flash',
    'gemini-1.5-flash',
    'gemini-1.5-flash-latest',
    'gemini-flash-latest',
  ];

  let lastError = '알 수 없는 오류';

  for (const model of models) {
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

    for (let attempt = 0; attempt <= maxRetries; attempt++) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 25000); // 25초

        aiCallsThisMinute++;

        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Goog-Api-Key': apiKey,
          },
          referrerPolicy: 'origin', // 원본 URL 리퍼러 강제 전송
          body: JSON.stringify({
            contents: [{
              parts: [{ text: prompt }]
            }],
            generationConfig: {
              temperature: 0.7,
              maxOutputTokens: 8000,
            },
          }),
          signal: controller.signal,
        });

        clearTimeout(timeoutId);

        if (!res.ok) {
          const errData = await res.json().catch(() => null);
          const errMsg = errData?.error?.message || `HTTP ${res.status}`;
          console.error(`Gemini ${model} 에러:`, res.status, errData);
          lastError = `${res.status}: ${errMsg.substring(0, 80)}`;

          if (res.status === 404) {
            // 모델 없음 → 다음 모델 시도
            break;
          }
          if (res.status === 429 && attempt < maxRetries) {
            // 한도 초과 → 대기 후 재시도
            const waitTime = Math.pow(2, attempt) * 3000;
            await new Promise(r => setTimeout(r, waitTime));
            continue;
          }
          if (res.status === 403) {
            return { error: `권한 거부 (도메인 제한 또는 API 비활성화)\n원인: ${errMsg.substring(0, 100)}` };
          }
          if (res.status === 400) {
            return { error: `요청 오류: ${errMsg.substring(0, 100)}` };
          }
          break; // 다음 모델 시도
        }

        const data = await res.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
        const finishReason = data.candidates?.[0]?.finishReason;

        if (!text) {
          const blockReason = finishReason || data.promptFeedback?.blockReason;
          if (blockReason) {
            return { error: `응답 차단됨: ${blockReason}` };
          }
          lastError = '응답이 비어있음';
          break;
        }

        // 토큰 한도로 잘린 경우 경고 표시 (텍스트는 있어도)
        let finalText = text;
        if (finishReason === 'MAX_TOKENS') {
          finalText = text + '\n\n*※ 답변이 길어서 일부 잘렸어요. "새로고침" 버튼으로 다시 받으세요.*';
        }

        console.log(`✅ Gemini ${model} 성공`);
        aiCache[cKey] = { text: finalText, time: Date.now() };
        return { text: finalText, cached: false };

      } catch (e) {
        if (e.name === 'AbortError') {
          lastError = '응답 시간 초과 (25초)';
          break;
        }
        console.error(`${model} 호출 실패:`, e);
        lastError = `네트워크: ${e.message?.substring(0, 50)}`;
        if (attempt < maxRetries) {
          await new Promise(r => setTimeout(r, 2000));
          continue;
        }
        break;
      }
    }
  }

  return { error: `모든 모델 실패. 마지막 에러: ${lastError}` };
}

// AI 응답을 마크다운 → HTML로 간단 변환
function renderAIText(text) {
  if (!text) return '';
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<b style="font-weight:600;">$1</b>')
    .replace(/\*(.+?)\*/g, '<i style="font-style:italic;">$1</i>')
    .replace(/`(.+?)`/g, '<code style="background:rgba(0,0,0,0.05); padding:1px 4px; border-radius:3px; font-size:11px;">$1</code>')
    .replace(/\n\n/g, '</p><p style="margin: 8px 0;">')
    .replace(/\n/g, '<br>');
}

// ====== AI 시장 브리핑 ======
// 시장 브리핑 데이터 + 프롬프트 생성 (UI 없이 호출 가능)
async function generateMarketBriefing(forceRefresh = false) {
  const cacheKey = 'market-briefing-' + new Date().toDateString();

  if (forceRefresh) delete aiCache[cacheKey];

  // 캐시 있으면 즉시 반환
  if (aiCache[cacheKey] && Date.now() - aiCache[cacheKey].time < AI_CACHE_TIME) {
    return { text: aiCache[cacheKey].text, cached: true };
  }

  // 데이터 수집
  const indices = await fetchMarketIndices();
  const news = await fetchNewsRSS().catch(() => []);

  const total = assets.reduce((s, a) => {
    const live = liveAssetData[a.id];
    return s + (live?.hasLive && live.krwValue ? live.krwValue : Number(a.qty) * Number(a.price));
  }, 0);

  const assetSummary = assets.map(a => {
    const live = liveAssetData[a.id];
    const v = live?.hasLive && live.krwValue ? live.krwValue : Number(a.qty) * Number(a.price);
    const pct = total > 0 ? ((v / total) * 100).toFixed(1) : '0';
    const changeInfo = live?.hasLive ? ` (오늘 ${live.changePct >= 0 ? '+' : ''}${live.changePct.toFixed(2)}%, 수익 ${live.profitPct >= 0 ? '+' : ''}${live.profitPct.toFixed(1)}%)` : '';
    return `- ${a.name}${a.ticker ? ` [${a.ticker}]` : ''}: 비중 ${pct}%${changeInfo}`;
  }).join('\n');

  const indexInfo = `
- 코스피: ${indices.kospi ? `${indices.kospi.price.toFixed(2)} (${indices.kospi.changePct >= 0 ? '+' : ''}${indices.kospi.changePct.toFixed(2)}%)` : '조회 불가'}
- 코스닥: ${indices.kosdaq ? `${indices.kosdaq.price.toFixed(2)} (${indices.kosdaq.changePct >= 0 ? '+' : ''}${indices.kosdaq.changePct.toFixed(2)}%)` : '조회 불가'}
- S&P500: ${indices.sp500 ? `${indices.sp500.price.toFixed(2)} (${indices.sp500.changePct >= 0 ? '+' : ''}${indices.sp500.changePct.toFixed(2)}%)` : '조회 불가'}
- 나스닥: ${indices.nasdaq ? `${indices.nasdaq.price.toFixed(2)} (${indices.nasdaq.changePct >= 0 ? '+' : ''}${indices.nasdaq.changePct.toFixed(2)}%)` : '조회 불가'}
- USD/KRW 환율: ${indices.usdkrw ? `${indices.usdkrw.price.toFixed(2)}원 (${indices.usdkrw.changePct >= 0 ? '+' : ''}${indices.usdkrw.changePct.toFixed(2)}%)` : '조회 불가'}

const PRICE_CACHE_TIME = 5 * 60 * 1000; // 5분

async function fetchYahooPrice(ticker) {
  if (!ticker) return null;

  // 캐시 확인
  const cached = priceCache[ticker];
  if (cached && Date.now() - cached.time < PRICE_CACHE_TIME) {
    return cached.data;
  }

  // Yahoo Finance API URL
  const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=2d`;

  // CORS 프록시 후보들 (순서대로 시도)
  const proxies = [
    {
      url: `https://api.allorigins.win/get?url=${encodeURIComponent(yahooUrl)}`,
      parse: async (res) => {
        const w = await res.json();
        return JSON.parse(w.contents);
      }
    },
    {
      url: `https://corsproxy.io/?${encodeURIComponent(yahooUrl)}`,
      parse: async (res) => res.json()
    },
    {
      url: `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(yahooUrl)}`,
      parse: async (res) => res.json()
    },
  ];

  for (const proxy of proxies) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000); // 8초 타임아웃

      const res = await fetch(proxy.url, { signal: controller.signal });
      clearTimeout(timeoutId);

      if (!res.ok) continue;

      const data = await proxy.parse(res);

      if (data.chart?.error) {
        console.error(`${ticker} Yahoo 에러:`, data.chart.error);
        continue;
      }

      const result = data.chart?.result?.[0];
      if (!result) continue;

      const meta = result.meta;
      const currentPrice = meta.regularMarketPrice;
      const previousClose = meta.chartPreviousClose || meta.previousClose;
      const currency = meta.currency || 'USD';

      if (!currentPrice) continue;

      const changePct = previousClose > 0 ? ((currentPrice - previousClose) / previousClose) * 100 : 0;

      const priceData = {
        ticker,
        price: currentPrice,
        previousClose,
        changePct,
        currency,
        time: Date.now()
      };

      priceCache[ticker] = { data: priceData, time: Date.now() };
      return priceData;
    } catch (e) {
      console.warn(`${ticker} 프록시 실패 (${proxy.url.substring(0, 30)}...):`, e.message);
      continue;
    }
  }

  console.error(`${ticker}: 모든 프록시 실패`);
  return null;
}

// 환율 조회 (USD → KRW)
let exchangeRateCache = null;
async function getUSDKRW() {
  if (exchangeRateCache && Date.now() - exchangeRateCache.time < 30 * 60 * 1000) {
    return exchangeRateCache.rate;
  }
  // USDKRW=X 우선 시도, 안 되면 KRW=X 시도
  let data = await fetchYahooPrice('USDKRW=X');
  if (!data?.price) {
    data = await fetchYahooPrice('KRW=X');
  }
  if (data?.price) {
    exchangeRateCache = { rate: data.price, time: Date.now() };
    return data.price;
  }
  return 1380; // 폴백
}

// 자산 라이브 데이터
let liveAssetData = {};

async function fetchAssetLive(asset) {
  if (!asset.ticker) {
    return {
      currentPrice: Number(asset.price),
      krwValue: Number(asset.qty) * Number(asset.price),
      changePct: 0,
      profitPct: 0,
      hasLive: false,
    };
  }

  const priceData = await fetchYahooPrice(asset.ticker);
  if (!priceData) {
    return {
      currentPrice: Number(asset.price),
      krwValue: Number(asset.qty) * Number(asset.price),
      changePct: 0,
      profitPct: 0,
      hasLive: false,
      error: true,
    };
  }

  let krwPrice = priceData.price;
  let krwAvgPrice = Number(asset.price);
  if (priceData.currency === 'USD') {
    const rate = await getUSDKRW();
    krwPrice = priceData.price * rate;
    krwAvgPrice = Number(asset.price) * rate;
  }

  const krwValue = Number(asset.qty) * krwPrice;
  const profitPct = krwAvgPrice > 0 ? ((krwPrice - krwAvgPrice) / krwAvgPrice) * 100 : 0;

  return {
    currentPrice: priceData.price,
    krwPrice,
    krwValue,
    changePct: priceData.changePct,
    profitPct,
    currency: priceData.currency,
    hasLive: true,
  };
}

async function refreshAllAssetPrices() {
  const promises = assets.filter(a => a.ticker).map(async (a) => {
    const data = await fetchAssetLive(a);
    liveAssetData[a.id] = data;
  });
  await Promise.all(promises);
}

// ====== YouTube Data API ======
const ytCache = {}; // 같은 검색 반복 방지

async function searchYoutube(query, maxResults = 8, order = 'relevance') {
  if (!query) return [];

  // 캐시 확인 (5분 유효) - 정렬 옵션 포함
  const cacheKey = `${query}_${maxResults}_${order}`;
  if (ytCache[cacheKey] && Date.now() - ytCache[cacheKey].time < 5 * 60 * 1000) {
    return ytCache[cacheKey].data;
  }

  try {
    const apiKey = window.YOUTUBE_API_KEY;
    if (!apiKey) {
      console.error('YouTube API 키 없음');
      return { error: 'YouTube API 키가 설정되지 않았어요' };
    }

    // order: relevance(관련성), date(최신순), viewCount(조회수순), rating(평점순)
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=${maxResults}&q=${encodeURIComponent(query)}&type=video&order=${order}&relevanceLanguage=ko&key=${apiKey}`;
    console.log(`🎬 YouTube 검색: ${query} (정렬: ${order})`);

    const res = await fetch(url, { referrerPolicy: 'origin' });
    const data = await res.json();

    if (!res.ok || data.error) {
      const errMsg = data.error?.message || `HTTP ${res.status}`;
      const errReason = data.error?.errors?.[0]?.reason || '';
      console.error('YouTube API 에러:', res.status, errMsg, errReason);

      let friendlyMsg = errMsg;
      if (errReason === 'quotaExceeded') {
        friendlyMsg = 'YouTube 일일 한도 초과 (내일 다시 시도)';
      } else if (errReason === 'keyInvalid' || res.status === 400) {
        friendlyMsg = 'YouTube API 키 문제';
      } else if (res.status === 403) {
        friendlyMsg = '권한 거부 (도메인 제한 또는 한도 초과)';
      }

      return { error: friendlyMsg };
    }

    const videos = (data.items || []).map(item => ({
      id: item.id.videoId,
      title: item.snippet.title,
      channel: item.snippet.channelTitle,
      thumb: item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default?.url,
      publishedAt: item.snippet.publishedAt,
    }));

    console.log(`✅ YouTube ${videos.length}개 영상`);
    ytCache[cacheKey] = { data: videos, time: Date.now() };
    return videos;
  } catch (e) {
    console.error('YouTube 검색 실패:', e);
    return { error: '네트워크 오류: ' + (e.message || '알 수 없음') };
  }
}

// 시간 포맷 (n일 전 / n시간 전)
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = (now - date) / 1000; // 초
  if (diff < 60) return '방금';
  if (diff < 3600) return Math.floor(diff/60) + '분 전';
  if (diff < 86400) return Math.floor(diff/3600) + '시간 전';
  if (diff < 86400 * 7) return Math.floor(diff/86400) + '일 전';
  if (diff < 86400 * 30) return Math.floor(diff/86400/7) + '주 전';
  if (diff < 86400 * 365) return Math.floor(diff/86400/30) + '개월 전';
  return Math.floor(diff/86400/365) + '년 전';
}

// ====== 자산 - 뉴스 (RSS 자동 피드) ======
let newsCache = null;

async function fetchNewsRSS() {
  if (newsCache && Date.now() - newsCache.time < 5 * 60 * 1000) {
    return newsCache.items;
  }

  const sources = [
    // 한국 경제 뉴스
    { name:'한경 경제', url:'https://www.hankyung.com/feed/economy', tag:'경제' },
    { name:'한경 증권', url:'https://www.hankyung.com/feed/finance', tag:'증시' },
    { name:'한경 부동산', url:'https://www.hankyung.com/feed/realestate', tag:'부동산' },
    { name:'한경 IT', url:'https://www.hankyung.com/feed/it', tag:'IT' },
    { name:'한경 정치', url:'https://www.hankyung.com/feed/politics', tag:'정치' },
    { name:'한경 국제', url:'https://www.hankyung.com/feed/international', tag:'국제' },
    { name:'매일경제', url:'https://www.mk.co.kr/rss/30100041/', tag:'경제' },
    { name:'매경 증권', url:'https://www.mk.co.kr/rss/50200011/', tag:'증시' },
    { name:'매경 부동산', url:'https://www.mk.co.kr/rss/50300009/', tag:'부동산' },
    // 미국 글로벌
    { name:'Yahoo Finance', url:'https://finance.yahoo.com/news/rssindex', tag:'글로벌' },
  ];

  const allItems = [];

  // 여러 프록시 서버 시도 (안정성)
  const proxies = [
    url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
  ];

  await Promise.all(sources.map(async (source) => {
    let success = false;
    
    for (const proxyFn of proxies) {
      if (success) break;
      
      try {
        const proxyUrl = proxyFn(source.url);
        
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000); // 10초
        
        const res = await fetch(proxyUrl, {
          signal: controller.signal,
          headers: {
            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36',
          }
        });
        
        clearTimeout(timeoutId);
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const wrapper = await res.json();
        const xml = wrapper.contents;

        // 간단 XML 파싱
        const parser = new DOMParser();
        const doc = parser.parseFromString(xml, 'text/xml');
        
        if (doc.getElementsByTagName('parsererror').length > 0) {
          throw new Error('XML 파싱 실패');
        }
        
        const items = doc.querySelectorAll('item');

        Array.from(items).slice(0, 5).forEach(item => {
          const title = item.querySelector('title')?.textContent?.trim() || '';
          const link = item.querySelector('link')?.textContent?.trim() || '';
          const pubDate = item.querySelector('pubDate')?.textContent?.trim() || '';

          if (title && link) {
            allItems.push({
              title: title.replace(/<!\[CDATA\[|\]\]>/g, '').substring(0, 100),
              link: link.replace(/<!\[CDATA\[|\]\]>/g, ''),
              pubDate,
              source: source.name,
              tag: source.tag,
            });
          }
        });
        
        success = true;
        console.log(`✅ ${source.name} RSS 로드 성공`);
        
      } catch (e) {
        console.warn(`⚠️ ${source.name} (프록시 실패):`, e.message);
      }
    }
    
    if (!success) {
      console.warn(`❌ ${source.name} 모든 프록시 실패 (뉴스 없으면 괜찮음)`);
    }
  }));

  // 시간 순 정렬
  allItems.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

  newsCache = { items: allItems, time: Date.now() };
  return allItems;
}

function renderAICoaching(total, byType) {
  if (total === 0) {
    return `<div class="ai-card">
      <div class="ai-badge"><i class="ti ti-sparkles" style="font-size:11px;"></i> AI 자산 코치</div>

      <div class="ai-text">보유한 주식, 예금, 현금 등을 입력하면 AI가 포트폴리오를 분석하고 맞춤 자산 플랜을 추천해드려요.</div>
    </div>`;
  }

  // 시뮬레이션 부분 (단순 수식)은 유지 - 데이터 계산이라 AI 아님
  const stockPct = ((byType['주식'] || 0) + (byType['펀드'] || 0)) / total * 100;
  const safePct = ((byType['예적금'] || 0) + (byType['현금'] || 0) + (byType['채권'] || 0)) / total * 100;
  const goldPct = (byType['금'] || 0) / total * 100;

  const monthlySaving = settings.savingsGoal || 0;
  const yearly = monthlySaving * 12;

  let expectedReturn = 0;
  expectedReturn += (stockPct / 100) * 0.08;
  expectedReturn += (safePct / 100) * 0.035;
  expectedReturn += (goldPct / 100) * 0.05;
  expectedReturn = Math.max(expectedReturn, 0.02);

  const expected1Y = Math.round(total * (1 + expectedReturn) + yearly);
  const expected3Y = Math.round(total * Math.pow(1 + expectedReturn, 3) + yearly * ((Math.pow(1 + expectedReturn, 3) - 1) / expectedReturn));
  const expected10Y = Math.round(total * Math.pow(1 + expectedReturn, 10) + yearly * ((Math.pow(1 + expectedReturn, 10) - 1) / expectedReturn));

  // AI 분석 부분은 div로만 두고 비동기로 채움
  const html = `<div id="ai-asset-coach-card"></div>

    <div class="ai-card" style="margin-bottom:14px;">
      <div class="ai-badge" style="background:rgba(255,255,255,0.15); color:white;"><i class="ti ti-trending-up" style="font-size:11px;"></i> 미래 자산 시뮬레이션</div>
      <div style="margin-top:10px;">
        <div style="font-size:11px; opacity:0.7; margin-bottom:8px;">현재 비중 + 월 ${(monthlySaving/10000).toFixed(0)}만원 저축 기준</div>
        <div style="display:flex; gap:8px;">
          <div style="flex:1;">
            <div style="font-size:10px; opacity:0.6;">1년 후</div>
            <div style="font-size:14px; font-weight:600;">${formatMoney(expected1Y)}</div>
          </div>
          <div style="flex:1;">
            <div style="font-size:10px; opacity:0.6;">3년 후</div>
            <div style="font-size:14px; font-weight:600;">${formatMoney(expected3Y)}</div>
          </div>
          <div style="flex:1;">
            <div style="font-size:10px; opacity:0.6;">10년 후</div>
            <div style="font-size:14px; font-weight:600; color:#FFD66E;">${formatMoney(expected10Y)}</div>
          </div>
        </div>

function formatMoney(v) {
  if (v >= 100000000) return (v/100000000).toFixed(1) + '억';
  if (v >= 10000) return (v/10000).toFixed(0) + '만';
  return v.toLocaleString();
}

async function saveAIKey() {
  const key = document.getElementById('ai-key-input').value.trim();
  if (!key) {
    if (window.GEMINI_API_KEY) {
      closeModal();
      return;
    }
    showToast('API 키를 입력해주세요');
    return;
  }

  if (!key.startsWith('AIzaSy')) {
    showToast('올바른 Gemini API 키 형식이 아니에요 (AIzaSy로 시작)');
    return;
  }

  const sync = document.getElementById('ai-sync-toggle').classList.contains('on');

  // localStorage에 저장
  localStorage.setItem('gemini_api_key', key);
  window.GEMINI_API_KEY = key;

  // Firebase에 저장 (선택)
  if (sync && currentUser) {
    try {
      const { db, doc, setDoc } = window._fb;
      await setDoc(doc(db, 'users', currentUser.uid, 'config', 'ai'), {
        geminiKey: key,
        updatedAt: new Date().toISOString()
      });
      showToast('AI 키 저장됨 (모든 기기 동기화)');
    } catch (e) {
      console.error('Firebase 저장 실패:', e);
      showToast('AI 키 저장됨 (이 기기만)');
    }
  } else {
    showToast('AI 키 저장됨 (이 기기만)');
  }

  closeModal();

  // 캐시 초기화 후 AI 다시 호출
  Object.keys(aiCache).forEach(k => delete aiCache[k]);

  // 현재 탭에 AI 카드 있으면 새로 로드
  if (currentTab === 'assets') {
    if (assetTab === 'briefing') loadAIBriefing(true);
    else if (assetTab === 'plan') loadAIActionAdvice();
    else if (assetTab === 'news') loadAINewsSummary();
  }
}

function deleteAIKey() {
  if (!confirm('AI 키를 삭제할까요? 다시 사용하려면 새로 입력해야 해요.')) return;

  localStorage.removeItem('gemini_api_key');

      geminiKey: null,
      updatedAt: new Date().toISOString()
    }).catch(() => {});

  showToast('AI 키 삭제됨');
  closeModal();
  render();
}

function renderAssetPlan(total, byType) {
  // 자산별 비중 계산 (세분화)
  // 국내주식 / 미국주식 / 채권 / 금 / 예적금/현금 / 기타
  const stockKr = assets.filter(a => (a.type === '주식' || a.type === '펀드') && a.region !== '해외').reduce((s, a) => {
    const live = liveAssetData[a.id];
    return s + (live?.hasLive && live.krwValue ? live.krwValue : Number(a.qty) * Number(a.price));
  }, 0);
  const stockUs = assets.filter(a => (a.type === '주식' || a.type === '펀드') && a.region === '해외').reduce((s, a) => {
    const live = liveAssetData[a.id];
    return s + (live?.hasLive && live.krwValue ? live.krwValue : Number(a.qty) * Number(a.price));
  }, 0);
  const bonds = assets.filter(a => a.type === '채권').reduce((s, a) => {
    const live = liveAssetData[a.id];
    return s + (live?.hasLive && live.krwValue ? live.krwValue : Number(a.qty) * Number(a.price));
  }, 0);
  const gold = assets.filter(a => a.type === '금').reduce((s, a) => {
    const live = liveAssetData[a.id];
    return s + (live?.hasLive && live.krwValue ? live.krwValue : Number(a.qty) * Number(a.price));
  }, 0);

// ★ 구체적 투자 추천
function renderInvestmentRecommendations(total, byType, recStock, recSafe, recCoin, monthlySaving) {
  const stockAmt = byType['주식'] || 0;
  const fundAmt = byType['펀드'] || 0;
  const safeAmt = (byType['예적금'] || 0) + (byType['현금'] || 0);
  const coinAmt = byType['코인'] || 0;

  const stockPct = ((stockAmt + fundAmt) / Math.max(total, 1)) * 100;
  const safePct = (safeAmt / Math.max(total, 1)) * 100;
  const coinPct = (coinAmt / Math.max(total, 1)) * 100;

  const recommendations = [];

  // 주식이 부족할 때
  if (stockPct < recStock - 5) {
    const targetAmt = Math.round((total * recStock / 100) - stockAmt - fundAmt);
    recommendations.push({
      type: 'add',
      color: 'info',
      icon: 'ti-trending-up',
      title: '주식·ETF 비중 확대',
      detail: `현재 ${Math.round(stockPct)}% → 목표 ${recStock}%. 약 <b>${formatMoney(targetAmt)}원</b> 추가 권장.`,
      products: [
        { name: 'TIGER 미국S&P500', desc: '대표 미국 지수 ETF, 안정적' },
        { name: 'KODEX 200', desc: '코스피200 추종, 국내 핵심' },
        { name: 'TIGER 미국나스닥100', desc: '미국 기술주 ETF' },
      ]
    });
  }

  // 주식이 너무 많을 때
  if (stockPct > recStock + 10) {
    const excessAmt = Math.round(((stockPct - recStock) / 100) * total);
    recommendations.push({
      type: 'reduce',
      color: 'warning',
      icon: 'ti-arrow-down',
      title: '주식 비중 일부 축소',
      detail: `현재 ${Math.round(stockPct)}% → 목표 ${recStock}%. 약 <b>${formatMoney(excessAmt)}원</b> 안전자산으로 이동 권장.`,
      products: [
        { name: '국채 ETF', desc: 'TIGER 국채10년 등' },
        { name: '정기예금', desc: '5% 이상 특판 찾기' },
        { name: 'CMA 통장', desc: '하루만 맡겨도 이자' },
      ]
    });
  }

  // 안전자산이 부족할 때
  if (safePct < recSafe - 10) {
    const targetAmt = Math.round((total * recSafe / 100) - safeAmt);
    recommendations.push({
      type: 'add',
      color: 'success',
      icon: 'ti-shield',
      title: '안전자산 비상금 확보',
      detail: `현재 ${Math.round(safePct)}% → 목표 ${recSafe}%. 약 <b>${formatMoney(targetAmt)}원</b> 추가 권장.`,
      products: [
        { name: '파킹통장', desc: '토스뱅크, 케이뱅크 (연 2.5%~)' },
        { name: '단기 정기예금', desc: '6개월~1년 만기' },
        { name: 'MMF·CMA', desc: '하루만 맡겨도 이자' },
      ]
    });
  }

  // 코인 비중 과다
  if (coinPct > 10) {
    const excessAmt = Math.round(((coinPct - recCoin) / 100) * total);
    recommendations.push({
      type: 'reduce',
      color: 'danger',
      icon: 'ti-alert-triangle',
      title: '코인 비중 축소',
      detail: `현재 ${Math.round(coinPct)}% → 권장 ${recCoin}% 이내. 약 <b>${formatMoney(excessAmt)}원</b> 안전자산으로 이동 권장.`,
      products: [
        { name: '단계적 매도', desc: '한 번에 팔지 말고 분할' },
        { name: '익절 전략', desc: '+10% 단위로 일부 매도' },
      ]
    });
  }

  // 모두 균형 잡혀있을 때
  if (recommendations.length === 0) {
    recommendations.push({
      type: 'maintain',
      color: 'success',
      icon: 'ti-check',
      title: '균형 잡힌 포트폴리오',
      detail: `현재 비중이 목표에 가까워요. 매월 <b>${formatMoney(monthlySaving)}원</b> 적립식 매수로 자산을 키워가세요.`,
      products: [
        { name: '월 자동이체', desc: '같은 날 같은 ETF 매수' },
        { name: '리밸런싱', desc: '6개월마다 비중 점검' },
      ]
    });
  }

  return recommendations.map(r => `
    <div style="padding:14px; border-radius:var(--radius-md); border:0.5px solid var(--border-tertiary); margin-bottom:10px; background:white;">
      <div style="display:flex; gap:10px; align-items:flex-start; margin-bottom:10px;">
        <div style="width:32px; height:32px; border-radius:8px; background:var(--bg-${r.color}); color:var(--text-${r.color}); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <i class="ti ${r.icon}" style="font-size:16px;"></i>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="font-size:13px; font-weight:600; margin-bottom:4px;">${r.title}</div>
          <div style="font-size:11px; color:var(--text-secondary); line-height:1.6;">${r.detail}</div>
        </div>
      </div>
      <div style="padding-top:10px; border-top:0.5px solid var(--border-tertiary);">
        <div style="font-size:10px; color:var(--text-tertiary); margin-bottom:6px;">추천 상품/방법</div>
        ${r.products.map(p => `
          <div style="display:flex; gap:8px; align-items:center; padding:6px 0; font-size:11px;">
            <i class="ti ti-circle-dot" style="font-size:12px; color:var(--text-${r.color});"></i>
            <div style="flex:1;">
              <b style="font-weight:500;">${p.name}</b>
              <span style="color:var(--text-tertiary); margin-left:6px;">— ${p.desc}</span>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function planRow(name, current, target, total) {
  const diff = current - target;
  const diffAmt = Math.round(total * Math.abs(diff) / 100);
  const action = diff > 3 ? `<span style="color:var(--text-danger);">${diffAmt.toLocaleString()}원 줄이기</span>` :
                 diff < -3 ? `<span style="color:var(--text-success);">${diffAmt.toLocaleString()}원 늘리기</span>` :
                 `<span style="color:var(--text-tertiary);">유지 OK</span>`;
  return `<div style="padding:12px 0; border-bottom:0.5px solid var(--border-tertiary);">
    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <span style="font-size:13px; font-weight:500;">${name}</span>
      <span style="font-size:11px;">${Math.round(current)}% → <b style="font-weight:600;">${target}%</b></span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div style="flex:1; height:6px; background:var(--bg-secondary); border-radius:3px; overflow:hidden; position:relative;">
        <div style="position:absolute; top:0; left:${Math.min(current, 100)}%; width:2px; height:100%; background:var(--text-primary);"></div>
        <div style="position:absolute; top:0; left:${target}%; width:2px; height:100%; background:var(--text-success);"></div>
      </div>
      <span style="font-size:10px;">${action}</span>
    </div>
  </div>`;
}

function simRow(name, rate, val, color) {
  return `<div style="display:flex; align-items:center; gap:10px;">
    <div style="width:8px; height:8px; border-radius:50%; background:${color};"></div>
    <div style="flex:1;">
      <div style="font-size:12px; font-weight:500; color:var(--text-primary);">${name}</div>
      <div style="font-size:10px; color:var(--text-tertiary);">${rate}</div>
    </div>
    <div style="font-size:14px; font-weight:600;">${val.toLocaleString()}원</div>
  </div>`;
}

        예) 카카오 035720.KS, 셀트리온 068270.KQ<br>

  modal.classList.add('show');

    document.querySelectorAll('#atype-grid .cat-btn').forEach(b => {

      });

}

function saveAsset() {
  const name = document.getElementById('a-name').value.trim();
  const ticker = document.getElementById('a-ticker').value.trim();
  const qty = Number(document.getElementById('a-qty').value) || 1;
  const price = Number(document.getElementById('a-price').value);
  const note = document.getElementById('a-note').value.trim();
  const type = document.querySelector('#atype-grid .cat-btn.active').dataset.t;
  const region = document.querySelector('#aregion-grid .chip.active')?.dataset.r || '국내';

  if (!name || !price) { showToast('자산명과 매입가를 입력해주세요'); return; }

  assets.push({ id: Date.now(), name, ticker, type, region, qty, price, note });
  saveData();
  showToast(`${name} 추가됨${ticker ? ' (시세 자동 갱신)' : ''}`);
  closeModal();
  renderAsset();
}

function editAsset(id) {
  const a = assets.find(x => x.id === id);
  if (!a) return;
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-cancel" onclick="closeModal()">취소</button>
        <h2>자산 수정</h2>
        <button class="modal-save" onclick="updateAsset(${id})">저장</button>
      </div>

      <div class="field">
        <div class="field-label">자산명</div>
        <input type="text" id="e-name" value="${a.name}" />
      </div>

      <div class="field">
        <div class="field-label">티커 심볼 (선택)</div>
        <input type="text" id="e-ticker" value="${a.ticker || ''}" placeholder="예: 005930.KS, TSLA, BTC-USD" />
        <div style="font-size:10px; color:var(--text-tertiary); margin-top:4px;">비워두면 수동 입력 가격 사용</div>
      </div>

      <div class="field" style="display:flex; gap:8px;">
        <div style="flex:1;">
          <div class="field-label">수량</div>
          <input type="number" id="e-qty" value="${a.qty}" step="0.0001" />
        </div>
        <div style="flex:1;">
          <div class="field-label">평균 매입가</div>
          <input type="number" id="e-price" value="${a.price}" />
        </div>
      </div>

      <div class="field">
        <div class="field-label">메모</div>
        <input type="text" id="e-note" value="${a.note || ''}" />

      <button onclick="deleteAsset(${id})" style="width:100%; padding:12px; border:none; border-radius:var(--radius-md); background:var(--bg-danger); color:var(--text-danger); font-size:13px; font-weight:500; cursor:pointer; font-family:inherit;">자산 삭제</button>
    </div>
