// 🔧 국내 ETF/종목 이름 → 티커 추론 (티커 안 넣어도 시세 뜨게)
const KR_TICKER_MAP = {
  'KODEX 미국나스닥100': '379810', 'TIGER 미국S&P500': '360750',
  'TIGER 미국나스닥100': '133690', 'KODEX 미국S&P500': '379800',
  'ACE 미국S&P500': '360200', 'ACE 미국나스닥100': '367380',
  'KODEX 200': '069500', 'TIGER 200': '102110', 'KODEX 코스닥150': '229200',
  'KODEX 레버리지': '122630', 'TIGER 미국필라델피아반도체나스닥': '381180',
  'KODEX 미국나스닥100레버리지': '409820', 'SOL 미국S&P500': '433330',
  'TIGER 미국테크TOP10': '381170', 'KODEX 미국나스닥100TR': '379810',
  '삼성전자': '005930', 'SK하이닉스': '000660', 'NAVER': '035420',
  '카카오': '035720', '현대차': '005380', 'LG에너지솔루션': '373220',
};
function guessKRTicker(name) {
  if (!name) return null;
  const clean = name.trim();
  if (KR_TICKER_MAP[clean]) return KR_TICKER_MAP[clean];
  // 부분 일치 (공백·특수문자 무시)
  const norm = (s) => s.replace(/\s+/g, '').toUpperCase();
  const target = norm(clean);
  for (const [k, v] of Object.entries(KR_TICKER_MAP)) {
    if (norm(k) === target) return v;
  }
  return null;
}

async function fetchAssetLive(asset) {
  // 🔧 OCR 캡처로 보정된 평가금액·수익률 스냅샷 (시세 못 받을 때 폴백용)
  const snap = asset.ocrSnapshot;
  const snapResult = () => {
    if (!snap) return null;
    const evalAmt = Number(snap.evalAmount) || 0;
    const krwValue = evalAmt > 0 ? evalAmt : Number(asset.qty) * Number(asset.price);
    return {
      currentPrice: Number(asset.price),
      krwValue,
      changePct: 0,
      profitPct: (snap.profitPct != null) ? Number(snap.profitPct) : 0,
      hasLive: false,
      fromOcr: true,
    };
  };

  // 🔧 티커가 없으면 종목명으로 국내 티커 추론 시도
  let effectiveTicker = asset.ticker;
  if (!effectiveTicker) {
    const guessed = guessKRTicker(asset.name);
    if (guessed) {
      effectiveTicker = guessed;
      asset.ticker = guessed; // 🔧 추론 성공 → 자산에 저장 (다음부터 확실히 LIVE)
      console.log(`🔧 티커 추론·저장: "${asset.name}" → ${guessed}`);
    }
  }

  if (!effectiveTicker) {
    return snapResult() || {
      currentPrice: Number(asset.price),
      krwValue: Number(asset.qty) * Number(asset.price),
      changePct: 0,
      profitPct: 0,
      hasLive: false,
    };
  }

  // 티커 자동 보정 - 한국 ETF 코드 (숫자 6자리)면 .KS 추가
  let ticker = effectiveTicker.trim();
  if (/^\d{6}$/.test(ticker)) {
    ticker = ticker + '.KS';
    console.log(`🔧 티커 자동 보정: ${asset.ticker} → ${ticker}`);
  }

  const priceData = await fetchYahooPrice(ticker);
  if (!priceData) {
    return snapResult() || {
      currentPrice: Number(asset.price),
      krwValue: Number(asset.qty) * Number(asset.price),
      changePct: 0,
      profitPct: 0,
      hasLive: false,
      error: true,
    };
  }

  let krwPrice = priceData.price;
  let krwAvgPrice = Number(asset.price);

  // 미국 주식 (USD) → 원화 환산
  if (priceData.currency === 'USD') {
    const marketRate = await getUSDKRW();

    // 환전 우대율 적용 (자산별 fxDiscount)
    // 매수 환율 = 시장환율 × (1 + 스프레드 × (1 - 우대율/100))
    // 일반 스프레드: 1.75% (증권사 평균)
    const fxDiscount = Number(asset.fxDiscount) || 0;
    const baseSpread = 0.0175; // 1.75%
    const effectiveSpread = baseSpread * (1 - fxDiscount / 100);
    const buyRate = marketRate * (1 + effectiveSpread);

    // 🔧 평가금액(현재 가치)은 매수 스프레드를 끼우지 않고 시장환율로 환산
    //    (증권사 평가금액 = 매매기준율 기준. 매수 스프레드는 살 때만 발생)
    krwPrice = priceData.price * marketRate;

    // 🔧 매입원가 환산 - 핵심: 환차손익을 살리려면 '매수 시점 환율'을 써야 함
    //    avgBuyRate(평균 매입 환율)가 입력돼 있으면 그걸로 원가 고정 → 증권사 수익률과 일치
    const avgBuyRate = Number(asset.avgBuyRate) || 0;
    if (asset.priceCurrency === 'USD') {
      if (avgBuyRate > 0) {
        // 달러 단가 × 사용자가 입력한 평균 매입 환율 = 실제 매입원가(원화)
        krwAvgPrice = krwAvgPrice * avgBuyRate;
      } else {
        // 매입 환율 미입력 → 매수 스프레드 포함 오늘 환율로 폴백 (환차손익 미반영, 안내 필요)
        krwAvgPrice = krwAvgPrice * buyRate;
      }
    } else if (asset.priceCurrency === 'KRW') {
      // 원화 단위 매입가 → 그대로 사용 (매수 시점 환율이 이미 녹아 있음)
    } else {
      // priceCurrency 없는 옛날 자산 → 기존 추측 로직 (하위호환)
      if (krwAvgPrice > 1000000 && Number(asset.qty) > 0) {
        krwAvgPrice = krwAvgPrice / Number(asset.qty);
      } else if (krwAvgPrice < 10000) {
        krwAvgPrice = krwAvgPrice * (avgBuyRate > 0 ? avgBuyRate : buyRate);
      }
    }
  }

  const krwValue = Number(asset.qty) * krwPrice;
  const profitPct = krwAvgPrice > 0 ? ((krwPrice - krwAvgPrice) / krwAvgPrice) * 100 : 0;
  // 매입원가 환율 정보가 없어 환차손익이 빠졌는지 여부 (UI 안내용)
  const fxRateMissing = priceData.currency === 'USD'
    && asset.priceCurrency === 'USD'
    && !(Number(asset.avgBuyRate) > 0);

  return {
    currentPrice: priceData.price,
    krwPrice,
    krwAvgPrice,
    krwValue,
    changePct: priceData.changePct,
    profitPct,
    currency: priceData.currency,
    fxRateMissing,
    hasLive: true,
  };
}

// 네이버 환율 (USD/KRW) - 네이버 모바일/PC 페이지가 실제 사용하는 엔드포인트 사용
async function fetchNaverExchange() {
  const proxies = [
    url => `https://life-planner.qorwl503.workers.dev/?url=${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  ];

  // 🔧 우선순위 1: polling/quotes API (네이버가 실시간 표시에 사용하는 엔드포인트)
  // 이게 모바일 페이지의 실제 표시값과 일치함
  const realtimeTarget = 'https://polling.finance.naver.com/api/realtime?query=SERVICE_RECENT_INDEX:FX_USDKRW';

  for (const proxyFn of proxies) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000);
      const res = await fetch(proxyFn(realtimeTarget), { signal: controller.signal });
      clearTimeout(timeoutId);
      if (!res.ok) continue;

      let text = await res.text();
      try { const j = JSON.parse(text); if (j.contents) text = j.contents; } catch (e) {}

      let data;
      try { data = JSON.parse(text); } catch (e) { continue; }

      console.log('💱 네이버 환율 realtime 응답:', data);

      // 응답 구조: { result: { areas: [{ datas: [{ nv, cv, cr, rf }] }] } }
      const item = data?.result?.areas?.[0]?.datas?.[0];
      if (item) {
        const price = Number(item.nv) / 100 || 0; // nv는 100배 스케일 (예: 150480 = 1504.80)
        const change = Number(item.cv) / 100 || 0;
        const changePct = Number(item.cr) || 0;
        const rf = String(item.rf); // 1=상승, 2=하락, 5=보합

        if (price > 1000 && price < 2000) {
          // 부호 보정
          const signedChange = rf === '2' || rf === '5' && change < 0 ? -Math.abs(change) : (rf === '1' ? Math.abs(change) : change);
          const signedPct = rf === '2' ? -Math.abs(changePct) : (rf === '1' ? Math.abs(changePct) : changePct);
          console.log(`✅ 네이버 환율 realtime: ${price}원, ${signedPct}%`);
          return { price, previousClose: price - signedChange, change: signedChange, changePct: signedPct, currency: 'KRW', time: Date.now() };
        }
      }
    } catch (e) {
      continue;
    }
  }

        const change = Number(String(data.compareToPreviousClosePrice || '').replace(/,/g, '')) || 0;

// 네이버 국내 금 시세 (g당 원) - m.stock.naver.com/marketindex/metals/M04020000 가 쓰는 API
// 화면에 보이는 가격·등락률을 그대로 사용 (계산 안 함)
async function fetchNaverGoldDomestic() {
  const proxies = [
    url => `https://life-planner.qorwl503.workers.dev/?url=${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  ];

  const fetchVia = async (target) => {
    for (const proxyFn of proxies) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 4500);
        const res = await fetch(proxyFn(target), { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) continue;
        let text = await res.text();
        try { const j = JSON.parse(text); if (j.contents) text = j.contents; } catch (e) {}
        return text;
      } catch (e) { continue; }
    }
    return null;
  };

  // 응답 객체에서 가격/등락률/방향을 넓게 탐색 (필드명이 엔드포인트마다 달라서)
  const pick = (obj) => {
    if (!obj || typeof obj !== 'object') return null;
    const num = (v) => Number(String(v ?? '').replace(/,/g, ''));

    // 가격 후보 필드
    const priceCands = [obj.closePrice, obj.nowVal, obj.nv, obj.currentPrice, obj.price, obj.amount];
    let price = 0;
    for (const c of priceCands) {
      const n = num(c);
      if (n > 50000 && n < 500000) { price = n; break; }
    }
    if (!price) return null;

    // 등락률 후보
    let changePct = num(obj.fluctuationsRatio ?? obj.changeRate ?? obj.cr ?? obj.rate);
    if (!isFinite(changePct)) changePct = 0;

    // 방향: risingFalling/rf (2,3=하락), 또는 변동액 부호
    const changeVal = num(obj.compareToPreviousClosePrice ?? obj.changeVal ?? obj.cv);
    const rf = String(obj.risingFalling ?? obj.rf ?? obj?.compareToPreviousPrice?.code ?? '');
    const isDown = rf === '2' || rf === '3' || (isFinite(changeVal) && changeVal < 0);
    if (changePct !== 0) changePct = isDown ? -Math.abs(changePct) : Math.abs(changePct);

    // 비현실적 값 차단
    if (Math.abs(changePct) > 30) changePct = 0;
    return { price, changePct };
  };

  // 응답이 배열/중첩이어도 첫 유효 객체를 찾음
  const dig = (data) => {
    if (!data) return null;
    let r = pick(data);
    if (r) return r;
    // 흔한 중첩 경로들
    const nests = [data.result, data.datas, data.data,
      data?.result?.[0], data?.datas?.[0],
      Array.isArray(data) ? data[0] : null];
    for (const n of nests) {
      if (Array.isArray(n)) { for (const it of n) { r = pick(it); if (r) return r; } }
      else { r = pick(n); if (r) return r; }
    }
    return null;
  };

  // 시도할 엔드포인트들 (순서대로)
  const targets = [
    'https://api.stock.naver.com/marketindex/metals/M04020000/basic',
    'https://m.stock.naver.com/api/marketindex/metals/M04020000/basic',
    'https://api.stock.naver.com/marketindex/metals/M04020000/prices?page=1&pageSize=2',
    'https://m.stock.naver.com/api/marketindex/metals/M04020000/prices?page=1&pageSize=2',
  ];

  for (const target of targets) {
    const text = await fetchVia(target);
    if (!text) continue;
    try {
      const data = JSON.parse(text);
      const r = dig(data);
      if (r) {
        console.log(`✅ 국내 금: ${r.price.toLocaleString()}원/g, ${r.changePct}% (${target})`);
        return r;
      } else {
        // 진단용: 어떤 응답이 왔는지 확인 가능하게
        console.warn('⚠️ 국내 금 - 가격 필드 못 찾음:', target, JSON.stringify(data).slice(0, 400));
      }
    } catch (e) {
      console.warn('⚠️ 국내 금 - JSON 파싱 실패:', target);
    }
  }

  console.error('❌ 국내 금 시세 조회 실패 - 모든 엔드포인트 실패');
  return null;
}


// ====== YouTube Data API ======
const ytCache = {}; // 같은 검색 반복 방지

async function searchYoutube(query, maxResults = 8, order = 'relevance') {
  if (!query) return [];

  // 캐시 확인 (5분 유효) - 정렬 옵션 포함
  const cacheKey = `${query}_${maxResults}_${order}`;
  if (ytCache[cacheKey] && Date.now() - ytCache[cacheKey].time < 5 * 60 * 1000) {
    return ytCache[cacheKey].data;
  }

  try {
    const apiKey = window.YOUTUBE_API_KEY;
    if (!apiKey) {
      console.error('YouTube API 키 없음');
      return { error: 'YouTube API 키가 설정되지 않았어요' };
    }

    // order: relevance(관련성), date(최신순), viewCount(조회수순), rating(평점순)
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=${maxResults}&q=${encodeURIComponent(query)}&type=video&order=${order}&relevanceLanguage=ko&key=${apiKey}`;
    console.log(`🎬 YouTube 검색: ${query} (정렬: ${order})`);

    const res = await fetch(url, { referrerPolicy: 'origin' });
    const data = await res.json();

    if (!res.ok || data.error) {
      const errMsg = data.error?.message || `HTTP ${res.status}`;
      const errReason = data.error?.errors?.[0]?.reason || '';
      console.error('YouTube API 에러:', res.status, errMsg, errReason);

      let friendlyMsg = errMsg;
      if (errReason === 'quotaExceeded') {
        friendlyMsg = 'YouTube 일일 한도 초과 (내일 다시 시도)';
      } else if (errReason === 'keyInvalid' || res.status === 400) {
        friendlyMsg = 'YouTube API 키 문제';
      } else if (res.status === 403) {
        friendlyMsg = '권한 거부 (도메인 제한 또는 한도 초과)';
      }

      return { error: friendlyMsg };
    }

    const videos = (data.items || []).map(item => ({
      id: item.id.videoId,
      title: item.snippet.title,
      channel: item.snippet.channelTitle,
      thumb: item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default?.url,
      publishedAt: item.snippet.publishedAt,
    }));

    console.log(`✅ YouTube ${videos.length}개 영상`);
    ytCache[cacheKey] = { data: videos, time: Date.now() };
    return videos;
  } catch (e) {
    console.error('YouTube 검색 실패:', e);
    return { error: '네트워크 오류: ' + (e.message || '알 수 없음') };
  }
}

// 시간 포맷 (n일 전 / n시간 전)
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = (now - date) / 1000; // 초
  if (diff < 60) return '방금';
  if (diff < 3600) return Math.floor(diff/60) + '분 전';
  if (diff < 86400) return Math.floor(diff/3600) + '시간 전';
  if (diff < 86400 * 7) return Math.floor(diff/86400) + '일 전';
  if (diff < 86400 * 30) return Math.floor(diff/86400/7) + '주 전';
  if (diff < 86400 * 365) return Math.floor(diff/86400/30) + '개월 전';
  return Math.floor(diff/86400/365) + '년 전';
}

  const wrap = [
    url => `https://life-planner.qorwl503.workers.dev/?url=${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  ];

  for (const feedUrl of feeds) {
    for (const wrapFn of wrap) {
      try {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 7000);
        const res = await fetch(wrapFn(feedUrl), { signal: controller.signal });
        clearTimeout(timeoutId);
        if (!res.ok) continue;

        const ct = res.headers.get('content-type') || '';
        const raw = await res.text();
        let xml;
        if (ct.includes('json') || raw.trim().startsWith('{')) {
          try { const w = JSON.parse(raw); xml = w.contents || w.body || raw; }
          catch { xml = raw; }
        } else { xml = raw; }
        if (!xml || !xml.includes('<item')) continue;

        const items = [];
        const itemMatches = xml.match(/<item[\s>][\s\S]*?<\/item>/g) || [];
        for (const block of itemMatches.slice(0, 8)) {
          const titleM = block.match(/<title>(?:<!\[CDATA\[)?([\s\S]*?)(?:\]\]>)?<\/title>/);
          const dateM = block.match(/<pubDate>([\s\S]*?)<\/pubDate>/);
          if (titleM) {
            let title = titleM[1].trim().replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&').replace(/&quot;/g,'"').replace(/&#39;/g,"'");
            let dateStr = '';
            if (dateM) {
              const d = new Date(dateM[1]);
              if (!isNaN(d)) dateStr = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
            }
            if (title) items.push({ title, date: dateStr });
          }
        }
        if (items.length > 0) {
          console.log(`📰 ${stockName} 뉴스 ${items.length}건 수집 (${feedUrl.includes('yahoo') ? '야후' : feedUrl.includes('google') ? '구글' : '네이버'})`);
          return items;
        }
      } catch (e) {
        continue;
      }
    }
  }
  console.warn(`${stockName} 뉴스 수집 실패 (모든 소스)`);
  return [];
}

// 🔧 야후 파이낸스에서 ETF/종목 기초 정보(AUM·운용보수·배당·지수 등) 실시간 수집
//    AI는 이런 사이트에 직접 못 들어가므로, 뉴스처럼 긁어다 프롬프트에 넣어줌
async function fetchFundFacts(ticker) {
  if (!ticker) return null;
  let t = ticker.trim();
  const tClean = t.replace(/\.(KS|KQ)$/i, '');

  // 🔧 1순위: Worker /fund 라우트 (서버가 야후 직접 호출 → 403 우회). 이미 파싱된 결과를 줌
  try {
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 8000);
    const res = await fetch(`https://life-planner.qorwl503.workers.dev/fund?ticker=${encodeURIComponent(tClean)}`, { signal: controller.signal });
    clearTimeout(timeoutId);
    if (res.ok) {
      const f = await res.json();
      // 🔧 Worker에 /fund 라우트가 없으면 {ok:true, message:'...Proxy', usage:...} 같은 안내가 옴 → 펀드정보 아님
      const isProxyInfo = f && (f.ok === true || f.message || f.usage) && !f['운용보수'] && !f['배당수익률'] && !f['운용자산(AUM)'];
      if (f && !f.error && !isProxyInfo && Object.keys(f).length > 2) {
        delete f.source; delete f.ticker; delete f.note;
        if (f['개요']) { f['_요약'] = f['개요']; delete f['개요']; }
        // 실제 수치 키가 하나라도 있어야 인정
        const hasRealData = Object.keys(f).some(k => !k.startsWith('_'));
        if (hasRealData) {
          console.log(`📊 ${ticker} 펀드정보 수집 (Worker):`, f);
          return f;
        }
      }
      if (isProxyInfo) console.warn('⚠️ Worker에 /fund 라우트 미배포 (worker-fundfacts.js 배포 필요)');
    }
  } catch (e) { /* 폴백으로 */ }

  // 🔧 2순위: 기존 프록시로 야후 quoteSummary 직접 (Worker /fund 미배포 시)
  if (/^\d{6}$/.test(t)) t = t + '.KS';
  const modules = 'price,summaryDetail,defaultKeyStatistics,fundProfile,topHoldings,summaryProfile';
  const apiUrl = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${encodeURIComponent(t)}?modules=${modules}`;

  const proxies = [
    { url: `https://life-planner.qorwl503.workers.dev/?url=${encodeURIComponent(apiUrl)}`, parse: async (res) => JSON.parse((await res.json()).contents) },
    { url: `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`, parse: async (res) => JSON.parse((await res.json()).contents) },
    { url: `https://corsproxy.io/?${encodeURIComponent(apiUrl)}`, parse: async (res) => res.json() },
    { url: `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(apiUrl)}`, parse: async (res) => res.json() },
  ];

  for (const proxy of proxies) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 6000);
      const res = await fetch(proxy.url, { signal: controller.signal });
      clearTimeout(timeoutId);
      if (!res.ok) continue;

      let json;
      try { json = await proxy.parse(res); } catch (pe) { continue; }

      const r = json?.quoteSummary?.result?.[0];
      if (!r) continue;

      const facts = {};
      const sd = r.summaryDetail || {};
      const ks = r.defaultKeyStatistics || {};
      const fp = r.fundProfile || {};
      const pr = r.price || {};
      const sp = r.summaryProfile || {};

      if (pr.regularMarketPrice?.raw) facts['현재가'] = `${pr.regularMarketPrice.raw} ${pr.currency||''}`;
      if (sd.marketCap?.raw) facts['시가총액'] = sd.marketCap.fmt;
      if (ks.totalAssets?.raw) facts['운용자산(AUM)'] = ks.totalAssets.fmt;
      if (fp.feesExpensesInvestment?.annualReportExpenseRatio?.raw != null)
        facts['운용보수(Expense Ratio)'] = (fp.feesExpensesInvestment.annualReportExpenseRatio.raw * 100).toFixed(2) + '%';
      else if (ks.annualReportExpenseRatio?.raw != null)
        facts['운용보수'] = (ks.annualReportExpenseRatio.raw * 100).toFixed(2) + '%';
      if (sd.dividendYield?.raw != null) facts['배당수익률'] = (sd.dividendYield.raw * 100).toFixed(2) + '%';
      else if (sd.yield?.raw != null) facts['분배수익률'] = (sd.yield.raw * 100).toFixed(2) + '%';
      if (sd.dividendRate?.raw != null) facts['연간배당'] = sd.dividendRate.raw + ' ' + (pr.currency||'');
      if (sd.trailingPE?.raw != null) facts['PER'] = sd.trailingPE.raw.toFixed(2);
      if (ks.priceToBook?.raw != null) facts['PBR'] = ks.priceToBook.raw.toFixed(2);
      if (sd.fiftyTwoWeekHigh?.raw && sd.fiftyTwoWeekLow?.raw)
        facts['52주 범위'] = `${sd.fiftyTwoWeekLow.raw} ~ ${sd.fiftyTwoWeekHigh.raw}`;
      if (fp.categoryName) facts['카테고리'] = fp.categoryName;
      if (fp.legalType) facts['유형'] = fp.legalType;
      if (sp.longBusinessSummary) facts['_요약'] = sp.longBusinessSummary.slice(0, 300);

      if (Object.keys(facts).length > 0) {
        console.log(`📊 ${ticker} 펀드정보 수집 (직접):`, facts);
        return facts;
      }
    } catch (e) {
      continue;
    }
  }
  console.warn(`${ticker} 펀드정보 수집 실패 — 야후에 없음, AI 학습데이터로 (시점 명시됨)`);
  return null;
}

async function fetchNewsRSS() {
  if (newsCache && Date.now() - newsCache.time < 5 * 60 * 1000) {
    return newsCache.items;
  }

  const sources = [
    { name:'인베스팅닷컴', url:'https://kr.investing.com/rss/news_25.rss', tag:'증시' },
    { name:'Investing.com', url:'https://www.investing.com/rss/news_25.rss', tag:'🇺🇸 글로벌' },
    { name:'한경 증권', url:'https://www.hankyung.com/feed/finance', tag:'증시' },
    { name:'한국경제', url:'https://www.hankyung.com/feed/economy', tag:'경제' },
    { name:'Yahoo Finance', url:'https://finance.yahoo.com/news/rssindex', tag:'🇺🇸 글로벌' },
  ];

  const allItems = [];

  // 여러 프록시 서버 시도 (본인 Cloudflare Worker 1순위 - 안정적)
  const proxies = [
    url => `https://life-planner.qorwl503.workers.dev/?url=${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
  ];

  // 전체 함수 최대 25초 안에 끝내기 (인베스팅 시간 충분히)
  const overallTimeout = new Promise(resolve => setTimeout(resolve, 25000));

  const fetchAll = Promise.all(sources.map(async (source) => {
    let success = false;
    
    for (const proxyFn of proxies) {
      if (success) break;
      
      try {
        const proxyUrl = proxyFn(source.url);
        
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000); // 12초 (인베스팅 등 느린 사이트 위해)
        
        const res = await fetch(proxyUrl, {
          signal: controller.signal,
        });
        
        clearTimeout(timeoutId);
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const wrapper = await res.json();
        const xml = wrapper.contents;
        if (!xml) throw new Error('빈 응답');

        // JSON 형식 처리 (네이버 증권 등)
        if (source.isJson) {
          try {
            const jsonData = JSON.parse(xml);
            const newsList = jsonData?.newsList || jsonData?.list || jsonData?.items || [];
            newsList.slice(0, 10).forEach(item => {
              const title = (item.title || item.officeName || '').trim();
              const link = item.officialUrl || item.url || `https://m.stock.naver.com/news/${item.articleId || ''}`;
              const pubDate = item.datetime || item.publishedAt || new Date().toISOString();
              if (title) {
                allItems.push({
                  title: title.substring(0, 100),
                  link,
                  pubDate,
                  source: source.name,
                  tag: source.tag,
                });
              }
            });
            success = true;
            console.log(`✅ ${source.name} JSON 로드 (${newsList.length}개)`);
            continue;
          } catch (jsonErr) {
            throw new Error('JSON 파싱 실패');
          }
        }

        // XML 파싱 (일반 RSS)
        const parser = new DOMParser();
        const doc = parser.parseFromString(xml, 'text/xml');
        
        if (doc.getElementsByTagName('parsererror').length > 0) {
          throw new Error('XML 파싱 실패');
        }
        
        const items = doc.getElementsByTagName('item');
        console.log(`📡 ${source.name}: ${items.length}개 item 발견`);

        let addedCount = 0;
        Array.from(items).slice(0, 10).forEach((item, idx) => {
          // 모든 직접 자식 노드 중에서 link 찾기 (enclosure 무시)
          const children = Array.from(item.children);

          const titleEl = children.find(c => c.tagName === 'title');
          const pubDateEl = children.find(c => c.tagName === 'pubDate');
          // link 태그 중에서 enclosure가 아닌 거 (직접 자식 link)
          const linkEl = children.find(c => c.tagName === 'link');

          const title = titleEl?.textContent?.trim() || '';
          let link = linkEl?.textContent?.trim() || '';
          // link 태그 자체에 텍스트 없으면 href 속성 시도 (Atom 형식)
          if (!link && linkEl) {
            link = linkEl.getAttribute('href') || '';
          }
          const pubDate = pubDateEl?.textContent?.trim() || new Date().toISOString();

          // 디버그용 첫 번째 아이템 정보
          if (idx === 0) {
            console.log(`   첫 item: title="${title.substring(0,30)}", link="${link.substring(0,40)}"`);
          }

          if (title) {  // link 없어도 title만 있으면 추가
            allItems.push({
              title: title.replace(/<!\[CDATA\[|\]\]>/g, '').substring(0, 100),
              link: link.replace(/<!\[CDATA\[|\]\]>/g, '') || '#',
              pubDate,
              source: source.name,
              tag: source.tag,
            });
            addedCount++;
          }
        });
        
        success = true;
        console.log(`✅ ${source.name} 로드 성공 (${addedCount}/${items.length}개 추가)`);
        
      } catch (e) {
        console.warn(`⚠️ ${source.name} 프록시 실패:`, e.message);
      }
    }
    
    if (!success) {
      console.warn(`❌ ${source.name} 모든 프록시 실패`);
    }
  }));

  // 어느 쪽이든 먼저 끝나는 것에 따라 진행
  await Promise.race([fetchAll, overallTimeout]);

  // 날짜 파싱 안전 처리 (인베스팅 등 다양한 형식 호환)
  function parseDate(dateStr) {
    if (!dateStr) return new Date(0); // 빈 값이면 1970년 (제일 뒤)
    try {
      // "2026-05-14 06:41:28" 형식 처리 (인베스팅) → ISO로
      let cleaned = dateStr.trim();
      if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(cleaned)) {
        cleaned = cleaned.replace(' ', 'T') + '+09:00'; // 한국 시간으로 가정
      }
      const d = new Date(cleaned);
      if (isNaN(d.getTime())) return new Date(0);
      return d;
    } catch (e) {
      return new Date(0);
    }
  }

  // 시간 순 정렬
  allItems.sort((a, b) => parseDate(b.pubDate) - parseDate(a.pubDate));

  // 소스별 균등 배치: 각 소스에서 최소 3개씩은 상단에
  const bySource = {};
  allItems.forEach(item => {
    if (!bySource[item.source]) bySource[item.source] = [];
    bySource[item.source].push(item);
  });

  // 인터리브: 각 소스에서 1개씩 돌아가며 추가 (최대 8개씩)
  const interleaved = [];
  let maxIter = 8;
  for (let i = 0; i < maxIter; i++) {
    Object.values(bySource).forEach(arr => {
      if (arr[i]) interleaved.push(arr[i]);
    });
  }

  // 나머지 추가 (이미 추가된 거 제외)
  const interleavedSet = new Set(interleaved);
  const remaining = allItems.filter(item => !interleavedSet.has(item));
  const finalItems = [...interleaved, ...remaining];

  newsCache = { items: finalItems, time: Date.now() };
  return finalItems;
}

// ★ AI 자산 코치 - 진짜 Gemini 사용
function renderAICoaching(total, byType) {
  if (total === 0) {
    return `<div class="ai-card">
      <div class="ai-badge"><i class="ti ti-sparkles" style="font-size:11px;"></i> AI 자산 코치</div>
      <h3>먼저 자산을 입력해주세요</h3>
      <div class="ai-text">보유한 주식, 예금, 현금 등을 입력하면 AI가 포트폴리오를 분석하고 맞춤 자산 플랜을 추천해드려요.</div>
    </div>`;
  }

  // 시뮬레이션 부분 (단순 수식)은 유지 - 데이터 계산이라 AI 아님
  const stockPct = Object.keys(byType).filter(t => isStockLikeType(t)).reduce((s, t) => s + (byType[t] || 0), 0) / total * 100;
  const safePct = ((byType['예적금'] || 0) + (byType['현금'] || 0) + (byType['채권'] || 0)) / total * 100;
  const goldPct = (byType['금'] || 0) / total * 100;
  const dollarPct = (byType['달러'] || 0) / total * 100;

  // 실제 월 투자액 자동 계산 (최근 3개월 평균)
  function getAvgMonthlyInvest() {
    const now = new Date();
    let totalInvest = 0;
    let months = 0;
    const investCats = ['주식','국내주식','미국주식','ETF','국내ETF','해외ETF','펀드','채권','금','달러','예적금','청약','부동산','투자'];

    // 자동매수 (고정지출 - 투자) 월별 합계
    let autoBuyPerMonth = 0;
    (budget.fixed || []).forEach(f => {
      if (f.cat !== '투자') return;
      const cycle = f.cycle || 'monthly';
      if (cycle === 'monthly') autoBuyPerMonth += Number(f.amt);
      else if (cycle === 'weekly') autoBuyPerMonth += Number(f.amt) * 4.33;
      else if (cycle === 'biweekly') autoBuyPerMonth += Number(f.amt) * 2.17;
    });

    // 최근 3개월 가계부의 투자 카테고리 합계
    for (let i = 0; i < 3; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const prefix = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const monthInvest = (budget.expenses || [])
        .filter(e => e.dateKey?.startsWith(prefix) && investCats.includes(e.cat) && !e.autoBuy)
        .reduce((s, e) => s + Number(e.amt), 0);
      if (monthInvest > 0 || i === 0) {
        totalInvest += monthInvest;
        months++;
      }
    }
    const avgManual = months > 0 ? totalInvest / months : 0;
    return Math.round(avgManual + autoBuyPerMonth);
  }

  // 사용자 설정 우선, 없으면 자동 계산
  const calculatedMonthly = getAvgMonthlyInvest();
  const monthlySaving = (settings.simMonthlyOverride !== undefined && settings.simMonthlyOverride !== null)
    ? Number(settings.simMonthlyOverride)
    : calculatedMonthly;
  const yearly = monthlySaving * 12;

  // 사용자 설정 수익률 우선, 없으면 비중 기반 자동 계산
  let autoReturn = 0;
  autoReturn += (stockPct / 100) * 0.08;
  autoReturn += (safePct / 100) * 0.035;
  autoReturn += (goldPct / 100) * 0.05;
  autoReturn += (dollarPct / 100) * 0.03;
  autoReturn = Math.max(autoReturn, 0.02);

  const expectedReturn = (settings.simReturnOverride !== undefined && settings.simReturnOverride !== null)
    ? Number(settings.simReturnOverride) / 100
    : autoReturn;

  const expected1Y = Math.round(total * (1 + expectedReturn) + yearly);
  const expected3Y = Math.round(total * Math.pow(1 + expectedReturn, 3) + yearly * ((Math.pow(1 + expectedReturn, 3) - 1) / expectedReturn));
  const expected10Y = Math.round(total * Math.pow(1 + expectedReturn, 10) + yearly * ((Math.pow(1 + expectedReturn, 10) - 1) / expectedReturn));

  const isCustomMonthly = settings.simMonthlyOverride !== undefined && settings.simMonthlyOverride !== null;
  const isCustomReturn = settings.simReturnOverride !== undefined && settings.simReturnOverride !== null;

  // AI 분석 부분은 div로만 두고 비동기로 채움
  const html = `<div id="ai-asset-coach-card"></div>

    <div class="ai-card" style="margin-bottom:14px;">

    // 기존 호출의 결과 기다림

        // 결과 받으면 다시 렌더 (현재 탭이 자산이면)

  }).join('\n');

  const monthlyIncome = settings.monthlyIncome || 0;

  const bk = getAllocationBuckets();

  const currentAlloc = {
    stockKr: bpct(bk.stockKr), stockUs: bpct(bk.stockUs),

  const detailSummary =
    `- 국내주식: ${bk.stockKr.toLocaleString()}원 (${currentAlloc.stockKr.toFixed(1)}%)\n` +

  const target7 = migrateAlloc(settings.allocation);

    stockKr: (target7.stockKr || 0) + (target7.etfKr || 0),
    stockUs: (target7.stockUs || 0) + (target7.etfUs || 0),
    bonds: target7.bonds || 0,

    cash: target7.cash || 0,
  } : null;
  let targetSummary = '(사용자가 목표 배분을 아직 설정하지 않음)';
  let gapSummary = '';
  if (target) {
    targetSummary =
      `- 국내주식 ${target.stockKr}% / 미국·해외주식 ${target.stockUs}% / ` +
      `채권 ${target.bonds}% / 금 ${target.gold}% / 현금성 ${target.cash}%`;
    const gap = (label, cur, tgt) => {
      const d = cur - tgt;
      if (Math.abs(d) < 3) return `- ${label}: 목표에 거의 맞음 (현재 ${cur.toFixed(0)}% / 목표 ${tgt}%)`;

(${target ? '위 "목표 대비 현재 차이"를 기준으로, 부족한 자산군은 더 담고 초과한 자산군은 비중을 줄이는 방향으로' : '다음 단계에 무엇을 해야 할지'} 1~2문장, 구체적 자산군 카테고리)

  // askGemini 호출을 _aiInFlight에 등록 (탭 이동에도 결과 추적)

function formatMoney(v) {
  if (v >= 100000000) return (v/100000000).toFixed(1) + '억';
  if (v >= 10000) return (v/10000).toFixed(0) + '만';
  return v.toLocaleString();
}

// ★ 자산명/티커/통화로 국내·해외(미국 등) 자동 추정
function guessAssetRegion(name, ticker, cur) {
  const n = (name || '').toLowerCase();
  const t = (ticker || '').toLowerCase();
  if ((cur || '').toUpperCase() === 'USD') return '해외';
  if (/미국|s&p|sp500|s&p500|나스닥|nasdaq|qqq|spy|voo|vti|vt |다우|dow|글로벌|선진국|러셀|russell|미국채|미국배당|반도체|소부장|필라델피아/.test(n)) return '해외';
  if (/\.ks$|\.kq$/.test(t) || /^\d{6}/.test(t)) return '국내';
  if (/코스피|코스닥|kospi|kosdaq|국내|한국|코리아/.test(n)) return '국내';
  if (t.length > 0 && /^[a-z]{1,5}$/.test(t)) return '해외'; // 알파벳 티커 → 미국 상장 추정
  return '국내';
}

// ★ 자산 분류 헬퍼 — 자산을 표준 버킷으로 분류
// 반환값: 'stockKr' | 'stockUs' | 'bonds' | 'gold' | 'cash' | 'dollar' | 'other'
// ETF / 펀드는 이름·티커·통화 기반으로 미국/국내/채권/금을 자동 판별 (region 명시값 우선)
function classifyAssetBucket(a) {
  const type = a.type || '';
  const name = (a.name || '').toLowerCase();
  const ticker = (a.ticker || '').toLowerCase();
  const cur = (a.priceCurrency || '').toUpperCase();

  // 단순 타입
  if (type === '금') return 'gold';
  if (type === '채권') return 'bonds';
  if (type === '예적금' || type === '현금' || type === '청약') return 'cash';
  if (type === '달러') return 'dollar';
  if (type === '부동산') return 'other';

  // 주식 / ETF / 펀드 → 미국 vs 국내 + 채권/금 ETF 구분
  if (type === '주식' || type === 'ETF' || type === '펀드') {
    // 채권형 ETF/펀드
    if (/채권|국채|회사채|크레딧|bond|treasury|회사채|tips|만기매칭|종합채/.test(name)) return 'bonds';
    // 금 ETF/펀드
    if (/(^|[^가-힣])금([^가-힣]|$)|골드|gold|krx금/.test(name)) return 'gold';

    // 미국/해외 판별
    const isUsByName = /미국|s&p|sp500|s&p500|나스닥|nasdaq|qqq|spy|voo|vti|vt |다우|dow|미국채|러셀|russell|글로벌|선진국|필라델피아|반도체 ?soxx|미국배당/.test(name);
    const isUsByTicker = /^(spy|qqq|voo|vti|vt|dia|schd|jepi|jepq|soxx|smh|tlt|ief|gld|iau)$/.test(ticker)
      || (ticker.length > 0 && /^[a-z]{1,5}$/.test(ticker) && !/\.ks$|\.kq$/.test(ticker));
    const isUsByCur = cur === 'USD';
    const isUsByRegion = a.region === '해외' || a.region === '미국';
    const isKrByRegion = a.region === '국내';
    const isKrByTicker = /\.ks$|\.kq$/.test(ticker) || /^\d{6}/.test(ticker);

    // region이 '해외'로 명시됐거나, 이름/티커/통화가 미국을 가리키면 미국
    if (isUsByRegion || isUsByName || isUsByCur || (isUsByTicker && !isKrByTicker)) return 'stockUs';
    return 'stockKr';
  }
  return 'other';
}

// 🔧 7버킷 분류 — 목표 자산배분 상세화용
// 'stockKr' | 'stockUs' | 'etfKr' | 'etfUs' | 'bonds' | 'gold' | 'cash'
// classifyAssetBucket과 달리 ETF를 주식에서 분리한다.
function classifyAssetBucket7(a) {
  const base = classifyAssetBucket(a); // 미국/국내·채권형·금형 판별 재사용
  const type = a.type || '';
  // 채권·금·현금성은 5버킷과 동일
  if (base === 'bonds') return 'bonds';
  if (base === 'gold') return 'gold';
  if (base === 'cash') return 'cash';
  if (base === 'dollar') return 'cash';   // 외화현금 → 현금
  if (base === 'other') return 'cash';    // 부동산 등 → 일단 현금성으로(목표엔 미포함 취급)
  // 주식 계열: ETF면 etf*, 아니면 stock*
  if (type === 'ETF') return base === 'stockUs' ? 'etfUs' : 'etfKr';
  // 펀드는 성격상 ETF에 가까우니 etf*로 묶음
  if (type === '펀드') return base === 'stockUs' ? 'etfUs' : 'etfKr';
  // 개별 주식
  return base === 'stockUs' ? 'stockUs' : 'stockKr';
}

// 7버킷 합계
function getAllocationBuckets7() {
  const b = { stockKr: 0, stockUs: 0, etfKr: 0, etfUs: 0, bonds: 0, gold: 0, cash: 0 };
  (assets || []).forEach(a => {
    b[classifyAssetBucket7(a)] += assetKrwValue(a);
  });
  return b;
}

// 자산 1개의 원화 평가액
function assetKrwValue(a) {
  const live = liveAssetData[a.id];
  if (live?.hasLive && live.krwValue) return live.krwValue;
  return Number(a.qty || 0) * Number(a.price || 0);
}

// 전체 자산을 표준 버킷별 합계로 — AI 코치 / 자산플랜 공용
function getAllocationBuckets() {
  const b = { stockKr: 0, stockUs: 0, bonds: 0, gold: 0, cash: 0, dollar: 0, other: 0 };
  (assets || []).forEach(a => {
    b[classifyAssetBucket(a)] += assetKrwValue(a);
  });
  return b;
}

// classifyAssetBucket(5버킷)보다 세분화: 주식/ETF/펀드/채권/금/현금을 각각 구분

  if (bucket === 'gold') return { key: 'goldFund', label: '금 ETF·펀드', color: '#E2A04A' };

    : { key: 'fundKr', label: '국내 펀드', color: '#6BA0E2' };
  // 개별 주식
  return isUs
    ? { key: 'stockUs', label: '미국 주식', color: '#5D7CE0' }
    : { key: 'stockKr', label: '국내 주식', color: '#4A90E2' };

// 현재 자산을 상세 자산군별 합계로
function getDetailGroups() {
  const map = {};
  (assets || []).forEach(a => {
    const g = detailAssetGroup(a);
    if (!map[g.key]) map[g.key] = { ...g, value: 0, count: 0 };
    map[g.key].value += assetKrwValue(a);
    map[g.key].count += 1;
  });
  return Object.values(map).sort((x, y) => y.value - x.value);
}

function planRow(name, current, target, total) {
  const diff = current - target;
  const diffAmt = Math.round(total * Math.abs(diff) / 100);
  const action = diff > 3 ? `<span style="color:var(--text-danger);">${diffAmt.toLocaleString()}원 줄이기</span>` :
                 diff < -3 ? `<span style="color:var(--text-success);">${diffAmt.toLocaleString()}원 늘리기</span>` :
                 `<span style="color:var(--text-tertiary);">유지 OK</span>`;
  return `<div style="padding:12px 0; border-bottom:0.5px solid var(--border-tertiary);">
    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <span style="font-size:13px; font-weight:500;">${name}</span>
      <span style="font-size:11px;">${Math.round(current)}% → <b style="font-weight:600;">${target}%</b></span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div style="flex:1; height:6px; background:var(--bg-secondary); border-radius:3px; overflow:hidden; position:relative;">
        <div style="position:absolute; top:0; left:${Math.min(current, 100)}%; width:2px; height:100%; background:var(--text-primary);"></div>
        <div style="position:absolute; top:0; left:${target}%; width:2px; height:100%; background:var(--text-success);"></div>
      </div>
      <span style="font-size:10px;">${action}</span>
    </div>
  </div>`;
}

function simRow(name, rate, val, color) {
  return `<div style="display:flex; align-items:center; gap:10px;">
    <div style="width:8px; height:8px; border-radius:50%; background:${color};"></div>
    <div style="flex:1;">
      <div style="font-size:12px; font-weight:500; color:var(--text-primary);">${name}</div>
      <div style="font-size:10px; color:var(--text-tertiary);">${rate}</div>
    </div>
    <div style="font-size:14px; font-weight:600;">${val.toLocaleString()}원</div>
  </div>`;
}

function saveAsset() {
  const type = document.querySelector('#atype-grid .cat-btn.active')?.dataset.t || '주식';
  const nameEl = document.getElementById('a-name');
  const bankEl = document.getElementById('a-bank');
  const locEl = document.getElementById('a-location');

  // 자산명은 타입에 따라 다른 필드에서 가져옴
  const name = nameEl?.value?.trim() || bankEl?.value?.trim() || locEl?.value?.trim();

  const ticker = document.getElementById('a-ticker')?.value?.trim() || '';
  const qty = Number(document.getElementById('a-qty')?.value) || 1;
  const price = Number(document.getElementById('a-price')?.value);
  const note = document.getElementById('a-note')?.value?.trim() || '';
  const region = document.querySelector('#aregion-grid .chip.active')?.dataset.r || '국내';
  // 🔧 매입가 통화 (원화/달러) - 없으면 원화 기본
  const priceCurrency = document.querySelector('#a-price-currency .chip.active')?.dataset.cur || 'KRW';
  // 🔧 평균 매입 환율 (달러 단가로 입력했을 때만 의미 있음)
  const avgBuyRate = Number(document.getElementById('a-avgrate')?.value) || 0;

  // 부동산, 채권, 예적금 등 추가 필드
  const propType = document.querySelector('#aproptype-grid .chip.active')?.dataset.p || '';
  const subType = document.querySelector('#asubtype-grid .chip.active')?.dataset.s || '';
  const maturity = document.getElementById('a-maturity')?.value || '';
  const rate = Number(document.getElementById('a-rate')?.value) || 0;
  const buyprice = Number(document.getElementById('a-buyprice')?.value) || 0;
  const rounds = Number(document.getElementById('a-rounds')?.value) || 0;

  if (!name || !price) {
    showToast('자산명과 금액을 입력해주세요');
    return;
  }

  const asset = { id: Date.now(), name, ticker, type, region, qty, price, note };
  // 타입별 추가 정보
  if (isStockLikeType(type)) {
    asset.priceCurrency = priceCurrency;
    if (priceCurrency === 'USD' && avgBuyRate > 0) asset.avgBuyRate = avgBuyRate;
  }
  if (propType) asset.propType = propType;
  if (subType) asset.subType = subType;
  if (maturity) asset.maturity = maturity;
  if (rate) asset.rate = rate;
  if (buyprice) asset.buyprice = buyprice;
  if (rounds) asset.rounds = rounds;

  assets.push(asset);
  saveData();
  showToast(`${name} 추가됨${ticker ? ' (시세 자동 갱신)' : ''}`);
  closeModal();
  renderAsset();
}

// 🔧 자산 합치기 — 같은 종류의 다른 자산을 골라 하나로 통합
function openMergeAssetPicker(targetId) {
  const target = assets.find(a => a.id === targetId);
  if (!target) return;
  const candidates = assets.filter(x => x.id !== targetId && x.type === target.type);
  if (candidates.length === 0) { showToast('합칠 수 있는 같은 종류 자산이 없어요'); return; }

  // 같은 티커는 맨 위로 (가장 합칠 가능성 높음)
  const normT = (t) => (t || '').toUpperCase().replace(/\.(KS|KQ)$/, '').trim();
  candidates.sort((a, b) => {
    const aMatch = normT(a.ticker) && normT(a.ticker) === normT(target.ticker) ? 0 : 1;
    const bMatch = normT(b.ticker) && normT(b.ticker) === normT(target.ticker) ? 0 : 1;
    return aMatch - bMatch;
  });

  modal.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-cancel" onclick="closeModal(); setTimeout(()=>editAsset(${targetId}),50);">취소</button>
        <h2>🔗 자산 합치기</h2>
        <span></span>
      </div>

      <div style="padding:10px 12px; background:var(--bg-info); border-radius:8px; margin-bottom:12px; font-size:11px; color:var(--text-info); line-height:1.5;">
        <b>${escapeHTML(target.name)}</b>에 합칠 자산을 고르세요. 선택한 자산의 보유분이 <b>${escapeHTML(target.name)}</b>으로 합쳐지고, 선택한 자산은 삭제돼요.<br>
        예: 일반계좌 QQQ + 소수점계좌 QQQ → 하나로
      </div>

      <div style="display:flex; flex-direction:column; gap:8px;">
        ${candidates.map(c => {
          const live = liveAssetData[c.id];
          const v = live?.hasLive && live.krwValue ? live.krwValue : Number(c.qty) * Number(c.price);
          const sameTicker = normT(c.ticker) && normT(c.ticker) === normT(target.ticker);
          const qtyStr = Number.isInteger(Number(c.qty)) ? Number(c.qty).toLocaleString() : Number(c.qty).toFixed(4).replace(/\.?0+$/, '');
          return `
            <button onclick="mergeAssetInto(${targetId}, ${c.id})" style="text-align:left; padding:12px; border:1px solid ${sameTicker ? 'var(--text-info)' : 'var(--border-tertiary)'}; background:${sameTicker ? 'var(--bg-info)' : 'white'}; border-radius:10px; cursor:pointer; font-family:inherit;">
              <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:13px; font-weight:600;">${escapeHTML(c.name)} ${sameTicker ? '<span style="font-size:9px; color:var(--text-info);">· 같은 티커</span>' : ''}</span>
                <span style="font-size:12px; color:var(--text-secondary);">${Math.round(v).toLocaleString()}원</span>
              </div>
              <div style="font-size:10px; color:var(--text-tertiary); margin-top:2px;">${qtyStr}주 · 평균 ${Math.round(Number(c.price)).toLocaleString()}원${c.ticker ? ' · ' + escapeHTML(c.ticker) : ''}</div>
            </button>`;
        }).join('')}
      </div>
    </div>`;
  modal.classList.add('show');
}

function mergeAssetInto(targetId, sourceId) {
  const target = assets.find(a => a.id === targetId);
  const source = assets.find(a => a.id === sourceId);
  if (!target || !source) return;

  if (!confirm(`"${source.name}"을(를) "${target.name}"에 합칠까요?\n\n"${source.name}"의 보유분이 모두 "${target.name}"으로 옮겨지고, "${source.name}"은 삭제됩니다.`)) return;

  // 두 자산을 lot 기반으로 통합
  // 각 자산의 보유분을 lot으로 환산 (lot 없으면 qty/price로 단일 lot 생성)
  const toLots = (a) => {
    if (a.lots && a.lots.length > 0) return a.lots.slice();
    if (Number(a.qty) > 0) {
      return [{
        id: Date.now() + Math.random(),
        source: '기존 보유분',
        qty: Number(a.qty),
        price: Number(a.price),
        date: a.createdDate || todayKey(),
        autoBuy: false,
        exactAmount: Math.round(Number(a.qty) * Number(a.price)),
      }];
    }
    return [];
  };

  const targetLots = toLots(target);
  const sourceLots = toLots(source);
  target.lots = [...targetLots, ...sourceLots];

  // 티커 없으면 source 것 채움
  if (!target.ticker && source.ticker) target.ticker = source.ticker;

  // 합산 후 재계산
  recalcAssetFromLots(target);

  // source에 연결된 자동매수(고정지출)가 있으면 target으로 연결 이전
  (budget.fixed || []).forEach(f => {
    if (f.autoBuy && f.assetInfo && f.assetInfo.name === source.name && f.assetInfo.type === source.type) {
      f.assetInfo.name = target.name;
    }
  });

  // source 삭제
  assets = assets.filter(a => a.id !== sourceId);

  saveData();
  showToast(`✅ "${source.name}"을 "${target.name}"에 합쳤어요`);
  closeModal();
  setTimeout(() => editAsset(targetId), 60);
}

function updateAsset(id) {
  const a = assets.find(x => x.id === id);
  if (!a) return;

  const newType = document.querySelector('#e-type .chip.active')?.dataset.t || a.type;
  a.type = newType;
  a.name = document.getElementById('e-name')?.value?.trim() || a.name;
  a.ticker = document.getElementById('e-ticker')?.value?.trim() || '';
  a.note = document.getElementById('e-note')?.value?.trim() || '';

  // 종류별 추가 필드
  const rate = Number(document.getElementById('e-rate')?.value) || 0;
  const maturity = document.getElementById('e-maturity')?.value?.trim() || '';
  const rounds = Number(document.getElementById('e-rounds')?.value) || 0;
  const subType = document.querySelector('#e-subtype .chip.active')?.dataset.s || '';
  const buyprice = Number(document.getElementById('e-buyprice')?.value) || 0;
  const fxDiscount = Number(document.getElementById('e-fx-discount')?.value) || 0;
  const avgBuyRate = Number(document.getElementById('e-avgrate')?.value) || 0;

  if (rate) a.rate = rate; else delete a.rate;
  if (maturity) a.maturity = maturity; else delete a.maturity;
  if (subType) a.subType = subType; else delete a.subType;
  if (buyprice) a.buyprice = buyprice; else delete a.buyprice;
  if (fxDiscount) a.fxDiscount = fxDiscount; else delete a.fxDiscount;

  // 🔧 매입가 통화 (주식/ETF/펀드만, 통화 선택 UI가 있을 때만 갱신)
  const curBtn = document.querySelector('#e-price-currency .chip.active');
  if (curBtn && isStockLikeType(newType)) {
    a.priceCurrency = curBtn.dataset.cur;
  } else if (!isStockLikeType(newType)) {
    delete a.priceCurrency;
  }
  // 🔧 평균 매입 환율 — 달러 단가 자산에서만 의미. 환차손익 정확 계산용
  if (avgBuyRate > 0 && a.priceCurrency === 'USD') {
    a.avgBuyRate = avgBuyRate;
  } else {
    delete a.avgBuyRate;
  }

  // ⭐ 통합 룰: 사용자 입력값 = 오늘까지 모든 거 포함된 최종 상태
  const isDepositType = ['청약', '예적금', '현금', '부동산'].includes(newType);
  const userInputPrice = Number(document.getElementById('e-price')?.value) || 0;
  const userInputQty = Number(document.getElementById('e-qty')?.value) || 1;

  // 기존 lots 모두 삭제 (입력값에 이미 다 포함됨)
  a.lots = [];

  if (isDepositType) {
    a.qty = 1;
    a.price = userInputPrice;
    a.initialBalance = userInputPrice;
    if (newType === '청약') {
      a.rounds = rounds;
      a.initialRounds = rounds;
    }
  } else {
    a.qty = userInputQty;
    a.price = userInputPrice;
  }

  // ⭐ 연결된 자동매수: 시작일이 과거면 → lastBuyDate = 오늘 (다음 매수일부터 추가)
  // 시작일이 미래면 → lastBuyDate 그대로 (그 날부터 자동 추가)
  const today = new Date();
  const todayEnd = new Date(today);
  todayEnd.setHours(23, 59, 59, 999);

  (budget.fixed || []).forEach(f => {
    if (!f.autoBuy || !f.assetInfo) return;

    // 매칭: 티커 우선, 없으면 이름+종류
    const normT = (t) => (t || '').toUpperCase().replace(/\.(KS|KQ|KQI)$/, '').trim();
    const fxTicker = normT(f.assetInfo.ticker);
    const aTicker = normT(a.ticker);
    const isMatch = (fxTicker && aTicker && fxTicker === aTicker) ||
                    (f.assetInfo.name === a.name && f.assetInfo.type === a.type);

    if (isMatch) {
      const startDate = f.createdAt ? new Date(f.createdAt) : null;
      const isStartPast = startDate && startDate <= today;

      if (isStartPast) {
        // 시작일 과거 → 입력값에 이미 반영됨 → 다음 매수일부터 추가
        f.lastBuyDate = todayEnd.toISOString();
        console.log(`📌 ${f.name} 시작일 과거 → lastBuyDate를 오늘로 (다음 매수일부터 자동 추가)`);
      } else {
        // 시작일 미래 → 그 날부터 자동 추가됨
        delete f.lastBuyDate;
        console.log(`📌 ${f.name} 시작일 미래 → 시작일부터 자동 추가 예정`);
      }
    }
  });

  saveData();
  showToast('저장됨');
  closeModal();
  renderAsset();
}

// 🔧 id 중복(OCR 동시생성 등)에 안전하도록 배열 인덱스로 선택 추적
function toggleAssetEditMode() {
  window._assetEditMode = !window._assetEditMode;
  window._assetSelected = [];
  if (window._assetEditMode) fixDuplicateAssetIds();
  renderAsset();
}

function fixDuplicateAssetIds() {
  const seen = new Set();
  let fixed = 0;
  assets.forEach(a => {
    if (a.id == null || seen.has(a.id)) {
      a.id = Date.now() + Math.floor(Math.random() * 1000000) + fixed;
      fixed++;
    }
    seen.add(a.id);
  });
  if (fixed > 0) {
    console.log(`🔧 중복/누락된 자산 id ${fixed}개 수정됨`);
    saveData(true);
  }
}

function toggleAssetSelect(idx) {
  if (!window._assetSelected) window._assetSelected = [];
  const i = window._assetSelected.indexOf(idx);
  if (i >= 0) window._assetSelected.splice(i, 1);
  else window._assetSelected.push(idx);
  renderAsset();
}

function deleteSelectedAssets() {
  const sel = window._assetSelected || [];

  if (targetAssets.length === 0) return;

  const linkedAutos = (budget.fixed || []).filter(f =>
    f.autoBuy && f.assetInfo &&
    targetAssets.some(a => a.name === f.assetInfo.name && a.type === f.assetInfo.type)
  );

  // 자동매수 연결 없으면 간단 확인 후 삭제
  if (linkedAutos.length === 0) {
    const names = targetAssets.map(a => a.name);
    if (!confirm(`선택한 ${targetAssets.length}개 자산을 삭제할까요?\n\n${names.join(', ')}`)) return;
    doDeleteSelectedAssets(targetAssets, false);
    return;
  }

  // 🔧 자동매수가 연결돼 있으면 명확한 선택 모달
  const names = targetAssets.map(a => escapeHTML(a.name)).join(', ');
  const autoNames = linkedAutos.map(f => escapeHTML(f.name)).join(', ');
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-cancel" onclick="closeModal()">취소</button>

        <span></span>
      </div>

        삭제할 자산: <b>${names}</b><br><br>
        이 중 <b>${linkedAutos.length}개</b>에 자동매수가 연결돼 있어요.<br>
        <span style="font-size:10px;">(${autoNames})</span>
      </div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <button onclick='doDeleteSelectedAssets(window._pendingDeleteAssets, true)' style="text-align:left; padding:14px; border:1px solid var(--text-danger); background:var(--bg-danger); border-radius:10px; cursor:pointer; font-family:inherit;">
          <div style="font-size:13px; font-weight:700; color:var(--text-danger);">🗑️ 자산 + 자동매수 모두 삭제</div>
          <div style="font-size:10px; color:var(--text-secondary); margin-top:3px; line-height:1.5;">자산도, 연결된 자동매수 설정도 완전히 삭제. 새로 시작할 때.</div>
        </button>

        <button onclick='doDeleteSelectedAssets(window._pendingDeleteAssets, false)' style="text-align:left; padding:14px; border:1px solid var(--border-tertiary); background:white; border-radius:10px; cursor:pointer; font-family:inherit;">
          <div style="font-size:13px; font-weight:700; color:var(--text-primary);">📊 자산만 삭제 (자동매수 유지)</div>
          <div style="font-size:10px; color:var(--text-secondary); margin-top:3px; line-height:1.5;">자동매수 설정은 남겨둠. 다음 회차부터 다시 자산이 쌓여요.</div>
        </button>
      </div>
    </div>`;
  window._pendingDeleteAssets = targetAssets;
  modal.classList.add('show');
}

function doDeleteSelectedAssets(targetAssets, alsoDeleteAuto) {
  if (!targetAssets || targetAssets.length === 0) { closeModal(); return; }

  const linkedAutos = (budget.fixed || []).filter(f =>
    f.autoBuy && f.assetInfo &&
    targetAssets.some(a => a.name === f.assetInfo.name && a.type === f.assetInfo.type)
  );

  // 자산 제거
  const targetSet = new Set(targetAssets);
  assets = assets.filter(a => !targetSet.has(a));

  if (alsoDeleteAuto && linkedAutos.length > 0) {
    // 자동매수도 삭제
    const autoSet = new Set(linkedAutos);
    budget.fixed = budget.fixed.filter(f => !autoSet.has(f));
  } else if (linkedAutos.length > 0) {
    // 자동매수 유지 → 다음 회차부터만 (자산은 0부터 쌓임)
    linkedAutos.forEach(f => { f.lastBuyDate = new Date().toISOString(); });
  }

  window._assetSelected = [];
  window._pendingDeleteAssets = null;
  saveData(true);
  closeModal();
  const msg = alsoDeleteAuto
    ? `${targetAssets.length}개 자산 삭제됨 (자동매수 ${linkedAutos.length}개 포함)`
    : (linkedAutos.length > 0 ? `${targetAssets.length}개 자산 삭제됨 (자동매수 유지)` : `${targetAssets.length}개 자산 삭제됨`);
  showToast(msg);
  renderAsset();
}

function mergeSelectedAssets() {
  const sel = window._assetSelected || [];
  if (sel.length < 2) {
    showToast('합칠 자산을 2개 이상 선택해주세요');
    return;
  }
  const targets = sel.map(idx => assets[idx]).filter(Boolean);
  if (targets.length < 2) {
    showToast('합칠 자산을 다시 선택해주세요');
    return;
  }

  // 종류가 다르면 합치기 불가
  const types = [...new Set(targets.map(a => a.type))];
  if (types.length > 1) {
    showToast('종류가 다른 자산은 합칠 수 없어요 (' + types.join(', ') + ')');
    return;
  }

  // 🔧 바로 합치지 않고 미리보기 모달을 띄움
  window._mergePreviewTargets = targets;
  window._mergeBaseIdx = 0; // 기준 자산 인덱스 (사용자가 바꿀 수 있음)
  renderMergePreview();
}

// 합치기 미리보기 모달
function renderMergePreview() {
  const targets = window._mergePreviewTargets || [];
  if (targets.length < 2) { closeModal(); return; }
  const baseIdx = window._mergeBaseIdx || 0;
  const base = targets[baseIdx];

  // 합쳐질 총 수량/평단가 계산 (미리보기용)
  let totalQty = 0, totalCost = 0;
  targets.forEach(a => {
    const q = Number(a.qty) || 0;
    const p = Number(a.price) || 0;
    totalQty += q;
    totalCost += q * p;
  });
  const mergedAvg = totalQty > 0 ? Math.round(totalCost / totalQty) : 0;

  // 티커 충돌 검사
  const nt = (t) => (t || '').toUpperCase().replace(/\.(KS|KQ|KQI)$/, '').trim();
  const tickers = [...new Set(targets.map(a => nt(a.ticker)).filter(Boolean))];
  const tickerConflict = tickers.length > 1;

  let h = `<div style="padding:4px 2px;">
    <h3 style="margin:0 0 4px; font-size:17px;">🔗 자산 합치기 확인</h3>
    <p style="margin:0 0 14px; font-size:12px; color:var(--text-secondary);">아래 자산들을 하나로 합칩니다. 기준 자산을 선택하세요.</p>`;

  // 티커 충돌 경고
  if (tickerConflict) {
    h += `<div style="margin-bottom:12px; padding:10px; background:#FCEBEB; border:1px solid #E74C3C; border-radius:8px; font-size:11px; color:#C0392B; line-height:1.5;">
      🚨 <b>티커가 서로 달라요</b> (${tickers.join(', ')})<br>
      QQQ와 QQQM처럼 다른 종목일 수 있어요. 정말 같은 자산이 맞는지 꼭 확인하세요.
    </div>`;
  }

  // 합칠 자산 목록 (각각 기준으로 선택 가능)
  h += `<div style="margin-bottom:12px;">`;
  targets.forEach((a, i) => {
    const isBase = i === baseIdx;
    const q = Number(a.qty) || 0;
    const qStr = Number.isInteger(q) ? q : q.toFixed(4).replace(/\.?0+$/, '');
    h += `<div onclick="window._mergeBaseIdx=${i}; renderMergePreview();" style="display:flex; align-items:center; gap:8px; padding:10px; margin-bottom:6px; border:1.5px solid ${isBase ? 'var(--text-info)' : 'var(--border-tertiary)'}; background:${isBase ? 'var(--bg-info)' : 'white'}; border-radius:8px; cursor:pointer;">
      <div style="width:18px; height:18px; border-radius:50%; border:2px solid ${isBase ? 'var(--text-info)' : 'var(--border-tertiary)'}; background:${isBase ? 'var(--text-info)' : 'transparent'}; flex-shrink:0; display:flex; align-items:center; justify-content:center; color:white; font-size:10px;">${isBase ? '✓' : ''}</div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:13px; font-weight:${isBase ? '600' : '500'};">${a.name} ${isBase ? '<span style="font-size:9px; color:var(--text-info);">(기준)</span>' : ''}</div>
        <div style="font-size:10px; color:var(--text-tertiary); margin-top:1px;">${a.type}${a.ticker ? ' · ' + a.ticker : ' · 티커없음'} · ${qStr}주 · 평균 ${(Number(a.price)||0).toLocaleString()}원</div>
      </div>
    </div>`;
  });
  h += `</div>`;

  // 합친 결과 미리보기
  h += `<div style="padding:12px; background:var(--bg-secondary); border-radius:8px; margin-bottom:14px;">
    <div style="font-size:11px; color:var(--text-secondary); margin-bottom:4px;">합친 결과 미리보기</div>
    <div style="font-size:14px; font-weight:600;">${base.name}</div>
    <div style="font-size:12px; color:var(--text-info); margin-top:2px;">${Number(totalQty.toFixed(4))}주 · 평균 매입가 ${mergedAvg.toLocaleString()}원</div>
    <div style="font-size:10px; color:var(--text-tertiary); margin-top:4px;">※ 모든 매수 기록이 합산되고, 기준 외 자산은 삭제됩니다.</div>
  </div>`;

  h += `<div style="display:flex; gap:8px;">
    <button onclick="closeModal()" style="flex:1; padding:12px; border:1px solid var(--border-tertiary); background:white; color:var(--text-secondary); border-radius:10px; font-size:13px; font-weight:500; cursor:pointer; font-family:inherit;">취소</button>
    <button onclick="executeMerge()" style="flex:2; padding:12px; border:none; background:var(--text-info); color:white; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;">🔗 합치기 실행</button>
  </div>`;
  h += `</div>`;

  modal.innerHTML = h;
  modal.classList.add('show');
}

// 실제 합치기 실행 (미리보기 확인 후)
function executeMerge() {
  const targets = window._mergePreviewTargets || [];
  if (targets.length < 2) { closeModal(); return; }
  const baseIdx = window._mergeBaseIdx || 0;
  const base = targets[baseIdx];
  const rest = targets.filter((_, i) => i !== baseIdx);

  // 합쳐진 lot 배열 구성
  const mergedLots = [];
  [base, ...rest].forEach((asset) => {
    const isBase = asset === base;
    if (asset.lots && asset.lots.length > 0) {
      asset.lots.forEach(lot => {
        mergedLots.push({ ...lot, id: Date.now() + Math.random() });
      });
    } else if (Number(asset.qty) > 0) {
      mergedLots.push({
        id: Date.now() + Math.random(),
        source: isBase ? '기존 보유분' : `${asset.name} (합침)`,
        qty: Number(asset.qty),
        price: Number(asset.price),
        date: todayKey(),
        autoBuy: false,
        note: isBase ? '합치기 전 보유분' : '합치기로 통합됨',
      });
    }
    if (!base.ticker && asset.ticker) base.ticker = asset.ticker;
  });

  // 자동매수를 base로 재연결
  rest.forEach(other => {
    if (budget.fixed) {
      budget.fixed.forEach(f => {
        if (f.autoBuy && f.assetInfo && f.assetInfo.name === other.name && f.assetInfo.type === other.type) {
          f.assetInfo.name = base.name;
          f.assetInfo.ticker = base.ticker || f.assetInfo.ticker;
        }
      });
    }
  });

  base.lots = mergedLots;
  recalcAssetFromLots(base);

  // 나머지 자산 제거
  const restSet = new Set(rest);
  assets = assets.filter(a => !restSet.has(a));

  delete window._mergePreviewTargets;
  delete window._mergeBaseIdx;
  window._assetSelected = [];
  window._assetEditMode = false;
  saveData(true);
  closeModal();
  showToast(`"${base.name}" 합치기 완료 (${base.qty}주)`);
  renderAsset();
}

function deleteAsset(id) {
  const asset = assets.find(x => x.id === id);
  if (!asset) return;

  const linkedFixed = (budget.fixed || []).filter(f =>
    f.autoBuy && f.assetInfo && f.assetInfo.name === asset.name && f.assetInfo.type === asset.type
  );

  // 연결된 자동매수가 없으면 간단히 확인 후 삭제
  if (linkedFixed.length === 0) {
    if (!confirm(`"${asset.name}" 자산을 삭제할까요?`)) return;
    doDeleteAsset(id, false);
    return;
  }

  // 🔧 연결된 자동매수가 있으면 — 명확한 선택 모달
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-cancel" onclick="closeModal(); setTimeout(()=>editAsset(${id}),50);">취소</button>
        <h2>🗑️ 자산 삭제</h2>
        <span></span>
      </div>

      <div style="padding:12px; background:var(--bg-warning); border-radius:10px; margin-bottom:14px; font-size:12px; color:var(--text-warning); line-height:1.6;">
        <b>"${escapeHTML(asset.name)}"</b>에 연결된 자동매수가 <b>${linkedFixed.length}개</b> 있어요.<br>
        자동매수 설정도 같이 지울지 선택하세요.
      </div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <button onclick="doDeleteAsset(${id}, true)" style="text-align:left; padding:14px; border:1px solid var(--text-danger); background:var(--bg-danger); border-radius:10px; cursor:pointer; font-family:inherit;">
          <div style="font-size:13px; font-weight:700; color:var(--text-danger);">🗑️ 자산 + 자동매수 모두 삭제</div>
          <div style="font-size:10px; color:var(--text-secondary); margin-top:3px; line-height:1.5;">자산도, 자동매수 설정도 완전히 삭제. 새로 시작할 때.</div>
        </button>

        <button onclick="doDeleteAsset(${id}, false)" style="text-align:left; padding:14px; border:1px solid var(--border-tertiary); background:white; border-radius:10px; cursor:pointer; font-family:inherit;">
          <div style="font-size:13px; font-weight:700; color:var(--text-primary);">📊 자산만 삭제 (자동매수 유지)</div>
          <div style="font-size:10px; color:var(--text-secondary); margin-top:3px; line-height:1.5;">자동매수 설정은 남겨둠. 다음 회차부터 다시 자산이 쌓여요.</div>
        </button>
      </div>
    </div>`;
  modal.classList.add('show');
}

function doDeleteAsset(id, alsoDeleteAuto) {
  const asset = assets.find(x => x.id === id);
  if (!asset) { closeModal(); return; }

  const linkedFixed = (budget.fixed || []).filter(f =>
    f.autoBuy && f.assetInfo && f.assetInfo.name === asset.name && f.assetInfo.type === asset.type
  );
  const linkedExpenses = (budget.expenses || []).filter(e =>
    e.type !== 'income' && e.cat === asset.type &&
    (e.linkedAssetName === asset.name || (!e.linkedAssetName && e.memo === asset.name))
  );

  // 자산 삭제
  assets = assets.filter(x => x.id !== id);

  if (alsoDeleteAuto && linkedFixed.length > 0) {
    // 자동매수도 삭제
    budget.fixed = budget.fixed.filter(f =>
      !(f.autoBuy && f.assetInfo && f.assetInfo.name === asset.name && f.assetInfo.type === asset.type)
    );
  } else if (linkedFixed.length > 0) {
    // 자동매수 유지 → 다음 회차부터만 (자산은 0부터)
    linkedFixed.forEach(f => { f.lastBuyDate = new Date().toISOString(); });
  }

  // 연결된 투자 지출 정리
  if (linkedExpenses.length > 0) {
    const expIds = new Set(linkedExpenses.map(e => e.id));
    budget.expenses = budget.expenses.filter(e => !expIds.has(e.id));
  }

  saveData();
  closeModal();
  const msg = alsoDeleteAuto
    ? `삭제됨 (자동매수 ${linkedFixed.length}개 포함)`
    : (linkedFixed.length > 0 ? '자산만 삭제됨 (자동매수 유지)' : '삭제됨');
  showToast(msg);
  render();
}

function closeModal() {
  modal.classList.remove('show');

  // → 모달 안의 이벤트 리스너가 붙은 요소들이 GC 대상이 됨
  clearTimeout(window._modalCleanupT);
  window._modalCleanupT = setTimeout(() => {
    // 닫는 사이 다시 열렸으면(show 클래스 있음) 정리하지 않음
    if (!modal.classList.contains('show')) {

    }
  }, 320);
}

// ====== 인증 처리 ======
let authMode = 'login';

function switchAuthTab(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
  document.getElementById('auth-submit').textContent = mode === 'login' ? '로그인' : '회원가입';
  document.getElementById('link-reset').style.display = mode === 'login' ? 'inline-block' : 'none';
  document.getElementById('auth-password').setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
  hideAuthError();
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.background = 'var(--bg-danger)';
  el.style.color = 'var(--text-danger)';
  el.classList.add('show');
}

function hideAuthError() {
  document.getElementById('auth-error').classList.remove('show');
}

async function authSubmit() {
  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-password').value;

  if (!email || !pw) {
    showAuthError('이메일과 비밀번호를 입력해주세요');
    return;
  }
  if (pw.length < 6) {
    showAuthError('비밀번호는 6자 이상이어야 해요');
    return;
  }

  const btn = document.getElementById('auth-submit');
  btn.disabled = true;
  btn.textContent = '잠시만요...';

  try {
    const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = window._fb;
    if (authMode === 'login') {
      await signInWithEmailAndPassword(auth, email, pw);
    } else {
      await createUserWithEmailAndPassword(auth, email, pw);
    }
  } catch (e) {
    showAuthError(getAuthErrorMessage(e.code));
    btn.disabled = false;
    btn.textContent = authMode === 'login' ? '로그인' : '회원가입';
  }
}

function getAuthErrorMessage(code) {
  const map = {
    'auth/invalid-email': '이메일 형식이 올바르지 않아요',
    'auth/user-not-found': '존재하지 않는 계정이에요. 회원가입을 먼저 해주세요',
    'auth/wrong-password': '비밀번호가 일치하지 않아요',
    'auth/invalid-credential': '이메일 또는 비밀번호가 맞지 않아요',
    'auth/email-already-in-use': '이미 사용 중인 이메일이에요. 로그인을 시도해주세요',
    'auth/weak-password': '비밀번호가 너무 약해요 (6자 이상)',
    'auth/network-request-failed': '네트워크 연결을 확인해주세요',
    'auth/too-many-requests': '잠시 후 다시 시도해주세요',
    'auth/missing-password': '비밀번호를 입력해주세요',
  };
  return map[code] || '오류가 발생했어요. 다시 시도해주세요';
}

async function resetPassword() {
  const email = document.getElementById('auth-email').value.trim();
  if (!email) {
    showAuthError('비밀번호 재설정 메일을 받을 이메일을 입력해주세요');
    return;
  }
  try {
    const { auth, sendPasswordResetEmail } = window._fb;
    await sendPasswordResetEmail(auth, email);
    const el = document.getElementById('auth-error');
    el.textContent = '재설정 메일이 전송됐어요. 메일을 확인해주세요.';
    el.style.background = 'var(--bg-success)';
    el.style.color = 'var(--text-success)';
    el.classList.add('show');
  } catch (e) {
    showAuthError(getAuthErrorMessage(e.code));
  }
}

async function logout() {
  if (!confirm('로그아웃하시겠어요? 데이터는 클라우드에 저장되어 다음에 로그인하면 그대로 보여요.')) return;
  try {
    const { auth, signOut } = window._fb;
    await signOut(auth);
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  } catch(e) {
    showToast('로그아웃 실패');
  }
}

// ====== 앱 시작 ======
function startApp() {
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('auth-screen').classList.add('hidden');
  render();
}

function showLoginScreen() {
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
}

function initAuth() {
  if (!window._fb) {
    setTimeout(initAuth, 100);
    return;
  }
  const { onAuthStateChanged, auth } = window._fb;
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      window._cloudLoadPending = true; // 🔧 로드 끝날 때까지 저장 차단
      const cloudData = await loadFromFirebase(user.uid);
      if (cloudData) {
        applyData(cloudData);
        window._cloudLoadPending = false; // 로드 완료 → 저장 허용
        saveLocal();
      } else {
        // 클라우드에 데이터 없음(신규 계정 등) → 로컬 유지, 저장 허용
        window._cloudLoadPending = false;
      }

      // AI 키 Firebase에서 복원 (다른 기기에서 저장한 거)
      try {
        const { db, doc, getDoc } = window._fb;
        const aiDoc = await getDoc(doc(db, 'users', user.uid, 'config', 'ai'));
        if (aiDoc.exists()) {
          const aiData = aiDoc.data();
          if (aiData.geminiKey) {
            window.GEMINI_API_KEY = aiData.geminiKey;
            localStorage.setItem('gemini_api_key', aiData.geminiKey);
            console.log('✅ AI 키 Firebase에서 복원');
          }
        }
      } catch (e) {
        console.error('AI 키 복원 실패:', e);
      }

      startApp();

      // localStorage에서 AI 캐시 복원 (즉시 표시용)
      try {
        const savedCache = localStorage.getItem('ai_cache_today');
        if (savedCache) {
          const parsed = JSON.parse(savedCache);
          // 1시간 이내 캐시만 복원
          const now = Date.now();
          for (const [k, v] of Object.entries(parsed)) {
            if (v && v.time && (now - v.time) < AI_CACHE_TIME) {
              aiCache[k] = v;
            }
          }
          console.log('✅ AI 캐시 복원:', Object.keys(aiCache).length, '개');
        }
      } catch (e) {
        console.error('캐시 복원 실패:', e);
      }
    } else {
      currentUser = null;
      window._cloudLoadPending = false;
      showLoginScreen();
    }
  });
}

// prewarmAI 함수는 유지하되 자동 호출 안 함 (수동 호출용으로 보관)
