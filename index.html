async function updateFixed(id) {
  const f = budget.fixed.find(x => x.id === id);
  if (!f) return;

  const name = document.getElementById('ef-name').value.trim();
  const amt = Number(document.getElementById('ef-amt').value);
  const cycle = document.querySelector('#ef-cycle .chip.active')?.dataset.cy || 'monthly';
  const day = Number(document.getElementById('ef-day').value);
  const dow = Number(document.querySelector('#ef-dow .chip.active')?.dataset.d);
  const catBtn = document.querySelector('#ef-cat .chip.active');
  const paid = modal.querySelector('.toggle').classList.contains('on');

  if (!name || !amt) { showToast('이름과 금액을 입력해주세요'); return; }

  if (cycle === 'monthly' && !day) {
    showToast('결제일을 입력해주세요');
    return;
  }
  if ((cycle === 'weekly' || cycle === 'biweekly') && isNaN(dow)) {
    showToast('요일을 선택해주세요');
    return;
  }

  f.name = name;
  f.amt = amt;
  f.cycle = cycle;
  if (cycle === 'monthly') {
    f.day = day;
    delete f.dow;
  } else {
    f.dow = dow;
    delete f.day;
  }
  f.cat = catBtn.dataset.c;
  f.icon = catBtn.dataset.icon;
  f.paid = paid;

  // 시작 날짜 저장 (변경 시 자동매수 + 자산 리셋)
  const newStartDate = document.getElementById('ef-startdate')?.value;
  if (newStartDate) {
    const newCreatedAt = new Date(newStartDate + 'T00:00:00').toISOString();
    if (f.createdAt !== newCreatedAt) {
      const prevLastBuyDate = f.lastBuyDate; // 🔧 원래 값 보존용
      f.createdAt = newCreatedAt;

      if (f.assetInfo) {
        const linkedAsset = findMatchingAsset({
          name: f.assetInfo.name,
          type: f.assetInfo.type,
          ticker: f.assetInfo.ticker,
        });
        if (linkedAsset && confirm(`시작 날짜를 ${newStartDate}로 변경하셨어요.\n\n연결된 자산 "${linkedAsset.name}"을 0으로 리셋하고 새 시작 날짜부터 자동 재계산할까요?\n\n⚠️ 확인: 과거 자동매수분을 새로 계산해서 채웁니다 (자산이 0부터 재계산됨)\n❌ 취소: 현재 수량/평단가 유지, 앞으로의 회차만 추가`)) {
          // 🔧 "확인" → 자동매수가 만든 lot만 제거하고 0부터 재계산, lastBuyDate 리셋
          if (linkedAsset.lots) {
            linkedAsset.lots = linkedAsset.lots.filter(lot => !lot.autoBuy);
          }
          linkedAsset.qty = 0;
          linkedAsset.price = 0;
          recalcAssetFromLots(linkedAsset); // 남은 수동/OCR lot 기준 재계산
          f.lastBuyDate = null;
          console.log(`🔄 ${linkedAsset.name} 자동매수 lot 제거 + ${newStartDate}부터 재계산 예정`);
        } else {
          // 🔧 "취소" → 과거 회차를 새로 만들면 중복되므로 lastBuyDate를 오늘로 고정
          const todayEnd = new Date();
          todayEnd.setHours(23, 59, 59, 999);
          f.lastBuyDate = todayEnd.toISOString();
          console.log(`⏭️ ${f.name} 자산 유지 → 과거 회차 생략, 다음 회차부터 추가`);
        }
      } else {
        f.lastBuyDate = prevLastBuyDate; // 자산 연결 없으면 원래대로
      }
    }
    f.createdAt = newCreatedAt;
  }

  // 투자 카테고리 처리
  const isInvest = catBtn.dataset.c === '투자';
  if (isInvest) {
    const autoBuy = document.getElementById('ef-autobuy')?.checked;
    const fractional = !!document.getElementById('ef-fractional')?.checked;
    f.fractional = fractional;
    f.feeRate = Number(document.getElementById('ef-feerate')?.value) || 0;
    const assetType = document.querySelector('#ef-asset-type .chip.active')?.dataset.t || '주식';
    const assetName = document.getElementById('ef-asset-name')?.value?.trim() || name;
    const assetTicker = document.getElementById('ef-asset-ticker')?.value?.trim() || '';
    const assetRate = Number(document.getElementById('ef-asset-rate')?.value) || 0;
    const assetMaturity = document.getElementById('ef-asset-maturity')?.value?.trim() || '';
    const assetRounds = Number(document.getElementById('ef-asset-rounds')?.value) || 0;
    const assetSubType = document.querySelector('#ef-asset-subtype .chip.active')?.dataset.s || '';

    f.autoBuy = !!autoBuy;
    f.assetInfo = { name: assetName, type: assetType, ticker: assetTicker };
    if (assetRate) f.assetInfo.rate = assetRate;
    if (assetMaturity) f.assetInfo.maturity = assetMaturity;
    if (assetRounds) f.assetInfo.rounds = assetRounds;
    if (assetSubType) f.assetInfo.subType = assetSubType;

    // 자산이 없으면 자동 생성
    if (autoBuy) {
      let asset = findMatchingAsset({ name: assetName, type: assetType, ticker: assetTicker });
      if (!asset) {
        asset = {
          id: Date.now(),
          type: assetType,
          name: assetName,
          ticker: assetTicker,
          qty: 0,
          price: 0,
          note: '자동매수',
        };
        if (assetRate) asset.rate = assetRate;
        if (assetMaturity) asset.maturity = assetMaturity;
        if (assetRounds) asset.rounds = assetRounds;
        if (assetSubType) asset.subType = assetSubType;
        assets.push(asset);
      }
    }
  } else {
    f.autoBuy = false;
    delete f.assetInfo;
  }

  saveData();
  showToast('수정됨');
  closeModal();

  // 자동매수 활성 + 시작 날짜 있으면 즉시 재실행
  if (f.autoBuy && f.assetInfo) {
    showToast('🔄 자동매수 재계산 중...');
    await processAutoBuy(f);
    saveData();
    showToast(`✅ 재계산 완료`);
  }

  renderMoney();
  renderAsset();
}

function deleteFixed(id) {
  if (confirm('이 고정지출을 삭제할까요?')) {
    budget.fixed = budget.fixed.filter(x => x.id !== id);
    saveData();
    closeModal();
    showToast('삭제됨');
    renderMoney();
  }
}

function toggleFixedPaid(id) {
  const f = budget.fixed.find(x => x.id === id);
  if (f) {
    f.paid = !f.paid;
    saveData();
    showToast(f.paid ? `${f.name} 납부 완료` : `${f.name} 납부 취소`);
  }
  renderMoney();
}

// ★★★ 가계부 AI 분석 ★★★
function renderMoneyAI(spent, projected) {
  // 카테고리별 합계 (이번 달만)
  const thisMonthPrefix = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  const byCategory = {};
  budget.expenses.forEach(e => {
    if (e.dateKey && !e.dateKey.startsWith(thisMonthPrefix)) return;
    byCategory[e.cat] = (byCategory[e.cat] || 0) + Number(e.amt);
  });

  const ranked = Object.entries(byCategory).sort((a,b) => b[1] - a[1]);
  const topCat = ranked[0];
  const lastMonth = budget.history?.[budget.history.length - 1];

  // AI 코치 카드 (진짜 AI)
  let html = `<div id="ai-budget-coach"></div>`;

  // 비동기로 AI 코치 호출
  setTimeout(() => loadAIBudgetCoach(spent, projected, byCategory, lastMonth), 100);

  return html;
}

// AI 가계부 코치 - 진짜 Gemini 분석
async function loadAIBudgetCoach(spent, projected, byCategory, lastMonth, forceRefresh = false) {

// 매월 1일에 자동으로 지난달 기록 백업
function archiveLastMonthIfNeeded() {
  const lastArchiveKey = budget.lastArchive;
  const thisMonthKey = `${currentYear}-${currentMonth+1}`;

  if (lastArchiveKey === thisMonthKey) return; // 이미 이번 달은 처리됨

  // 처음 사용자거나 새 달이 시작됐을 때
  if (lastArchiveKey && lastArchiveKey !== thisMonthKey && budget.expenses.length > 0) {
    // 이전 달 데이터를 history에 저장
    const byCategory = {};
    let total = 0;
    budget.expenses.forEach(e => {
      byCategory[e.cat] = (byCategory[e.cat] || 0) + Number(e.amt);
      total += Number(e.amt);
    });

    if (!budget.history) budget.history = [];
    budget.history.push({
      month: lastArchiveKey,
      total,
      byCategory,
      expenses: budget.expenses
    });

    // 최근 6개월만 유지
    if (budget.history.length > 6) {
      budget.history = budget.history.slice(-6);
    }

    // 이번달 지출 초기화 (고정지출 paid는 모두 false로)
    budget.expenses = [];
    budget.fixed.forEach(f => { f.paid = false; });
  }

  budget.lastArchive = thisMonthKey;
  saveData();
}

// 앱 시작 시 한 번 체크
archiveLastMonthIfNeeded();

function saveFixed() {
  const name = document.getElementById('fx-name').value.trim();
  const amt = Number(document.getElementById('fx-amt').value);
  const catBtn = document.querySelector('#fx-cat .chip.active');
  const cat = catBtn.dataset.c;
  const icon = catBtn.dataset.icon;
  const cycle = document.querySelector('#fx-cycle .chip.active')?.dataset.cycle || 'monthly';

  let day = 0, dow = 0;
  if (cycle === 'monthly') {
    day = Number(document.getElementById('fx-day').value);
    if (!day) { showToast('결제일을 입력해주세요'); return; }
  } else {
    dow = Number(document.querySelector('#fx-dow .chip.active')?.dataset.dow ?? 1);
  }

  if (!name || !amt) {
    showToast('이름과 금액을 입력해주세요');
    return;
  }

  // 투자 카테고리 + 자동매수 체크 → 자산 정보 추가
  const isInvest = cat === '투자';
  const autoBuy = isInvest && document.getElementById('fx-autobuy')?.checked;
  let assetInfo = null;
  if (autoBuy) {
    const assetType = document.querySelector('#fx-asset-type .chip.active')?.dataset.t || '주식';
    const assetName = document.getElementById('fx-asset-name')?.value?.trim() || name; // 비워두면 이름 사용
    const assetTicker = document.getElementById('fx-asset-ticker')?.value?.trim() || '';
    assetInfo = { type: assetType, name: assetName, ticker: assetTicker };
  }

  // 시작 날짜 (사용자 입력 또는 오늘)
  const startDateInput = document.getElementById('fx-startdate')?.value;
  const createdAt = startDateInput
    ? new Date(startDateInput + 'T00:00:00').toISOString()
    : new Date().toISOString();

  // 소수점 매매 옵션
  const fractional = !!document.getElementById('fx-fractional')?.checked;
  const feeRate = Number(document.getElementById('fx-feerate')?.value) || 0;

  // ⭐ 시작일이 과거인 경우 중복 방지 처리
  // 자동매수 대상 자산이 "이미 존재하고 보유분이 있으면" → 과거분은 이미 반영된 것으로 간주
  const today = new Date();
  const startDate = new Date(createdAt);
  let initLastBuyDate = null;

  if (startDate < today) {
    // 시작일이 과거 → 이 자산에 기존 보유분이 있는지 확인
    let existingHolding = false;
    if (autoBuy && assetInfo) {
      const existAsset = findMatchingAsset({
        name: assetInfo.name, type: assetInfo.type, ticker: assetInfo.ticker,
      });
      if (existAsset && (Number(existAsset.qty) > 0 || (existAsset.lots && existAsset.lots.length > 0))) {
        existingHolding = true;
      }
    }

    if (existingHolding) {
      // 🔧 이미 보유분 있음 → 과거 자동매수를 만들면 중복 → 다음 회차부터만
      const todayEnd = new Date(today);
      todayEnd.setHours(23, 59, 59, 999);
      initLastBuyDate = todayEnd.toISOString();
      console.log(`📌 ${name} - 기존 보유 자산 발견 → 과거분 생략(중복방지), 다음 회차부터 추가`);
    } else {
      // 🔧 새 자산이거나 보유분 없음 → 사용자에게 과거분 소급 여부 확인
      const applyPast = confirm(`자동매수 시작일이 과거(${startDateInput})로 설정됐어요.\n\n⚠️ 확인: 시작일부터 오늘까지의 과거 자동매수분을 모두 채웁니다.\n❌ 취소: 오늘 이후 회차부터만 자동매수합니다.\n\n(이미 자산에 과거 매수분을 입력하셨다면 '취소'를 누르세요)`);
      if (!applyPast) {
        const todayEnd = new Date(today);
        todayEnd.setHours(23, 59, 59, 999);
        initLastBuyDate = todayEnd.toISOString();
        console.log(`📌 ${name} - 사용자 선택: 과거분 생략, 다음 회차부터`);
      } else {
        console.log(`📌 ${name} - 사용자 선택: 과거분 소급 적용`);
      }
    }
  }

  const newFixed = {
    id: Date.now(),
    name, amt, cat, icon,
    cycle,
    day, dow,
    paid: false,
    autoBuy: !!autoBuy,
    assetInfo,
    fractional, // 소수점 매매 여부
    feeRate,    // 거래 수수료율 % (매입원가 정확도용)
    lastBuyDate: initLastBuyDate,
    createdAt, // 사용자 지정 시작 날짜
  };
  budget.fixed.push(newFixed);

  // 자동매수 활성화 시 → 즉시 자산 등록 (없으면)
  if (autoBuy && assetInfo) {
    // 🔧 티커 우선 매칭 - 이름이 미묘하게 달라도 같은 티커면 같은 자산
    const existing = findMatchingAsset({
      name: assetInfo.name, type: assetInfo.type, ticker: assetInfo.ticker,
    });
    if (!existing) {
      const newAuto = {
        id: Date.now() + 1,
        name: assetInfo.name,
        ticker: assetInfo.ticker,
        type: assetInfo.type,
        region: guessAssetRegion(assetInfo.name, assetInfo.ticker, assetInfo.priceCurrency),
        qty: 0,
        price: 0,
        note: `🤖 자동매수: ${cycle === 'monthly' ? '매월' : cycle === 'weekly' ? '매주' : '격주'} ${amt.toLocaleString()}원`,
      };
      // 🔧 자동매수 lot은 매수일 환율로 원화 환산되어 저장 → 자산은 원화 기준
      if (isStockLikeType(assetInfo.type)) newAuto.priceCurrency = 'KRW';
      assets.push(newAuto);
    } else if (!existing.ticker && assetInfo.ticker) {
      // 기존 자산에 티커가 없으면 채워줌 (이후 매칭 정확도 ↑)
      existing.ticker = assetInfo.ticker;
    }
  }

  // 자동매수 실행 (지금까지 누락된 회차 자동 처리)
  if (autoBuy) {
    processAutoBuy(newFixed);
  }

  saveData();
  showToast(`${name} 추가됨${autoBuy ? ' (자동매수 활성)' : ''}`);
  closeModal();
  render(); // 🔧 현재 탭에 맞게 렌더 (가계부서 추가하면 가계부, 자산서 추가하면 자산)
}

// 시뮬레이션 직접 조정
function openSimSettings() {
  const monthlyAuto = (() => {
    let autoBuyPerMonth = 0;
    (budget.fixed || []).forEach(f => {
      if (f.cat !== '투자') return;
      const cycle = f.cycle || 'monthly';
      if (cycle === 'monthly') autoBuyPerMonth += Number(f.amt);
      else if (cycle === 'weekly') autoBuyPerMonth += Number(f.amt) * 4.33;
      else if (cycle === 'biweekly') autoBuyPerMonth += Number(f.amt) * 2.17;
    });
    return Math.round(autoBuyPerMonth);
  })();

  const currentMonthly = settings.simMonthlyOverride !== undefined && settings.simMonthlyOverride !== null
    ? settings.simMonthlyOverride
    : '';
  const currentReturn = settings.simReturnOverride !== undefined && settings.simReturnOverride !== null
    ? settings.simReturnOverride
    : '';

  modal.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-cancel" onclick="closeModal()">취소</button>
        <h2>시뮬레이션 조정</h2>
        <button class="modal-save" onclick="saveSimSettings()">저장</button>
      </div>

      <div style="padding:10px 12px; background:var(--bg-info); border-radius:var(--radius-md); margin-bottom:14px; font-size:11px; color:var(--text-info); line-height:1.5;">
        💡 비워두면 *자동 계산* 됩니다.<br>
        <span style="opacity:0.8;">자동 매수액: ${monthlyAuto.toLocaleString()}원/월 (고정지출의 투자)</span>
      </div>

      <div class="field">
        <div class="field-label">월 투자액 (원) - 직접 설정</div>
        <input type="number" id="sim-monthly" value="${currentMonthly}" placeholder="자동 계산" />
        <div style="font-size:10px; color:var(--text-tertiary); margin-top:4px;">
          비워두면: <b>자동매수 + 가계부 투자 카테고리 평균</b>으로 계산
        </div>
      </div>

      <div class="field">
        <div class="field-label">연 수익률 (%) - 직접 설정</div>
        <input type="number" id="sim-return" value="${currentReturn}" placeholder="자동 계산" step="0.1" />
        <div style="font-size:10px; color:var(--text-tertiary); margin-top:4px;">
          비워두면: <b>주식 8% / 채권·예금 3.5% / 금 5%</b> 비중 가중평균
        </div>
      </div>

      <div style="display:flex; gap:6px; margin-top:14px;">
        <button onclick="resetSimSettings()" style="flex:1; padding:10px; border:0.5px solid var(--border-tertiary); background:var(--bg-secondary); border-radius:var(--radius-md); font-size:12px; cursor:pointer; font-family:inherit;">자동 계산으로 리셋</button>
      </div>
    </div>
  `;
  modal.classList.add('show');
}

function saveSimSettings() {
  const monthlyVal = document.getElementById('sim-monthly').value.trim();
  const returnVal = document.getElementById('sim-return').value.trim();

  settings.simMonthlyOverride = monthlyVal === '' ? null : Number(monthlyVal);
  settings.simReturnOverride = returnVal === '' ? null : Number(returnVal);

  saveData();
  showToast('시뮬레이션 설정 저장됨');
  closeModal();
  renderAsset();
}

function resetSimSettings() {
  settings.simMonthlyOverride = null;
  settings.simReturnOverride = null;
  saveData();
  showToast('자동 계산으로 리셋됨');
  closeModal();
  renderAsset();
}

async function runAIStockAnalysis() {
  const nameInput = document.getElementById('ai-stock-name');
  const stockName = nameInput?.value?.trim();
  if (!stockName) {
    showToast('종목명을 입력해주세요');
    return;
  }

  if (!window.GEMINI_API_KEY) {

      friendly = `🔑 API 키에 문제가 있어요.<br><span style="font-size:10px; color:var(--text-tertiary);">설정에서 키를 다시 확인하거나 새로 등록해주세요.</span>`;
    } else {
      friendly = `❌ 분석에 실패했어요: ${e.message}`;
    }
    statusEl.style.display = 'block';
    statusEl.innerHTML = `<div style="color:var(--text-danger); line-height:1.6; text-align:center;">${friendly}</div>`;
  }
}

// Markdown 간단 렌더러 (AI 응답용)
function markdownToHTML(md) {
  if (!md) return '';
  let html = md;
  // 헤더
  html = html.replace(/^###\s+(.+)$/gm, '<h3 style="font-size:13px; font-weight:700; margin:14px 0 6px; color:var(--text-primary);">$1</h3>');
  html = html.replace(/^##\s+(.+)$/gm, '<h2 style="font-size:14px; font-weight:700; margin:16px 0 8px; color:var(--text-primary);">$1</h2>');
  html = html.replace(/^#\s+(.+)$/gm, '<h1 style="font-size:15px; font-weight:700; margin:16px 0 8px; color:var(--text-primary);">$1</h1>');
  // 굵게
  html = html.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  // 기울임
  html = html.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<i>$1</i>');
  // 코드
  html = html.replace(/`([^`]+)`/g, '<code style="padding:2px 5px; background:var(--bg-secondary); border-radius:4px; font-size:11px;">$1</code>');
  // 리스트
  html = html.replace(/^[\-\*]\s+(.+)$/gm, '<li style="margin:4px 0;">$1</li>');
  html = html.replace(/(<li[^>]*>.*?<\/li>(\s*<li[^>]*>.*?<\/li>)*)/gs, '<ul style="padding-left:18px; margin:6px 0;">$1</ul>');
  // 번호 리스트
  html = html.replace(/^\d+\.\s+(.+)$/gm, '<li style="margin:4px 0;">$1</li>');
  // 단락
  html = html.replace(/\n\n+/g, '</p><p style="margin:8px 0;">');
  html = '<p style="margin:8px 0;">' + html + '</p>';
  // 줄바꿈
  html = html.replace(/(?<!>)\n(?!<)/g, '<br>');
  return html;
}

// 자산 매칭 헬퍼: 티커 같으면 같은 자산, 아니면 이름+종류 매칭
function findMatchingAsset(criteria) {
  const { name, type, ticker } = criteria;
  if (!name && !ticker) return null;

  // 티커 정규화 (.KS, .KQ 등 제거하고 비교)
  const normTicker = (t) => (t || '').toUpperCase().replace(/\.(KS|KQ|KQI)$/, '').trim();
  const myTicker = normTicker(ticker);

  // 1순위: 티커 일치 (둘 다 있고 정규화한 게 같음)
  if (myTicker) {
    const byTicker = assets.find(a => {
      const at = normTicker(a.ticker);
      return at && at === myTicker;
    });
    if (byTicker) {
      console.log(`🔍 자산매칭: "${name}" → 티커(${myTicker}) 일치 → "${byTicker.name}"`);
      return byTicker;
    }
  }

  // 2순위: 이름 + 종류 일치
  // ⚠️ 단, 내 티커가 있는데 후보의 티커가 '다르면' → 다른 종목이므로 매칭 거부
  //    (QQQ vs QQQM 처럼 이름이 비슷해도 티커가 다르면 합치면 안 됨)
  if (name && type) {
    const byName = assets.find(a => {
      if (a.name !== name || a.type !== type) return false;
      const at = normTicker(a.ticker);
      // 둘 다 티커가 있는데 서로 다르면 → 다른 종목
      if (myTicker && at && myTicker !== at) return false;
      return true;
    });
    if (byName) {
      console.log(`🔍 자산매칭: "${name}" → 이름 일치 → "${byName.name}"`);
      return byName;
    }
  }

  console.log(`🔍 자산매칭: "${name}"(${myTicker || '티커없음'}) → 매칭 없음 (신규)`);
  return null;
}

// 자산의 모든 lot에서 총 수량 + 평균 평단가 계산
function recalcAssetFromLots(asset) {
  // 납입형 자산 (청약/예적금/현금/부동산): 기존 잔액 + lot 누적
  const isDepositType = ['청약', '예적금', '현금', '부동산'].includes(asset.type);

  if (!asset.lots || asset.lots.length === 0) {
    return; // lot 없으면 수동 입력 그대로
  }

  let totalQty = 0;
  let totalCost = 0;
  asset.lots.forEach(lot => {
    const q = Number(lot.qty) || 0;
    const p = Number(lot.price) || 0;
    totalQty += q;
    // 🔧 exactAmount(증권사 실제 체결금액)가 있으면 그걸 우선 — 반올림 오차 0
    const lotCost = (lot.exactAmount != null && Number(lot.exactAmount) > 0)
      ? Number(lot.exactAmount)
      : q * p;
    totalCost += lotCost;
  });

  if (isDepositType) {
    // 납입형: 기존 잔액(initialBalance) + lot 누적
    const initialBalance = Number(asset.initialBalance) || 0;
    const initialRounds = Number(asset.initialRounds) || 0;
    asset.qty = 1;
    asset.price = Math.round(initialBalance + totalCost); // 기존 + 자동 누적
    if (asset.type === '청약') {
      // 🔧 청약 회차 = '납입 건수'. lot의 qty(주식 수량)가 아니라 lot 개수로 셈.
      //    (과거 버그로 청약 lot에 주식 수량이 섞여도 회차가 안 튀게)
      asset.rounds = initialRounds + asset.lots.length;
    }
  } else {
    // 주식/ETF/금/달러 등 - 수량 × 평단가
    asset.qty = parseFloat(totalQty.toFixed(4));
    asset.price = totalQty > 0 ? Math.round(totalCost / totalQty) : 0;
  }
}

// 자산에 lot 추가 헬퍼
function addAssetLot(asset, lot) {
  if (!asset.lots) asset.lots = [];
  asset.lots.push({
    id: Date.now() + Math.random(),
    source: lot.source || '수동 입력',
    qty: Number(lot.qty) || 0,
    price: Number(lot.price) || 0,
    date: lot.date || todayKey(),
    fxDiscount: lot.fxDiscount || null,
    buyRate: lot.buyRate || null, // 🔧 매수 시점 원/달러 환율 (미국 주식 자동매수 정확도용)
    autoBuy: !!lot.autoBuy,
    fixedId: lot.fixedId || null, // 🔧 어떤 자동매수(고정지출)가 만든 lot인지 - 이름 변경에 강함
    exactAmount: (lot.exactAmount != null && Number(lot.exactAmount) > 0) ? Number(lot.exactAmount) : null, // 🔧 증권사 실제 체결금액 (반올림 오차 0)
    note: lot.note || '',
  });
  recalcAssetFromLots(asset);
}

      });
    });

    qtyEl.addEventListener('input', updatePreview);
    totalEl.addEventListener('input', updatePreview);
    priceEl.addEventListener('input', updatePreview);
    updatePreview();
  }, 50);
}

function saveLot(assetId, lotIdToEdit) {
  const asset = assets.find(a => a.id === assetId);
  if (!asset) return;

  const source = document.getElementById('lot-source').value.trim() || '수동 입력';
  const qty = Number(document.getElementById('lot-qty').value);
  const date = document.getElementById('lot-date').value;
  const fxDiscount = Number(document.getElementById('lot-fx').value) || null;
  const note = document.getElementById('lot-note').value.trim();

  // 🔧 입력 방식에 따라 1주당 단가 계산
  const mode = document.querySelector('#lot-mode .chip.active')?.dataset.mode || 'total';
  let price = 0;
  let totalAmount = 0;
  if (mode === 'total') {
    totalAmount = Number(document.getElementById('lot-total-input').value);
    if (!qty || !totalAmount) {
      showToast('수량과 총 체결금액을 입력해주세요');
      return;
    }
    price = totalAmount / qty; // 정확한 평균 단가 (반올림 안 함)
  } else {
    price = Number(document.getElementById('lot-price').value);
    if (!qty || !price) {
      showToast('수량과 단가를 입력해주세요');
      return;
    }
    totalAmount = qty * price;
  }

  if (!asset.lots) asset.lots = [];

  if (lotIdToEdit && lotIdToEdit !== 'null') {
    // 수정 — autoBuy/fixedId 등 기존 속성은 보존
    const idx = asset.lots.findIndex(l => String(l.id) === String(lotIdToEdit));
    if (idx >= 0) {
      asset.lots[idx] = {
        ...asset.lots[idx],
        source, qty, price, date, fxDiscount, note,
        // 🔧 정확한 체결금액 보존 (수량×단가 반올림 오차 방지)
        exactAmount: Math.round(totalAmount),
      };
    }
    showToast('수정됨');
  } else {
    // 추가
    asset.lots.push({
      id: Date.now() + Math.random(),
      source, qty, price, date,
      fxDiscount,
      autoBuy: false,
      exactAmount: Math.round(totalAmount),
      note,
    });
    showToast('매수 기록 추가됨');
  }

  recalcAssetFromLots(asset);
  saveData();
  closeModal();
  setTimeout(() => editAsset(assetId), 50);
}

function editLot(assetId, lotId) {
  addManualLot(assetId, lotId);
}

function deleteLot(assetId, lotId) {
  if (!confirm('이 매수 기록을 삭제할까요?')) return;
  const asset = assets.find(a => a.id === assetId);
  if (!asset || !asset.lots) return;
  asset.lots = asset.lots.filter(l => String(l.id) !== String(lotId));
  recalcAssetFromLots(asset);
  saveData();
  showToast('삭제됨');
  closeModal();
  setTimeout(() => editAsset(assetId), 50);
}

        증권사 <b>더모으기 내역</b> 화면을 보면서, 회차별 <b>체결 수량</b>과 <b>총 체결금액</b>을 그대로 입력하세요. ${isUSD ? '미국 종목은 소수점 수량(예: 0.5984)으로 입력하면 돼요. ' : ''}1원도 안 틀려요.

      </div>
    </div>`;

}

function saveBulkLotEdit(assetId) {
  const asset = assets.find(a => a.id === assetId);
  if (!asset) return;
  const autoLots = asset.lots.filter(l => l.autoBuy);

  let changed = 0;
  autoLots.forEach(lot => {
    const qtyEl = document.getElementById(`bulk-qty-${lot.id}`);
    const amtEl = document.getElementById(`bulk-amt-${lot.id}`);
    if (!qtyEl || !amtEl) return;
    const newQty = parseFloat(qtyEl.value) || 0;
    const newAmt = Math.round(parseFloat(amtEl.value) || 0);
    if (newQty <= 0 || newAmt <= 0) return;

    lot.qty = parseFloat(newQty.toFixed(4));
    lot.price = Math.round(newAmt / newQty); // 평단 = 금액/수량
    lot.exactAmount = newAmt; // 정확 금액 보존
    changed++;
  });

  if (changed === 0) { showToast('입력된 회차가 없어요'); return; }

  recalcAssetFromLots(asset);
  saveData();
  showToast(`✅ ${changed}개 회차 정확히 입력됨 (총 ${Number(asset.qty).toFixed(4).replace(/\.?0+$/, '')}주)`);
  closeModal();
  setTimeout(() => editAsset(assetId), 60);
}

// 🔧 자동매수 회차를 정수 수량으로 보정 (한국 주식·ETF는 정수만 거래)
// 각 회차의 1주당 단가는 그대로, 그 단가로 살 수 있는 정수 주수로 재계산.
async function fixAutoLotsToInteger(assetId) {
  const asset = assets.find(a => a.id === assetId);
  if (!asset || !asset.lots) return;

  const autoLots = asset.lots.filter(l => l.autoBuy);
  if (autoLots.length === 0) {
    showToast('자동매수 회차가 없어요');
    return;
  }

  // 연결된 자동매수 설정에서 회차 매수 한도(amt) 찾기
  const _nTk = (t) => (t || '').toUpperCase().replace(/\.(KS|KQ|KQI)$/, '').trim();
  const _aTk = _nTk(asset.ticker);
  const linkedFixed = (budget.fixed || []).find(f => {
    if (!f.autoBuy || !f.assetInfo) return false;
    const fTk = _nTk(f.assetInfo.ticker);
    return (fTk && _aTk && fTk === _aTk) ||
           (f.assetInfo.name === asset.name && f.assetInfo.type === asset.type);
  });

  showToast('🔄 회차별 그날 시세로 보정 중...');

  // 🔧 각 회차 날짜의 실제 종가를 받아 정확히 복원
  let histMap = null, fxHistMap = null, histIsUSD = false, fxSpreadMul = 1;
  if (asset.ticker && asset.type !== '금') {
    try {
      let t = asset.ticker.trim();
      if (/^\d{6}$/.test(t)) t = t + '.KS';
      histMap = await fetchYahooHistorical(t);
      const live = liveAssetData[asset.id];
      if (live?.currency === 'USD' || asset.priceCurrency === 'USD') {
        histIsUSD = true;
        fxSpreadMul = 1 + 0.0175 * (1 - (Number(asset.fxDiscount) || 0) / 100);
        fxHistMap = await fetchYahooHistorical('KRW=X');
      }
    } catch (e) { console.warn('보정: 과거 종가 로드 실패', e); }
  }

  let changed = 0;
  autoLots.forEach(lot => {
    const q = Number(lot.qty) || 0;
    const p = Number(lot.price) || 0;
    if (p <= 0) return;

    // 그 회차에 쓴 매수 한도 = 자동매수 설정 금액(있으면) 아니면 기존 수량×단가
    const budgetAmt = (linkedFixed && Number(linkedFixed.amt) > 0)
      ? Number(linkedFixed.amt)
      : q * p;

    // 🔧 회차 날짜의 실제 그날 종가 (원화)
    let realPrice = p; // 폴백: lot에 저장된 단가
    const histClose = lot.date ? getHistPriceOn(histMap, lot.date) : null;
    if (histClose != null) {
      if (histIsUSD) {
        const histFx = lot.date ? getHistPriceOn(fxHistMap, lot.date) : null;
        const rate = histFx != null ? histFx * fxSpreadMul : (lot.buyRate || 1380);
        realPrice = histClose * rate;
        lot.buyRate = Math.round(rate);
      } else {
        realPrice = histClose;
      }
    }

    // 그날 종가로 살 수 있는 정수 주수
    const intQty = Math.floor(budgetAmt / realPrice);
    if (intQty <= 0) return;

    const newQty = intQty;
    const newPrice = Math.round(realPrice);
    if (newQty === q && newPrice === p) return; // 변화 없으면 스킵

    lot.qty = newQty;
    lot.price = newPrice;
    delete lot.exactAmount; // 🔧 옛 체결금액 제거 — 새 수량×단가로 계산되도록
    lot.note = (lot.note || '').replace(/ ?\(정수 보정\)/g, '') + ' (정수 보정)';
    changed++;
  });

  if (changed === 0) {
    showToast('보정할 회차가 없어요 (이미 정확함)');
    return;
  }

  // 연결된 자동매수 설정도 정수 모드로 전환 (앞으로의 회차도 정수)
  if (linkedFixed) linkedFixed.fractional = false;

  recalcAssetFromLots(asset);
  saveData();
  showToast(`🔢 ${changed}개 회차 보정 완료 (총 ${Number(asset.qty).toFixed(2).replace(/\.?0+$/, '')}주)`);
  closeModal();
  setTimeout(() => editAsset(assetId), 60);
}

    : `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-01`;

      <div style="padding:10px 12px; background:var(--bg-warning); border-radius:var(--radius-md); margin-bottom:14px; font-size:11px; color:var(--text-warning); line-height:1.6;">

          자동매수를 실제로 시작한 날짜를 선택하세요.

async function runRecalcAutoBuy(assetId, fixedId) {
  const asset = assets.find(a => a.id === assetId);
  const fixed = budget.fixed.find(f => f.id === fixedId);
  if (!asset || !fixed) return;

  const today = new Date();
  const startDateStr = document.getElementById('recalc-start')?.value;
  if (!startDateStr) {
    showToast('시작 날짜를 선택해주세요');
    return;
  }

  const start = new Date(startDateStr + 'T00:00:00');
  if (isNaN(start.getTime())) {
    showToast('⚠️ 날짜 형식이 잘못됨');
    return;
  }
  if (start > today) {
    showToast('⚠️ 미래 날짜는 안돼요');
    return;
  }

  closeModal();
  showToast('🔄 재계산 중...');

  // 자산 초기화
  // 🔧 이 자동매수가 만든 lot만 제거 — 안 그러면 재계산할 때마다 회차·수량이 누적됨.
  //    수동 입력 lot이나 다른 자동매수 lot은 보존.
  if (asset.lots && asset.lots.length > 0) {
    asset.lots = asset.lots.filter(l =>
      !(l.autoBuy && (l.fixedId != null ? l.fixedId === fixed.id : l.source === `🤖 ${fixed.name}`))
    );
  }
  // 남은 lot(수동·타 자동매수)으로 자산 값 재계산. 없으면 0.
  if (asset.lots && asset.lots.length > 0) {
    recalcAssetFromLots(asset);
  } else {
    asset.qty = (['청약','예적금','현금','부동산'].includes(asset.type)) ? 1 : 0;
    asset.price = Number(asset.initialBalance) || 0;
    if (asset.type === '청약') asset.rounds = Number(asset.initialRounds) || 0;
  }
  fixed.lastBuyDate = null;
  fixed.createdAt = start.toISOString(); // 새 시작 날짜 저장

  // 시세 받아오기
  let live = liveAssetData[asset.id];
  if (!live && asset.ticker) {
    try {
      live = await fetchAssetLive(asset);
      liveAssetData[asset.id] = live;
    } catch (e) {
      console.error('시세 조회 실패:', e);
    }
  }
  const currPrice = live?.krwPrice || 0;

  if (currPrice <= 0) {
    showToast('⚠️ 시세를 받을 수 없어요. 티커를 확인해주세요');
    return;
  }

  // 🔧 회차별 정확한 매입가를 위해 과거 종가 + 과거 환율 맵 로드
  let histMap = null, fxHistMap = null, histIsUSD = false, fxSpreadMul = 1;
  if (asset.ticker && asset.type !== '금') {
    try {
      let histTicker = asset.ticker.trim();
      if (/^\d{6}$/.test(histTicker)) histTicker = histTicker + '.KS';
      histMap = await fetchYahooHistorical(histTicker);
      if (live?.currency === 'USD') {
        histIsUSD = true;
        const fxDiscount = Number(asset.fxDiscount) || 0;
        fxSpreadMul = 1 + 0.0175 * (1 - fxDiscount / 100);
        fxHistMap = await fetchYahooHistorical('KRW=X');
      }
    } catch (e) {
      console.warn('재계산: 과거 종가 로드 실패', e);
    }
  }

  const now = new Date();
  const cycle = fixed.cycle || 'monthly';

  // 발생일 모두 계산
  const occurDates = [];
  const cursor = new Date(start);
  cursor.setHours(0, 0, 0, 0);

  if (cycle === 'monthly') {
    while (cursor <= now) {
      const y = cursor.getFullYear();
      const m = cursor.getMonth();
      const daysInM = new Date(y, m + 1, 0).getDate();
      const targetDay = Math.min(fixed.day, daysInM);
      const d = new Date(y, m, targetDay);
      if (d >= start && d <= now) occurDates.push(d);
      cursor.setMonth(cursor.getMonth() + 1);
    }
  } else {
    // 🔧 주간/격주: 시작일 기준 7일/14일 간격 (processAutoBuy와 동일 로직)
    const stepDays = cycle === 'biweekly' ? 14 : 7;
    const targetDow = Number(fixed.dow);
    const anchor = new Date(start);
    anchor.setHours(0, 0, 0, 0);
    while (anchor.getDay() !== targetDow) {
      anchor.setDate(anchor.getDate() + 1);
    }
    const c = new Date(anchor);
    let guard = 0;
    while (c <= now && guard < 1000) {
      occurDates.push(new Date(c));
      c.setDate(c.getDate() + stepDays);
      guard++;
    }
  }

  console.log(`🔄 ${asset.name} 재계산: ${startDateStr} ~ 오늘, ${occurDates.length}회 발생일 (시세 ${currPrice}원/주)`);

  // 기존 자동매수 lot만 제거 (수동 입력 lot는 유지)
  if (asset.lots) {
    asset.lots = asset.lots.filter(lot => !lot.autoBuy);
  }

  // 모든 발생일에 대해 lot 추가
  // 🔧 소수점 매매는 이 자동매수의 fractional === true 일 때만
  const allowFractional = fixed.fractional === true;
  const feeRate = Number(fixed.feeRate) || 0;
  const feeMul = 1 + feeRate / 100;
  let histTickerForAvg = asset.ticker ? asset.ticker.trim() : '';
  if (/^\d{6}$/.test(histTickerForAvg)) histTickerForAvg = histTickerForAvg + '.KS';
  occurDates.forEach((d) => {
    const dStr = dateKey(d.getFullYear(), d.getMonth(), d.getDate());

    // 🔧 그 회차 날짜의 매입가 — 정기매수는 장중 체결되므로 '그날 평균가' 우선
    let lotPrice = currPrice;
    let lotBuyRate = null;
    const histClose = getHistPriceOn(histMap, dStr);
    const histAvg = getHistAvgPriceOn(histTickerForAvg, dStr);
    const basePrice = (histAvg != null) ? histAvg : histClose;
    if (basePrice != null) {
      if (histIsUSD) {
        const histFx = getHistPriceOn(fxHistMap, dStr);
        lotBuyRate = histFx != null ? histFx * fxSpreadMul : (live?.krwPrice && live?.currentPrice ? live.krwPrice / live.currentPrice : 1380);
        lotPrice = basePrice * lotBuyRate;
      } else {
        lotPrice = basePrice;
      }
    }

    // 🔧 수수료 포함가로 수량 계산
    const effectivePrice = lotPrice * feeMul;
    let newQty = fixed.amt / effectivePrice;
    if (!allowFractional) {
      newQty = Math.floor(newQty); // 내림 (잔돈 남김)
    } else {
      newQty = parseFloat(newQty.toFixed(4));
    }
    if (newQty <= 0) return; // 한 주도 못 사는 경우 스킵

    addAssetLot(asset, {
      source: `🤖 ${fixed.name}`,
      qty: newQty,
      price: Math.round(lotPrice * feeMul), // 수수료 포함 1주당 원가
      date: dStr,
      fxDiscount: asset.fxDiscount || null,
      buyRate: lotBuyRate ? Math.round(lotBuyRate) : null,
      autoBuy: true,
      fixedId: fixed.id,
      note: allowFractional ? '자동매수 (소수점)' : '자동매수 (정수)',
    });
  });

  fixed.lastBuyDate = occurDates.length > 0 ? occurDates[occurDates.length - 1].toISOString() : null;
  saveData();

  showToast(`✅ ${occurDates.length}회 재계산 완료 (총 ${asset.qty}주)`);
  closeModal();
  renderAsset();
}

async function processAutoBuy(fixed) {
  if (!fixed.autoBuy) {
    console.log(`⏸️ ${fixed.name} - autoBuy=false, 스킵`);
    return;
  }
  if (!fixed.assetInfo) {
    console.log(`⏸️ ${fixed.name} - assetInfo 없음, 스킵`);
    return;
  }
  const now = new Date();
  const cycle = fixed.cycle || 'monthly';
  console.log(`🤖 ${fixed.name} 자동매수 점검 (주기:${cycle}, day:${fixed.day}, dow:${fixed.dow})`);

  // 🔧 자동 복구: 연결된 자산이 '아예 없을 때만' lastBuyDate를 리셋해 시작일부터 다시 채운다.
  //    (자산 삭제 후 자동매수만 남아 0원 되는 문제 복구용)
  //    ⚠️ 자산이 존재하면 — lot이 없어도 — 복구하지 않는다.
  //       사용자가 보유 탭에서 '현재값(과거분 이미 포함)'을 직접 입력한 정상 상황이기 때문.
  //       이때 복구하면 입력값 위에 과거 회차가 통째로 중복으로 쌓인다.
  if (fixed.lastBuyDate) {
    const linkedAsset = findMatchingAsset({
      name: fixed.assetInfo.name,
      type: fixed.assetInfo.type,
      ticker: fixed.assetInfo.ticker,
    });
    if (!linkedAsset) {
      console.log(`🔧 ${fixed.name} - 연결 자산 없음(삭제됨) → lastBuyDate 리셋(시작일부터 재계산)`);
      fixed.lastBuyDate = null;
    }
  }

  // 이번 달의 발생일 계산 - createdAt 이후만!
  const year = now.getFullYear();
  const month = now.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const occurDates = [];

  // 자동매수 시작 날짜 (createdAt 또는 lastBuyDate)
  const startDate = fixed.createdAt
    ? new Date(fixed.createdAt)
    : new Date(year, month, 1); // 기본: 이번 달 1일
  startDate.setHours(0, 0, 0, 0);
  console.log(`📅 ${fixed.name} 시작 날짜: ${startDate.toLocaleDateString()}`);

  if (cycle === 'monthly') {
    if (!fixed.day || fixed.day < 1) {
      console.warn(`⚠️ ${fixed.name} - 결제일 없음 (day=${fixed.day})`);
      return;
    }
    const targetDay = Math.min(fixed.day, daysInMonth);
    const d = new Date(year, month, targetDay);
    if (d <= now && d >= startDate) occurDates.push(d);
  } else {
    // 🔧 주간/격주: "이번 달 0,2,4번째" 방식은 달 경계에서 14일 주기가 깨짐
    // → 시작일 기준으로 7일(주간)/14일(격주) 간격을 직접 누적해서 생성
    if (isNaN(Number(fixed.dow))) {
      console.warn(`⚠️ ${fixed.name} - 요일 없음 (dow=${fixed.dow})`);
      return;
    }
    const stepDays = cycle === 'biweekly' ? 14 : 7;
    const targetDow = Number(fixed.dow);

    // 시작일 이후(포함) 첫 번째 '해당 요일'을 기준점으로 잡음
    const anchor = new Date(startDate);
    anchor.setHours(0, 0, 0, 0);
    while (anchor.getDay() !== targetDow) {
      anchor.setDate(anchor.getDate() + 1);
    }

    // 기준점부터 today까지 stepDays 간격으로 전부 생성 (과거 누락분 포함)
    const cursor = new Date(anchor);
    let guard = 0; // 무한루프 방지
    while (cursor <= now && guard < 1000) {
      occurDates.push(new Date(cursor));
      cursor.setDate(cursor.getDate() + stepDays);
      guard++;
    }
  }
  console.log(`📅 ${fixed.name} - 발생일 ${occurDates.length}회:`, occurDates.map(d => d.toLocaleDateString()));

  // 마지막 처리 날짜 이후의 회차만 처리
  let lastBuyDate = fixed.lastBuyDate ? new Date(fixed.lastBuyDate) : null;

  // 🔧 안전망: lastBuyDate가 없는데(=처음부터 채우려는 상태) 연결 자산에 이미 보유분이 있으면,
  //    그 자산은 사용자가 보유 탭에서 '현재값(과거 회차 다 포함)'을 직접 입력한 것이다.
  //    이때 과거 회차를 채우면 입력값 위에 중복으로 쌓인다(청약·주식 공통 버그).
  //    → lastBuyDate를 오늘로 잡아 다음 회차부터만 추가한다.
  if (!lastBuyDate) {
    const linkedAsset = findMatchingAsset({
      name: fixed.assetInfo.name,
      type: fixed.assetInfo.type,
      ticker: fixed.assetInfo.ticker,
    });
    // 이 자동매수가 만든 lot이 하나라도 있으면 '이미 자동으로 채운 자산' → 안전망 불필요
    const hasMyAutoLot = linkedAsset && (linkedAsset.lots || []).some(l =>
      l.autoBuy && (l.fixedId != null ? l.fixedId === fixed.id : l.source === `🤖 ${fixed.name}`)
    );
    // 보유분 판정: 수량>0 이거나, 납입형이면 금액>0
    const hasHolding = linkedAsset && (
      Number(linkedAsset.qty) > 0 ||
      Number(linkedAsset.price) > 0 ||
      (linkedAsset.lots && linkedAsset.lots.length > 0)
    );
    if (linkedAsset && hasHolding && !hasMyAutoLot) {
      const todayEnd = new Date(now);
      todayEnd.setHours(23, 59, 59, 999);
      fixed.lastBuyDate = todayEnd.toISOString();
      lastBuyDate = new Date(fixed.lastBuyDate);
      console.log(`🛡️ ${fixed.name} - 자산에 입력된 보유분 있음 → 과거분 생략, 다음 회차부터 (lastBuyDate=오늘)`);
    }
  }

  const newDates = lastBuyDate
    ? occurDates.filter(d => d > lastBuyDate)
    : occurDates;

  if (newDates.length === 0) {
    console.log(`⏸️ ${fixed.name} - 새 매수일 없음 (마지막 ${lastBuyDate?.toLocaleDateString() || '없음'})`);
    return;
  }
  console.log(`✅ ${fixed.name} - 새 매수 ${newDates.length}건 처리 예정`);

  // 자산 찾기 (티커 우선)
  let asset = findMatchingAsset({
    name: fixed.assetInfo.name,
    type: fixed.assetInfo.type,
    ticker: fixed.assetInfo.ticker,
  });
  if (!asset) {
    // 자산이 없으면 자동 생성
    console.log(`🆕 ${fixed.name} - 자산 자동 생성: ${fixed.assetInfo.name}`);
    asset = {
      id: Date.now() + Math.random(),
      type: fixed.assetInfo.type,
      name: fixed.assetInfo.name,
      ticker: fixed.assetInfo.ticker || '',
      qty: 0,
      price: 0,
      note: '자동매수',
    };
    assets.push(asset);
  }

  // 현재 시세 (없으면 받아오기)
  let live = liveAssetData[asset.id];
  if (!live && asset.ticker) {
    console.log(`📡 ${asset.name} 시세 받아오는 중...`);
    try {
      live = await fetchAssetLive(asset);
      liveAssetData[asset.id] = live;
    } catch (e) {
      console.warn(`${asset.name} 시세 조회 실패:`, e.message);
    }
  }
  let currPrice = live?.krwPrice || asset.price || 0;

  // 금 자산 + 티커 없으면 → 네이버 국내 금 시세 (g당 원) 사용
  if (asset.type === '금' && !asset.ticker) {
    try {
      const goldData = await fetchNaverGoldDomestic();
      if (goldData?.price) {
        currPrice = goldData.price;
        console.log(`🪙 ${asset.name} 네이버 국내 금 시세: ${currPrice}원/g`);
      }
    } catch (e) {
      console.warn('네이버 금 시세 실패:', e);
    }
  }
  console.log(`💰 ${asset.name} 시세: ${currPrice.toLocaleString()}원`);

  // 🔧 과거 회차의 정확한 매입가를 위해 과거 종가 맵을 미리 받아둠
  // (기존엔 모든 회차를 '오늘 시세'로 저장 → 매입가=현재가 → 수익률 0% 버그)
  let histMap = null;
  let histIsUSD = false;
  let buyRateForHist = 1;        // 환율 맵이 없을 때 쓰는 폴백 (오늘 환율)
  let fxHistMap = null;          // 🔧 날짜별 과거 원/달러 환율 맵
  let fxSpreadMul = 1;           // 환전 스프레드 배수 (과거 환율에도 동일 적용)
  if (asset.ticker && asset.type !== '금') {
    try {
      let histTicker = asset.ticker;
      // 한국 종목 티커 보정 (.KS)
      if (/^\d{6}$/.test(histTicker)) histTicker = histTicker + '.KS';
      histMap = await fetchYahooHistorical(histTicker);
      // 미국 종목이면 과거 종가가 달러 → 원화 환산 필요
      if (live?.currency === 'USD') {
        histIsUSD = true;
        const fxDiscount = Number(asset.fxDiscount) || 0;
        fxSpreadMul = 1 + 0.0175 * (1 - fxDiscount / 100);
        // 🔧 핵심: 각 매수일의 '그 날 환율'을 쓰기 위해 과거 원/달러 환율 1년치 로드
        fxHistMap = await fetchYahooHistorical('KRW=X');
        // 환율 맵을 못 받았을 때만 오늘 환율로 폴백
        const marketRate = await getUSDKRW();
        buyRateForHist = marketRate * fxSpreadMul;
      }
    } catch (e) {
      console.warn('과거 종가 로드 실패:', e);
    }
  }

  const skippedDates = []; // 🔧 시세 조회 실패로 건너뛴 회차 (lastBuyDate 갱신 제외용)
  const addedDates = [];   // 🔧 실제로 lot이 추가된 회차 (토스트 카운트용)
  let fallbackCount = 0;   // 🔧 과거 시세를 못 구해 오늘 시세로 폴백한 회차 수 (1년 초과 등)
  newDates.forEach(d => {
    // 🔧 toISOString()은 UTC 기준이라 한국(UTC+9)에서 하루 밀림 → 로컬 기준으로 변환
    const dateStr = dateKey(d.getFullYear(), d.getMonth(), d.getDate());

    // 🔧 중복 방지: 같은 자동매수(fixedId)의 같은 날짜 lot이 이미 있으면 스킵
    // (이름 기반 매칭은 자동매수 이름을 바꾸면 뚫리므로 fixedId 우선)
    const existingLot = (asset.lots || []).find(lot =>
      lot.autoBuy &&
      lot.date === dateStr &&
      (lot.fixedId != null
        ? lot.fixedId === fixed.id
        : lot.source === `🤖 ${fixed.name}`) // fixedId 없는 옛 lot 하위호환
    );
    if (existingLot) {
      console.log(`⏸️ ${asset.name} ${dateStr} 이미 처리됨 (중복 방지)`);
      return;
    }

    // 청약/예적금/현금/부동산: 납입형 - 금액 그대로 누적 (qty=1, price=금액)
    const isDepositType = ['청약', '예적금', '현금', '부동산'].includes(asset.type);

    if (isDepositType) {
      addAssetLot(asset, {
        source: `🤖 ${fixed.name}`,
        qty: 1,
        price: fixed.amt,
        date: dateStr,
        autoBuy: true,
        fixedId: fixed.id,
        note: '자동 납입',
      });
      // 🔧 청약 회차는 recalcAssetFromLots가 lot 개수로 계산 → 여기서 직접 ++ 안 함 (이중 카운트 방지)
      addedDates.push(d);
      console.log(`💰 ${asset.name} 납입 lot 추가: ${dateStr}, ${fixed.amt.toLocaleString()}원`);
    } else if (currPrice > 0) {
      // 🔧 그 회차 날짜의 정확한 매입가가 있어야만 lot 생성 (없으면 보류)
      //    예전엔 그날 데이터 없으면 7일 역추적 또는 현재가로 폴백 → 다른 회차와 같은 값 들어가는 버그
      //    예: 수요일 매수일인데 한국 시각 오전이라 야후에 아직 그날 종가 없음 → 화요일 값이 복사됨
      let histTickerForAvg = asset.ticker ? asset.ticker.trim() : '';
      if (/^\d{6}$/.test(histTickerForAvg)) histTickerForAvg = histTickerForAvg + '.KS';

      const exactClose = getHistPriceExact(histMap, dateStr);
      const exactAvg = getHistAvgPriceExact(histTickerForAvg, dateStr);
      const basePrice = (exactAvg != null) ? exactAvg : exactClose;

      if (basePrice == null) {
        console.log(`⏳ ${asset.name} ${dateStr} 그날 시세 미확정 → 회차 보류 (다음에 정확한 값으로 처리)`);
        skippedDates.push(d);
        return;
      }

      let lotPrice = basePrice;
      let lotBuyRate = null;
      let priceSrc = (exactAvg != null) ? '그날 평균가' : '그날 종가';
      if (histIsUSD) {
        const histFx = getHistPriceExact(fxHistMap, dateStr);
        if (histFx == null) {
          console.log(`⏳ ${asset.name} ${dateStr} 그날 환율 미확정 → 회차 보류`);
          skippedDates.push(d);
          return;
        }
        lotBuyRate = histFx * fxSpreadMul;
        lotPrice = basePrice * lotBuyRate;
      }

      // 🔧 거래수수료 반영 — 정기매수도 매수수수료가 붙어 실제 매입원가가 약간 높음.
      //    자동매수 설정의 feeRate(%)가 있으면 사용, 없으면 0 (수수료 무료 증권사 기본).
      const feeRate = Number(fixed.feeRate) || 0; // 예: 0.015 (%)
      const feeMul = 1 + feeRate / 100;

      // 시세 알면 정확한 수량 계산 — 수수료 포함가로 살 수 있는 수량
      const effectivePrice = lotPrice * feeMul;
      let newQty = fixed.amt / effectivePrice;
      // 🔧 소수점 매매는 이 자동매수의 fractional === true 일 때만.
      //    그 외(정수 매매 설정)엔 무조건 내림 → 정수 주수 (잔돈은 남김)
      const allowFractional = fixed.fractional === true;
      if (!allowFractional) {
        newQty = Math.floor(newQty);
      } else {
        newQty = parseFloat(newQty.toFixed(4));
      }
      if (newQty <= 0) {
        console.warn(`⚠️ ${asset.name} 정수 매수 불가 (한도 ${fixed.amt} / 시세 ${Math.round(effectivePrice)})`);
        return;
      }
      // 🔧 매입원가 = 주가 + 수수료. lot의 price는 수수료 포함 1주당 원가로 저장
      const lotPriceWithFee = Math.round(lotPrice * feeMul);
      console.log(`  📅 ${dateStr} ${priceSrc} ${Math.round(lotPrice).toLocaleString()}원${feeRate>0?` +수수료${feeRate}%`:''} → ${newQty}주 @ ${lotPriceWithFee.toLocaleString()}`);
      addAssetLot(asset, {
        source: `🤖 ${fixed.name}`,
        qty: newQty,
        price: lotPriceWithFee,
        date: dateStr,
        fxDiscount: asset.fxDiscount || null,
        buyRate: lotBuyRate ? Math.round(lotBuyRate) : null, // 🔧 매수 시점 환율 기록
        autoBuy: true,
        fixedId: fixed.id,
        note: fixed.fractional ? '자동매수 (소수점)' : '자동매수 (정수)',
      });
      addedDates.push(d);
      if (priceSrc === '현재가') fallbackCount++;
      console.log(`✅ ${asset.name} lot 추가: ${dateStr}, ${newQty}주, 총 ${asset.qty}주`);
    } else {
      // 🔧 시세를 못 받으면 부정확한 "1주 추정"을 만들지 않고 이 회차는 건너뜀
      // (lastBuyDate를 갱신하지 않으므로 다음 점검 때 다시 시도됨)
      console.warn(`⚠️ ${asset.name} ${dateStr} 시세 조회 실패 - 이번 회차 건너뜀 (다음에 재시도)`);
      skippedDates.push(d);
      return;
    }
  });

  // 🔧 시세 실패로 건너뛴 회차는 lastBuyDate에서 제외 → 다음 점검 때 재처리
  // (중복·정수불가로 스킵된 건 이미 처리됐거나 처리 불가이므로 lastBuyDate는 정상 전진)
  const lastValidDate = newDates.filter(d => !skippedDates.includes(d));

  if (lastValidDate.length === 0) {
    console.log(`⏸️ ${fixed.name} - 진행 가능한 회차 없음`);
    if (skippedDates.length > 0) {
      showToast(`⚠️ ${fixed.name} 시세 조회 실패 - 잠시 후 자동 재시도`);
    }
    return;
  }
  fixed.lastBuyDate = lastValidDate[lastValidDate.length - 1].toISOString();
  saveData();

  if (addedDates.length > 0) {
    showToast(`🤖 ${fixed.name} ${addedDates.length}회 자동매수 처리됨`);
    if (fallbackCount > 0) {
      // 과거 시세(1년 초과 등)를 못 구해 오늘 시세로 계산된 회차 안내
      setTimeout(() => {
        showToast(`💡 ${fixed.name}: ${fallbackCount}개 회차는 과거 시세를 못 구해 추정값이에요. 캡처 보정 권장`);
      }, 2200);
    }
  } else if (skippedDates.length > 0) {
    showToast(`⚠️ ${fixed.name} 시세 조회 실패 - 잠시 후 자동 재시도`);
  }
}

// 앱 시작 시 모든 자동매수 항목 점검
async function runAllAutoBuys() {
  // 기존 중복 정리: budget.expenses에서 autoBuy=true인 항목 모두 제거 (이제 고정지출만으로 처리)
  const before = budget.expenses.length;
  budget.expenses = budget.expenses.filter(e => !e.autoBuy);
  const removed = before - budget.expenses.length;
  if (removed > 0) {
    console.log(`🧹 기존 자동매수 중복 ${removed}건 정리됨 (이제 고정지출만 사용)`);
    saveData();
  }

  if (!budget.fixed) return;
  for (const f of budget.fixed) {
    if (f.autoBuy) await processAutoBuy(f);
  }
}

// 월 수입 빠른 편집
// 🎯 목표 생활비 편집
function editLivingGoal() {
  const monthLabel = `${budgetViewYear}년 ${budgetViewMonth + 1}월`;
  const goalKey = `${budgetViewYear}-${String(budgetViewMonth + 1).padStart(2, '0')}`;
  const current = (settings.livingGoals && settings.livingGoals[goalKey]) || settings.defaultLivingGoal || 0;

  modal.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-cancel" onclick="closeModal()">취소</button>
        <h2>🎯 목표 생활비</h2>
        <button class="modal-save" onclick="saveLivingGoal()">저장</button>
      </div>

      <div style="padding:12px 14px; background:var(--bg-info); border-radius:var(--radius-md); margin-bottom:14px; font-size:11px; color:var(--text-info); line-height:1.5;">
        💡 본인이 한 달 동안 <b>자유롭게 쓸 수 있는 금액</b> 목표를 정해주세요.<br>
        고정지출(월세 등)과 자산투자는 <b>제외</b>됩니다.<br>
        목표 안 넘으면 → <b>비상금</b>으로 세이브!
      </div>

      <div class="amount-display">
        <div class="label">${monthLabel} 목표 생활비</div>
        <div class="num"><span id="goal-val">${current.toLocaleString()}</span><span>원</span></div>
      </div>

      <div class="field">
        <input type="number" id="goal-input" placeholder="예: 500000" value="${current || ''}" autofocus
          oninput="document.getElementById('goal-val').textContent = (Number(this.value) || 0).toLocaleString();" />
      </div>
      ${quickAmtButtons('goal-input')}

      <div class="field">
        <label style="display:flex; align-items:center; gap:10px; cursor:pointer; font-size:12px;">
          <input type="checkbox" id="goal-default" ${current && current === settings.defaultLivingGoal ? 'checked' : ''} style="width:18px; height:18px; cursor:pointer;" />
          매월 기본 목표로 저장
        </label>
        <div style="font-size:10px; color:var(--text-tertiary); margin-top:4px; padding-left:28px;">
          체크하면 다음 달부터 자동으로 같은 목표 적용
        </div>
      </div>

      <div style="display:flex; gap:6px; margin-top:14px;">
        <button onclick="clearLivingGoal()" style="flex:1; padding:10px; border:0.5px solid var(--border-tertiary); background:var(--bg-secondary); border-radius:var(--radius-md); font-size:12px; cursor:pointer; font-family:inherit;">목표 삭제</button>
      </div>
    </div>
  `;
  modal.classList.add('show');
}

function saveLivingGoal() {
  const val = Number(document.getElementById('goal-input').value) || 0;
  if (val <= 0) {
    showToast('금액을 입력해주세요');
    return;
  }
  const setAsDefault = document.getElementById('goal-default').checked;

  if (!settings.livingGoals) settings.livingGoals = {};
  const goalKey = `${budgetViewYear}-${String(budgetViewMonth + 1).padStart(2, '0')}`;
  settings.livingGoals[goalKey] = val;

  if (setAsDefault) {
    settings.defaultLivingGoal = val;
  }

  saveData();
  showToast(`🎯 목표 생활비 ${val.toLocaleString()}원 저장됨`);
  closeModal();
  renderMoney();
}

function clearLivingGoal() {
  if (!confirm('이번 달 목표 생활비를 삭제할까요?')) return;
  const goalKey = `${budgetViewYear}-${String(budgetViewMonth + 1).padStart(2, '0')}`;
  if (settings.livingGoals) delete settings.livingGoals[goalKey];
  saveData();
  showToast('목표 삭제됨');
  closeModal();
  renderMoney();
}

// 💵 가계부 월 잔액을 '현금' 자산으로 이동 (총자산 합산용)
// 같은 달은 한 번만 반영. 다시 누르면 그 달 금액을 최신값으로 갱신(중복 X).
function moveBudgetRemainToCash(year, month, remaining) {
  remaining = Math.round(Number(remaining) || 0);
  if (remaining <= 0) { showToast('이동할 잔액이 없어요'); return; }
  const monthKey = `${year}-${String(month).padStart(2, '0')}`;
  const monthLabel = `${year}년 ${month}월`;

  // 🔧 진행 중인 달이면 잔액이 아직 미확정 → 경고
  const now = new Date();
  const isCurrentMonth = (year === now.getFullYear() && month === now.getMonth() + 1);
  if (isCurrentMonth) {
    const daysInM = new Date(year, month, 0).getDate();
    const daysLeft = daysInM - now.getDate();
    if (daysLeft > 0 && !confirm(
      `${monthLabel}은 아직 진행 중이에요 (${daysLeft}일 남음).\n\n지금 잔액(${remaining.toLocaleString()}원)은 확정이 아니라서, 이번 달에 지출이 더 생기면 실제와 달라져요.\n\n그래도 지금 반영할까요?\n(나중에 같은 버튼을 다시 누르면 최신값으로 갱신돼요)`
    )) {
      return;
    }
  }

  // '가계부 현금' 전용 자산 찾기 (없으면 생성)
  let cashAsset = assets.find(a => a.type === '현금' && a._budgetCash === true);
  if (!cashAsset) {
    cashAsset = {
      id: Date.now(),
      name: '가계부 잔액 (현금)',
      type: '현금',
      ticker: '',
      qty: 1,
      price: 0,
      _budgetCash: true,
      _monthlyRemains: {}, // { '2026-05': 320000, ... } 월별 이월 내역
      note: '가계부에서 넘어온 월별 잔액 합계',
    };
    assets.push(cashAsset);
  }
  if (!cashAsset._monthlyRemains) cashAsset._monthlyRemains = {};

  const prev = Number(cashAsset._monthlyRemains[monthKey]) || 0;
  const isUpdate = prev > 0;

  if (isUpdate && !confirm(`${monthLabel} 잔액은 이미 ${prev.toLocaleString()}원이 반영돼 있어요.\n\n${remaining.toLocaleString()}원으로 갱신할까요?\n(중복으로 더해지지 않고 최신값으로 바뀝니다)`)) {
    return;
  }

  // 월별 내역 갱신 후 전체 합산
  cashAsset._monthlyRemains[monthKey] = remaining;
  const total = Object.values(cashAsset._monthlyRemains).reduce((s, v) => s + (Number(v) || 0), 0);
  cashAsset.price = total;
  cashAsset.qty = 1;

  saveData();
  showToast(isUpdate
    ? `💵 ${monthLabel} 잔액 갱신 (현금 자산 총 ${total.toLocaleString()}원)`
    : `💵 ${monthLabel} 잔액 ${remaining.toLocaleString()}원을 현금 자산에 반영`);
  renderMoney();
}

function calcInputChanged() {
  calcEvaluate();
}

function calcCopy() {
  const result = document.getElementById('calc-result').textContent.replace(/,/g, '');
  navigator.clipboard?.writeText(result).then(() => {
    showToast(`📋 ${Number(result).toLocaleString()} 복사됨`);
  }).catch(() => {
    showToast(`결과: ${Number(result).toLocaleString()}`);
  });
  calcCancel();
}

function calcBtnStyle(bg, fg) {
  return `padding:18px; border:none; background:${bg}; color:${fg}; border-radius:12px; font-size:18px; font-weight:600; cursor:pointer; font-family:inherit; ${bg === 'white' ? 'box-shadow:0 1px 2px rgba(0,0,0,0.05); border:0.5px solid #E5E5E5;' : ''}`;
}

function calcAppend(ch) {
  const input = document.getElementById('calc-input');
  input.value = (input.value || '') + ch;
  input.focus();
  calcEvaluate();
}

function calcBack() {
  const input = document.getElementById('calc-input');
  input.value = (input.value || '').slice(0, -1);
  input.focus();
  calcEvaluate();
}

function calcClear() {
  document.getElementById('calc-input').value = '';
  document.getElementById('calc-result').textContent = '0';
  document.getElementById('calc-input').focus();
}

function calcQuick(amt) {
  const input = document.getElementById('calc-input');
  let cur = input.value || '';
  if (!cur || cur === '0') cur = String(amt);
  else cur = cur + '+' + String(amt);
  input.value = cur;
  input.focus();
  calcEvaluate();
}

function calcEvaluate() {
  const input = document.getElementById('calc-input');
  const expr = input?.value || '0';
  try {
    const clean = expr.replace(/[^0-9+\-*/.()% ]/g, '');
    if (!clean) {
      document.getElementById('calc-result').textContent = '0';
      return;
    }
    let result = Function('"use strict"; return (' + clean.replace(/(\d+)%/g, '($1/100)') + ')')();
    if (!isFinite(result)) result = 0;
    result = Math.round(result * 100) / 100;
    document.getElementById('calc-result').textContent = Number.isInteger(result) ? result.toLocaleString() : result.toLocaleString(undefined, { maximumFractionDigits: 2 });
  } catch (e) {
    document.getElementById('calc-result').textContent = '...';
  }
}

function calcEquals() {
  const input = document.getElementById('calc-input');
  const expr = input?.value || '0';
  try {
    const clean = expr.replace(/[^0-9+\-*/.()% ]/g, '');
    let result = Function('"use strict"; return (' + clean.replace(/(\d+)%/g, '($1/100)') + ')')();
    if (!isFinite(result)) result = 0;
    result = Math.round(result);
    input.value = String(result);
    document.getElementById('calc-result').textContent = result.toLocaleString();
  } catch (e) {
    showToast('계산 오류');
  }
}

function calcApply() {
  const result = document.getElementById('calc-result').textContent.replace(/,/g, '');
  const val = Math.round(Number(result) || 0);
  const targetId = window._calcReturnTarget || 'amt-input';
  const target = document.getElementById(targetId);
  if (target) {
    target.value = val;
    target.dispatchEvent(new Event('input', { bubbles: true }));
  }
  calcCancel();
  showToast(`✅ ${val.toLocaleString()}원 적용`);
}

function calcCancel() {
  const overlay = document.getElementById('calc-overlay');
  if (overlay) overlay.remove();
  delete window._calcReturnTarget;
  delete window._calcCurrentExpr;
}

function saveExpenseEdit(id) {
  const e = budget.expenses.find(x => x.id === id);
  if (!e) return;

  const newAmt = Number(document.getElementById('edit-amt').value);
  const newDate = document.getElementById('edit-date').value;
  const newMemo = document.getElementById('edit-memo').value.trim();

  if (!newAmt) { showToast('금액을 입력해주세요'); return; }

  e.amt = newAmt;
  if (newDate) {
    e.dateKey = newDate;
    const [, , d] = newDate.split('-');
    e.date = Number(d);
  }
  e.memo = newMemo;

  saveData();
  showToast('수정됨');
  closeModal();
  renderMoney();
}

function deleteExpense(id) {
  const e = budget.expenses.find(x => x.id === id);
  if (!e) return;

  // 투자 카테고리면 → 연결된 자산도 함께 처리
  const investCategories = ['투자', '주식', '국내주식', '미국주식', 'ETF', '국내ETF', '해외ETF', '펀드', '채권', '금', '달러', '예적금', '청약', '현금', '부동산'];
  const isInvestExpense = e.type !== 'income' && investCategories.includes(e.cat);

  // 연결된 자산 찾기 - linkedAssetName 또는 memo
  let linkedAsset = null;
  if (isInvestExpense) {
    const key = e.linkedAssetName || e.memo;
    if (key) {
      linkedAsset = assets.find(a => a.name === key && a.type === e.cat);
    }
  }

  // 같은 자산에 연결된 다른 지출이 더 있는지 확인
  let otherExpensesForAsset = 0;
  if (linkedAsset) {
    const key = e.linkedAssetName || e.memo;
    otherExpensesForAsset = budget.expenses.filter(x =>
      x.id !== id && x.type !== 'income' &&
      investCategories.includes(x.cat) &&
      ((x.linkedAssetName === key) || (x.memo === key && !x.linkedAssetName))
    ).length;
  }

  let msg = `"${e.memo || e.cat}" ${Number(e.amt).toLocaleString()}원을 삭제할까요?`;
  let willDeleteAsset = false;
  if (linkedAsset && otherExpensesForAsset === 0) {
    msg += `\n\n⚠️ 마지막 매수 기록입니다. 연결된 자산 "${linkedAsset.name}" (${linkedAsset.type})도 함께 삭제됩니다.`;
    willDeleteAsset = true;
  } else if (linkedAsset && otherExpensesForAsset > 0) {
    msg += `\n\n(자산 "${linkedAsset.name}"는 다른 매수 기록이 ${otherExpensesForAsset}개 남아있어 유지됩니다)`;
  }

  if (!confirm(msg)) return;

  // 지출 삭제
  budget.expenses = budget.expenses.filter(x => x.id !== id);

  // 마지막 매수 기록이면 → 자산도 삭제
  if (willDeleteAsset) {
    assets = assets.filter(a => a.id !== linkedAsset.id);
  }

  saveData();
  showToast(willDeleteAsset ? `삭제됨 (자산 "${linkedAsset.name}" 포함)` : '삭제됨');
  closeModal();
  renderMoney();
}

// 보정 배너에서 호출 — 증권사 잔고 캡처 파일 선택창을 연다.
// 캡처를 올리면 기존 OCR 검토 흐름으로 이어지고, 자동매수 자산은 '보정'이 기본 선택됨.
function openAssetCaptureForCorrection() {
  if (!window.GEMINI_API_KEY) {
    showToast('AI 키를 먼저 설정해주세요 (설정 → AI 키)');
    return;
  }
  let input = document.getElementById('asset-capture-input');
  if (!input) {
    // 자산 추가 모달이 안 열려 있어도 동작하도록 임시 파일 인풋 생성
    input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/jpeg,image/png,image/heic,image/webp';
    input.multiple = true;
    input.style.display = 'none';
    input.onchange = function () { processAssetCapture(this); };
    document.body.appendChild(input);
  }
  input.click();
}

    try {

      const mimeType = file.type || 'image/jpeg';

    const prompt = `증권/은행/투자 앱 화면에서 보유 자산을 추출해 JSON 반환.

각 항목: {type, name, qty, price, ticker, priceCurrency, avgBuyRate, evalAmount, profitPct, profitAmount}
