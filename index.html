function calcSellResult(assetId) {
  const sellQty = Number(document.getElementById('sell-qty')?.value) || 0;
  const sellPrice = Number(document.getElementById('sell-price')?.value) || 0;
  const krwAvg = Number(document.getElementById('sell-krwavg')?.value) || 0;
  const isUS = document.getElementById('sell-isus')?.value === '1';
  const priorProfit = Number(document.getElementById('sell-prior')?.value) || 0;
  const resultEl = document.getElementById('sell-result');
  if (!resultEl) return;

  // 🔧 수수료율 — 증권사 선택값 또는 직접입력값
  const brokerSel = document.getElementById('sell-broker');
  let feeRatePct;
  if (brokerSel && brokerSel.value === 'custom') {
    feeRatePct = Number(document.getElementById('sell-fee-rate')?.value) || 0;
  } else if (brokerSel) {
    feeRatePct = Number(brokerSel.value) || 0;
  } else {
    feeRatePct = isUS ? 0.07 : 0.015;
  }
  const feeRate = feeRatePct / 100; // % → 비율

  if (sellQty <= 0 || sellPrice <= 0) {
    resultEl.innerHTML = `<div style="padding:14px; text-align:center; color:var(--text-tertiary); font-size:12px;">매도 수량과 단가를 입력하세요.</div>`;
    return;
  }

  const grossSell = sellQty * sellPrice;        // 매도 총액 (원화)
  const buyValue = sellQty * krwAvg;            // 해당 수량의 매입원가 (원화)
  const rawProfit = grossSell - buyValue;       // 세전 매매차익 (환차익 포함 — krwAvg가 매입환율 반영)

  let tax = 0, taxLabel = '', taxDetail = '';
  if (isUS) {
    // 미국: 양도소득세 22% (양도세 20% + 지방소득세 2%), 연 250만원 기본공제
    const yearProfit = rawProfit + priorProfit;       // 올해 전체 해외주식 손익
    const taxable = Math.max(0, yearProfit - 2500000); // 250만원 공제
    tax = Math.round(taxable * 0.22);
    taxLabel = '양도소득세 (22%)';
    taxDetail = yearProfit > 0
      ? `올해 합산손익 ${Math.round(yearProfit).toLocaleString()}원 − 공제 250만원 = 과세표준 ${Math.round(taxable).toLocaleString()}원`
      : '올해 합산손익이 손실이라 양도세 없음';
  } else {
    // 국내: 증권거래세 (매도금액 기준, 2025년 약 0.18%) — 일반 개인은 양도세 없음
    tax = Math.round(grossSell * 0.0018);
    taxLabel = '증권거래세 (0.18%)';
    taxDetail = `매도금액 ${Math.round(grossSell).toLocaleString()}원 × 0.18%`;
  }

  // 거래수수료 (매도, 선택한 증권사 수수료율)
  const fee = Math.round(grossSell * feeRate);
  const netReceive = grossSell - tax - fee;     // 최종 실수령액
  const netProfit = netReceive - buyValue;      // 세후 실현손익
  const netProfitPct = buyValue > 0 ? (netProfit / buyValue * 100) : 0;
  const pColor = netProfit >= 0 ? 'var(--text-danger)' : 'var(--text-info)';

  const line = (label, val, color) =>
    `<div style="display:flex; justify-content:space-between; padding:6px 0; font-size:12px;">
      <span style="color:var(--text-tertiary);">${label}</span>
      <span style="font-weight:600; ${color ? `color:${color};` : ''}">${val}</span>
    </div>`;

  resultEl.innerHTML = `
    <div style="padding:14px; background:var(--bg-secondary); border-radius:12px;">
      ${line('매도 총액', Math.round(grossSell).toLocaleString() + '원')}
      ${line('매입 원가', '− ' + Math.round(buyValue).toLocaleString() + '원')}
      ${line('세전 매매차익', (rawProfit>=0?'+':'') + Math.round(rawProfit).toLocaleString() + '원', rawProfit>=0?'var(--text-danger)':'var(--text-info)')}
      <div style="border-top:0.5px solid var(--border-tertiary); margin:4px 0;"></div>
      ${line(taxLabel, '− ' + tax.toLocaleString() + '원')}
      ${line(`거래수수료 (${feeRatePct}%)`, '− ' + fee.toLocaleString() + '원')}
      <div style="font-size:9px; color:var(--text-tertiary); padding:2px 0 6px;">${taxDetail}</div>
      <div style="border-top:1px solid var(--border-secondary); margin:4px 0;"></div>
      <div style="display:flex; justify-content:space-between; padding:8px 0 2px;">
        <span style="font-size:13px; font-weight:700;">실수령액</span>
        <span style="font-size:16px; font-weight:800;">${Math.round(netReceive).toLocaleString()}원</span>
      </div>
      <div style="display:flex; justify-content:space-between;">
        <span style="font-size:11px; color:var(--text-tertiary);">세후 실현손익</span>
        <span style="font-size:12px; font-weight:700; color:${pColor};">
          ${netProfit>=0?'+':''}${Math.round(netProfit).toLocaleString()}원 (${netProfit>=0?'+':''}${netProfitPct.toFixed(2)}%)
        </span>
      </div>
    </div>
  `;
}

// 🔧 주가 차트 SVG 생성 — 1년치 종가 선그래프 + 거래량 막대
// series: [{date, close, volume}], buyPrice: 평단가(원), period: 표시 기간(일)
// 🔧 기술적 지표 계산 — series: [{date, close, volume}]
// AI 분석에 넘길 수치들을 만든다 (이동평균·RSI·52주 고저·추세)
function calcTechnicalIndicators(series) {
  if (!series || series.length < 20) return null;
  const closes = series.map(s => s.close).filter(c => c != null);
  const n = closes.length;
  const cur = closes[n - 1];

  const sma = (days) => {
    if (n < days) return null;
    return closes.slice(-days).reduce((a, b) => a + b, 0) / days;
  };
  const ma20 = sma(20), ma60 = sma(60), ma120 = sma(120);

  // RSI (14일)
  let rsi = null;
  if (n >= 15) {
    let gain = 0, loss = 0;
    for (let i = n - 14; i < n; i++) {
      const diff = closes[i] - closes[i - 1];
      if (diff >= 0) gain += diff; else loss -= diff;
    }
    const avgGain = gain / 14, avgLoss = loss / 14;
    rsi = avgLoss === 0 ? 100 : 100 - (100 / (1 + avgGain / avgLoss));
  }

  const hi = Math.max(...closes);
  const lo = Math.min(...closes);
  const posInRange = hi > lo ? ((cur - lo) / (hi - lo) * 100) : 50;

  const chg1m = n >= 21 ? ((cur - closes[n - 21]) / closes[n - 21] * 100) : null;
  const chg3m = n >= 61 ? ((cur - closes[n - 61]) / closes[n - 61] * 100) : null;

  let trend = '판단보류';
  if (ma20 && ma60) {
    if (cur > ma20 && ma20 > ma60) trend = '상승추세 (정배열)';
    else if (cur < ma20 && ma20 < ma60) trend = '하락추세 (역배열)';
    else trend = '횡보/혼조';
  }

  let score = 0;
  const signalReason = [];
  if (ma20) { if (cur > ma20) { score++; signalReason.push('20일선 상회'); } else { score--; signalReason.push('20일선 하회'); } }
  if (ma60) { if (cur > ma60) score++; else score--; }
  if (rsi != null) {
    if (rsi >= 70) { score--; signalReason.push(`RSI ${rsi.toFixed(0)} 과매수`); }
    else if (rsi <= 30) { score++; signalReason.push(`RSI ${rsi.toFixed(0)} 과매도`); }
    else signalReason.push(`RSI ${rsi.toFixed(0)} 중립권`);
  }
  let signal = '중립';
  if (score >= 2) signal = '매수 우위';
  else if (score <= -2) signal = '매도 우위';

  return {
    current: cur, ma20, ma60, ma120, rsi,
    high: hi, low: lo, posInRange,
    chg1m, chg3m, trend, signal,
    signalReason: signalReason.join(', '),
  };
}

function buildPriceChartSVG(series, opts) {
  opts = opts || {};
  if (!series || series.length < 2) {
    return `<div style="padding:24px; text-align:center; color:var(--text-tertiary); font-size:11px;">차트 데이터를 불러올 수 없어요.<br>티커가 정확한지 확인하거나 시세 갱신을 눌러보세요.</div>`;
  }
  // 기간 필터 (최근 N일)
  let data = series.slice();
  if (opts.period && opts.period < data.length) {
    data = data.slice(-opts.period);
  }
  const W = 320, H = 140, VH = 36; // 차트 폭/높이, 거래량 영역 높이
  const pad = { l: 4, r: 4, t: 8, b: 4 };
  const closes = data.map(d => d.close);
  const vols = data.map(d => d.volume || 0);
  const minP = Math.min(...closes), maxP = Math.max(...closes);
  const maxV = Math.max(...vols, 1);
  const range = maxP - minP || 1;
  const cw = W - pad.l - pad.r;
  const ch = H - pad.t - pad.b - VH;

  const x = (i) => pad.l + (i / (data.length - 1)) * cw;
  const y = (p) => pad.t + (1 - (p - minP) / range) * ch;
  const vy = (v) => H - pad.b - (v / maxV) * VH;

  // 종가 선
  const linePts = data.map((d, i) => `${x(i).toFixed(1)},${y(d.close).toFixed(1)}`).join(' ');
  // 면적(그라데이션)
  const areaPts = `${pad.l},${(pad.t+ch).toFixed(1)} ${linePts} ${(pad.l+cw).toFixed(1)},${(pad.t+ch).toFixed(1)}`;
  // 거래량 막대
  const barW = Math.max(0.6, cw / data.length * 0.7);
  const volBars = data.map((d, i) =>
    `<rect x="${(x(i)-barW/2).toFixed(1)}" y="${vy(d.volume||0).toFixed(1)}" width="${barW.toFixed(1)}" height="${(H-pad.b-vy(d.volume||0)).toFixed(1)}" fill="var(--text-tertiary)" opacity="0.35"/>`
  ).join('');

  const up = closes[closes.length-1] >= closes[0];
  const lineColor = up ? '#E2483D' : '#3B7DE0'; // 한국식: 상승 빨강

  // 평단가 점선
  let buyLine = '';
  if (opts.buyPrice && opts.buyPrice >= minP && opts.buyPrice <= maxP) {
    const by = y(opts.buyPrice).toFixed(1);
    buyLine = `<line x1="${pad.l}" y1="${by}" x2="${pad.l+cw}" y2="${by}" stroke="var(--text-tertiary)" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="${pad.l+cw}" y="${(Number(by)-3)}" text-anchor="end" font-size="8" fill="var(--text-tertiary)">내 평단</text>`;
  }

  const first = data[0].date, last = data[data.length-1].date;
  const pctChange = ((closes[closes.length-1] - closes[0]) / closes[0] * 100);

  return `
    <div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%; height:auto; display:block;">
        <defs>
          <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="${lineColor}" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="${lineColor}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        ${volBars}
        <polygon points="${areaPts}" fill="url(#chartGrad)"/>
        <polyline points="${linePts}" fill="none" stroke="${lineColor}" stroke-width="1.6" stroke-linejoin="round"/>
        ${buyLine}
      </svg>
      <div style="display:flex; justify-content:space-between; font-size:9px; color:var(--text-tertiary); margin-top:2px;">
        <span>${first}</span>
        <span style="color:${up?'#E2483D':'#3B7DE0'}; font-weight:600;">${pctChange>=0?'+':''}${pctChange.toFixed(1)}% (기간)</span>
        <span>${last}</span>
      </div>
    </div>`;
}

// 🔧 종목 상세 카드 HTML 생성 (매입/평가/환차손익/보유기간)
function buildAssetDetailCard(a, live) {
  const isStock = isStockLikeType(a.type);
  const row = (label, mainVal, subVal) =>
    `<div style="flex:1;">
      <div style="font-size:10px; color:var(--text-tertiary); margin-bottom:2px;">${label}</div>
      <div style="font-size:13px; font-weight:700;">${mainVal}</div>
      ${subVal ? `<div style="font-size:10px; color:var(--text-tertiary);">${subVal}</div>` : ''}
    </div>`;

  let body = '';

  if (isStock && live?.hasLive) {
    // 시세가 있는 주식/ETF — 매입가/현재가/평가금액/환차손익
    const isUSD = live.currency === 'USD';
    const qty = Number(a.qty) || 0;
    const krwAvg = live.krwAvgPrice || 0;
    const krwNow = live.krwPrice || 0;
    const totalBuy = krwAvg * qty;
    const totalEval = live.krwValue || krwNow * qty;
    const profit = totalEval - totalBuy;
    const profitPct = totalBuy > 0 ? (profit / totalBuy) * 100 : 0;
    const pColor = profit >= 0 ? 'var(--text-danger)' : 'var(--text-info)';

    const usdAvg = isUSD && live.currentPrice && krwNow ? (krwAvg / krwNow * live.currentPrice) : null;

    const qtyDisp = Number.isInteger(qty) ? qty.toLocaleString() : qty.toFixed(4).replace(/\.?0+$/, '');
    body = `
      <div style="display:flex; gap:12px; margin-bottom:10px;">
        ${row('매입가', isUSD && usdAvg ? `$${usdAvg.toFixed(2)}` : `${Math.round(krwAvg).toLocaleString()}원`, isUSD ? `₩${Math.round(krwAvg).toLocaleString()}` : `${qtyDisp}주`)}
        ${row('총 매입금액', `${Math.round(totalBuy).toLocaleString()}원`, `${qtyDisp}주 보유`)}
      </div>
      <div style="display:flex; gap:12px; margin-bottom:10px;">
        ${row('현재가', isUSD ? `$${(live.currentPrice||0).toFixed(2)}` : `${Math.round(krwNow).toLocaleString()}원`, isUSD ? `₩${Math.round(krwNow).toLocaleString()}` : '')}
        ${row('총 평가금액', `${Math.round(totalEval).toLocaleString()}원`, '')}
      </div>
      <div style="display:flex; gap:12px; padding-top:8px; border-top:0.5px solid var(--border-tertiary);">
        <div style="flex:1;">
          <div style="font-size:10px; color:var(--text-tertiary); margin-bottom:2px;">평가손익</div>
          <div style="font-size:14px; font-weight:700; color:${pColor};">${profit >= 0 ? '+' : ''}${Math.round(profit).toLocaleString()}원</div>
          <div style="font-size:10px; color:${pColor};">${profit >= 0 ? '+' : ''}${profitPct.toFixed(2)}%</div>
        </div>
        ${a.avgBuyRate ? `<div style="flex:1;">
          <div style="font-size:10px; color:var(--text-tertiary); margin-bottom:2px;">매입환율</div>
          <div style="font-size:13px; font-weight:700;">$1 = ₩${Number(a.avgBuyRate).toLocaleString()}</div>
        </div>` : ''}
      </div>`;
  } else if (isStock) {
    // 시세 없는 주식 — 입력값만
    const qty = Number(a.qty) || 0;
    const p = Number(a.price) || 0;
    body = `
      <div style="display:flex; gap:12px;">
        ${row('보유 수량', `${qty}주`, '')}
        ${row('평균 매입가', `${p.toLocaleString()}원`, '')}
        ${row('총 매입금액', `${Math.round(qty*p).toLocaleString()}원`, '')}
      </div>
      <div style="font-size:10px; color:var(--text-tertiary); margin-top:8px;">티커를 입력하면 실시간 시세·수익률이 표시돼요.</div>`;
  } else {
    // 납입형 (청약·예적금 등)
    body = `
      <div style="display:flex; gap:12px;">
        ${row('현재 잔액', `${Number(a.price||0).toLocaleString()}원`, '')}
        ${a.type === '청약' && a.rounds ? row('납입 회차', `${a.rounds}회`, '') : ''}
        ${a.rate ? row('금리', `${a.rate}%`, '') : ''}
      </div>`;
  }

  // 보유기간 (가장 오래된 lot 기준)
  let holdInfo = '';
  const lots = a.lots || [];
  if (lots.length > 0) {
    const dates = lots.map(l => l.date).filter(Boolean).sort();
    if (dates.length > 0) {
      const first = new Date(dates[0] + 'T00:00:00');
      const days = Math.floor((Date.now() - first.getTime()) / 86400000);
      const y = Math.floor(days / 365);
      const m = Math.floor((days % 365) / 30);
      const d = (days % 365) % 30;
      const parts = [];
      if (y > 0) parts.push(`${y}년`);
      if (m > 0) parts.push(`${m}개월`);
      parts.push(`${d}일`);
      holdInfo = `🕐 ${parts.join(' ')} 보유 · 최초매수 ${dates[0]}`;
    }
  }

  // 평가금액 / 손익 헤더
  const v = live?.hasLive && live.krwValue ? live.krwValue : Number(a.qty) * Number(a.price);
  let headProfit = '';
  if (isStock && live?.hasLive) {
    const qty = Number(a.qty) || 0;
    const totalBuy = (live.krwAvgPrice || 0) * qty;
    const profit = v - totalBuy;
    const pct = totalBuy > 0 ? (profit / totalBuy * 100) : 0;
    const pColor = profit >= 0 ? 'var(--text-danger)' : 'var(--text-info)';
    headProfit = `<div style="font-size:13px; font-weight:600; color:${pColor}; margin-top:2px;">${profit >= 0 ? '+' : ''}${Math.round(profit).toLocaleString()}원 (${profit >= 0 ? '+' : ''}${pct.toFixed(2)}%)</div>`;
  }

  return `
    <div style="padding-bottom:20px;">
      <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
        <button onclick="closeAssetDetail()" style="border:none; background:var(--bg-secondary); width:34px; height:34px; border-radius:8px; font-size:16px; cursor:pointer; font-family:inherit;">←</button>
        <div style="flex:1; min-width:0;">
          <div style="font-size:16px; font-weight:700;">${a.name}</div>
          <div style="font-size:11px; color:var(--text-tertiary);">${a.type}${a.ticker ? ' · ' + a.ticker : ''}</div>
        </div>
      </div>

      <div style="padding:16px; background:var(--bg-secondary); border-radius:12px; margin-bottom:12px;">
        <div style="font-size:11px; color:var(--text-tertiary);">총 평가금액</div>
        <div style="font-size:24px; font-weight:800; margin-top:2px;">${Math.round(v).toLocaleString()}원</div>
        ${headProfit}
      </div>

      ${isStock && a.ticker ? `
      <div style="padding:14px; background:var(--bg-secondary); border-radius:12px; margin-bottom:12px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <span style="font-size:12px; font-weight:600;">📈 주가 차트</span>
          <div style="display:flex; gap:3px;" id="chart-period-${a.id}">
            <button onclick="setChartPeriod(${a.id},30)" class="chip" style="font-size:9px; padding:3px 7px;">1M</button>
            <button onclick="setChartPeriod(${a.id},90)" class="chip" style="font-size:9px; padding:3px 7px;">3M</button>
            <button onclick="setChartPeriod(${a.id},180)" class="chip active" style="font-size:9px; padding:3px 7px;">6M</button>
            <button onclick="setChartPeriod(${a.id},365)" class="chip" style="font-size:9px; padding:3px 7px;">1Y</button>
          </div>
        </div>
        <div id="asset-chart-${a.id}">
          <div style="padding:24px; text-align:center; color:var(--text-tertiary); font-size:11px;">
            <div class="spinner" style="margin:0 auto 8px;"></div>차트 불러오는 중...
          </div>
        </div>
      </div>
      ` : ''}

      <div style="padding:14px; background:var(--bg-secondary); border-radius:12px;">
        ${body}
        ${holdInfo ? `<div style="font-size:10px; color:var(--text-tertiary); margin-top:12px; padding-top:10px; border-top:0.5px solid var(--border-tertiary);">${holdInfo}</div>` : ''}
      </div>

      <div style="display:flex; gap:8px; margin-top:12px;">
        <button onclick="editAsset(${a.id})" style="flex:1; border:none; background:var(--accent-primary, #5E5CE6); color:white; padding:12px; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; font-family:inherit;">✏️ 수정</button>
        ${a.ticker ? `<button onclick="manualRefreshAssetPrices()" style="flex:1; border:none; background:var(--bg-tertiary); color:var(--text-secondary); padding:12px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;">🔄 시세 갱신</button>` : ''}
      </div>
      ${isStock ? `
      <button onclick="openSellSimulator(${a.id})" style="width:100%; margin-top:8px; border:none; background:var(--bg-secondary); color:var(--text-secondary); padding:12px; border-radius:10px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;">💰 매도 시 실수령액 계산하기</button>
      ` : ''}
    </div>`;
}

// 🔧 종목 차트 비동기 로드 — 상세 화면 진입 시 호출
async function loadAssetChart(assetId, period) {
  const a = assets.find(x => x.id === assetId);
  if (!a || !a.ticker) return;
  const container = document.getElementById(`asset-chart-${assetId}`);
  if (!container) return;

  period = period || window._chartPeriod || 180;
  window._chartPeriod = period;

  try {
    let t = a.ticker.trim();
    if (/^\d{6}$/.test(t)) t = t + '.KS';
    // 캐시에 시계열 있으면 바로, 없으면 fetch
    let cached = histPriceCache[t];
    if (!cached || !cached.series) {
      await fetchYahooHistorical(t);
      cached = histPriceCache[t];
    }
    if (!cached || !cached.series || cached.series.length < 2) {
      container.innerHTML = `<div style="padding:20px; text-align:center; color:var(--text-tertiary); font-size:11px;">차트 데이터를 불러올 수 없어요.<br>티커가 정확한지 확인해주세요.</div>`;
      return;
    }
    // 평단가(원화) — 차트가 원화 종목이면 표시
    const live = liveAssetData[a.id];
    const isKRW = !(live && live.currency === 'USD');
    const buyPrice = isKRW ? (live?.krwAvgPrice || Number(a.price)) : null;
    container.innerHTML = buildPriceChartSVG(cached.series, { period, buyPrice });
  } catch (e) {
    console.warn('차트 로드 실패', e);
    container.innerHTML = `<div style="padding:20px; text-align:center; color:var(--text-tertiary); font-size:11px;">차트를 불러오지 못했어요.</div>`;
  }
}

function setChartPeriod(assetId, period) {
  window._chartPeriod = period;
  // 기간 버튼 active 갱신
  const wrap = document.getElementById(`chart-period-${assetId}`);
  if (wrap) {
    wrap.querySelectorAll('.chip').forEach(b => {
      const isThis = b.getAttribute('onclick').includes(`,${period})`);
      b.classList.toggle('active', isThis);
    });
  }
  loadAssetChart(assetId, period);
}

// 🔧 자산 신뢰도 분류 — 어느 자산이 어떤 출처로 평가됐는지 표시
//    (평가금액 박제 안 함. 라벨로만 신뢰 수준을 보여줌)
function getAssetReliability(asset) {
  // 캡처로 보정한 lot이 있고 자동매수도 있음 → 자동매수가 캡처 이후 또 들어왔으면 다시 보정 필요할 수 있음
  const lots = asset.lots || [];
  const hasAutoBuy = lots.some(l => l.autoBuy);
  const captureLots = lots.filter(l => l.source && l.source.includes('캡처 보정'));
  const hasCapture = captureLots.length > 0;

  if (hasCapture && hasAutoBuy) {
    // 마지막 캡처 이후 자동매수 회차가 더 들어왔는지 확인
    const lastCaptureDate = captureLots
      .map(l => l.date || '')
      .filter(Boolean)
      .sort()
      .pop() || '';
    const newerAutoBuy = lots.some(l => l.autoBuy && (l.date || '') > lastCaptureDate);
    if (newerAutoBuy) {
      return { key:'needs', text:'보정 권장', color:'var(--text-warning)' };
    }
    return { key:'broker', text:'증권사 보정됨', color:'var(--text-danger)' };
  }
  if (hasCapture) {
    return { key:'broker', text:'증권사 보정됨', color:'var(--text-danger)' };
  }
  if (hasAutoBuy) {
    return { key:'needs', text:'보정 권장', color:'var(--text-warning)' };
  }
  const live = liveAssetData?.[asset.id];
  if (live?.hasLive) {
    return { key:'live', text:'실시간 시세', color:'var(--text-info)' };
  }
  return { key:'manual', text:'수동 입력', color:'var(--text-secondary)' };
}

// 🔧 자산 위쪽에 표시할 신뢰도 요약 막대 — 어느 비중이 정확/부정확한지 한눈에
// 🔧 주식류(개별주+ETF+펀드) 전체를 합쳐서 종목별 비중을 한 막대로 표시
function renderStockDistributionBar() {
  const stockAssets = assets.filter(a => isStockLikeType(a.type));
  if (stockAssets.length < 2) return ''; // 2개 미만이면 의미 없음

  const items = stockAssets.map(a => {
    const lv = liveAssetData[a.id];
    const v = lv?.hasLive && lv.krwValue ? lv.krwValue : Number(a.qty) * Number(a.price);
    return { name: a.name, type: a.type, value: v };
  }).filter(x => x.value > 0).sort((x, y) => y.value - x.value);

  const stockTotal = items.reduce((s, x) => s + x.value, 0);
  if (stockTotal <= 0) return '';

  const palette = ['#5B8DEF','#A78BFA','#7BC8B5','#F6C76D','#FF8E72','#54A0FF','#FB7185','#34D399','#FBBF24','#9CD3A5','#C4A0F5','#85D4D6'];
  const segs = items.map((x, i) => ({ ...x, pct: x.value / stockTotal * 100, color: palette[i % palette.length] }));

  return `
    <div style="padding:12px 14px; background:var(--bg-secondary); border-radius:12px; margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:11px; font-weight:700; color:var(--text-secondary);">📊 주식 종목 분포 <span style="font-size:9px; color:var(--text-tertiary); font-weight:500;">(개별주+ETF+펀드)</span></span>
        <span style="font-size:10px; color:var(--text-tertiary);">${Math.round(stockTotal).toLocaleString()}원</span>
      </div>
      <div style="display:flex; height:10px; border-radius:999px; overflow:hidden; background:rgba(0,0,0,0.05); margin-bottom:8px;">
        ${segs.map(s => `<div style="width:${Math.max(0.5, s.pct)}%; background:${s.color};" title="${escapeAttr(s.name)} ${s.pct.toFixed(1)}%"></div>`).join('')}
      </div>
      <div style="display:flex; flex-direction:column; gap:4px;">
        ${segs.map(s => `
          <div style="display:flex; align-items:center; justify-content:space-between; font-size:11px;">
            <span style="display:flex; align-items:center; gap:6px; min-width:0;">
              <span style="width:8px; height:8px; border-radius:2px; background:${s.color}; flex:0 0 auto;"></span>
              <span style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHTML(s.name)}</span>
              <span style="font-size:8px; color:var(--text-tertiary); flex:0 0 auto;">${escapeHTML(s.type)}</span>
            </span>
            <span style="font-weight:600; flex:0 0 auto; margin-left:8px;">${s.pct.toFixed(1)}%</span>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function renderAssetReliabilitySummary(total) {
  if (!assets || assets.length === 0 || total <= 0) return '';
  const bucket = { broker:0, live:0, manual:0, needs:0 };
  assets.forEach(a => {
    const r = getAssetReliability(a).key;
    // 평가금액 — 라이브 있으면 라이브, 없으면 qty*price
    const live = liveAssetData?.[a.id];
    const v = (live?.hasLive && Number(live.krwValue) > 0)
      ? Number(live.krwValue)
      : (Number(a.qty) || 0) * (Number(a.price) || 0);
    bucket[r] += v;
  });
  const rows = [
    ['broker','증권사 보정','var(--text-danger)'],
    ['live','실시간','var(--text-info)'],
    ['manual','수동','var(--text-secondary)'],
    ['needs','보정 권장','var(--text-warning)'],
  ].filter(([k]) => bucket[k] > 0);
  if (rows.length === 0) return '';
  return `
    <div style="padding:10px 12px; background:var(--bg-secondary); border-radius:10px; margin-bottom:12px;">
      <div style="font-size:10px; font-weight:600; margin-bottom:6px; color:var(--text-secondary);">🔎 자산 신뢰도</div>
      <div style="display:flex; gap:3px; height:6px; border-radius:999px; overflow:hidden; background:rgba(0,0,0,0.05); margin-bottom:6px;">
        ${rows.map(([k,,c]) => `<div style="width:${Math.max(3, bucket[k]/total*100)}%; background:${c};"></div>`).join('')}
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:8px; font-size:9px; color:var(--text-secondary);">
        ${rows.map(([k,label,c]) => `<span><b style="color:${c};">●</b> ${label} ${Math.round(bucket[k]/total*100)}%</span>`).join('')}
      </div>
    </div>`;
}

function renderAsset() {
  runAllAutoBuys(); // 자동매수 점검 (시세 알면 정확히 처리)

  // 🔧 자산 탭 진입 시 시세 자동 갱신 — LIVE 안 뜨는 자산이 있거나 5분 지났으면
  //    (수동 새로고침 안 눌러도 국내·해외 모두 시세가 걸리게)
  (function autoRefreshOnEnter() {
    if (window._assetRefreshInFlight) return; // 갱신 중이면 중복 방지
    const stockAssets = assets.filter(a => isStockLikeType(a.type) && (a.ticker || guessKRTicker(a.name)));
    if (stockAssets.length === 0) return;
    const anyMissing = stockAssets.some(a => !liveAssetData[a.id] || !liveAssetData[a.id].hasLive);
    const stale = !window._lastAutoAssetRefresh || (Date.now() - window._lastAutoAssetRefresh > 5 * 60 * 1000);
    if (anyMissing || stale) {
      window._lastAutoAssetRefresh = Date.now();
      window._assetRefreshInFlight = true;
      refreshAllAssetPrices().then(() => {
        window._assetRefreshInFlight = false;
        if (currentTab === 'asset') renderAsset();
      }).catch(() => { window._assetRefreshInFlight = false; });
    }
  })();

  header.innerHTML = `
    <h1>자산</h1>
    <div class="header-actions">
      <button onclick="manualRefreshPrices()" aria-label="새로고침" id="refresh-btn"><i class="ti ti-refresh"></i></button>
      <button onclick="openAssetCoachSettings()" aria-label="AI 자산 코치 설정"><i class="ti ti-target"></i></button>
      <button onclick="openAssetAddModal()" aria-label="추가"><i class="ti ti-plus"></i></button>
    </div>
  `;

  // 🔧 종목 상세 화면은 시장지수·자산추이·도넛 등을 건너뛰고 바로 상세만 표시
  //    (스크롤 내려야 정보 보이던 문제 해결)
  if (assetTab === 'holdings' && window._assetDetailId) {
    const detailAsset = assets.find(a => a.id === window._assetDetailId);
    if (detailAsset) {
      screen.innerHTML = buildAssetDetailCard(detailAsset, liveAssetData[detailAsset.id]);
      if (isStockLikeType(detailAsset.type) && detailAsset.ticker) {
        setTimeout(() => loadAssetChart(detailAsset.id, window._chartPeriod || 180), 60);
      }
      return;
    }
  }

  // 라이브 시세 반영해서 자산별 평가금액 계산
  const total = assets.reduce((s, a) => {
    const live = liveAssetData[a.id];
    if (live?.hasLive && live.krwValue) {
      return s + live.krwValue;
    }
    return s + (Number(a.qty) * Number(a.price));
  }, 0);

  const byType = {};
  assets.forEach(a => {
    const live = liveAssetData[a.id];
    const v = live?.hasLive && live.krwValue
      ? live.krwValue
      : Number(a.qty) * Number(a.price);
    byType[a.type] = (byType[a.type] || 0) + v;
  });

  // 이번 달 자산 스냅샷 자동 저장
  saveAssetSnapshot(total, byType);

  const typeColors = {
    '국내주식':'#8AB4F8',  // 파스텔 파랑
    '미국주식':'#5B8DEF',  // 진한 파랑
    '주식':'#8AB4F8',      // (구버전 호환)
    '국내ETF':'#A78BFA',   // 파스텔 보라
    '해외ETF':'#C4A0F5',   // 연보라
    'ETF':'#A78BFA',       // (구버전 호환)
    '펀드':'#7BC8B5',      // 파스텔 청록
    '채권':'#9CD3A5',      // 파스텔 초록
    '금':'#F6C76D',        // 파스텔 골드
    '달러':'#85D4D6',      // 파스텔 시안
    '예적금':'#A8E6CF',    // 파스텔 민트
    '청약':'#FFC9A8',      // 파스텔 살구
    '현금':'#C9C5D9',      // 파스텔 그레이
    '부동산':'#F6A8A8',  // 파스텔 핑크
    '코인':'#FFD66E',    // 파스텔 옐로
    '기타':'#D5D5D5',    // 라이트 그레이
  };

  let html = '';

  // 시장 지수 카드 (라이브)
  html += `<div id="market-indices" style="margin-bottom:14px;"></div>`;

  // 자산 변화 추이 (월별 스냅샷)
  html += renderAssetTrendCard();

  // 자산 비중 도넛 차트
  if (total > 0) {
    const size = 180;
    const cx = size / 2;
    const cy = size / 2;
    const r = 68;
    const strokeWidth = 28;
    const circumference = 2 * Math.PI * r;

    let cumPct = 0;
    let segments = '';
    const entries = Object.entries(byType);
    entries.forEach(([type, val]) => {
      const pct = val / total;
      const dashLength = circumference * pct;
      const dashOffset = circumference - dashLength;
      const rotation = cumPct * 360;
      segments += `<circle
        cx="${cx}" cy="${cy}" r="${r}"
        fill="none"
        stroke="${typeColors[type] || 'var(--text-tertiary)'}"
        stroke-width="${strokeWidth}"
        stroke-dasharray="${dashLength} ${circumference}"
        transform="rotate(${rotation - 90} ${cx} ${cy})"
      />`;
      cumPct += pct;
    });

    html += `
      <div style="display:flex; align-items:center; gap:16px; margin: 14px 0 8px;">
        <div style="position:relative; width:${size}px; height:${size}px; flex-shrink:0;">
          <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
            ${segments}
          </svg>
          <div style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:none;">
            <div style="font-size:10px; color:var(--text-tertiary);">총 자산</div>
            <div style="font-size:16px; font-weight:600; margin-top:2px;">${total >= 100000000 ? (total/100000000).toFixed(1)+'억' : (total/10000).toFixed(0)+'만'}</div>
            <div style="font-size:9px; color:var(--text-tertiary); margin-top:1px;">${total.toLocaleString()}원</div>
          </div>
        </div>
        <div style="flex:1; min-width:0;">
          ${entries.map(([type, val]) => {
            const pct = Math.round((val/total)*100);
            return `<div style="display:flex; align-items:center; gap:8px; padding:4px 0;">
              <span style="width:10px; height:10px; border-radius:2px; background:${typeColors[type] || 'var(--text-tertiary)'}; flex-shrink:0;"></span>
              <div style="flex:1; min-width:0;">
                <div style="font-size:12px; font-weight:500;">${type}</div>
                <div style="font-size:10px; color:var(--text-tertiary);">${val.toLocaleString()}원</div>
              </div>
              <div style="font-size:13px; font-weight:600;">${pct}%</div>
            </div>`;
          }).join('')}
        </div>
      </div>
    `;
  } else {
    html += `
      <div style="margin: 6px 0 12px;">
        <div style="font-size:11px; color:var(--text-tertiary);">총 자산</div>
        <div style="font-size:26px; font-weight:600;">0원</div>
      </div>
    `;
  }

  // ★ AI 코칭 카드
  html += renderAICoaching(total, byType);

  // 🎯 재무 목표 카드들 (자산 페이지 상단 - 항상 보임)
  html += renderFinancialGoalsCard(total);

  // 탭
  const tabs = [
    { id:'holdings', label:'보유' },
    { id:'plan',     label:'플랜' },
    { id:'analysis', label:'🔍 AI분석' },
    { id:'market',   label:'시장·뉴스' },
    { id:'youtube',  label:'유튜브' },
  ];
  html += `<div style="display:flex; gap:4px; margin-bottom:14px; border-bottom:0.5px solid var(--border-tertiary); padding-bottom:6px; overflow-x:auto;">`;
  tabs.forEach(t => {
    const active = assetTab === t.id;
    html += `<button onclick="switchAssetTab('${t.id}')" style="flex:1; min-width:64px; padding:10px 4px; border:none; background:transparent; color:${active?'var(--text-primary)':'var(--text-tertiary)'}; font-size:13px; font-weight:${active?'600':'400'}; cursor:pointer; border-bottom:2px solid ${active?'var(--text-info)':'transparent'}; margin-bottom:-7px; font-family:inherit;">${t.label}</button>`;
  });
  html += `</div>`;

  if (assetTab === 'holdings') {
    if (assets.length === 0) {
      html += `<div class="empty-state"><i class="ti ti-chart-pie"></i>등록된 자산이 없어요<br><span style="font-size:11px; opacity:0.7;">+ 버튼으로 자산을 추가하세요</span>
        <div style="margin-top:14px;">
          <button onclick="openAssetAddModal()" style="padding:10px 20px; border:none; border-radius:8px; background:var(--bg-info); color:var(--text-info); font-size:13px; font-weight:600; cursor:pointer; font-family:inherit;">+ 자산 추가</button>
        </div>
      </div>`;
    } else {
      // 🔧 자산 신뢰도 요약 (어느 비중이 정확/부정확한지 한눈에)
      html += renderAssetReliabilitySummary(total);

      // 🔧 주식 종목 분포 (개별주+ETF+펀드 통합 막대바)
      html += renderStockDistributionBar();

      const editing = !!window._assetEditMode;
      html += `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <span style="font-size:12px; color:var(--text-secondary);">${assets.length}개 자산</span>
        <div style="display:flex; align-items:center; gap:6px;">
          ${editing ? `
            <button onclick="toggleAssetEditMode()" style="border:none; background:var(--bg-secondary); color:var(--text-secondary); padding:5px 12px; border-radius:999px; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit;">완료</button>
          ` : `
            <button onclick="toggleAssetEditMode()" style="border:none; background:var(--bg-secondary); color:var(--text-secondary); padding:5px 10px; border-radius:999px; font-size:11px; cursor:pointer; font-family:inherit;">✏️ 편집</button>
            <button onclick="manualRefreshAssetPrices()" style="border:none; background:var(--bg-secondary); color:var(--text-secondary); padding:5px 10px; border-radius:999px; font-size:11px; cursor:pointer; font-family:inherit;" title="시세 갱신">🔄 시세</button>
            <button onclick="openAssetAddModal()" style="border:none; background:var(--bg-info); color:var(--text-info); padding:5px 12px; border-radius:999px; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit;">+ 추가</button>
          `}
        </div>
      </div>`;

      // 🔧 보정 권유 배너 — 자동매수 자산 중 오래 보정 안 한 게 있으면 부드럽게 안내
      (() => {
        const todayMs = Date.now();
        const DAY = 86400000;
        let needCorrect = [];
        assets.forEach(a => {
          const lots = a.lots || [];
          if (!lots.some(l => l.autoBuy)) return; // 자동매수 자산만
          const snapDate = a.ocrSnapshot?.date;
          if (!snapDate) {
            // 한 번도 보정 안 함
            needCorrect.push({ name: a.name, days: null });
          } else {
            const days = Math.floor((todayMs - new Date(snapDate + 'T00:00:00').getTime()) / DAY);
            if (days >= 30) needCorrect.push({ name: a.name, days });
          }
        });
        if (needCorrect.length === 0) return;
        const neverCount = needCorrect.filter(x => x.days === null).length;
        const oldCount = needCorrect.length - neverCount;
        let msg = '';
        if (neverCount > 0) msg += `자동매수 자산 ${neverCount}개가 아직 증권사와 안 맞춰졌어요.`;
        if (oldCount > 0) msg += (msg ? ' ' : '') + `${oldCount}개는 보정한 지 한 달이 넘었어요.`;
        html += `
          <div style="padding:11px 13px; background:var(--bg-warning); border-radius:10px; margin-bottom:10px; line-height:1.6;">
            <div style="font-size:11px; color:var(--text-warning); font-weight:600; margin-bottom:3px;">💡 수익률을 정확하게 — 캡처 보정</div>
            <div style="font-size:10px; color:var(--text-warning);">
              ${msg}<br>증권사 잔고 화면을 캡처해서 올리면 그 시점 수익률이 정확해져요. (한 달에 한 번이면 충분)
            </div>
            <button onclick="openAssetCaptureForCorrection()" style="margin-top:8px; width:100%; border:none; background:var(--text-warning); color:white; padding:8px; border-radius:7px; font-size:11px; font-weight:700; cursor:pointer; font-family:inherit;">📸 증권사 잔고 캡처로 보정하기</button>
          </div>`;
      })();

      // 편집 모드: 선택 액션 바
      if (editing) {
        const selCount = (window._assetSelected || []).length;
        html += `<div style="display:flex; gap:6px; margin-bottom:10px; padding:8px; background:var(--bg-secondary); border-radius:8px;">
          <span style="flex:1; font-size:11px; color:var(--text-secondary); align-self:center;">${selCount}개 선택됨</span>
          <button onclick="mergeSelectedAssets()" style="border:none; background:${selCount >= 2 ? 'var(--bg-info)' : 'var(--bg-tertiary)'}; color:${selCount >= 2 ? 'var(--text-info)' : 'var(--text-tertiary)'}; padding:6px 12px; border-radius:6px; font-size:11px; font-weight:600; cursor:${selCount >= 2 ? 'pointer' : 'default'}; font-family:inherit;">🔗 합치기</button>
          <button onclick="deleteSelectedAssets()" style="border:none; background:${selCount >= 1 ? 'var(--bg-danger)' : 'var(--bg-tertiary)'}; color:${selCount >= 1 ? 'var(--text-danger)' : 'var(--text-tertiary)'}; padding:6px 12px; border-radius:6px; font-size:11px; font-weight:600; cursor:${selCount >= 1 ? 'pointer' : 'default'}; font-family:inherit;">🗑️ 삭제</button>
        </div>`;
      }

      // 🔧 자산을 종류별로 그룹핑해서 표시 (청약·주식·ETF 섞이지 않게)
      const GROUP_ORDER = ASSET_TYPES;
      const GROUP_ICON = { '국내주식':'📈','미국주식':'🇺🇸','주식':'📈','국내ETF':'📊','해외ETF':'🌐','ETF':'📊','펀드':'🧺','채권':'📜','금':'🪙','달러':'💵','예적금':'🏦','청약':'🏠','현금':'💴','부동산':'🏢' };
      // 원본 인덱스 보존하며 그룹 구성
      const groups = {};
      assets.forEach((a, idx) => {
        const t = a.type || '기타';
        if (!groups[t]) groups[t] = [];
        groups[t].push({ a, idx });
      });
      const groupKeys = Object.keys(groups).sort((x, y) => {
        const ix = GROUP_ORDER.indexOf(x), iy = GROUP_ORDER.indexOf(y);
        return (ix < 0 ? 99 : ix) - (iy < 0 ? 99 : iy);
      });

      groupKeys.forEach(gKey => {
        const groupItems = groups[gKey];
        // 그룹 합계
        const groupTotal = groupItems.reduce((s, { a }) => {
          const lv = liveAssetData[a.id];
          return s + (lv?.hasLive && lv.krwValue ? lv.krwValue : Number(a.qty) * Number(a.price));
        }, 0);
        const groupPct = total > 0 ? (groupTotal / total * 100) : 0;
        // 그룹 헤더
        html += `
          <div style="display:flex; align-items:center; justify-content:space-between; margin:14px 2px 6px;">
            <div style="font-size:12px; font-weight:700; color:var(--text-secondary);">
              ${GROUP_ICON[gKey] || '📦'} ${gKey} <span style="font-size:10px; color:var(--text-tertiary); font-weight:500;">${groupItems.length}개</span>
            </div>
            <div style="font-size:11px; color:var(--text-tertiary);">
              ${Math.round(groupTotal).toLocaleString()}원 · ${groupPct.toFixed(0)}%
            </div>
          </div>`;

        groupItems.forEach(({ a, idx: assetIdx }) => {
        const live = liveAssetData[a.id];
        const v = live?.hasLive && live.krwValue ? live.krwValue : Number(a.qty) * Number(a.price);
        const badge = a.type[0];

        let priceInfo = '';
        if (a.ticker && !live) {
          priceInfo = `<div style="font-size:10px; color:var(--text-tertiary);">시세 불러오는 중...</div>`;
        } else if (live?.hasLive) {
          const changePct = live.changePct;
          const profitPct = live.profitPct;
          const changeColor = changePct >= 0 ? 'var(--text-danger)' : 'var(--text-info)';
          const profitColor = profitPct >= 0 ? 'var(--text-danger)' : 'var(--text-info)';
          // 수익률이 -90% 이하 또는 +500% 이상이면 평단가 입력 오류로 간주 → 표시 X
          const showProfit = profitPct > -90 && profitPct < 500;
          // 달러 단가인데 평균 매입 환율이 없으면 → 환차손익 빠진 수익률 (안내)
          const fxWarn = live.fxRateMissing
            ? `<span style="color:var(--text-warning); font-size:9px;" title="평균 매입 환율 미입력 — 환차손익이 빠져 증권사 수익률과 다를 수 있어요. 자산 수정에서 입력하세요.">⚠️ 환율</span>`
            : '';
          // 🔧 자동매수 lot이 있는데 보정(OCR/회차수정)이 한 번도 안 됐으면 → 추정치 표시
          const _lots = a.lots || [];
          const _hasAuto = _lots.some(l => l.autoBuy);
          const _isCorrected = !!a.ocrSnapshot || _lots.some(l => l.exactAmount != null && Number(l.exactAmount) > 0);
          const estTag = (_hasAuto && !_isCorrected)
            ? `<span onclick="event.stopPropagation(); openAssetCaptureForCorrection();" style="color:var(--text-tertiary); font-size:9px; cursor:pointer; text-decoration:underline dotted;" title="자동매수 추정치예요. 탭하면 증권사 캡처로 보정할 수 있어요.">≈추정</span>`
            : '';
          // 🔧 보유 수량 표시 (정수면 그대로, 소수면 4자리)
          const qtyStr = Number.isInteger(Number(a.qty))
            ? Number(a.qty).toLocaleString()
            : Number(a.qty).toFixed(4).replace(/\.?0+$/, '');
          priceInfo = `<div style="font-size:10px; display:flex; gap:8px; justify-content:flex-end; margin-top:2px; flex-wrap:wrap;">
            <span style="color:var(--text-secondary);">${qtyStr}주</span>
            <span style="color:${changeColor};">오늘 ${changePct >= 0 ? '▲' : '▼'}${Math.abs(changePct).toFixed(2)}%</span>
            ${showProfit ? `<span style="color:${profitColor};">수익 ${profitPct >= 0 ? '+' : ''}${profitPct.toFixed(1)}%</span>` : `<span style="color:var(--text-tertiary);" title="평단가 확인 필요">수익 -</span>`}
            ${estTag}
            ${fxWarn}
          </div>`;
        } else if (live?.error) {
          const qtyStr = Number.isInteger(Number(a.qty)) ? Number(a.qty).toLocaleString() : Number(a.qty).toFixed(4).replace(/\.?0+$/, '');
          priceInfo = `<div style="font-size:10px; display:flex; gap:8px; justify-content:flex-end; margin-top:2px; flex-wrap:wrap;">
            <span style="color:var(--text-secondary);">${qtyStr}주</span>
            <span onclick="event.stopPropagation(); manualRefreshAssetPrices();" style="color:var(--text-info); cursor:pointer; text-decoration:underline;">시세 새로고침 ↻</span>
          </div>`;
        } else if (a.qty && Number(a.qty) > 0 && Number(a.qty) !== 1) {
          // 소수점 매매 지원 - 정수면 그대로, 소수면 최대 4자리
          const qtyStr = Number.isInteger(Number(a.qty))
            ? Number(a.qty).toLocaleString()
            : Number(a.qty).toFixed(4).replace(/\.?0+$/, ''); // 0.5000 → 0.5
          // 🔧 티커가 있는데 시세가 아직 없으면 → 보유수량 + 시세 유도 (단순 N주×단가 대신)
          if (a.ticker) {
            priceInfo = `<div style="font-size:10px; display:flex; gap:8px; justify-content:flex-end; margin-top:2px; flex-wrap:wrap;">
              <span style="color:var(--text-secondary);">${qtyStr}주</span>
              <span onclick="event.stopPropagation(); manualRefreshAssetPrices();" style="color:var(--text-info); cursor:pointer; text-decoration:underline;">시세 새로고침 ↻</span>
            </div>`;
          } else {
            priceInfo = `<div style="font-size:10px; color:var(--text-tertiary);">${qtyStr}주 × ${Number(a.price).toLocaleString()}</div>`;
          }
        }

        const liveBadge = a.ticker
          ? `<span style="font-size:9px; padding:2px 5px; border-radius:3px; background:var(--bg-success); color:var(--text-success); margin-left:6px;">LIVE</span>`
          : '';

        // 자동매수 + 환전우대 표시
        let extraInfo = '';
        const _nT = (t) => (t || '').toUpperCase().replace(/\.(KS|KQ|KQI)$/, '').trim();
        const aTk = _nT(a.ticker);
        const linkedFx = (budget.fixed || []).find(f => {
          if (!f.autoBuy || !f.assetInfo) return false;
          const fTk = _nT(f.assetInfo.ticker);
          return (fTk && aTk && fTk === aTk) ||
                 (f.assetInfo.name === a.name && f.assetInfo.type === a.type);
        });
        if (linkedFx) {
          const cy = linkedFx.cycle === 'monthly' ? '매월' : linkedFx.cycle === 'weekly' ? '매주' : '격주';
          extraInfo += `<span style="font-size:9px; color:#5E5CE6; margin-right:6px;">🤖 자동매수: ${cy} ${linkedFx.amt.toLocaleString()}원</span>`;
        }
        if (a.fxDiscount) {
          extraInfo += `<span style="font-size:9px; color:var(--text-success);">💱 환전우대 ${a.fxDiscount}%</span>`;
        }

        const editing = !!window._assetEditMode;
        const isSel = (window._assetSelected || []).includes(assetIdx);

        html += `<div class="hold-row" onclick="${editing ? `toggleAssetSelect(${assetIdx})` : `openAssetDetail(${a.id})`}" style="${editing && isSel ? 'background:var(--bg-info);' : ''}">
          ${editing ? `<div style="width:22px; height:22px; border-radius:6px; border:2px solid ${isSel ? 'var(--text-info)' : 'var(--border-tertiary)'}; background:${isSel ? 'var(--text-info)' : 'transparent'}; display:flex; align-items:center; justify-content:center; flex-shrink:0; color:white; font-size:13px;">${isSel ? '✓' : ''}</div>` : ''}
          <div style="width:38px; height:38px; border-radius:8px; background:var(--bg-secondary); color:var(--text-primary); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600;">${badge}</div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:14px; font-weight:500;">${a.name}${liveBadge}</div>
            <div style="font-size:11px; color:var(--text-tertiary); margin-top:2px;">${a.type}${a.ticker ? ' · ' + a.ticker : ''}${a.note ? ' · ' + a.note : ''}</div>
            ${extraInfo ? `<div style="margin-top:3px;">${extraInfo}</div>` : ''}
          </div>
          <div style="text-align:right;">
            <div style="font-size:14px; font-weight:600;">${Math.round(v).toLocaleString()}원</div>
            ${groupItems.length > 1 && groupTotal > 0 ? `<div style="font-size:9px; color:var(--text-tertiary); margin-top:1px;">${gKey} 내 ${(v / groupTotal * 100).toFixed(0)}%</div>` : ''}
            ${priceInfo}
          </div>
          ${!editing ? `<div style="margin-left:6px; color:var(--text-tertiary); font-size:13px; align-self:center;">›</div>` : ''}
        </div>`;
        }); // groupItems.forEach
      }); // groupKeys.forEach
    }
  } else if (assetTab === 'plan') {
    html += renderAssetPlan(total, byType);
  } else if (assetTab === 'analysis') {
    html += renderAssetAnalysis();
  } else if (assetTab === 'market') {
    html += renderAssetMarket(total, byType);
  } else if (assetTab === 'youtube') {
    html += renderAssetYoutube();
  }

  screen.innerHTML = html;

  // 시장 지수 로드
  loadMarketIndices();

  // 시장·뉴스 통합 탭 — RSS + AI 뉴스요약 + AI 시장 브리핑 모두 로드
  if (assetTab === 'market') {
    setTimeout(() => loadFearGreedGauge(), 30);
    setTimeout(() => loadNewsRSS(), 50);
    setTimeout(() => loadAINewsSummary(), 100);
    setTimeout(async () => { await loadAIBriefing(false); }, 150);
  }

  // 플랜 탭이면 AI 액션 호출
  if (assetTab === 'plan') {
    setTimeout(() => loadAIActionAdvice(), 100);
  }

  // 자산 시세 자동 갱신 (보유 탭에 있을 때만, 5분에 한 번)
  if (assetTab === 'holdings' && assets.some(a => a.ticker)) {
    const lastRefresh = window._lastAssetRefresh || 0;
    const fiveMin = 5 * 60 * 1000;
    if (Date.now() - lastRefresh > fiveMin) {
      window._lastAssetRefresh = Date.now();
      refreshAllAssetPrices().then(() => {
        if (assetTab === 'holdings') renderAsset();
      });
    }
  }

  // 유튜브 탭이면 영상 자동 로드
  if (assetTab === 'youtube') {
    setTimeout(() => loadVideosInto('yt-results', currentAssetYtQuery, 10, currentAssetYtOrder), 50);
  }
}

// 자산 스냅샷 - 매달 첫 자산 페이지 방문시 저장
function saveAssetSnapshot(total, byType) {
  if (!total || total <= 0) return;
  if (!settings.assetSnapshots) settings.assetSnapshots = {};

  const now = new Date();
  const key = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  // 이번 달 스냅샷 - 항상 최신 값으로 덮어쓰기 (오늘 본 시세)
  settings.assetSnapshots[key] = {
    total: Math.round(total),
    byType: Object.fromEntries(Object.entries(byType).map(([k,v]) => [k, Math.round(v)])),
    date: now.toISOString(),
  };
  saveData();
}

// 자산 변화 그래프 - SVG 라인 그래프
// 🎯 재무 목표 카드 - 자산 페이지 상단
function renderFinancialGoalsCard(currentTotal) {
  const goals = settings.financialGoals || [];

  // 한국식 금액 포맷 (1억 5,000만 같이)
  const formatKoreanMoney = (amt) => {
    const num = Math.round(Number(amt) || 0);
    if (num >= 100000000) {
      const eok = Math.floor(num / 100000000);
      const man = Math.floor((num % 100000000) / 10000);
      if (man > 0) return `${eok}억 ${man.toLocaleString()}만`;
      return `${eok}억`;
    } else if (num >= 10000) {
      const man = Math.floor(num / 10000);
      const won = num % 10000;
      if (won > 0 && man < 10) return `${man.toLocaleString()}만 ${won.toLocaleString()}`;
      return `${man.toLocaleString()}만`;
    } else {
      return `${num.toLocaleString()}원`;
    }
  };

  if (goals.length === 0) {
    return `
      <div style="background:linear-gradient(135deg, #FFF7E6 0%, #FFEFD5 100%); border:0.5px solid #F4A261; border-radius:14px; padding:14px; margin-bottom:14px; text-align:center;">
        <div style="font-size:13px; font-weight:600; color:#B45309; margin-bottom:6px;">🎯 재무 목표</div>
        <div style="font-size:11px; color:#8B5A1A; line-height:1.5; margin-bottom:10px;">
          큰 꿈을 목표로 설정하고 진행 상황을 확인하세요.<br>
          예: 1억 모으기, 5년 안에 집 구매 등
        </div>
        <button onclick="openGoalModal()" style="padding:8px 16px; border:none; border-radius:8px; background:#F4A261; color:white; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit;">
          + 목표 만들기
        </button>
      </div>
    `;
  }

  let html = `
    <div style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="font-size:13px; font-weight:600;">🎯 재무 목표 (${goals.length}개)</div>
        <button onclick="openGoalModal()" style="border:none; background:var(--bg-info); color:var(--text-info); padding:4px 10px; border-radius:999px; font-size:10px; font-weight:500; cursor:pointer; font-family:inherit;">+ 추가</button>
      </div>
  `;

  goals.forEach(g => {
    // 진행 금액 계산
    let progressAmt = 0;
    if (g.trackMode === 'total') {
      progressAmt = currentTotal;
    } else if (g.trackMode === 'asset' && g.linkedAssetId) {
      const asset = assets.find(a => a.id === g.linkedAssetId);
      if (asset) {
        const live = liveAssetData?.[asset.id];
        progressAmt = (live?.hasLive && live.krwValue) ? live.krwValue : Number(asset.qty) * Number(asset.price);
      }
    } else {
      progressAmt = Number(g.currentAmount) || 0;
    }

    const pct = g.targetAmount > 0 ? Math.min(100, (progressAmt / g.targetAmount) * 100) : 0;
    const isCompleted = progressAmt >= g.targetAmount;

    // 기한 계산
    let timeLeft = '';
    let monthlyNeeded = 0;
    if (g.deadline) {
      const deadline = new Date(g.deadline + 'T00:00:00');
      const now = new Date();
      const monthsLeft = (deadline.getFullYear() - now.getFullYear()) * 12 + (deadline.getMonth() - now.getMonth());
      if (monthsLeft > 0) {
        const years = Math.floor(monthsLeft / 12);
        const months = monthsLeft % 12;
        timeLeft = years > 0 ? `${years}년 ${months}개월` : `${months}개월`;
        const remaining = g.targetAmount - progressAmt;
        if (remaining > 0) monthlyNeeded = Math.ceil(remaining / monthsLeft);
      } else {
        timeLeft = '기한 지남';
      }
    }

    // 이모지 + 색상
    const emoji = g.emoji || '🎯';
    const bgGradient = isCompleted
      ? 'linear-gradient(135deg, #2A4D1B 0%, #3B6D11 100%)'
      : 'linear-gradient(135deg, #185FA5 0%, #2D7BC9 100%)';

    html += `
      <div style="margin-bottom:10px; padding:14px; border-radius:14px; background:${bgGradient}; color:white;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
          <div style="flex:1; min-width:0;">
            <div style="font-size:14px; font-weight:600; margin-bottom:2px;">${emoji} ${g.title}</div>
            <div style="font-size:10px; opacity:0.8;">
              ${g.trackMode === 'total' ? '📊 총자산 자동' : g.trackMode === 'asset' ? '🎯 특정 자산' : '✏️ 직접 입력'}
              ${timeLeft ? ` · ${timeLeft} 남음` : ''}
            </div>
          </div>
          <button onclick="event.stopPropagation(); editGoal(${g.id})" style="border:none; background:rgba(255,255,255,0.15); color:white; padding:4px 8px; border-radius:6px; font-size:10px; cursor:pointer; font-family:inherit;">⋮</button>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; font-size:13px;">
          <span style="font-weight:600;">${formatKoreanMoney(progressAmt)} / ${formatKoreanMoney(g.targetAmount)}</span>
          <span style="font-size:11px; opacity:0.85;">${pct.toFixed(1)}%</span>
        </div>
        <div style="height:6px; background:rgba(255,255,255,0.25); border-radius:3px; overflow:hidden; margin-bottom:${monthlyNeeded > 0 || isCompleted ? '8px' : '0'};">
          <div style="height:100%; width:${pct}%; background:rgba(255,255,255,0.95); transition:width 0.4s;"></div>
        </div>

        ${isCompleted ? `
          <div style="text-align:center; padding:6px; background:rgba(255,255,255,0.18); border-radius:6px; font-size:11px; font-weight:600;">
            🎉 목표 달성!
          </div>
        ` : monthlyNeeded > 0 ? `
          <div style="font-size:10px; opacity:0.85;">
            매달 <b>${formatKoreanMoney(monthlyNeeded)}원</b>씩 필요
          </div>
        ` : ''}

        ${g.trackMode === 'manual' ? `
          <button onclick="updateGoalAmount(${g.id})" style="margin-top:8px; padding:6px 10px; border:none; border-radius:6px; background:rgba(255,255,255,0.2); color:white; font-size:10px; cursor:pointer; font-family:inherit; width:100%;">
            💰 진행 금액 업데이트
          </button>
        ` : ''}
      </div>
    `;
  });

  html += '</div>';
  return html;
}

      ` : ''}
    </div>
  `;
  modal.classList.add('show');

  // 이모지 선택
  setTimeout(() => {
    document.querySelectorAll('#goal-emoji .chip').forEach(b => {
      b.addEventListener('click', () => {
        document.querySelectorAll('#goal-emoji .chip').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
      });
    });

    // 금액 표시
    const updateDisplay = () => {
      const val = Number(document.getElementById('goal-target').value) || 0;
      const display = document.getElementById('goal-target-display');
      if (val >= 100000000) {
        const eok = Math.floor(val / 100000000);
        const man = Math.floor((val % 100000000) / 10000);
        if (man > 0) {
          display.textContent = `= ${eok}억 ${man.toLocaleString()}만원`;
        } else {
          display.textContent = `= ${eok}억원`;
        }
      } else if (val >= 10000) {
        const man = Math.floor(val / 10000);
        const won = val % 10000;
        if (won > 0 && man < 10) {
          display.textContent = `= ${man.toLocaleString()}만 ${won.toLocaleString()}원`;
        } else {
          display.textContent = `= ${man.toLocaleString()}만원`;
        }
      } else if (val > 0) {
        display.textContent = `= ${val.toLocaleString()}원`;
      } else {
        display.textContent = '';
      }
    };
    document.getElementById('goal-target').addEventListener('input', updateDisplay);
    updateDisplay();
  }, 50);
}

function saveGoal(goalId) {
  const title = document.getElementById('goal-title').value.trim();
  const target = Number(document.getElementById('goal-target').value);
  const deadline = document.getElementById('goal-deadline').value;
  const emoji = document.querySelector('#goal-emoji .chip.active')?.dataset.e || '🎯';
  const trackMode = document.querySelector('input[name="track"]:checked')?.value || 'total';
  const linkedAssetId = trackMode === 'asset' ? Number(document.getElementById('goal-asset-id').value) || null : null;
  const currentAmount = trackMode === 'manual' ? (Number(document.getElementById('goal-current').value) || 0) : 0;

  if (!title || !target) {
    showToast('이름과 금액을 입력해주세요');
    return;
  }
  if (trackMode === 'asset' && !linkedAssetId) {
    showToast('자산을 선택해주세요');
    return;
  }

  if (!settings.financialGoals) settings.financialGoals = [];

  if (goalId) {
    const idx = settings.financialGoals.findIndex(g => g.id === goalId);
    if (idx >= 0) {
      settings.financialGoals[idx] = { ...settings.financialGoals[idx], title, targetAmount: target, deadline, emoji, trackMode, linkedAssetId, currentAmount };
    }
    showToast('목표 수정됨');
  } else {
    settings.financialGoals.push({
      id: Date.now(),
      title,
      targetAmount: target,
      deadline,
      emoji,
      trackMode,
      linkedAssetId,
      currentAmount,
      createdAt: Date.now(),
    });
    showToast(`🎯 목표 "${title}" 추가됨`);

  renderAsset();

function renderAssetTrendCard() {
  const snaps = settings.assetSnapshots || {};
  const keys = Object.keys(snaps).sort();
  if (keys.length < 2) {
    return `<div style="background:white; border:0.5px solid var(--border-tertiary); border-radius:14px; padding:16px; margin-bottom:14px; text-align:center; color:var(--text-tertiary); font-size:12px;">
      📈 자산 변화 추이는 <b>2개월 이상</b> 데이터가 모이면 표시됩니다.<br>
      <span style="font-size:10px;">매달 자동 저장됨</span>
    </div>`;
  }

  // 최근 12개월만
  const recent = keys.slice(-12);
  const totals = recent.map(k => snaps[k].total);
  const max = Math.max(...totals);
  const min = Math.min(...totals);
  const range = max - min || 1;

  // SVG 좌표 계산
  const w = 280, h = 110, padL = 40, padR = 10, padT = 10, padB = 24;
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;

  const points = recent.map((k, i) => {
    const x = padL + (recent.length > 1 ? (i / (recent.length - 1)) * innerW : innerW / 2);
    const y = padT + innerH - ((snaps[k].total - min) / range) * innerH;
    return { x, y, k, v: snaps[k].total };
  });

  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');
  const areaPath = `M ${points[0].x.toFixed(1)} ${(padT+innerH).toFixed(1)} ${points.map(p => `L ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ')} L ${points[points.length-1].x.toFixed(1)} ${(padT+innerH).toFixed(1)} Z`;

  const lastTotal = totals[totals.length - 1];
  const firstTotal = totals[0];
  const change = lastTotal - firstTotal;
  const changePct = firstTotal > 0 ? (change / firstTotal * 100) : 0;
  const isUp = change >= 0;

  return `
    <div style="background:white; border:0.5px solid var(--border-tertiary); border-radius:14px; padding:16px; margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">
        <div style="font-size:13px; font-weight:600;">📈 자산 변화 추이</div>
        <div style="font-size:11px; color:${isUp ? 'var(--text-success)' : 'var(--text-danger)'}; font-weight:600;">
          ${isUp ? '+' : ''}${(change/10000).toFixed(0)}만 (${isUp ? '+' : ''}${changePct.toFixed(1)}%)
        </div>
      </div>

      <svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;">
        <!-- Y축 라벨 -->
        <text x="${padL-4}" y="${padT+4}" font-size="9" fill="#999" text-anchor="end">${(max/10000).toFixed(0)}만</text>
        <text x="${padL-4}" y="${padT+innerH+3}" font-size="9" fill="#999" text-anchor="end">${(min/10000).toFixed(0)}만</text>

        <!-- 영역 -->
        <path d="${areaPath}" fill="rgba(94,92,230,0.15)" />

        <!-- 라인 -->
        <path d="${linePath}" stroke="#5E5CE6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />

        <!-- 점 -->
        ${points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#5E5CE6" stroke="white" stroke-width="1.5" />`).join('')}

        <!-- X축 라벨 -->
        ${points.map((p, i) => {
          if (recent.length > 6 && i % 2 !== 0 && i !== points.length - 1) return '';
          const monthLabel = p.k.split('-')[1] + '월';
          return `<text x="${p.x.toFixed(1)}" y="${(h-6).toFixed(1)}" font-size="9" fill="#999" text-anchor="middle">${monthLabel}</text>`;
        }).join('')}
      </svg>

      <!-- 종류별 비율 변화 (최신 vs 이전달) -->
      ${recent.length >= 2 ? renderAssetTypeChange(snaps[recent[recent.length-2]].byType, snaps[recent[recent.length-1]].byType) : ''}
    </div>
  `;
}

// 종류별 비율 변화
function renderAssetTypeChange(prevByType, currByType) {
  const allTypes = new Set([...Object.keys(prevByType||{}), ...Object.keys(currByType||{})]);
  const currTotal = Object.values(currByType||{}).reduce((s,v) => s+Number(v), 0);
  const prevTotal = Object.values(prevByType||{}).reduce((s,v) => s+Number(v), 0);
  if (currTotal === 0) return '';

  const items = [];
  allTypes.forEach(t => {
    const curr = Number(currByType?.[t]) || 0;
    const prev = Number(prevByType?.[t]) || 0;
    if (curr === 0 && prev === 0) return;
    const currPct = currTotal > 0 ? (curr / currTotal * 100) : 0;
    const prevPct = prevTotal > 0 ? (prev / prevTotal * 100) : 0;
    const diff = currPct - prevPct;
    items.push({ type: t, currPct, diff, curr });
  });
  items.sort((a, b) => b.curr - a.curr);

  return `
    <div style="margin-top:14px; padding-top:12px; border-top:0.5px solid var(--border-tertiary);">
      <div style="font-size:11px; color:var(--text-tertiary); margin-bottom:8px;">지난달 대비 비율 변화</div>
      ${items.slice(0, 6).map(it => {
        const diffStr = it.diff >= 0.1 ? `+${it.diff.toFixed(1)}%p` : it.diff <= -0.1 ? `${it.diff.toFixed(1)}%p` : '';
        const diffColor = it.diff > 0.1 ? 'var(--text-success)' : it.diff < -0.1 ? 'var(--text-danger)' : 'var(--text-tertiary)';
        return `
          <div style="display:flex; align-items:center; gap:8px; padding:4px 0; font-size:11px;">
            <span style="width:50px;">${it.type}</span>
            <div style="flex:1; height:5px; background:rgba(0,0,0,0.05); border-radius:3px; overflow:hidden;">
              <div style="height:100%; width:${it.currPct}%; background:#5E5CE6;"></div>
            </div>
            <span style="width:42px; text-align:right; font-weight:500;">${it.currPct.toFixed(0)}%</span>
            <span style="width:48px; text-align:right; color:${diffColor}; font-size:10px;">${diffStr}</span>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// ====== Gemini AI ======
// 캐시: 같은 프롬프트는 1시간 동안 재사용 (토큰 절약)
const aiCache = {};
const AI_CACHE_TIME = 60 * 60 * 1000; // 1시간

// AI 호출 진행 상태 - 탭 이동에도 결과 유지
window._aiInFlight = window._aiInFlight || {}; // {cacheKey: Promise}
window._aiInFlightStatus = window._aiInFlightStatus || {}; // {cacheKey: 'loading'}
window._aiLastError = window._aiLastError || {}; // {cacheKey: { error: '...', time: ... }} - 최근 에러 (10분 유지)

async function askGemini(prompt, options = {}) {
  const { useCache = true, cacheKey = null, maxRetries = 1, useSearch = false } = options;

  const cKey = cacheKey || prompt;
  if (useCache && aiCache[cKey] && Date.now() - aiCache[cKey].time < AI_CACHE_TIME) {
    return { text: aiCache[cKey].text, cached: true };
  }

  const apiKey = window.GEMINI_API_KEY;
  if (!apiKey) {
    return { error: 'AI 키가 설정되지 않았어요. 우측 상단 톱니바퀴에서 키를 입력하세요.', needsKey: true };
  }

  const models = ['gemini-2.5-flash', 'gemini-flash-latest'];
  let lastError = '알 수 없는 오류';
  let searchFailed = false; // 🔧 검색 도구 때문에 실패했는지

  try {
    for (const model of models) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          const controller = new AbortController();
          // 🔧 AI 응답은 길면 20~30초 걸림 (7섹션 분석 등) → 40초로 여유있게
          const timeoutId = setTimeout(() => controller.abort(), 40000);

          const reqBody = {
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.7, maxOutputTokens: 8192 },
          };
          // 🔧 검색 그라운딩 — 켜지면 AI가 답변 전 구글 검색으로 최신 정보 수집
          //    단, 이전에 검색 때문에 실패했으면 검색 끄고 시도 (무료 키는 검색 도구 거부할 수 있음)
          if (useSearch && !searchFailed) {
            reqBody.tools = [{ google_search: {} }];
          }

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(reqBody),
            signal: controller.signal,
          });

          clearTimeout(timeoutId);

          if (!res.ok) {
            const errData = await res.json().catch(() => null);
            if (res.status === 429) {
              // 🔧 429(한도초과)는 재시도해도 똑같이 막힘 → 대기/재시도 없이 즉시 다음 모델로
              // (무의미한 재호출이 남은 할당량을 더 빠르게 소진시키는 것을 방지)
              console.warn(`⚠️ ${model} 한도초과(429) → 다음 모델 시도`);
              lastError = '429: AI 호출 한도 도달';
              break; // 안쪽 attempt 루프 탈출 → 바깥 for가 다음 모델 시도
            }
            if (res.status === 503) {
              // 503(서버 일시 혼잡) — 잠깐 대기 후 재시도, 그래도 안 되면 다음 모델
              console.warn(`⚠️ ${model} 서버 혼잡(503) → ${attempt < maxRetries ? '잠시 후 재시도' : '다음 모델'}`);
              lastError = '503: AI 서버 일시 혼잡';
              if (attempt < maxRetries) {
                await new Promise(r => setTimeout(r, 1500 * (attempt + 1)));
                continue; // 같은 모델 재시도
              }
              break;
            }
            lastError = `${res.status}: ${errData?.error?.message || '오류'}`;
            console.warn(`⚠️ ${model} 실패 — ${lastError}`, errData);
            break; 
          }

          const data = await res.json();
          // 🔧 검색 그라운딩 사용 시 parts가 여러 개로 쪼개질 수 있어 모두 합침
          const cand = data.candidates?.[0];
          const parts = cand?.content?.parts || [];
          const text = parts.map(p => p.text || '').join('').trim();
          const finishReason = cand?.finishReason;
          console.log(`📊 ${model} finishReason=${finishReason}, parts=${parts.length}, textLen=${text.length}`);

          // 🔧 검색 그라운딩이 실제 작동했는지 확인 (groundingMetadata 유무)
          if (useSearch) {
            const gm = cand?.groundingMetadata;
            if (gm && (gm.groundingChunks || gm.webSearchQueries || gm.searchEntryPoint)) {
              const queries = gm.webSearchQueries || [];
              console.log(`🔍 검색 그라운딩 작동함 — 검색어:`, queries);
            } else {
              console.warn('⚠️ 검색 그라운딩 요청했지만 검색 안 함 (무료 키 권한 없음 가능성). AI 학습데이터로 답변됨.');
            }
          }

          // 🔧 토큰 초과로 답변이 잘렸으면(텍스트 없음) 명확히 안내
          if (!text && finishReason === 'MAX_TOKENS') {
            lastError = 'MAX_TOKENS: 검색+분석이 길어 토큰 초과. 답변이 안 나옴';
            console.warn('⚠️ MAX_TOKENS — 토큰 한도 초과로 빈 응답');
            break;
          }
          if (!text && finishReason && finishReason !== 'STOP') {
            lastError = `${finishReason}: AI가 답변을 완성하지 못함`;
            break;
          }

          if (!text) throw new Error('응답이 비어있음');

          // 🔧 검색 출처 추출 (검색 그라운딩 작동 시)
          let sources = [];
          if (useSearch) {
            const chunks = data.candidates?.[0]?.groundingMetadata?.groundingChunks || [];
            sources = chunks
              .map(c => c.web ? { title: c.web.title || c.web.uri, uri: c.web.uri } : null)
              .filter(Boolean);
          }

          console.log(`✅ Gemini ${model} 성공`);
          aiCache[cKey] = { text, time: Date.now() };
          localStorage.setItem('ai_cache_today', JSON.stringify(aiCache));
          return { text, cached: false, sources };

        } catch (e) {
          lastError = e.message;
          if (attempt < maxRetries) {
            await new Promise(r => setTimeout(r, 2000));
            continue;
          }
          break;
        }
      }
    }
  } catch (e) {
    // 외부 에러
    lastError = e.message || '알 수 없는 오류';
  }

  // 🔧 사용자 친화적 에러 메시지
  if (lastError.includes('429')) {
    return { error: '429: 오늘 AI 사용량을 모두 썼어요. 내일 다시 이용하거나, 설정에서 새 API 키를 등록해주세요. (무료 등급은 하루 사용량 제한이 있어요)' };
  }
  if (lastError.includes('503')) {
    return { error: '503: AI 서버가 잠시 혼잡해요. 5~10분 후 다시 시도해주세요.' };
  }
  return { error: `AI 분석 실패: ${lastError}` };
}
// AI 응답을 마크다운 → HTML로 간단 변환
function renderAIText(text) {
  if (!text) return '';
  let result = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // 안전한 HTML 태그 복원
  // 자기 닫는 태그
  result = result.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  result = result.replace(/&lt;hr\s*\/?&gt;/gi, '<hr style="border:none; border-top:0.5px solid var(--border-tertiary); margin:8px 0;">');

  // 닫는 태그 먼저 (열기 태그가 닫기 태그 패턴이랑 충돌 안 나게)
  result = result.replace(/&lt;\/small&gt;/gi, '</small>');
  result = result.replace(/&lt;\/font&gt;/gi, '</font>');
  result = result.replace(/&lt;\/b&gt;/gi, '</b>');
  result = result.replace(/&lt;\/strong&gt;/gi, '</strong>');
  result = result.replace(/&lt;\/i&gt;/gi, '</i>');
  result = result.replace(/&lt;\/em&gt;/gi, '</em>');
  result = result.replace(/&lt;\/span&gt;/gi, '</span>');
  result = result.replace(/&lt;\/h3&gt;/gi, '</h3>');
  result = result.replace(/&lt;\/h4&gt;/gi, '</h4>');
  result = result.replace(/&lt;\/h5&gt;/gi, '</h5>');
  result = result.replace(/&lt;\/ul&gt;/gi, '</ul>');
  result = result.replace(/&lt;\/ol&gt;/gi, '</ol>');
  result = result.replace(/&lt;\/li&gt;/gi, '</li>');
  result = result.replace(/&lt;\/p&gt;/gi, '</p>');
  result = result.replace(/&lt;\/div&gt;/gi, '</div>');

  // 여는 태그 (속성 포함된 거 처리)
  result = result.replace(/&lt;small[^&]*?&gt;/gi, '<small style="font-size:0.85em; opacity:0.7;">');
  result = result.replace(/&lt;font[^&]*?&gt;/gi, '<small style="font-size:0.85em; opacity:0.7;">');
  result = result.replace(/&lt;b&gt;/gi, '<b style="font-weight:600;">');
  result = result.replace(/&lt;strong&gt;/gi, '<strong style="font-weight:600;">');
  result = result.replace(/&lt;i&gt;/gi, '<i>');
  result = result.replace(/&lt;em&gt;/gi, '<em>');
  result = result.replace(/&lt;h3[^&]*?&gt;/gi, '<h3 style="font-size:14px; font-weight:600; margin:10px 0 6px;">');
  result = result.replace(/&lt;h4[^&]*?&gt;/gi, '<h4 style="font-size:13px; font-weight:600; margin:8px 0 4px;">');
  result = result.replace(/&lt;h5[^&]*?&gt;/gi, '<h5 style="font-size:12px; font-weight:600; margin:6px 0 3px;">');
  result = result.replace(/&lt;ul[^&]*?&gt;/gi, '<ul style="margin:6px 0; padding-left:18px;">');
  result = result.replace(/&lt;ol[^&]*?&gt;/gi, '<ol style="margin:6px 0; padding-left:18px;">');
  result = result.replace(/&lt;li[^&]*?&gt;/gi, '<li style="margin:2px 0;">');
  result = result.replace(/&lt;span[^&]*?&gt;/gi, '<span>');
  result = result.replace(/&lt;p[^&]*?&gt;/gi, '<p style="margin:6px 0;">');
  result = result.replace(/&lt;div[^&]*?&gt;/gi, '<div>');

  // 마크다운 변환
  result = result.replace(/\*\*(.+?)\*\*/g, '<b style="font-weight:600;">$1</b>');
  result = result.replace(/\*(.+?)\*/g, '<i>$1</i>');
  result = result.replace(/`(.+?)`/g, '<code style="background:rgba(0,0,0,0.05); padding:1px 4px; border-radius:3px; font-size:11px;">$1</code>');
  result = result.replace(/\n\n/g, '</p><p style="margin: 8px 0;">');
  result = result.replace(/\n/g, '<br>');

  return result;
}

      <div style="margin-top:6px; font-size:9px; opacity:0.5; color:#FFD;">⚠️ ${new Date(errInfo.time).toLocaleTimeString('ko-KR')} 에러 (탭 이동해도 유지됨)</div>

  // 진행 중인 호출이 있으면 → 로딩 상태 그대로

const PRICE_CACHE_TIME = 60 * 1000; // 1분 (실시간 가깝게)

async function fetchYahooPrice(ticker) {
  if (!ticker) return null;

  // 캐시 확인
  const cached = priceCache[ticker];
  if (cached && Date.now() - cached.time < PRICE_CACHE_TIME) {
    return cached.data;
  }

  // Yahoo Finance API URL
  const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=2d`;

  // CORS 프록시 후보들 (본인 Cloudflare Worker 1순위)
  const proxies = [
    {
      url: `https://life-planner.qorwl503.workers.dev/?url=${encodeURIComponent(yahooUrl)}`,
      parse: async (res) => {
        const w = await res.json();
        return JSON.parse(w.contents);
      }
    },
    {
      url: `https://api.allorigins.win/get?url=${encodeURIComponent(yahooUrl)}`,
      parse: async (res) => {
        const w = await res.json();
        return JSON.parse(w.contents);
      }
    },
    {
      url: `https://corsproxy.io/?${encodeURIComponent(yahooUrl)}`,
      parse: async (res) => res.json()
    },
    {
      url: `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(yahooUrl)}`,
      parse: async (res) => res.json()
    },
  ];

  for (const proxy of proxies) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 4000); // 8초 타임아웃

      const res = await fetch(proxy.url, { signal: controller.signal });
      clearTimeout(timeoutId);

      if (!res.ok) continue;

      const data = await proxy.parse(res);

      if (data.chart?.error) {
        console.error(`${ticker} Yahoo 에러:`, data.chart.error);
        continue;
      }

      const result = data.chart?.result?.[0];
      if (!result) continue;

      const meta = result.meta;
      const currentPrice = meta.regularMarketPrice;
      const previousClose = meta.regularMarketPreviousClose || meta.chartPreviousClose || meta.previousClose;
      const currency = meta.currency || 'USD';

      if (!currentPrice) continue;

      // 🔧 야후의 regularMarketChangePercent는 항상 % 단위 (0.5 = 0.5%)
      // 기존 "abs<1이면 비율로 보고 ×100" 로직은 등락 ±1% 미만 종목을 100배로 뻥튀기했음
      let changePct;
      if (meta.regularMarketChangePercent != null) {
        changePct = Number(meta.regularMarketChangePercent);
      } else if (previousClose > 0) {
        // 계산 폴백
        changePct = ((currentPrice - previousClose) / previousClose) * 100;
      } else {
        changePct = 0;
      }

      console.log(`📊 ${ticker}: 현재 ${currentPrice} / 전일 ${previousClose} / ${changePct.toFixed(2)}%`);

      const priceData = {
        ticker,
        price: currentPrice,
        previousClose,
        changePct,
        currency,
        time: Date.now()
      };

      priceCache[ticker] = { data: priceData, time: Date.now() };
      return priceData;
    } catch (e) {
      console.warn(`${ticker} 프록시 실패 (${proxy.url.substring(0, 30)}...):`, e.message);
      continue;
    }
  }

  console.error(`${ticker}: 모든 프록시 실패`);
  return null;
}

// 🔧 특정 날짜의 과거 종가 조회 (자동매수 과거 회차의 매입가용)
// dateStrList의 각 날짜에 가장 가까운 거래일 종가를 { 'YYYY-MM-DD': price } 로 반환
const histPriceCache = {}; // ticker별 일별 종가 캐시
async function fetchYahooHistorical(ticker) {
  if (!ticker) return null;
  if (histPriceCache[ticker] && Date.now() - histPriceCache[ticker].time < 6 * 60 * 60 * 1000) {
    return histPriceCache[ticker].map;
  }

  // 최근 1년치 일별 종가
  const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=1y`;
  const proxies = [
    { url: `https://life-planner.qorwl503.workers.dev/?url=${encodeURIComponent(yahooUrl)}`, parse: async (r) => JSON.parse((await r.json()).contents) },
    { url: `https://api.allorigins.win/get?url=${encodeURIComponent(yahooUrl)}`, parse: async (r) => JSON.parse((await r.json()).contents) },
    { url: `https://corsproxy.io/?${encodeURIComponent(yahooUrl)}`, parse: async (r) => r.json() },
  ];

  for (const proxy of proxies) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);
      const res = await fetch(proxy.url, { signal: controller.signal });
      clearTimeout(timeoutId);
      if (!res.ok) continue;

      const data = await proxy.parse(res);
      const result = data.chart?.result?.[0];
      if (!result || !result.timestamp) continue;

      const timestamps = result.timestamp;
      const q = result.indicators?.quote?.[0] || {};
      const closes = q.close || [];
      const opens = q.open || [];
      const highs = q.high || [];
      const lows = q.low || [];
      const volumes = q.volume || [];

      // 날짜(YYYY-MM-DD) → 종가 맵 + OHLC 맵 생성
      const map = {};
      const ohlc = {};
      const series = []; // 🔧 차트용 시계열
      timestamps.forEach((ts, i) => {
        if (closes[i] == null) return;
        const d = new Date(ts * 1000);
        const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        map[key] = closes[i];
        // 🔧 그날 평균가 = (시+고+저+종)/4. 일부 값이 없으면 있는 것끼리 평균
        const vals = [opens[i], highs[i], lows[i], closes[i]].filter(v => v != null);
        ohlc[key] = {
          o: opens[i], h: highs[i], l: lows[i], c: closes[i],
          avg: vals.length > 0 ? vals.reduce((s,v)=>s+v,0) / vals.length : closes[i],
        };
        series.push({ date: key, close: closes[i], volume: volumes[i] || 0 });
      });

      histPriceCache[ticker] = { map, ohlc, series, time: Date.now() };
      console.log(`📈 ${ticker} 과거 시세 ${Object.keys(map).length}일치 로드 (OHLC 포함)`);
      return map;
    } catch (e) {
      continue;
    }
  }
  console.warn(`${ticker}: 과거 종가 조회 실패`);
  return null;
}

// 과거 종가 맵에서 특정 날짜에 가장 가까운(그 이전) 거래일 종가 찾기
function getHistPriceOn(histMap, dateStr) {
  if (!histMap) return null;
  if (histMap[dateStr] != null) return histMap[dateStr];
  // 해당 날짜가 휴장일이면 그 이전 가장 가까운 거래일 찾기 (최대 7일 역추적)
  const d = new Date(dateStr + 'T00:00:00');
  for (let i = 1; i <= 7; i++) {
    d.setDate(d.getDate() - 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (histMap[key] != null) return histMap[key];
  }
  return null;
}

// 🔧 특정 날짜의 '그날 평균가' 조회 — 정기매수는 장중 체결되므로
// 종가만 쓰는 것보다 (시+고+저+종)/4 평균가가 실제 체결가에 가깝다.
// ticker로 캐시된 ohlc 맵을 직접 조회. 평균가 없으면 종가로 폴백.
function getHistAvgPriceOn(ticker, dateStr) {
  const cached = ticker ? histPriceCache[ticker] : null;
  const ohlc = cached?.ohlc;
  if (!ohlc) return null;
  const pick = (key) => (ohlc[key] && ohlc[key].avg != null) ? ohlc[key].avg : null;
  if (pick(dateStr) != null) return pick(dateStr);
  const d = new Date(dateStr + 'T00:00:00');
  for (let i = 1; i <= 7; i++) {
    d.setDate(d.getDate() - 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if (pick(key) != null) return pick(key);
  }
  return null;
}

// 🔧 자동매수 전용 — '정확히 그 날짜'의 데이터만 반환 (역추적 안 함)
//    수요일 매수일인데 야후에 아직 수요일 데이터가 없으면 null 반환 → 회차 보류
function getHistAvgPriceExact(ticker, dateStr) {
  const cached = ticker ? histPriceCache[ticker] : null;
  const ohlc = cached?.ohlc;
  if (!ohlc || !ohlc[dateStr]) return null;
  return ohlc[dateStr].avg != null ? ohlc[dateStr].avg : null;
}

function getHistPriceExact(histMap, dateStr) {
  if (!histMap) return null;
  return histMap[dateStr] != null ? histMap[dateStr] : null;
}
