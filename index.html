async function processAssetCapture(input) {
  const file = input.files?.[0];
  if (!file) return;

  if (!window.GEMINI_API_KEY) {
    showToast('AI 키 먼저 설정해주세요');
    return;
  }

  const statusEl = document.getElementById('asset-capture-status');
  statusEl.style.display = 'block';
  statusEl.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; gap:6px;"><div class="spinner" style="width:12px; height:12px;"></div>분석 중...</div>`;

  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(',')[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const mimeType = file.type || 'image/jpeg';

    const prompt = `이 이미지는 증권/은행/투자 앱 화면이야. 보유 자산 정보를 추출해서 JSON 배열로 반환해줘.

각 항목: {type, name, qty, price, ticker}
- type: 다음 중 - "주식","ETF","펀드","채권","금","달러","예적금","청약","현금","부동산"
- name: 종목명/계좌명 (예: "삼성전자", "토스 정기예금", "주택청약통장")
- qty: 보유 수량 (주식이면 주, 예금이면 1)
- price: 평단가 또는 평균 매수가 (원)
- ticker: 종목 코드 (있으면, 한국주식 6자리 또는 미국 티커)

반드시 다음 JSON 형식으로만:
{"items":[{"type":"주식","name":"삼성전자","qty":10,"price":70000,"ticker":"005930"}]}

분석 불가하면: {"items":[],"error":"이유"}`;

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${window.GEMINI_API_KEY}`;
    const body = {
      contents: [{ parts: [{ text: prompt }, { inline_data: { mime_type: mimeType, data: base64 } }] }],
      generationConfig: { temperature: 0.1, maxOutputTokens: 2000 }
    };

    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    const data = await res.json();
    if (!res.ok || data.error) throw new Error(data.error?.message || `HTTP ${res.status}`);

    const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
    let jsonStr = text.trim().replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
    let parsed;
    try { parsed = JSON.parse(jsonStr); }
    catch (e) {
      const match = jsonStr.match(/\{[\s\S]*\}/);
      if (match) parsed = JSON.parse(match[0]);
      else throw new Error('JSON 파싱 실패');
    }

    if (parsed.error || !parsed.items || parsed.items.length === 0) {
      statusEl.innerHTML = `<span style="color:var(--text-warning);">⚠️ ${parsed.error || '추출된 자산이 없어요'}</span>`;
      return;
    }

    statusEl.style.display = 'none';
    closeModal();
    openAssetReviewModal(parsed.items);

  } catch (e) {
    console.error('자산 캡처 오류:', e);
    statusEl.innerHTML = `<span style="color:var(--text-danger);">❌ ${e.message}</span>`;
  }

  input.value = '';
}

        qty = Number(document.getElementById('inv-dollar-qty')?.value) || 1;
        price = qty > 0 ? amt / qty : amt;
      } else if (cat === '현금') {
        qty = 1;
        price = amt;
      }

      // 기존 자산 있으면 → 수량 추가 + 평균가 재계산
      const existing = assets.find(a => a.name === invName && a.type === cat);
      if (existing) {
        const oldQty = Number(existing.qty) || 0;
        const oldPrice = Number(existing.price) || 0;
        const newQty = oldQty + qty;
        const newAvgPrice = newQty > 0 ? ((oldQty * oldPrice) + amt) / newQty : price;
        existing.qty = newQty;
        existing.price = Math.round(newAvgPrice);
        if (ticker && !existing.ticker) existing.ticker = ticker;
        showToast(`${cat} ${amt.toLocaleString()}원 추가 (${invName} 평단 재계산)`);
      } else {
        // 신규 자산 추가
        assets.push({
          id: Date.now() + 1,
          name: invName,
          ticker, type: cat, region: '국내',
          qty, price: Math.round(price),
          note: memo || '가계부에서 자동 추가',
        });
        showToast(`${cat} ${amt.toLocaleString()}원 저장 (${invName} 자산 추가됨)`);
      }
      assetAdded = true;
    }
  }

  if (!assetAdded) {
    showToast(`${cat} ${amt.toLocaleString()}원 저장됨`);
  }

  saveData();
  closeModal();
  render();
}

function setTodoDate(preset) {
  const input = document.getElementById('todo-date');
  const n = new Date();
  let d = new Date(n);
  if (preset === 'today') d = n;
  else if (preset === 'tomorrow') d.setDate(n.getDate() + 1);
  else if (preset === 'week') d.setDate(n.getDate() + 7);
  else if (preset === 'month') d.setMonth(n.getMonth() + 1);
  input.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function saveTodo(editId) {
  const title = document.getElementById('todo-title').value.trim();
  if (!title) { showToast('내용을 입력해주세요'); return; }
  const dateKeyVal = document.getElementById('todo-date').value || todayKey();
  const tag = document.querySelector('#tag-grid .chip.active')?.dataset.tag || '업무';
  const flag = modal.querySelector('.toggle').classList.contains('on');

  if (editId) {
    // 수정
    const t = todos.find(x => x.id === Number(editId));
    if (t) {
      t.title = title;
      t.dateKey = dateKeyVal;
      t.tag = tag;
      t.flag = flag;
    }
    showToast('수정됨');
  } else {
    // 새로 추가
    todos.unshift({
      id: Date.now(),
      title,
      tag,
      dateKey: dateKeyVal,
      flag,
      done: false,
    });
    showToast(`"${title}" 추가됨`);
  }
  saveData();
  closeModal();
  render();
}

  let h = `<div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; -webkit-overflow-scrolling:touch;">`;
  h += `<style>#market-indices div::-webkit-scrollbar{display:none;}</style>`;
  items.forEach(it => {
    const isLink = !!it.link;
    const clickHandler = isLink ? `onclick="openExt('${it.link}')"` : '';
    const cursor = isLink ? 'cursor:pointer;' : '';
    const highlight = it.highlight ? 'border:1px solid var(--text-warning);' : '';

    if (!it.data || !it.data.price) {
      h += `<div style="flex:0 0 auto; min-width:96px; padding:10px; background:var(--bg-secondary); border-radius:var(--radius-md); text-align:center;">
        <div style="font-size:10px; color:var(--text-tertiary);">${it.label}</div>
        <div style="font-size:12px; color:var(--text-tertiary); margin-top:4px;">—</div>
        <div style="font-size:9px; color:var(--text-tertiary); margin-top:2px;">조회 불가</div>
      </div>`;
    } else {
      const changeColor = it.data.changePct >= 0 ? 'var(--text-danger)' : 'var(--text-info)';
      const arrow = it.data.changePct >= 0 ? '▲' : '▼';
      const decimals = it.decimals !== undefined ? it.decimals : 2;
      const formattedPrice = it.data.price.toLocaleString(undefined, {
        maximumFractionDigits: decimals,
        minimumFractionDigits: decimals === 0 ? 0 : Math.min(decimals, 2)
      });
      h += `<div ${clickHandler} style="flex:0 0 auto; min-width:96px; padding:10px; background:var(--bg-secondary); border-radius:var(--radius-md); text-align:center; ${cursor} ${highlight}">
        <div style="font-size:10px; color:var(--text-tertiary); display:flex; align-items:center; justify-content:center; gap:2px;">
          ${it.label}${isLink ? ' <i class="ti ti-external-link" style="font-size:9px;"></i>' : ''}
        </div>
        <div style="font-size:13px; font-weight:600; margin-top:3px;">${it.prefix}${formattedPrice}${it.suffix}</div>
        <div style="font-size:10px; color:${changeColor}; margin-top:2px;">${arrow} ${Math.abs(it.data.changePct).toFixed(2)}%</div>
        ${it.sub ? `<div style="font-size:8px; color:var(--text-tertiary); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${it.sub}</div>` : ''}
      </div>`;
    }
  });
  h += `</div>`;

  // 김프 상세 정보 (또는 금 1돈 환산)
  if (kimchiPremium !== null && domesticGoldPerG && intlGoldKrwPerG) {
    const kColor = kimchiPremium >= 0 ? 'var(--text-danger)' : 'var(--text-info)';
    const kBg = kimchiPremium >= 0 ? 'rgba(255,90,90,0.08)' : 'rgba(70,140,255,0.08)';
    h += `<div style="margin-top:6px; padding:8px 10px; background:${kBg}; border-radius:6px; font-size:10px; color:${kColor};">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
        <span style="font-weight:600;">🌶️ 김치 프리미엄</span>
        <span style="font-weight:700; font-size:13px;">${kimchiPremium >= 0 ? '+' : ''}${kimchiPremium.toFixed(2)}%</span>
      </div>
      <div style="font-size:9px; opacity:0.85; line-height:1.5;">
        국내 ${Math.round(domesticGoldPerG).toLocaleString()}원/g · 국제 ${Math.round(intlGoldKrwPerG).toLocaleString()}원/g<br>
        ${kimchiPremium >= 0 ? '국내가 국제보다 비쌈 → 매수 신중' : '국내가 국제보다 저렴 → 매수 기회'}
      </div>
    </div>`;
  } else if (intlGoldKrwPerG) {
    // 국내금 시세 없으면 1돈 환산만
    const krwPerDon = intlGoldKrwPerG * 3.75;
    h += `<div style="margin-top:6px; padding:6px 10px; background:var(--bg-warning); border-radius:6px; font-size:10px; color:var(--text-warning); display:flex; justify-content:space-between; align-items:center;">
      <span><i class="ti ti-coin" style="font-size:11px; vertical-align:-1px;"></i> 금 1돈(3.75g) 환산</span>
      <span style="font-weight:600;">약 ${Math.round(krwPerDon).toLocaleString()}원</span>
    </div>`;
  }
  h += `<div style="font-size:9px; color:var(--text-tertiary); text-align:right; margin-top:4px;">← 좌우로 스크롤</div>`;
  container.innerHTML = h;
}

// 자산 스냅샷 - 매달 첫 자산 페이지 방문시 저장
function saveAssetSnapshot(total, byType) {
  if (!total || total <= 0) return;
  if (!settings.assetSnapshots) settings.assetSnapshots = {};

  const now = new Date();
  const key = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

  // 이번 달 스냅샷 - 항상 최신 값으로 덮어쓰기 (오늘 본 시세)
  settings.assetSnapshots[key] = {
    total: Math.round(total),
    byType: Object.fromEntries(Object.entries(byType).map(([k,v]) => [k, Math.round(v)])),
    date: now.toISOString(),
  };
  saveData();
}

// 자산 변화 그래프 - SVG 라인 그래프
// 🎯 재무 목표 카드 - 자산 페이지 상단
function renderFinancialGoalsCard(currentTotal) {
  const goals = settings.financialGoals || [];

  // 한국식 금액 포맷 (1억 5,000만 같이)
  const formatKoreanMoney = (amt) => {
    const num = Math.round(Number(amt) || 0);
    if (num >= 100000000) {
      const eok = Math.floor(num / 100000000);
      const man = Math.floor((num % 100000000) / 10000);
      if (man > 0) return `${eok}억 ${man.toLocaleString()}만`;
      return `${eok}억`;
    } else if (num >= 10000) {
      const man = Math.floor(num / 10000);
      const won = num % 10000;
      if (won > 0 && man < 10) return `${man.toLocaleString()}만 ${won.toLocaleString()}`;
      return `${man.toLocaleString()}만`;
    } else {
      return `${num.toLocaleString()}원`;
    }
  };

  if (goals.length === 0) {
    return `
      <div style="background:linear-gradient(135deg, #FFF7E6 0%, #FFEFD5 100%); border:0.5px solid #F4A261; border-radius:14px; padding:14px; margin-bottom:14px; text-align:center;">
        <div style="font-size:13px; font-weight:600; color:#B45309; margin-bottom:6px;">🎯 재무 목표</div>
        <div style="font-size:11px; color:#8B5A1A; line-height:1.5; margin-bottom:10px;">
          큰 꿈을 목표로 설정하고 진행 상황을 확인하세요.<br>
          예: 1억 모으기, 5년 안에 집 구매 등
        </div>
        <button onclick="openGoalModal()" style="padding:8px 16px; border:none; border-radius:8px; background:#F4A261; color:white; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit;">
          + 목표 만들기
        </button>
      </div>
    `;
  }

  let html = `
    <div style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
        <div style="font-size:13px; font-weight:600;">🎯 재무 목표 (${goals.length}개)</div>
        <button onclick="openGoalModal()" style="border:none; background:var(--bg-info); color:var(--text-info); padding:4px 10px; border-radius:999px; font-size:10px; font-weight:500; cursor:pointer; font-family:inherit;">+ 추가</button>
      </div>
  `;

  goals.forEach(g => {
    // 진행 금액 계산
    let progressAmt = 0;
    if (g.trackMode === 'total') {
      progressAmt = currentTotal;
    } else if (g.trackMode === 'asset' && g.linkedAssetId) {
      const asset = assets.find(a => a.id === g.linkedAssetId);
      if (asset) {
        const live = liveAssetData?.[asset.id];
        progressAmt = (live?.hasLive && live.krwValue) ? live.krwValue : Number(asset.qty) * Number(asset.price);
      }
    } else {
      progressAmt = Number(g.currentAmount) || 0;
    }

    const pct = g.targetAmount > 0 ? Math.min(100, (progressAmt / g.targetAmount) * 100) : 0;
    const isCompleted = progressAmt >= g.targetAmount;

    // 기한 계산
    let timeLeft = '';
    let monthlyNeeded = 0;
    if (g.deadline) {
      const deadline = new Date(g.deadline + 'T00:00:00');
      const now = new Date();
      const monthsLeft = (deadline.getFullYear() - now.getFullYear()) * 12 + (deadline.getMonth() - now.getMonth());
      if (monthsLeft > 0) {
        const years = Math.floor(monthsLeft / 12);
        const months = monthsLeft % 12;
        timeLeft = years > 0 ? `${years}년 ${months}개월` : `${months}개월`;
        const remaining = g.targetAmount - progressAmt;
        if (remaining > 0) monthlyNeeded = Math.ceil(remaining / monthsLeft);
      } else {
        timeLeft = '기한 지남';
      }
    }

    // 이모지 + 색상
    const emoji = g.emoji || '🎯';
    const bgGradient = isCompleted
      ? 'linear-gradient(135deg, #2A4D1B 0%, #3B6D11 100%)'
      : 'linear-gradient(135deg, #185FA5 0%, #2D7BC9 100%)';

    html += `
      <div style="margin-bottom:10px; padding:14px; border-radius:14px; background:${bgGradient}; color:white;">
        <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
          <div style="flex:1; min-width:0;">
            <div style="font-size:14px; font-weight:600; margin-bottom:2px;">${emoji} ${g.title}</div>
            <div style="font-size:10px; opacity:0.8;">
              ${g.trackMode === 'total' ? '📊 총자산 자동' : g.trackMode === 'asset' ? '🎯 특정 자산' : '✏️ 직접 입력'}
              ${timeLeft ? ` · ${timeLeft} 남음` : ''}
            </div>
          </div>
          <button onclick="event.stopPropagation(); editGoal(${g.id})" style="border:none; background:rgba(255,255,255,0.15); color:white; padding:4px 8px; border-radius:6px; font-size:10px; cursor:pointer; font-family:inherit;">⋮</button>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:4px; font-size:13px;">
          <span style="font-weight:600;">${formatKoreanMoney(progressAmt)} / ${formatKoreanMoney(g.targetAmount)}</span>
          <span style="font-size:11px; opacity:0.85;">${pct.toFixed(1)}%</span>
        </div>
        <div style="height:6px; background:rgba(255,255,255,0.25); border-radius:3px; overflow:hidden; margin-bottom:${monthlyNeeded > 0 || isCompleted ? '8px' : '0'};">
          <div style="height:100%; width:${pct}%; background:rgba(255,255,255,0.95); transition:width 0.4s;"></div>
        </div>

        ${isCompleted ? `
          <div style="text-align:center; padding:6px; background:rgba(255,255,255,0.18); border-radius:6px; font-size:11px; font-weight:600;">
            🎉 목표 달성!
          </div>
        ` : monthlyNeeded > 0 ? `
          <div style="font-size:10px; opacity:0.85;">
            매달 <b>${formatKoreanMoney(monthlyNeeded)}원</b>씩 필요
          </div>
        ` : ''}

        ${g.trackMode === 'manual' ? `
          <button onclick="updateGoalAmount(${g.id})" style="margin-top:8px; padding:6px 10px; border:none; border-radius:6px; background:rgba(255,255,255,0.2); color:white; font-size:10px; cursor:pointer; font-family:inherit; width:100%;">
            💰 진행 금액 업데이트
          </button>
        ` : ''}
      </div>
    `;
  });

  html += '</div>';
  return html;
}

            <div>

        display.textContent = '';
      }

    document.getElementById('goal-target').addEventListener('input', updateDisplay);
    updateDisplay();
  }, 50);
}

function saveGoal(goalId) {
  const title = document.getElementById('goal-title').value.trim();
  const target = Number(document.getElementById('goal-target').value);
  const deadline = document.getElementById('goal-deadline').value;
  const emoji = document.querySelector('#goal-emoji .chip.active')?.dataset.e || '🎯';
  const trackMode = document.querySelector('input[name="track"]:checked')?.value || 'total';
  const linkedAssetId = trackMode === 'asset' ? Number(document.getElementById('goal-asset-id').value) || null : null;
  const currentAmount = trackMode === 'manual' ? (Number(document.getElementById('goal-current').value) || 0) : 0;

  if (!title || !target) {
    showToast('이름과 금액을 입력해주세요');
    return;
  }
  if (trackMode === 'asset' && !linkedAssetId) {
    showToast('자산을 선택해주세요');
    return;
  }

  if (!settings.financialGoals) settings.financialGoals = [];

  if (goalId) {
    const idx = settings.financialGoals.findIndex(g => g.id === goalId);
    if (idx >= 0) {
      settings.financialGoals[idx] = { ...settings.financialGoals[idx], title, targetAmount: target, deadline, emoji, trackMode, linkedAssetId, currentAmount };
    }
    showToast('목표 수정됨');
  } else {
    settings.financialGoals.push({
      id: Date.now(),
      title,
      targetAmount: target,
      deadline,
      emoji,
      trackMode,
      linkedAssetId,
      currentAmount,
      createdAt: Date.now(),
    });
    showToast(`🎯 목표 "${title}" 추가됨`);
  }

  saveData();
  closeModal();
  renderAsset();
}

function editGoal(goalId) {
  openGoalModal(goalId);
}

function deleteGoal(goalId) {
  if (!confirm('이 목표를 삭제할까요?')) return;
  settings.financialGoals = (settings.financialGoals || []).filter(g => g.id !== goalId);
  saveData();
  showToast('목표 삭제됨');
  closeModal();
  renderAsset();
}

function updateGoalAmount(goalId) {
  const g = (settings.financialGoals || []).find(x => x.id === goalId);
  if (!g) return;
  const newAmt = prompt(`"${g.title}"의 현재 진행 금액 (원):`, g.currentAmount || 0);
  if (newAmt === null) return;
  g.currentAmount = Number(newAmt) || 0;
  saveData();
  showToast(`진행 금액 ${g.currentAmount.toLocaleString()}원으로 업데이트`);
  renderAsset();
}

function renderAssetTrendCard() {
  const snaps = settings.assetSnapshots || {};
  const keys = Object.keys(snaps).sort();
  if (keys.length < 2) {
    return `<div style="background:white; border:0.5px solid var(--border-tertiary); border-radius:14px; padding:16px; margin-bottom:14px; text-align:center; color:var(--text-tertiary); font-size:12px;">
      📈 자산 변화 추이는 <b>2개월 이상</b> 데이터가 모이면 표시됩니다.<br>
      <span style="font-size:10px;">매달 자동 저장됨</span>
    </div>`;
  }

  // 최근 12개월만
  const recent = keys.slice(-12);
  const totals = recent.map(k => snaps[k].total);
  const max = Math.max(...totals);
  const min = Math.min(...totals);
  const range = max - min || 1;

  // SVG 좌표 계산
  const w = 280, h = 110, padL = 40, padR = 10, padT = 10, padB = 24;
  const innerW = w - padL - padR;
  const innerH = h - padT - padB;

  const points = recent.map((k, i) => {
    const x = padL + (recent.length > 1 ? (i / (recent.length - 1)) * innerW : innerW / 2);
    const y = padT + innerH - ((snaps[k].total - min) / range) * innerH;
    return { x, y, k, v: snaps[k].total };
  });

  const linePath = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)} ${p.y.toFixed(1)}`).join(' ');

  const lastTotal = totals[totals.length - 1];
  const firstTotal = totals[0];
  const change = lastTotal - firstTotal;
  const changePct = firstTotal > 0 ? (change / firstTotal * 100) : 0;

  return `
    <div style="background:white; border:0.5px solid var(--border-tertiary); border-radius:14px; padding:16px; margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px;">

          ${isUp ? '+' : ''}${(change/10000).toFixed(0)}만 (${isUp ? '+' : ''}${changePct.toFixed(1)}%)
        </div>
      </div>

      <svg width="100%" viewBox="0 0 ${w} ${h}" style="display:block;">
        <!-- Y축 라벨 -->
        <text x="${padL-4}" y="${padT+4}" font-size="9" fill="#999" text-anchor="end">${(max/10000).toFixed(0)}만</text>
        <text x="${padL-4}" y="${padT+innerH+3}" font-size="9" fill="#999" text-anchor="end">${(min/10000).toFixed(0)}만</text>

        <!-- 영역 -->
        <path d="${areaPath}" fill="rgba(94,92,230,0.15)" />

        <!-- 라인 -->
        <path d="${linePath}" stroke="#5E5CE6" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" />

        <!-- 점 -->
        ${points.map(p => `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="#5E5CE6" stroke="white" stroke-width="1.5" />`).join('')}

        <!-- X축 라벨 -->
        ${points.map((p, i) => {
          if (recent.length > 6 && i % 2 !== 0 && i !== points.length - 1) return '';
          const monthLabel = p.k.split('-')[1] + '월';
          return `<text x="${p.x.toFixed(1)}" y="${(h-6).toFixed(1)}" font-size="9" fill="#999" text-anchor="middle">${monthLabel}</text>`;
        }).join('')}
      </svg>

      <!-- 종류별 비율 변화 (최신 vs 이전달) -->
      ${recent.length >= 2 ? renderAssetTypeChange(snaps[recent[recent.length-2]].byType, snaps[recent[recent.length-1]].byType) : ''}
    </div>
  `;
}

// 종류별 비율 변화
function renderAssetTypeChange(prevByType, currByType) {
  const allTypes = new Set([...Object.keys(prevByType||{}), ...Object.keys(currByType||{})]);
  const currTotal = Object.values(currByType||{}).reduce((s,v) => s+Number(v), 0);
  const prevTotal = Object.values(prevByType||{}).reduce((s,v) => s+Number(v), 0);
  if (currTotal === 0) return '';

  const items = [];
  allTypes.forEach(t => {
    const curr = Number(currByType?.[t]) || 0;
    const prev = Number(prevByType?.[t]) || 0;
    if (curr === 0 && prev === 0) return;
    const currPct = currTotal > 0 ? (curr / currTotal * 100) : 0;
    const prevPct = prevTotal > 0 ? (prev / prevTotal * 100) : 0;
    const diff = currPct - prevPct;
    items.push({ type: t, currPct, diff, curr });
  });
  items.sort((a, b) => b.curr - a.curr);

  return `
    <div style="margin-top:14px; padding-top:12px; border-top:0.5px solid var(--border-tertiary);">
      <div style="font-size:11px; color:var(--text-tertiary); margin-bottom:8px;">지난달 대비 비율 변화</div>
      ${items.slice(0, 6).map(it => {
        const diffStr = it.diff >= 0.1 ? `+${it.diff.toFixed(1)}%p` : it.diff <= -0.1 ? `${it.diff.toFixed(1)}%p` : '';
        const diffColor = it.diff > 0.1 ? 'var(--text-success)' : it.diff < -0.1 ? 'var(--text-danger)' : 'var(--text-tertiary)';
        return `
          <div style="display:flex; align-items:center; gap:8px; padding:4px 0; font-size:11px;">
            <span style="width:50px;">${it.type}</span>
            <div style="flex:1; height:5px; background:rgba(0,0,0,0.05); border-radius:3px; overflow:hidden;">
              <div style="height:100%; width:${it.currPct}%; background:#5E5CE6;"></div>
            </div>
            <span style="width:42px; text-align:right; font-weight:500;">${it.currPct.toFixed(0)}%</span>
            <span style="width:48px; text-align:right; color:${diffColor}; font-size:10px;">${diffStr}</span>
          </div>
        `;
      }).join('')}
    </div>
  `;
}

// 캐시: 같은 프롬프트는 1시간 동안 재사용 (토큰 절약)
const aiCache = {};
const AI_CACHE_TIME = 60 * 60 * 1000; // 1시간

// AI 호출 진행 상태 - 탭 이동에도 결과 유지
window._aiInFlight = window._aiInFlight || {}; // {cacheKey: Promise}
window._aiInFlightStatus = window._aiInFlightStatus || {}; // {cacheKey: 'loading'}
window._aiLastError = window._aiLastError || {}; // {cacheKey: { error: '...', time: ... }} - 최근 에러 (10분 유지)

async function askGemini(prompt, options = {}) {
  const { useCache = true, cacheKey = null, maxRetries = 1 } = options;

  const cKey = cacheKey || prompt;
  if (useCache && aiCache[cKey] && Date.now() - aiCache[cKey].time < AI_CACHE_TIME) {
    return { text: aiCache[cKey].text, cached: true };
  }

  const apiKey = window.GEMINI_API_KEY;
  if (!apiKey) {
    return { error: 'AI 키가 설정되지 않았어요. 우측 상단 톱니바퀴에서 키를 입력하세요.', needsKey: true };
  }

  const models = ['gemini-flash-latest', 'gemini-2.0-flash', 'gemini-2.5-flash'];
  let lastError = '알 수 없는 오류';

  try {
    for (const model of models) {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 12000); 

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: prompt }] }],
              generationConfig: { temperature: 0.7, maxOutputTokens: 8000 },
            }),
            signal: controller.signal,
          });

          clearTimeout(timeoutId);

          if (!res.ok) {
            const errData = await res.json().catch(() => null);
            if (res.status === 429) {
              if (attempt < maxRetries) {
                await new Promise(r => setTimeout(r, 2000));
                continue;
              }
              return { error: '429: AI 호출 한도 도달. 잠시 후 다시 시도해주세요.' };
            }
            lastError = `${res.status}: ${errData?.error?.message || '오류'}`;
            break; 
          }

          const data = await res.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          
          if (!text) throw new Error('응답이 비어있음');

          console.log(`✅ Gemini ${model} 성공`);
          aiCache[cKey] = { text, time: Date.now() };
          localStorage.setItem('ai_cache_today', JSON.stringify(aiCache));
          return { text, cached: false };

        } catch (e) {
          lastError = e.message;
          if (attempt < maxRetries) {
            await new Promise(r => setTimeout(r, 2000));
            continue;
          }
          break;
        }
      }
    }
  } catch (e) {
    // 외부 에러
    lastError = e.message || '알 수 없는 오류';
  }

  return { error: `모든 모델 실패. 마지막 에러: ${lastError}` };
}
// AI 응답을 마크다운 → HTML로 간단 변환
function renderAIText(text) {
  if (!text) return '';
  let result = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // 안전한 HTML 태그 복원
  // 자기 닫는 태그
  result = result.replace(/&lt;br\s*\/?&gt;/gi, '<br>');
  result = result.replace(/&lt;hr\s*\/?&gt;/gi, '<hr style="border:none; border-top:0.5px solid var(--border-tertiary); margin:8px 0;">');

  // 닫는 태그 먼저 (열기 태그가 닫기 태그 패턴이랑 충돌 안 나게)
  result = result.replace(/&lt;\/small&gt;/gi, '</small>');
  result = result.replace(/&lt;\/font&gt;/gi, '</font>');
  result = result.replace(/&lt;\/b&gt;/gi, '</b>');
  result = result.replace(/&lt;\/strong&gt;/gi, '</strong>');
  result = result.replace(/&lt;\/i&gt;/gi, '</i>');
  result = result.replace(/&lt;\/em&gt;/gi, '</em>');
  result = result.replace(/&lt;\/span&gt;/gi, '</span>');
  result = result.replace(/&lt;\/h3&gt;/gi, '</h3>');
  result = result.replace(/&lt;\/h4&gt;/gi, '</h4>');
  result = result.replace(/&lt;\/h5&gt;/gi, '</h5>');
  result = result.replace(/&lt;\/ul&gt;/gi, '</ul>');
  result = result.replace(/&lt;\/ol&gt;/gi, '</ol>');
  result = result.replace(/&lt;\/li&gt;/gi, '</li>');
  result = result.replace(/&lt;\/p&gt;/gi, '</p>');
  result = result.replace(/&lt;\/div&gt;/gi, '</div>');

  // 여는 태그 (속성 포함된 거 처리)
  result = result.replace(/&lt;small[^&]*?&gt;/gi, '<small style="font-size:0.85em; opacity:0.7;">');
  result = result.replace(/&lt;font[^&]*?&gt;/gi, '<small style="font-size:0.85em; opacity:0.7;">');
  result = result.replace(/&lt;b&gt;/gi, '<b style="font-weight:600;">');
  result = result.replace(/&lt;strong&gt;/gi, '<strong style="font-weight:600;">');
  result = result.replace(/&lt;i&gt;/gi, '<i>');
  result = result.replace(/&lt;em&gt;/gi, '<em>');
  result = result.replace(/&lt;h3[^&]*?&gt;/gi, '<h3 style="font-size:14px; font-weight:600; margin:10px 0 6px;">');
  result = result.replace(/&lt;h4[^&]*?&gt;/gi, '<h4 style="font-size:13px; font-weight:600; margin:8px 0 4px;">');
  result = result.replace(/&lt;h5[^&]*?&gt;/gi, '<h5 style="font-size:12px; font-weight:600; margin:6px 0 3px;">');
  result = result.replace(/&lt;ul[^&]*?&gt;/gi, '<ul style="margin:6px 0; padding-left:18px;">');
  result = result.replace(/&lt;ol[^&]*?&gt;/gi, '<ol style="margin:6px 0; padding-left:18px;">');
  result = result.replace(/&lt;li[^&]*?&gt;/gi, '<li style="margin:2px 0;">');
  result = result.replace(/&lt;span[^&]*?&gt;/gi, '<span>');
  result = result.replace(/&lt;p[^&]*?&gt;/gi, '<p style="margin:6px 0;">');
  result = result.replace(/&lt;div[^&]*?&gt;/gi, '<div>');

  // 마크다운 변환
  result = result.replace(/\*\*(.+?)\*\*/g, '<b style="font-weight:600;">$1</b>');
  result = result.replace(/\*(.+?)\*/g, '<i>$1</i>');
  result = result.replace(/`(.+?)`/g, '<code style="background:rgba(0,0,0,0.05); padding:1px 4px; border-radius:3px; font-size:11px;">$1</code>');
  result = result.replace(/\n\n/g, '</p><p style="margin: 8px 0;">');
  result = result.replace(/\n/g, '<br>');

  return result;
}

async function generateActionAdvice(forceRefresh = false) {
  const cacheKey = 'action-advice-' + new Date().toDateString();

  if (forceRefresh) delete aiCache[cacheKey];

  if (aiCache[cacheKey] && Date.now() - aiCache[cacheKey].time < AI_CACHE_TIME) {
    return { text: aiCache[cacheKey].text, cached: true };
  }

  const indices = await fetchMarketIndices();
  const total = assets.reduce((s, a) => {
    const live = liveAssetData[a.id];
    return s + (live?.hasLive && live.krwValue ? live.krwValue : Number(a.qty) * Number(a.price));
  }, 0);

  const byType = {};
  assets.forEach(a => {
    const live = liveAssetData[a.id];
    const v = live?.hasLive && live.krwValue ? live.krwValue : Number(a.qty) * Number(a.price);
    byType[a.type] = (byType[a.type] || 0) + v;
  });

  const typeSummary = Object.entries(byType).map(([type, v]) => {
    const pct = total > 0 ? ((v / total) * 100).toFixed(1) : '0';
    return `- ${type}: ${v.toLocaleString()}원 (${pct}%)`;
  }).join('\n');

  const monthlyIncome = settings.monthlyIncome || 0;
  const monthlySaving = monthlyIncome - (budget.total || 0);

  const thisMonthPrefix = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  const thisMonthExpenses = budget.expenses.filter(e => !e.dateKey || e.dateKey.startsWith(thisMonthPrefix));
  const variableSpent = thisMonthExpenses.reduce((s, e) => s + Number(e.amt), 0);

  const prompt = `한국 개인 투자자를 위한 자산관리 AI 코치입니다. 사용자의 자산/소득/시장 상황을 종합 분석해 이번 달 우선순위 액션 3가지를 추천해주세요.

## 사용자 정보
- 월 소득: ${monthlyIncome.toLocaleString()}원
- 월 변동지출 예산: ${(budget.total || 0).toLocaleString()}원
- 월 저축 가능액: ${monthlySaving.toLocaleString()}원
- 이번 달 변동지출: ${variableSpent.toLocaleString()}원 (${currentMonth+1}월 ${today}일 기준)

## 자산 구성 (총 ${total.toLocaleString()}원)
${typeSummary || '(미등록)'}

## 오늘 글로벌 시장 상황
**🇺🇸 미국**
- S&P500: ${indices.sp500 ? `${indices.sp500.price.toFixed(2)} (${indices.sp500.changePct >= 0 ? '+' : ''}${indices.sp500.changePct.toFixed(2)}%)` : '?'}
- 나스닥: ${indices.nasdaq ? `${indices.nasdaq.price.toFixed(2)} (${indices.nasdaq.changePct >= 0 ? '+' : ''}${indices.nasdaq.changePct.toFixed(2)}%)` : '?'}

**🇰🇷 한국**

- 코스닥: ${indices.kosdaq ? `${indices.kosdaq.price.toFixed(2)} (${indices.kosdaq.changePct >= 0 ? '+' : ''}${indices.kosdaq.changePct.toFixed(2)}%)` : '?'}

**💱 환율 & 원자재**

// ====== Yahoo Finance 시세 ======
const PRICE_CACHE_TIME = 5 * 60 * 1000; // 5분

async function fetchYahooPrice(ticker) {
  if (!ticker) return null;

  // 캐시 확인
  const cached = priceCache[ticker];
  if (cached && Date.now() - cached.time < PRICE_CACHE_TIME) {
    return cached.data;
  }

  // Yahoo Finance API URL
  const yahooUrl = `https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(ticker)}?interval=1d&range=2d`;

  // CORS 프록시 후보들 (본인 Cloudflare Worker 1순위)
  const proxies = [
    {
      url: `https://life-planner.qorwl503.workers.dev/?url=${encodeURIComponent(yahooUrl)}`,
      parse: async (res) => {
        const w = await res.json();
        return JSON.parse(w.contents);
      }
    },
    {
      url: `https://api.allorigins.win/get?url=${encodeURIComponent(yahooUrl)}`,
      parse: async (res) => {
        const w = await res.json();
        return JSON.parse(w.contents);
      }
    },
    {
      url: `https://corsproxy.io/?${encodeURIComponent(yahooUrl)}`,
      parse: async (res) => res.json()
    },
    {
      url: `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(yahooUrl)}`,
      parse: async (res) => res.json()
    },
  ];

  for (const proxy of proxies) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000); // 8초 타임아웃

      const res = await fetch(proxy.url, { signal: controller.signal });
      clearTimeout(timeoutId);

      if (!res.ok) continue;

      const data = await proxy.parse(res);

      if (data.chart?.error) {
        console.error(`${ticker} Yahoo 에러:`, data.chart.error);
        continue;
      }

      const result = data.chart?.result?.[0];
      if (!result) continue;

      const meta = result.meta;
      const currentPrice = meta.regularMarketPrice;
      const previousClose = meta.chartPreviousClose || meta.previousClose;
      const currency = meta.currency || 'USD';

      if (!currentPrice) continue;

      const changePct = previousClose > 0 ? ((currentPrice - previousClose) / previousClose) * 100 : 0;

      const priceData = {
        ticker,
        price: currentPrice,
        previousClose,
        changePct,
        currency,
        time: Date.now()
      };

      priceCache[ticker] = { data: priceData, time: Date.now() };
      return priceData;
    } catch (e) {
      console.warn(`${ticker} 프록시 실패 (${proxy.url.substring(0, 30)}...):`, e.message);
      continue;
    }
  }

  console.error(`${ticker}: 모든 프록시 실패`);
  return null;
}

// 환율 조회 (USD → KRW)
let exchangeRateCache = null;
async function getUSDKRW() {
  if (exchangeRateCache && Date.now() - exchangeRateCache.time < 30 * 60 * 1000) {
    return exchangeRateCache.rate;
  }
  // USDKRW=X 우선 시도, 안 되면 KRW=X 시도
  let data = await fetchYahooPrice('USDKRW=X');
  if (!data?.price) {
    data = await fetchYahooPrice('KRW=X');
  }
  if (data?.price) {
    exchangeRateCache = { rate: data.price, time: Date.now() };
    return data.price;
  }
  return 1380; // 폴백
}

// 자산 라이브 데이터
let liveAssetData = {};

async function fetchAssetLive(asset) {
  if (!asset.ticker) {
    return {
      currentPrice: Number(asset.price),
      krwValue: Number(asset.qty) * Number(asset.price),
      changePct: 0,
      profitPct: 0,
      hasLive: false,
    };
  }

  const priceData = await fetchYahooPrice(asset.ticker);
  if (!priceData) {
    return {
      currentPrice: Number(asset.price),
      krwValue: Number(asset.qty) * Number(asset.price),
      changePct: 0,
      profitPct: 0,
      hasLive: false,
      error: true,
    };
  }

  let krwPrice = priceData.price;
  let krwAvgPrice = Number(asset.price);
  if (priceData.currency === 'USD') {
    const rate = await getUSDKRW();
    krwPrice = priceData.price * rate;
    krwAvgPrice = Number(asset.price) * rate;
  }

  const krwValue = Number(asset.qty) * krwPrice;
  const profitPct = krwAvgPrice > 0 ? ((krwPrice - krwAvgPrice) / krwAvgPrice) * 100 : 0;

  return {
    currentPrice: priceData.price,
    krwPrice,
    krwValue,
    changePct: priceData.changePct,
    profitPct,
    currency: priceData.currency,
    hasLive: true,
  };
}

async function refreshAllAssetPrices() {
  const promises = assets.filter(a => a.ticker).map(async (a) => {
    const data = await fetchAssetLive(a);
    liveAssetData[a.id] = data;
  });
  await Promise.all(promises);
}

// 네이버 국내 금 시세 (g당 원)
async function fetchNaverGoldDomestic() {
  const proxies = [
    url => `https://life-planner.qorwl503.workers.dev/?url=${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
  ];
  const target = 'https://finance.naver.com/marketindex/goldDetail.naver';

  for (const proxyFn of proxies) {
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 8000);

      const res = await fetch(proxyFn(target), { signal: controller.signal });
      clearTimeout(timeoutId);
      if (!res.ok) continue;

      let html = await res.text();
      // allorigins는 JSON 래핑됨
      try {
        const j = JSON.parse(html);
        if (j.contents) html = j.contents;
      } catch (e) {}

      // 네이버 국내 금 = "218,860.79원/g" 형식
      // 1순위: "원/g" 텍스트 앞의 숫자 (가장 정확)
      let priceMatch = html.match(/([0-9]{1,3}(?:,[0-9]{3})*\.?[0-9]*)\s*(?:원\s*\/\s*g|원\/g)/);

      if (!priceMatch) {
        // 2순위: no_today em 태그 (네이버 표준 현재가 위치)
        priceMatch = html.match(/no_today[^<]*<em[^>]*>([\s\S]*?)<\/em>/);
        if (priceMatch) {
          // 안에 여러 span 있을 수 있어 숫자만 추출
          const inner = priceMatch[1].replace(/<[^>]+>/g, '').replace(/\s/g, '');
          priceMatch = inner.match(/([0-9]{1,3}(?:,[0-9]{3})*\.?[0-9]*)/);
        }
      }

      if (!priceMatch) {
        // 3순위: 6자리 가격 형식
        priceMatch = html.match(/>([0-9]{3},[0-9]{3}\.[0-9]{2})</);
      }

      if (priceMatch) {
        const price = parseFloat(priceMatch[1].replace(/,/g, ''));
        console.log(`💰 네이버 국내 금: ${price}원/g`);

        // 합리적 범위 - g당 가격 (2026년 약 21만원/g)
        if (price > 50000 && price < 500000) {
          let changePct = 0;
          // 변동률 추출
          const pctMatch = html.match(/등락률[^0-9-]*([-+]?[0-9.]+)/) ||
                            html.match(/<em[^>]*class="rate"[^>]*>([-+]?[0-9.]+)%?</);
          if (pctMatch) {
            changePct = parseFloat(pctMatch[1]);
            if (html.match(/class="down"|down_p|하락/)) changePct = -Math.abs(changePct);
          }

          return { price, changePct };
        }
      }
      return null;
    } catch (e) {
      console.error('네이버 금 프록시 실패:', e);
      continue;
    }
  }
  return null;
}

// ====== YouTube Data API ======
const ytCache = {}; // 같은 검색 반복 방지

async function searchYoutube(query, maxResults = 8, order = 'relevance') {
  if (!query) return [];

  // 캐시 확인 (5분 유효) - 정렬 옵션 포함
  const cacheKey = `${query}_${maxResults}_${order}`;
  if (ytCache[cacheKey] && Date.now() - ytCache[cacheKey].time < 5 * 60 * 1000) {
    return ytCache[cacheKey].data;
  }

  try {
    const apiKey = window.YOUTUBE_API_KEY;
    if (!apiKey) {
      console.error('YouTube API 키 없음');
      return { error: 'YouTube API 키가 설정되지 않았어요' };
    }

    // order: relevance(관련성), date(최신순), viewCount(조회수순), rating(평점순)
    const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=${maxResults}&q=${encodeURIComponent(query)}&type=video&order=${order}&relevanceLanguage=ko&key=${apiKey}`;
    console.log(`🎬 YouTube 검색: ${query} (정렬: ${order})`);

    const res = await fetch(url, { referrerPolicy: 'origin' });
    const data = await res.json();

    if (!res.ok || data.error) {
      const errMsg = data.error?.message || `HTTP ${res.status}`;
      const errReason = data.error?.errors?.[0]?.reason || '';
      console.error('YouTube API 에러:', res.status, errMsg, errReason);

      let friendlyMsg = errMsg;
      if (errReason === 'quotaExceeded') {
        friendlyMsg = 'YouTube 일일 한도 초과 (내일 다시 시도)';
      } else if (errReason === 'keyInvalid' || res.status === 400) {
        friendlyMsg = 'YouTube API 키 문제';
      } else if (res.status === 403) {
        friendlyMsg = '권한 거부 (도메인 제한 또는 한도 초과)';
      }

      return { error: friendlyMsg };
    }

    const videos = (data.items || []).map(item => ({
      id: item.id.videoId,
      title: item.snippet.title,
      channel: item.snippet.channelTitle,
      thumb: item.snippet.thumbnails.medium?.url || item.snippet.thumbnails.default?.url,
      publishedAt: item.snippet.publishedAt,
    }));

    console.log(`✅ YouTube ${videos.length}개 영상`);
    ytCache[cacheKey] = { data: videos, time: Date.now() };
    return videos;
  } catch (e) {
    console.error('YouTube 검색 실패:', e);
    return { error: '네트워크 오류: ' + (e.message || '알 수 없음') };
  }
}

// 시간 포맷 (n일 전 / n시간 전)
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const date = new Date(dateStr);
  const now = new Date();
  const diff = (now - date) / 1000; // 초
  if (diff < 60) return '방금';
  if (diff < 3600) return Math.floor(diff/60) + '분 전';
  if (diff < 86400) return Math.floor(diff/3600) + '시간 전';
  if (diff < 86400 * 7) return Math.floor(diff/86400) + '일 전';
  if (diff < 86400 * 30) return Math.floor(diff/86400/7) + '주 전';
  if (diff < 86400 * 365) return Math.floor(diff/86400/30) + '개월 전';
  return Math.floor(diff/86400/365) + '년 전';
}

// ====== 자산 - 뉴스 (RSS 자동 피드) ======
let newsCache = null;

async function fetchNewsRSS() {
  if (newsCache && Date.now() - newsCache.time < 5 * 60 * 1000) {
    return newsCache.items;
  }

  const sources = [
    { name:'인베스팅닷컴', url:'https://kr.investing.com/rss/news_25.rss', tag:'증시' },
    { name:'Investing.com', url:'https://www.investing.com/rss/news_25.rss', tag:'🇺🇸 글로벌' },
    { name:'한경 증권', url:'https://www.hankyung.com/feed/finance', tag:'증시' },
    { name:'한국경제', url:'https://www.hankyung.com/feed/economy', tag:'경제' },
    { name:'Yahoo Finance', url:'https://finance.yahoo.com/news/rssindex', tag:'🇺🇸 글로벌' },
  ];

  const allItems = [];

  // 여러 프록시 서버 시도 (본인 Cloudflare Worker 1순위 - 안정적)
  const proxies = [
    url => `https://life-planner.qorwl503.workers.dev/?url=${encodeURIComponent(url)}`,
    url => `https://api.allorigins.win/get?url=${encodeURIComponent(url)}`,
    url => `https://corsproxy.io/?${encodeURIComponent(url)}`,
    url => `https://api.codetabs.com/v1/proxy/?quest=${encodeURIComponent(url)}`,
  ];

  // 전체 함수 최대 25초 안에 끝내기 (인베스팅 시간 충분히)
  const overallTimeout = new Promise(resolve => setTimeout(resolve, 25000));

  const fetchAll = Promise.all(sources.map(async (source) => {
    let success = false;
    
    for (const proxyFn of proxies) {
      if (success) break;
      
      try {
        const proxyUrl = proxyFn(source.url);
        
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 12000); // 12초 (인베스팅 등 느린 사이트 위해)
        
        const res = await fetch(proxyUrl, {
          signal: controller.signal,
        });
        
        clearTimeout(timeoutId);
        
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        
        const wrapper = await res.json();
        const xml = wrapper.contents;
        if (!xml) throw new Error('빈 응답');

        // JSON 형식 처리 (네이버 증권 등)
        if (source.isJson) {
          try {
            const jsonData = JSON.parse(xml);
            const newsList = jsonData?.newsList || jsonData?.list || jsonData?.items || [];
            newsList.slice(0, 10).forEach(item => {
              const title = (item.title || item.officeName || '').trim();
              const link = item.officialUrl || item.url || `https://m.stock.naver.com/news/${item.articleId || ''}`;
              const pubDate = item.datetime || item.publishedAt || new Date().toISOString();
              if (title) {
                allItems.push({
                  title: title.substring(0, 100),
                  link,
                  pubDate,
                  source: source.name,
                  tag: source.tag,
                });
              }
            });
            success = true;
            console.log(`✅ ${source.name} JSON 로드 (${newsList.length}개)`);
            continue;
          } catch (jsonErr) {
            throw new Error('JSON 파싱 실패');
          }
        }

        // XML 파싱 (일반 RSS)
        const parser = new DOMParser();
        const doc = parser.parseFromString(xml, 'text/xml');
        
        if (doc.getElementsByTagName('parsererror').length > 0) {
          throw new Error('XML 파싱 실패');
        }
        
        const items = doc.getElementsByTagName('item');
        console.log(`📡 ${source.name}: ${items.length}개 item 발견`);

        let addedCount = 0;
        Array.from(items).slice(0, 10).forEach((item, idx) => {
          // 모든 직접 자식 노드 중에서 link 찾기 (enclosure 무시)
          const children = Array.from(item.children);

          const titleEl = children.find(c => c.tagName === 'title');
          const pubDateEl = children.find(c => c.tagName === 'pubDate');
          // link 태그 중에서 enclosure가 아닌 거 (직접 자식 link)
          const linkEl = children.find(c => c.tagName === 'link');

          const title = titleEl?.textContent?.trim() || '';
          let link = linkEl?.textContent?.trim() || '';
          // link 태그 자체에 텍스트 없으면 href 속성 시도 (Atom 형식)
          if (!link && linkEl) {
            link = linkEl.getAttribute('href') || '';
          }
          const pubDate = pubDateEl?.textContent?.trim() || new Date().toISOString();

          // 디버그용 첫 번째 아이템 정보
          if (idx === 0) {
            console.log(`   첫 item: title="${title.substring(0,30)}", link="${link.substring(0,40)}"`);
          }

          if (title) {  // link 없어도 title만 있으면 추가
            allItems.push({
              title: title.replace(/<!\[CDATA\[|\]\]>/g, '').substring(0, 100),
              link: link.replace(/<!\[CDATA\[|\]\]>/g, '') || '#',
              pubDate,
              source: source.name,
              tag: source.tag,
            });
            addedCount++;
          }
        });
        
        success = true;
        console.log(`✅ ${source.name} 로드 성공 (${addedCount}/${items.length}개 추가)`);
        
      } catch (e) {
        console.warn(`⚠️ ${source.name} 프록시 실패:`, e.message);
      }
    }
    
    if (!success) {
      console.warn(`❌ ${source.name} 모든 프록시 실패`);
    }
  }));

  // 어느 쪽이든 먼저 끝나는 것에 따라 진행
  await Promise.race([fetchAll, overallTimeout]);

  // 날짜 파싱 안전 처리 (인베스팅 등 다양한 형식 호환)
  function parseDate(dateStr) {
    if (!dateStr) return new Date(0); // 빈 값이면 1970년 (제일 뒤)
    try {
      // "2026-05-14 06:41:28" 형식 처리 (인베스팅) → ISO로
      let cleaned = dateStr.trim();
      if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(cleaned)) {
        cleaned = cleaned.replace(' ', 'T') + '+09:00'; // 한국 시간으로 가정
      }
      const d = new Date(cleaned);
      if (isNaN(d.getTime())) return new Date(0);
      return d;
    } catch (e) {
      return new Date(0);
    }
  }

  // 시간 순 정렬
  allItems.sort((a, b) => parseDate(b.pubDate) - parseDate(a.pubDate));

  // 소스별 균등 배치: 각 소스에서 최소 3개씩은 상단에
  const bySource = {};
  allItems.forEach(item => {
    if (!bySource[item.source]) bySource[item.source] = [];
    bySource[item.source].push(item);
  });

  // 인터리브: 각 소스에서 1개씩 돌아가며 추가 (최대 8개씩)
  const interleaved = [];
  let maxIter = 8;
  for (let i = 0; i < maxIter; i++) {
    Object.values(bySource).forEach(arr => {
      if (arr[i]) interleaved.push(arr[i]);
    });
  }

  // 나머지 추가 (이미 추가된 거 제외)
  const interleavedSet = new Set(interleaved);
  const remaining = allItems.filter(item => !interleavedSet.has(item));
  const finalItems = [...interleaved, ...remaining];

  newsCache = { items: finalItems, time: Date.now() };
  return finalItems;
}

// ★ AI 자산 코치 - 진짜 Gemini 사용
function renderAICoaching(total, byType) {
  if (total === 0) {
    return `<div class="ai-card">
      <div class="ai-badge"><i class="ti ti-sparkles" style="font-size:11px;"></i> AI 자산 코치</div>
      <h3>먼저 자산을 입력해주세요</h3>
      <div class="ai-text">보유한 주식, 예금, 현금 등을 입력하면 AI가 포트폴리오를 분석하고 맞춤 자산 플랜을 추천해드려요.</div>
    </div>`;
  }

  // 시뮬레이션 부분 (단순 수식)은 유지 - 데이터 계산이라 AI 아님
  const stockPct = ((byType['주식'] || 0) + (byType['ETF'] || 0) + (byType['펀드'] || 0)) / total * 100;
  const safePct = ((byType['예적금'] || 0) + (byType['현금'] || 0) + (byType['채권'] || 0)) / total * 100;
  const goldPct = (byType['금'] || 0) / total * 100;
  const dollarPct = (byType['달러'] || 0) / total * 100;

  // 실제 월 투자액 자동 계산 (최근 3개월 평균)
  function getAvgMonthlyInvest() {
    const now = new Date();
    let totalInvest = 0;
    let months = 0;
    const investCats = ['주식','ETF','펀드','채권','금','달러','예적금','청약','부동산','투자'];

    // 자동매수 (고정지출 - 투자) 월별 합계
    let autoBuyPerMonth = 0;
    (budget.fixed || []).forEach(f => {
      if (f.cat !== '투자') return;
      const cycle = f.cycle || 'monthly';
      if (cycle === 'monthly') autoBuyPerMonth += Number(f.amt);
      else if (cycle === 'weekly') autoBuyPerMonth += Number(f.amt) * 4.33;
      else if (cycle === 'biweekly') autoBuyPerMonth += Number(f.amt) * 2.17;
    });

    // 최근 3개월 가계부의 투자 카테고리 합계
    for (let i = 0; i < 3; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const prefix = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
      const monthInvest = (budget.expenses || [])
        .filter(e => e.dateKey?.startsWith(prefix) && investCats.includes(e.cat) && !e.autoBuy)
        .reduce((s, e) => s + Number(e.amt), 0);
      if (monthInvest > 0 || i === 0) {
        totalInvest += monthInvest;
        months++;
      }
    }
    const avgManual = months > 0 ? totalInvest / months : 0;
    return Math.round(avgManual + autoBuyPerMonth);
  }

  // 사용자 설정 우선, 없으면 자동 계산
  const calculatedMonthly = getAvgMonthlyInvest();
  const monthlySaving = (settings.simMonthlyOverride !== undefined && settings.simMonthlyOverride !== null)
    ? Number(settings.simMonthlyOverride)
    : calculatedMonthly;
  const yearly = monthlySaving * 12;

  // 사용자 설정 수익률 우선, 없으면 비중 기반 자동 계산
  let autoReturn = 0;
  autoReturn += (stockPct / 100) * 0.08;
  autoReturn += (safePct / 100) * 0.035;
  autoReturn += (goldPct / 100) * 0.05;
  autoReturn += (dollarPct / 100) * 0.03;
  autoReturn = Math.max(autoReturn, 0.02);

  const expectedReturn = (settings.simReturnOverride !== undefined && settings.simReturnOverride !== null)
    ? Number(settings.simReturnOverride) / 100
    : autoReturn;

  const expected1Y = Math.round(total * (1 + expectedReturn) + yearly);
  const expected3Y = Math.round(total * Math.pow(1 + expectedReturn, 3) + yearly * ((Math.pow(1 + expectedReturn, 3) - 1) / expectedReturn));
  const expected10Y = Math.round(total * Math.pow(1 + expectedReturn, 10) + yearly * ((Math.pow(1 + expectedReturn, 10) - 1) / expectedReturn));

  const isCustomMonthly = settings.simMonthlyOverride !== undefined && settings.simMonthlyOverride !== null;
  const isCustomReturn = settings.simReturnOverride !== undefined && settings.simReturnOverride !== null;

  // AI 분석 부분은 div로만 두고 비동기로 채움
  const html = `<div id="ai-asset-coach-card"></div>

    <div class="ai-card" style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div class="ai-badge" style="background:rgba(255,255,255,0.15); color:white;"><i class="ti ti-trending-up" style="font-size:11px;"></i> 미래 자산 시뮬레이션</div>
        <button onclick="openSimSettings()" style="border:none; background:rgba(255,255,255,0.15); color:white; padding:4px 10px; border-radius:999px; font-size:10px; font-weight:500; cursor:pointer; font-family:inherit;">⚙️ 조정</button>
      </div>
      <div style="margin-top:10px;">
        <div style="font-size:11px; opacity:0.85; margin-bottom:8px; line-height:1.5;">
          월 ${(monthlySaving/10000).toFixed(0)}만원 투자 ${isCustomMonthly ? '<span style="opacity:0.6;">(직접 설정)</span>' : '<span style="opacity:0.6;">(자동 계산)</span>'} ·
          연 ${(expectedReturn*100).toFixed(1)}% 수익률 ${isCustomReturn ? '<span style="opacity:0.6;">(직접)</span>' : '<span style="opacity:0.6;">(자동)</span>'}
        </div>
        <div style="display:flex; gap:8px;">
          <div style="flex:1;">
            <div style="font-size:10px; opacity:0.6;">1년 후</div>
            <div style="font-size:14px; font-weight:600;">${formatMoney(expected1Y)}</div>
          </div>
          <div style="flex:1;">
            <div style="font-size:10px; opacity:0.6;">3년 후</div>
            <div style="font-size:14px; font-weight:600;">${formatMoney(expected3Y)}</div>
          </div>
          <div style="flex:1;">
            <div style="font-size:10px; opacity:0.6;">10년 후</div>
            <div style="font-size:14px; font-weight:600; color:#FFD66E;">${formatMoney(expected10Y)}</div>
          </div>
        </div>
        <div style="font-size:9px; opacity:0.5; margin-top:6px;">실제와 다를 수 있음 · ⚙️로 직접 조정 가능</div>
      </div>
    </div>`;

  // 비동기로 AI 코치 호출
  setTimeout(() => loadAIAssetCoach(total, byType, expected1Y, expected3Y, expected10Y), 100);

  return html;
}

// AI 자산 코치 - 진짜 Gemini 분석
async function loadAIAssetCoach(total, byType, expected1Y, expected3Y, expected10Y, forceRefresh = false) {
  const container = document.getElementById('ai-asset-coach-card');
  if (!container) return;

  if (!window.GEMINI_API_KEY) {
    container.innerHTML = `<div class="ai-card" style="margin-bottom:14px;">
      <div class="ai-badge"><i class="ti ti-sparkles" style="font-size:11px;"></i> AI 자산 코치</div>
      <div class="ai-text" style="margin-bottom:10px;">
        AI 자산 분석을 사용하려면 본인 Gemini API 키를 입력해주세요.
      </div>
      <button onclick="openAIKeyModal()" style="padding:8px 14px; border:none; border-radius:6px; background:#FFD700; color:black; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit;">
        <i class="ti ti-key" style="font-size:12px; vertical-align:-2px;"></i> AI 키 입력하기
      </button>
    </div>`;
    return;
  }

  const cacheKey = 'asset-coach-' + new Date().toDateString();
  const byTypeStr = JSON.stringify(byType).replace(/"/g, '&quot;');

  if (!forceRefresh && aiCache[cacheKey] && Date.now() - aiCache[cacheKey].time < AI_CACHE_TIME) {
    const text = aiCache[cacheKey].text;
    container.innerHTML = `<div class="ai-card" style="margin-bottom:14px;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <div class="ai-badge"><i class="ti ti-sparkles" style="font-size:11px;"></i> AI 자산 코치</div>
        <button onclick="delete aiCache['${cacheKey}']; loadAIAssetCoach(${total}, ${byTypeStr}, ${expected1Y}, ${expected3Y}, ${expected10Y}, true);" style="border:none; background:transparent; color:white; opacity:0.7; padding:2px 6px; font-size:10px; cursor:pointer; font-family:inherit;">
          <i class="ti ti-refresh" style="font-size:11px;"></i>
        </button>
      </div>
      <div class="ai-text"><p style="margin:0;">${renderAIText(text)}</p></div>
    </div>`;
    return;
  }

  // 진행 중인 호출이 있으면 → 로딩 상태 그대로 표시하고 결과 대기
  if (window._aiInFlightStatus[cacheKey] === 'loading') {
    container.innerHTML = `<div class="ai-card" style="margin-bottom:14px;">
      <div class="ai-badge"><i class="ti ti-sparkles" style="font-size:11px;"></i> AI 분석 중</div>
      <div style="display:flex; align-items:center; gap:8px; padding:8px 0;">
        <div class="spinner" style="border-color:rgba(255,255,255,0.3); border-top-color:white;"></div>
        <span style="font-size:11px; opacity:0.8;">자산 포트폴리오 분석 중... (계속 진행 중)</span>
      </div>
    </div>`;
    // 기존 호출의 결과 기다림
    if (window._aiInFlight[cacheKey]) {
      window._aiInFlight[cacheKey].then(() => {
        // 결과 받으면 다시 렌더 (현재 탭이 자산이면)
        if (currentTab === 'asset' && assetTab === 'briefing') {
          loadAIAssetCoach(total, byType, expected1Y, expected3Y, expected10Y, false);
        }
      });
    }
    return;
  }

  // 자동 호출 차단 - forceRefresh 없으면 안내만
  if (!forceRefresh) {
    container.innerHTML = `<div class="ai-card" style="margin-bottom:14px;">
      <div class="ai-badge"><i class="ti ti-sparkles" style="font-size:11px;"></i> AI 자산 코치</div>
      <div class="ai-text" style="margin: 10px 0 12px; line-height:1.6;">

async function saveAIKey() {
  const key = document.getElementById('ai-key-input').value.trim();
  if (!key) {
    if (window.GEMINI_API_KEY) {
      closeModal();
      return;
    }
    showToast('API 키를 입력해주세요');
    return;
  }

  if (!key.startsWith('AIzaSy')) {
    showToast('올바른 Gemini API 키 형식이 아니에요 (AIzaSy로 시작)');
    return;
  }

  const sync = document.getElementById('ai-sync-toggle').classList.contains('on');

  // localStorage에 저장
  localStorage.setItem('gemini_api_key', key);
  window.GEMINI_API_KEY = key;

  // Firebase에 저장 (선택)
  if (sync && currentUser) {
    try {
      const { db, doc, setDoc } = window._fb;
      await setDoc(doc(db, 'users', currentUser.uid, 'config', 'ai'), {
        geminiKey: key,
        updatedAt: new Date().toISOString()
      });
      showToast('AI 키 저장됨 (모든 기기 동기화)');
    } catch (e) {
      console.error('Firebase 저장 실패:', e);
      showToast('AI 키 저장됨 (이 기기만)');
    }
  } else {
    showToast('AI 키 저장됨 (이 기기만)');
  }

  closeModal();

  // 캐시 초기화 후 AI 다시 호출
  Object.keys(aiCache).forEach(k => delete aiCache[k]);

  // 현재 탭에 AI 카드 있으면 새로 로드
  if (currentTab === 'assets') {
    if (assetTab === 'briefing') loadAIBriefing(true);
    else if (assetTab === 'plan') loadAIActionAdvice();
    else if (assetTab === 'news') loadAINewsSummary();
  }
}

function deleteAIKey() {
  if (!confirm('AI 키를 삭제할까요? 다시 사용하려면 새로 입력해야 해요.')) return;

  localStorage.removeItem('gemini_api_key');
  window.GEMINI_API_KEY = null;

  // Firebase에서도 삭제
  if (currentUser) {
    const { db, doc, setDoc } = window._fb;
    setDoc(doc(db, 'users', currentUser.uid, 'config', 'ai'), {
      geminiKey: null,
      updatedAt: new Date().toISOString()
    }).catch(() => {});
  }

  showToast('AI 키 삭제됨');
  closeModal();
  render();
}

// ★ 구체적 투자 추천
function renderInvestmentRecommendations(total, byType, recStock, recSafe, recCoin, monthlySaving) {
  const stockAmt = byType['주식'] || 0;
  const fundAmt = byType['펀드'] || 0;
  const safeAmt = (byType['예적금'] || 0) + (byType['현금'] || 0);
  const coinAmt = byType['코인'] || 0;

  const stockPct = ((stockAmt + fundAmt) / Math.max(total, 1)) * 100;
  const safePct = (safeAmt / Math.max(total, 1)) * 100;
  const coinPct = (coinAmt / Math.max(total, 1)) * 100;

  const recommendations = [];

  // 주식이 부족할 때
  if (stockPct < recStock - 5) {
    const targetAmt = Math.round((total * recStock / 100) - stockAmt - fundAmt);
    recommendations.push({
      type: 'add',
      color: 'info',
      icon: 'ti-trending-up',
      title: '주식·ETF 비중 확대',
      detail: `현재 ${Math.round(stockPct)}% → 목표 ${recStock}%. 약 <b>${formatMoney(targetAmt)}원</b> 추가 권장.`,
      products: [
        { name: 'TIGER 미국S&P500', desc: '대표 미국 지수 ETF, 안정적' },
        { name: 'KODEX 200', desc: '코스피200 추종, 국내 핵심' },
        { name: 'TIGER 미국나스닥100', desc: '미국 기술주 ETF' },
      ]
    });
  }

  // 주식이 너무 많을 때
  if (stockPct > recStock + 10) {
    const excessAmt = Math.round(((stockPct - recStock) / 100) * total);
    recommendations.push({
      type: 'reduce',
      color: 'warning',
      icon: 'ti-arrow-down',
      title: '주식 비중 일부 축소',
      detail: `현재 ${Math.round(stockPct)}% → 목표 ${recStock}%. 약 <b>${formatMoney(excessAmt)}원</b> 안전자산으로 이동 권장.`,
      products: [
        { name: '국채 ETF', desc: 'TIGER 국채10년 등' },
        { name: '정기예금', desc: '5% 이상 특판 찾기' },
        { name: 'CMA 통장', desc: '하루만 맡겨도 이자' },
      ]
    });
  }

  // 안전자산이 부족할 때
  if (safePct < recSafe - 10) {
    const targetAmt = Math.round((total * recSafe / 100) - safeAmt);
    recommendations.push({
      type: 'add',
      color: 'success',
      icon: 'ti-shield',
      title: '안전자산 비상금 확보',
      detail: `현재 ${Math.round(safePct)}% → 목표 ${recSafe}%. 약 <b>${formatMoney(targetAmt)}원</b> 추가 권장.`,
      products: [
        { name: '파킹통장', desc: '토스뱅크, 케이뱅크 (연 2.5%~)' },
        { name: '단기 정기예금', desc: '6개월~1년 만기' },
        { name: 'MMF·CMA', desc: '하루만 맡겨도 이자' },
      ]
    });
  }

  // 코인 비중 과다
  if (coinPct > 10) {
    const excessAmt = Math.round(((coinPct - recCoin) / 100) * total);
    recommendations.push({
      type: 'reduce',
      color: 'danger',
      icon: 'ti-alert-triangle',
      title: '코인 비중 축소',
      detail: `현재 ${Math.round(coinPct)}% → 권장 ${recCoin}% 이내. 약 <b>${formatMoney(excessAmt)}원</b> 안전자산으로 이동 권장.`,
      products: [
        { name: '단계적 매도', desc: '한 번에 팔지 말고 분할' },
        { name: '익절 전략', desc: '+10% 단위로 일부 매도' },
      ]
    });
  }

  // 모두 균형 잡혀있을 때
  if (recommendations.length === 0) {
    recommendations.push({
      type: 'maintain',
      color: 'success',
      icon: 'ti-check',
      title: '균형 잡힌 포트폴리오',
      detail: `현재 비중이 목표에 가까워요. 매월 <b>${formatMoney(monthlySaving)}원</b> 적립식 매수로 자산을 키워가세요.`,
      products: [
        { name: '월 자동이체', desc: '같은 날 같은 ETF 매수' },
        { name: '리밸런싱', desc: '6개월마다 비중 점검' },
      ]
    });
  }

  return recommendations.map(r => `
    <div style="padding:14px; border-radius:var(--radius-md); border:0.5px solid var(--border-tertiary); margin-bottom:10px; background:white;">
      <div style="display:flex; gap:10px; align-items:flex-start; margin-bottom:10px;">
        <div style="width:32px; height:32px; border-radius:8px; background:var(--bg-${r.color}); color:var(--text-${r.color}); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
          <i class="ti ${r.icon}" style="font-size:16px;"></i>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="font-size:13px; font-weight:600; margin-bottom:4px;">${r.title}</div>
          <div style="font-size:11px; color:var(--text-secondary); line-height:1.6;">${r.detail}</div>
        </div>
      </div>
      <div style="padding-top:10px; border-top:0.5px solid var(--border-tertiary);">
        <div style="font-size:10px; color:var(--text-tertiary); margin-bottom:6px;">추천 상품/방법</div>
        ${r.products.map(p => `
          <div style="display:flex; gap:8px; align-items:center; padding:6px 0; font-size:11px;">
            <i class="ti ti-circle-dot" style="font-size:12px; color:var(--text-${r.color});"></i>
            <div style="flex:1;">
              <b style="font-weight:500;">${p.name}</b>
              <span style="color:var(--text-tertiary); margin-left:6px;">— ${p.desc}</span>
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function planRow(name, current, target, total) {
  const diff = current - target;
  const diffAmt = Math.round(total * Math.abs(diff) / 100);
  const action = diff > 3 ? `<span style="color:var(--text-danger);">${diffAmt.toLocaleString()}원 줄이기</span>` :
                 diff < -3 ? `<span style="color:var(--text-success);">${diffAmt.toLocaleString()}원 늘리기</span>` :
                 `<span style="color:var(--text-tertiary);">유지 OK</span>`;
  return `<div style="padding:12px 0; border-bottom:0.5px solid var(--border-tertiary);">
    <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
      <span style="font-size:13px; font-weight:500;">${name}</span>
      <span style="font-size:11px;">${Math.round(current)}% → <b style="font-weight:600;">${target}%</b></span>
    </div>
    <div style="display:flex; align-items:center; gap:8px;">
      <div style="flex:1; height:6px; background:var(--bg-secondary); border-radius:3px; overflow:hidden; position:relative;">
        <div style="position:absolute; top:0; left:${Math.min(current, 100)}%; width:2px; height:100%; background:var(--text-primary);"></div>
        <div style="position:absolute; top:0; left:${target}%; width:2px; height:100%; background:var(--text-success);"></div>
      </div>
      <span style="font-size:10px;">${action}</span>
    </div>
  </div>`;
}

function simRow(name, rate, val, color) {
  return `<div style="display:flex; align-items:center; gap:10px;">
    <div style="width:8px; height:8px; border-radius:50%; background:${color};"></div>
    <div style="flex:1;">
      <div style="font-size:12px; font-weight:500; color:var(--text-primary);">${name}</div>
      <div style="font-size:10px; color:var(--text-tertiary);">${rate}</div>
    </div>
    <div style="font-size:14px; font-weight:600;">${val.toLocaleString()}원</div>
  </div>`;
}

function saveAsset() {
  const type = document.querySelector('#atype-grid .cat-btn.active')?.dataset.t || '주식';
  const nameEl = document.getElementById('a-name');
  const bankEl = document.getElementById('a-bank');
  const locEl = document.getElementById('a-location');

  // 자산명은 타입에 따라 다른 필드에서 가져옴
  const name = nameEl?.value?.trim() || bankEl?.value?.trim() || locEl?.value?.trim();

  const ticker = document.getElementById('a-ticker')?.value?.trim() || '';
  const qty = Number(document.getElementById('a-qty')?.value) || 1;
  const price = Number(document.getElementById('a-price')?.value);
  const note = document.getElementById('a-note')?.value?.trim() || '';
  const region = document.querySelector('#aregion-grid .chip.active')?.dataset.r || '국내';

  // 부동산, 채권, 예적금 등 추가 필드
  const propType = document.querySelector('#aproptype-grid .chip.active')?.dataset.p || '';
  const subType = document.querySelector('#asubtype-grid .chip.active')?.dataset.s || '';
  const maturity = document.getElementById('a-maturity')?.value || '';
  const rate = Number(document.getElementById('a-rate')?.value) || 0;
  const buyprice = Number(document.getElementById('a-buyprice')?.value) || 0;
  const rounds = Number(document.getElementById('a-rounds')?.value) || 0;

  if (!name || !price) {
    showToast('자산명과 금액을 입력해주세요');
    return;
  }

  const asset = { id: Date.now(), name, ticker, type, region, qty, price, note };
  // 타입별 추가 정보
  if (propType) asset.propType = propType;
  if (subType) asset.subType = subType;
  if (maturity) asset.maturity = maturity;
  if (rate) asset.rate = rate;
  if (buyprice) asset.buyprice = buyprice;
  if (rounds) asset.rounds = rounds;

  assets.push(asset);
  saveData();
  showToast(`${name} 추가됨${ticker ? ' (시세 자동 갱신)' : ''}`);
  closeModal();
  renderAsset();
}

  const a = assets.find(x => x.id === id);

    a.qty = Number(document.getElementById('e-qty').value) || a.qty;

    a.note = document.getElementById('e-note').value.trim();

    closeModal();

}

function deleteAsset(id) {
  const asset = assets.find(x => x.id === id);
  if (!asset) return;

  // 연결된 자동매수 고정지출 찾기
  const linkedFixed = (budget.fixed || []).filter(f =>
    f.autoBuy && f.assetInfo && f.assetInfo.name === asset.name && f.assetInfo.type === asset.type
  );

  // 연결된 자산 투자 지출 찾기 - linkedAssetName 또는 memo
  const linkedExpenses = (budget.expenses || []).filter(e =>
    e.type !== 'income' && e.cat === asset.type &&
    (e.linkedAssetName === asset.name || (!e.linkedAssetName && e.memo === asset.name))
  );

  let msg = `"${asset.name}" 자산을 삭제할까요?`;
  if (linkedFixed.length > 0 || linkedExpenses.length > 0) {
    msg += `\n\n연결된 항목:`;
    if (linkedFixed.length > 0) msg += `\n- 자동매수 ${linkedFixed.length}개`;
    if (linkedExpenses.length > 0) msg += `\n- 매수 기록 ${linkedExpenses.length}개`;
    msg += `\n\n이 항목도 함께 삭제됩니다.`;
  }

  if (!confirm(msg)) return;

  // 자산 삭제
  assets = assets.filter(x => x.id !== id);

  // 연결된 자동매수 삭제
  if (linkedFixed.length > 0) {
    budget.fixed = budget.fixed.filter(f =>
      !(f.autoBuy && f.assetInfo && f.assetInfo.name === asset.name && f.assetInfo.type === asset.type)
    );
  }

  // 연결된 지출 삭제
  if (linkedExpenses.length > 0) {
    const expIds = new Set(linkedExpenses.map(e => e.id));
    budget.expenses = budget.expenses.filter(e => !expIds.has(e.id));
  }

  saveData();
  closeModal();
  showToast(`삭제됨${linkedFixed.length + linkedExpenses.length > 0 ? ` (연결 항목 ${linkedFixed.length + linkedExpenses.length}개 포함)` : ''}`);
  renderAsset();
}

  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-password').value;

  if (!email || !pw) {
    showAuthError('이메일과 비밀번호를 입력해주세요');
    return;
  }
  if (pw.length < 6) {
    showAuthError('비밀번호는 6자 이상이어야 해요');
    return;
  }

  const btn = document.getElementById('auth-submit');
  btn.disabled = true;
  btn.textContent = '잠시만요...';

  try {
    const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = window._fb;
    if (authMode === 'login') {
      await signInWithEmailAndPassword(auth, email, pw);
    } else {
      await createUserWithEmailAndPassword(auth, email, pw);
    }
  } catch (e) {
    showAuthError(getAuthErrorMessage(e.code));
    btn.disabled = false;
    btn.textContent = authMode === 'login' ? '로그인' : '회원가입';
  }
}

function getAuthErrorMessage(code) {
  const map = {
    'auth/invalid-email': '이메일 형식이 올바르지 않아요',
    'auth/user-not-found': '존재하지 않는 계정이에요. 회원가입을 먼저 해주세요',
    'auth/wrong-password': '비밀번호가 일치하지 않아요',
    'auth/invalid-credential': '이메일 또는 비밀번호가 맞지 않아요',
    'auth/email-already-in-use': '이미 사용 중인 이메일이에요. 로그인을 시도해주세요',
    'auth/weak-password': '비밀번호가 너무 약해요 (6자 이상)',
    'auth/network-request-failed': '네트워크 연결을 확인해주세요',
    'auth/too-many-requests': '잠시 후 다시 시도해주세요',
    'auth/missing-password': '비밀번호를 입력해주세요',
  };
  return map[code] || '오류가 발생했어요. 다시 시도해주세요';
}

async function resetPassword() {
  const email = document.getElementById('auth-email').value.trim();
  if (!email) {
    showAuthError('비밀번호 재설정 메일을 받을 이메일을 입력해주세요');
    return;
  }
  try {
    const { auth, sendPasswordResetEmail } = window._fb;
    await sendPasswordResetEmail(auth, email);
    const el = document.getElementById('auth-error');
    el.textContent = '재설정 메일이 전송됐어요. 메일을 확인해주세요.';
    el.style.background = 'var(--bg-success)';
    el.style.color = 'var(--text-success)';
    el.classList.add('show');
  } catch (e) {
    showAuthError(getAuthErrorMessage(e.code));
  }
}

async function logout() {
  if (!confirm('로그아웃하시겠어요? 데이터는 클라우드에 저장되어 다음에 로그인하면 그대로 보여요.')) return;
  try {
    const { auth, signOut } = window._fb;
    await signOut(auth);
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  } catch(e) {
    showToast('로그아웃 실패');
  }
}

// ====== 앱 시작 ======
function startApp() {
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('auth-screen').classList.add('hidden');
  render();
}

function showLoginScreen() {
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
}

function initAuth() {
  if (!window._fb) {
    setTimeout(initAuth, 100);
    return;
  }
  const { onAuthStateChanged, auth } = window._fb;
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const cloudData = await loadFromFirebase(user.uid);
      if (cloudData) {
        applyData(cloudData);
        saveLocal();
      }

      // AI 키 Firebase에서 복원 (다른 기기에서 저장한 거)
      try {
        const { db, doc, getDoc } = window._fb;
        const aiDoc = await getDoc(doc(db, 'users', user.uid, 'config', 'ai'));
        if (aiDoc.exists()) {
          const aiData = aiDoc.data();
          if (aiData.geminiKey) {
            window.GEMINI_API_KEY = aiData.geminiKey;
            localStorage.setItem('gemini_api_key', aiData.geminiKey);
            console.log('✅ AI 키 Firebase에서 복원');
          }
        }
      } catch (e) {
        console.error('AI 키 복원 실패:', e);
      }

      startApp();

      // localStorage에서 AI 캐시 복원 (즉시 표시용)
      try {
        const savedCache = localStorage.getItem('ai_cache_today');
        if (savedCache) {
          const parsed = JSON.parse(savedCache);
          // 1시간 이내 캐시만 복원
          const now = Date.now();
          for (const [k, v] of Object.entries(parsed)) {
            if (v && v.time && (now - v.time) < AI_CACHE_TIME) {
              aiCache[k] = v;
            }
          }
          console.log('✅ AI 캐시 복원:', Object.keys(aiCache).length, '개');
        }
      } catch (e) {
        console.error('캐시 복원 실패:', e);
      }
    } else {
      currentUser = null;
      showLoginScreen();
    }
  });
}

// prewarmAI 함수는 유지하되 자동 호출 안 함 (수동 호출용으로 보관)
async function prewarmAI() {
  console.log('🤖 AI 백그라운드 사전 로드 시작...');
  const todayStr = new Date().toDateString();
  try {
    await fetchMarketIndices();

  } catch (e) {}
  await prewarmOne('briefing', () => generateMarketBriefing());
  await new Promise(r => setTimeout(r, 3000));

  await new Promise(r => setTimeout(r, 3000));
  await prewarmOne('news', () => generateNewsSummary());
  localStorage.setItem('ai_cache_today', JSON.stringify(aiCache));
  localStorage.setItem('ai_prewarm_date', todayStr);
  console.log('✅ AI 사전 로드 완료');
}

async function prewarmOne(name, fn) {
  try {
    await fn();
  } catch (e) {
    console.error(`${name} 실패:`, e);
  }
}

if (window._fb) {
  initAuth();
} else {
  window.addEventListener('firebase-ready', initAuth);
}

// 엔터키로 로그인

  const pwInput = document.getElementById('auth-password');
  if (pwInput) {
    pwInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') authSubmit();
    });
  }
