function updateAsset(id) {
  const a = assets.find(x => x.id === id);
  if (a) {
    a.name = document.getElementById('e-name').value.trim() || a.name;
    a.ticker = document.getElementById('e-ticker').value.trim();
    a.qty = Number(document.getElementById('e-qty').value) || a.qty;
    a.price = Number(document.getElementById('e-price').value) || a.price;
    a.note = document.getElementById('e-note').value.trim();
    saveData();
    showToast('저장됨');
    closeModal();
    renderAsset();
  }
}

function deleteAsset(id) {
  if (confirm('이 자산을 삭제할까요?')) {
    assets = assets.filter(x => x.id !== id);
    saveData();
    closeModal();
    showToast('삭제됨');
    renderAsset();
  }
}

// PWA 안내 (iOS Safari에서 standalone 모드가 아니면 표시)
if (!window.matchMedia('(display-mode: standalone)').matches && !window.navigator.standalone) {
  const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
  if (isIOS && !sessionStorage.getItem('hideInstallHint')) {

      document.getElementById('install-hint').classList.add('show');

// ====== 인증 처리 ======
let authMode = 'login';

function switchAuthTab(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode === 'login');
  document.getElementById('tab-signup').classList.toggle('active', mode === 'signup');
  document.getElementById('auth-submit').textContent = mode === 'login' ? '로그인' : '회원가입';
  document.getElementById('link-reset').style.display = mode === 'login' ? 'inline-block' : 'none';
  document.getElementById('auth-password').setAttribute('autocomplete', mode === 'login' ? 'current-password' : 'new-password');
  hideAuthError();
}

function showAuthError(msg) {
  const el = document.getElementById('auth-error');
  el.textContent = msg;
  el.style.background = 'var(--bg-danger)';
  el.style.color = 'var(--text-danger)';
  el.classList.add('show');
}

function hideAuthError() {
  document.getElementById('auth-error').classList.remove('show');
}

async function authSubmit() {
  const email = document.getElementById('auth-email').value.trim();
  const pw = document.getElementById('auth-password').value;

  if (!email || !pw) {
    showAuthError('이메일과 비밀번호를 입력해주세요');
    return;
  }
  if (pw.length < 6) {
    showAuthError('비밀번호는 6자 이상이어야 해요');
    return;
  }

  const btn = document.getElementById('auth-submit');
  btn.disabled = true;
  btn.textContent = '잠시만요...';

  try {
    const { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword } = window._fb;
    if (authMode === 'login') {
      await signInWithEmailAndPassword(auth, email, pw);
    } else {
      await createUserWithEmailAndPassword(auth, email, pw);
    }
  } catch (e) {
    showAuthError(getAuthErrorMessage(e.code));
    btn.disabled = false;
    btn.textContent = authMode === 'login' ? '로그인' : '회원가입';
  }
}

function getAuthErrorMessage(code) {
  const map = {
    'auth/invalid-email': '이메일 형식이 올바르지 않아요',
    'auth/user-not-found': '존재하지 않는 계정이에요. 회원가입을 먼저 해주세요',
    'auth/wrong-password': '비밀번호가 일치하지 않아요',
    'auth/invalid-credential': '이메일 또는 비밀번호가 맞지 않아요',
    'auth/email-already-in-use': '이미 사용 중인 이메일이에요. 로그인을 시도해주세요',
    'auth/weak-password': '비밀번호가 너무 약해요 (6자 이상)',
    'auth/network-request-failed': '네트워크 연결을 확인해주세요',
    'auth/too-many-requests': '잠시 후 다시 시도해주세요',
    'auth/missing-password': '비밀번호를 입력해주세요',
  };
  return map[code] || '오류가 발생했어요. 다시 시도해주세요';
}

async function resetPassword() {
  const email = document.getElementById('auth-email').value.trim();
  if (!email) {
    showAuthError('비밀번호 재설정 메일을 받을 이메일을 입력해주세요');
    return;
  }
  try {
    const { auth, sendPasswordResetEmail } = window._fb;
    await sendPasswordResetEmail(auth, email);
    const el = document.getElementById('auth-error');
    el.textContent = '재설정 메일이 전송됐어요. 메일을 확인해주세요.';
    el.style.background = 'var(--bg-success)';
    el.style.color = 'var(--text-success)';
    el.classList.add('show');
  } catch (e) {
    showAuthError(getAuthErrorMessage(e.code));
  }
}

async function logout() {
  if (!confirm('로그아웃하시겠어요? 데이터는 클라우드에 저장되어 다음에 로그인하면 그대로 보여요.')) return;
  try {
    const { auth, signOut } = window._fb;
    await signOut(auth);
    localStorage.removeItem(STORAGE_KEY);
    location.reload();
  } catch(e) {
    showToast('로그아웃 실패');
  }
}

// ====== 앱 시작 ======
function startApp() {
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('auth-screen').classList.add('hidden');
  render();
}

function showLoginScreen() {
  document.getElementById('loading-screen').classList.add('hidden');
  document.getElementById('auth-screen').classList.remove('hidden');
}

function initAuth() {
  if (!window._fb) {
    setTimeout(initAuth, 100);
    return;
  }
  const { onAuthStateChanged, auth } = window._fb;
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      currentUser = user;
      const cloudData = await loadFromFirebase(user.uid);
      if (cloudData) {
        applyData(cloudData);
        saveLocal();
      }

      // AI 키 Firebase에서 복원 (다른 기기에서 저장한 거)
      try {
        const { db, doc, getDoc } = window._fb;
        const aiDoc = await getDoc(doc(db, 'users', user.uid, 'config', 'ai'));
        if (aiDoc.exists()) {
          const aiData = aiDoc.data();
          if (aiData.geminiKey) {
            window.GEMINI_API_KEY = aiData.geminiKey;
            localStorage.setItem('gemini_api_key', aiData.geminiKey);
            console.log('✅ AI 키 Firebase에서 복원');
          }
        }
      } catch (e) {
        console.error('AI 키 복원 실패:', e);
      }

      startApp();

      // localStorage에서 어제 AI 캐시 복원 (즉시 표시용)
      try {
        const todayStr = new Date().toDateString();
        const lastDate = localStorage.getItem('ai_prewarm_date');
        const savedCache = localStorage.getItem('ai_cache_today');
        if (savedCache && lastDate === todayStr) {
          const parsed = JSON.parse(savedCache);
          Object.assign(aiCache, parsed);
          console.log('✅ AI 캐시 복원');
        }
      } catch (e) {
        console.error('캐시 복원 실패:', e);
      }
    } else {
      currentUser = null;
      showLoginScreen();
    }
  });
}

// prewarmAI 함수는 유지하되 자동 호출 안 함 (수동 호출용으로 보관)
async function prewarmAI() {
  console.log('🤖 AI 백그라운드 사전 로드 시작...');
  const todayStr = new Date().toDateString();
  try {
    await fetchMarketIndices();
    await fetchNewsRSS();
  } catch (e) {}
  await prewarmOne('briefing', () => generateMarketBriefing());
  await new Promise(r => setTimeout(r, 3000));
  await prewarmOne('action', () => generateActionAdvice());
  await new Promise(r => setTimeout(r, 3000));
  await prewarmOne('news', () => generateNewsSummary());
  localStorage.setItem('ai_cache_today', JSON.stringify(aiCache));
  localStorage.setItem('ai_prewarm_date', todayStr);
  console.log('✅ AI 사전 로드 완료');
}

async function prewarmOne(name, fn) {
  try {
    await fn();
  } catch (e) {
    console.error(`${name} 실패:`, e);
  }
}

if (window._fb) {
  initAuth();
} else {
  window.addEventListener('firebase-ready', initAuth);
}

// 엔터키로 로그인
document.addEventListener('DOMContentLoaded', () => {
  const pwInput = document.getElementById('auth-password');
  if (pwInput) {
    pwInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') authSubmit();
    });
  }
});
</script>
