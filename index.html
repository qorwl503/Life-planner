<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    signOut, onAuthStateChanged, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, getDoc, enableIndexedDbPersistence
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyA3FDgECTqtI7XDo1Isg02PmCgFv01Y3sI", // 원래 있던 진짜 키로 복구!
    authDomain: "life-planner-a03d2.firebaseapp.com",
    projectId: "life-planner-a03d2",
    storageBucket: "life-planner-a03d2.firebasestorage.app",
    messagingSenderId: "538319814686",
    appId: "1:538319814686:web:39b16b7ef65279dcc06e0f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Firebase 키를 YouTube API 키로 직접 사용 (코드 박힌 공개 키, Firebase 프로젝트에 YouTube API 활성화 필요)
  window.YOUTUBE_API_KEY = firebaseConfig.apiKey;

  // Gemini AI API 키 — 사용자가 직접 입력 (localStorage)
  window.GEMINI_API_KEY = localStorage.getItem('gemini_api_key') || null;

  // 오프라인 지원
  enableIndexedDbPersistence(db).catch(() => {});

  // 전역 노출
  window._fb = {
    auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    signOut, onAuthStateChanged, sendPasswordResetEmail,
    doc, setDoc, getDoc
  };

  // Firebase 준비 완료 알림
  window.dispatchEvent(new Event('firebase-ready'));
</script>

<script>
// ====== Firebase 동기화 ======
let currentUser = null;
let isSaving = false;
let saveQueue = false;
let saveTimer = null;

const STORAGE_KEY = 'life-planner-v5-local'; // 오프라인 캐시용

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

// localStorage 자동 정리 — 7일 이상 된 캐시 삭제
function cleanupOldStorage() {
  try {
    const today = new Date();
    const keysToCheck = [];

    // 모든 localStorage 키 검사
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key) continue;

      // ai_cache_today 만든 날짜 체크
      if (key === 'ai_cache_today' || key === 'ai_prewarm_date') {
        const stored = localStorage.getItem('ai_prewarm_date');
        if (stored) {
          const storedDate = new Date(stored);
          const daysDiff = (today - storedDate) / (1000 * 60 * 60 * 24);
          if (daysDiff > 7) {
            keysToCheck.push('ai_cache_today');
            keysToCheck.push('ai_prewarm_date');
          }
        }
      }

      // last_market_indices 도 7일 넘으면 삭제 (혹시 망한 데이터 있을 수도)
      if (key === 'last_market_indices') {
        try {
          const parsed = JSON.parse(localStorage.getItem(key));
          const oldestSavedAt = Math.min(...Object.values(parsed)
            .map(v => v?.savedAt || 0)
            .filter(t => t > 0));
          if (oldestSavedAt > 0) {
            const daysDiff = (Date.now() - oldestSavedAt) / (1000 * 60 * 60 * 24);
            if (daysDiff > 7) keysToCheck.push(key);
          }
        } catch (e) {}
      }
    }

    // 삭제 실행
    keysToCheck.forEach(k => localStorage.removeItem(k));
    if (keysToCheck.length > 0) {
      console.log(`🧹 오래된 캐시 ${keysToCheck.length}개 정리`);
    }
  } catch (e) {
    console.error('localStorage 정리 실패:', e);
  }
}

// 앱 시작 시 1회 실행
cleanupOldStorage();

// 오프라인 감지
function setupOfflineHandler() {
  // 오프라인 배너 만들기
  if (!document.getElementById('offline-banner')) {
    const banner = document.createElement('div');
    banner.id = 'offline-banner';
    banner.style.cssText = 'position:fixed; top:0; left:0; right:0; background:#FF3B30; color:white; padding:8px 14px; font-size:12px; text-align:center; z-index:9999; display:none; font-family:inherit;';
    banner.innerHTML = '<i class="ti ti-wifi-off" style="vertical-align:-2px;"></i> 인터넷 연결이 끊겼습니다. 일부 기능이 작동하지 않을 수 있어요.';
    document.body.appendChild(banner);
  }

  const banner = document.getElementById('offline-banner');

  function updateOnlineStatus() {
    if (navigator.onLine) {
      banner.style.display = 'none';
    } else {
      banner.style.display = 'block';
    }
  }

  // 상태 변경 리스너
  window.addEventListener('online', () => {
    banner.style.display = 'none';
    showToast('인터넷 연결됨');
  });
  window.addEventListener('offline', () => {
    banner.style.display = 'block';
    showToast('인터넷 연결 끊김');
  });

  // 초기 상태 체크
  updateOnlineStatus();
}

// body 로드 후 실행
if (document.body) {
  setupOfflineHandler();
} else {
  document.addEventListener('DOMContentLoaded', setupOfflineHandler);
}

// Firebase에 저장 (디바운스 적용)
function saveData() {
  saveLocal();

  if (!currentUser || !window._fb) return;

  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (isSaving) {
      saveQueue = true;
      return;
    }
    isSaving = true;
    try {
      const { doc, setDoc, db } = window._fb;
      await setDoc(doc(db, 'users', currentUser.uid), {
        todos, budget, workoutLog, assets, settings, userChannels, economySites, challenges,
        updatedAt: Date.now()
      });
      showSyncStatus();
    } catch (e) {
      console.error('저장 실패:', e);
    } finally {
      isSaving = false;
      if (saveQueue) {
        saveQueue = false;
        saveData();
      }
    }
  }, 800);
}

function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      todos, budget, workoutLog, assets, settings, userChannels, economySites, challenges
    }));
  } catch(e) {}
}

function showSyncStatus() {
  const el = document.getElementById('sync-status');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(window._syncT);
  window._syncT = setTimeout(() => el.classList.remove('show'), 1500);
}

// Firebase에서 로드
async function loadFromFirebase(uid) {
  try {
    const { doc, getDoc, db } = window._fb;
    const snap = await getDoc(doc(db, 'users', uid));
    if (snap.exists()) {
      return snap.data();
    }
  } catch (e) {
    console.error('로드 실패:', e);
  }
  return null;
}

// ====== 초기 데이터 ======
const todayDate = new Date();
const currentYear = todayDate.getFullYear();
const currentMonth = todayDate.getMonth(); // 0-11
const today = todayDate.getDate();
// 캘린더가 보고 있는 월 (네비게이션용 - 처음엔 현재 월)
let viewYear = currentYear;
let viewMonth = currentMonth;
const dayLabels = ['일','월','화','수','목','금','토'];
const monthLabels = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

// 기본값 설정 후 저장된 데이터로 덮어쓰기
let todos = [
  { id:1, title:'장보기 (마트)', tag:'생활', group:'today', flag:false, done:false, date:today, money:null },

let budget = {
  total: 1500000,

    { id:1, name:'월세', amt:500000, day:5, paid:false, icon:'ti-home', cat:'주거' },

    { id:4, name:'통신비', amt:55000, day:15, paid:false, icon:'ti-phone', cat:'공과금' },
    { id:5, name:'실손보험', amt:48000, day:7, paid:false, icon:'ti-shield', cat:'보험' },
    { id:6, name:'넷플릭스', amt:17000, day:10, paid:false, icon:'ti-device-tv', cat:'구독' },
  ],
  expenses: [],
};
let workoutLog = {}; // { 'YYYY-MM-DD': { done: true, kcal: 320, minutes: 30, note: '러닝' } }
let assets = [
  { id:1, name:'삼성전자', type:'주식', qty:50, price:75000, note:'국내 주식' },
  { id:2, name:'정기예금', type:'예적금', qty:1, price:5000000, note:'토스뱅크' },
];
let settings = {
  monthlyIncome: 3000000,        // 기본값 (월별 미설정시 사용)
  monthlyIncomes: {},            // 월별 수입: { '2026-04': 3000000, '2026-05': 3500000 }
  savingsGoal: 500000,
  riskProfile: 'balanced',
};

// 특정 월의 수입 가져오기 (월별 설정 우선, 없으면 기본값)
function getMonthlyIncome(year, monthIdx) {
  const key = `${year}-${String(monthIdx+1).padStart(2,'0')}`;
  if (settings.monthlyIncomes && settings.monthlyIncomes[key] !== undefined) {
    return Number(settings.monthlyIncomes[key]) || 0;
  }
  return Number(settings.monthlyIncome) || 0;
}

// 특정 월의 수입 저장
function setMonthlyIncome(year, monthIdx, amount) {
  if (!settings.monthlyIncomes) settings.monthlyIncomes = {};
  const key = `${year}-${String(monthIdx+1).padStart(2,'0')}`;
  settings.monthlyIncomes[key] = Number(amount) || 0;

// 사용자가 추가한 채널 (자산 / 운동)
let userChannels = {
  asset: [
    { id:1, name:'슈카월드', q:'슈카월드' },

  ],
  workout: [
    { id:1, name:'땅끄부부', q:'땅끄부부 홈트', emoji:'🏠' },
    { id:2, name:'에이핏', q:'에이핏 운동', emoji:'💪' },
    { id:3, name:'캐서린TV', q:'캐서린TV 스트레칭', emoji:'🧘' },
  ],
};
// 사용자가 추가한 경제 사이트
let economySites = [
  { id:1, name:'네이버 증권', url:'https://finance.naver.com', desc:'국내외 증시 시세' },
  { id:2, name:'한국경제', url:'https://www.hankyung.com', desc:'경제 뉴스' },
  { id:3, name:'매일경제', url:'https://www.mk.co.kr', desc:'경제 뉴스' },
  { id:4, name:'인베스팅닷컴', url:'https://kr.investing.com', desc:'글로벌 시세/지표' },
  { id:5, name:'KRX', url:'https://data.krx.co.kr', desc:'한국거래소 데이터' },
  { id:6, name:'한국은행', url:'https://ecos.bok.or.kr', desc:'경제 통계 (ECOS)' },
];
// 챌린지
let challenges = [];
// 시세 캐시 (5분간 유효)
let priceCache = {};

// 데이터 적용 함수
function applyData(data) {
  if (!data) return;
  if (data.todos) todos = data.todos;
  if (data.budget) budget = data.budget;
  if (data.workoutLog) workoutLog = data.workoutLog;
  if (data.assets) assets = data.assets;
  if (data.settings) {
    // 기존 settings 기본값 보존하면서 저장된 값 덮어쓰기 (누락 필드 안전)
    settings = Object.assign({}, settings, data.settings);
    // 객체 필드 기본값 보충
    if (!settings.monthlyIncomes) settings.monthlyIncomes = {};
    if (!settings.assetSnapshots) settings.assetSnapshots = {};
    if (!settings.livingGoals) settings.livingGoals = {};
    if (!settings.financialGoals) settings.financialGoals = [];
    if (!settings.ddays) settings.ddays = [];
  }
  if (data.userChannels) userChannels = data.userChannels;
  if (data.economySites) economySites = data.economySites;
  if (data.challenges) challenges = data.challenges;
  // 고정지출 마이그레이션 - 옛날 데이터에 cycle 없으면 monthly 기본
  if (budget && budget.fixed) {
    budget.fixed.forEach(f => {
      if (!f.cycle) f.cycle = 'monthly';
    });
  }
  migrateTodos();
}

// 옛날 todo (date가 숫자) → dateKey (YYYY-MM-DD)로 마이그레이션
function migrateTodos() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  todos.forEach(t => {
    if (!t.dateKey) {
      if (typeof t.date === 'number') {
        // 일자만 있던 옛날 데이터 → 현재 월로 가정
        t.dateKey = `${y}-${String(m+1).padStart(2,'0')}-${String(t.date).padStart(2,'0')}`;
      } else if (typeof t.date === 'string' && t.date.length === 10) {
        // 이미 YYYY-MM-DD 형식
        t.dateKey = t.date;
      } else {
        // 날짜 없으면 오늘
        t.dateKey = `${y}-${String(m+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      }
    }
  });
}

// 날짜 키 → 그룹 동적 분류 (today/tomorrow/week/later/past)
function todoGroup(dateKeyStr) {
  if (!dateKeyStr) return 'today';
  const now = new Date();
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const [y, m, d] = dateKeyStr.split('-').map(Number);
  const target = new Date(y, m-1, d);
  const diffDays = Math.floor((target - today0) / (24*60*60*1000));

  if (diffDays < 0) return 'past';
  if (diffDays === 0) return 'today';
  if (diffDays === 1) return 'tomorrow';
  if (diffDays <= 7) return 'week';
  return 'later';
}

// 한국식 날짜 라벨 ("5월 12일 (화)")
function dateLabel(dateKeyStr) {
  if (!dateKeyStr) return '';
  const [y, m, d] = dateKeyStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const dow = ['일','월','화','수','목','금','토'][dt.getDay()];
  return `${m}월 ${d}일 (${dow})`;
}

// 오늘 키
function todayKey() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}

// 일자(d) + 현재 캘린더 월 → dateKey
function makeDateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

// ===== 🎂 D-day 카운트다운 =====
function renderDdayCard() {
  const ddays = settings.ddays || [];
  const today = new Date();
  today.setHours(0, 0, 0, 0);

  // 각 D-day 계산
  const computed = ddays.map(d => {
    const target = new Date(d.date + 'T00:00:00');
    const diff = Math.round((target - today) / (24 * 60 * 60 * 1000));
    return { ...d, diff };
  });

  // 정렬: 다가오는 거 우선 (음수는 뒤로)
  computed.sort((a, b) => {
    if (a.diff >= 0 && b.diff < 0) return -1;
    if (a.diff < 0 && b.diff >= 0) return 1;
    if (a.diff >= 0) return a.diff - b.diff; // 다가오는 거: 가까운 순
    return b.diff - a.diff; // 지난 거: 최근부터
  });

  let html = `<div style="margin: 18px 0 12px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
      <div style="font-size:13px; font-weight:600;">🎂 D-day</div>
      <button onclick="openDdayModal()" style="border:none; background:var(--bg-info); color:var(--text-info); padding:4px 10px; border-radius:999px; font-size:10px; font-weight:500; cursor:pointer; font-family:inherit;">+ 추가</button>
    </div>`;

  if (computed.length === 0) {
    html += `<div style="padding:14px; background:var(--bg-secondary); border-radius:12px; text-align:center; font-size:11px; color:var(--text-tertiary);">
      중요한 날짜를 추가해보세요<br>
      <span style="opacity:0.7;">생일, 시험, 여행, 기념일 등</span>
    </div>`;
  } else {
    html += `<div style="display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none;">`;
    computed.forEach(d => {
      const isPast = d.diff < 0;
      const isToday = d.diff === 0;
      const label = isToday ? 'D-DAY' : isPast ? `D+${Math.abs(d.diff)}` : `D-${d.diff}`;
      const color = isToday ? 'var(--text-warning)' : isPast ? 'var(--text-tertiary)' : 'var(--text-info)';
      const bg = isToday ? 'rgba(255,165,0,0.12)' : isPast ? 'var(--bg-secondary)' : 'rgba(70,140,255,0.08)';
      const dateLabel = (() => {
        const dt = new Date(d.date + 'T00:00:00');
        return `${dt.getMonth() + 1}/${dt.getDate()}`;
      })();
      html += `<div onclick="openDdayModal(${d.id})" style="flex:0 0 auto; min-width:100px; padding:12px; background:${bg}; border-radius:10px; text-align:center; cursor:pointer;">
        <div style="font-size:22px;">${d.emoji || '📅'}</div>
        <div style="font-size:11px; font-weight:600; margin-top:4px; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:90px;">${d.title}</div>
        <div style="font-size:13px; font-weight:700; margin-top:4px; color:${color};">${label}</div>
        <div style="font-size:9px; color:var(--text-tertiary); margin-top:2px;">${dateLabel}</div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;
  return html;
}

function renderMonthlyReportCard() {
  const now = new Date();
  const cy = now.getFullYear();
  const cm = now.getMonth(); // 0-11
  const cmStr = `${cy}-${String(cm + 1).padStart(2, '0')}`;
  const lastM = cm === 0 ? 11 : cm - 1;
  const lastY = cm === 0 ? cy - 1 : cy;
  const lastMStr = `${lastY}-${String(lastM + 1).padStart(2, '0')}`;

  // 보고 있는 월 (기본은 이번 달)
  if (typeof window.reportMonth === 'undefined') window.reportMonth = 'current';
  const showCurrent = window.reportMonth === 'current';
  const targetY = showCurrent ? cy : lastY;

  const targetLabel = `${targetY}년 ${targetM + 1}월`;

  // 한국식 금액 포맷
  const fmt = (amt) => {
    const num = Math.round(Number(amt) || 0);
    if (num >= 100000000) {
      const eok = Math.floor(num / 100000000);
      const man = Math.floor((num % 100000000) / 10000);
      return man > 0 ? `${eok}억 ${man.toLocaleString()}만` : `${eok}억`;
    } else if (num >= 10000) {
      return `${Math.floor(num / 10000).toLocaleString()}만`;
    }
    return num.toLocaleString() + '원';
  };

  // 1. 가계부
  const monthExp = (budget.expenses || []).filter(e => e.dateKey?.startsWith(targetMStr));
  const monthSpent = monthExp.filter(e => e.type !== 'income').reduce((s, e) => s + Number(e.amt), 0);
  const monthDeposit = monthExp.filter(e => e.type === 'income').reduce((s, e) => s + Number(e.amt), 0);

  // 카테고리 1위
  const catTotals = {};
  monthExp.filter(e => e.type !== 'income').forEach(e => {
    catTotals[e.cat] = (catTotals[e.cat] || 0) + Number(e.amt);

  const topCat = Object.entries(catTotals).sort((a, b) => b[1] - a[1])[0];

    .filter(e => e.type !== 'income' && !investCats.includes(e.cat))

        <button onclick="window.reportMonth='current'; renderCalendar();" style="border:none; background:${showCurrent ? 'var(--bg-info)' : 'var(--bg-secondary)'}; color:${showCurrent ? 'var(--text-info)' : 'var(--text-secondary)'}; padding:4px 10px; border-radius:999px; font-size:10px; font-weight:500; cursor:pointer; font-family:inherit;">이번 달</button>

        <div>
          <div style="font-size:10px; opacity:0.7;">🏃 운동</div>
          <div style="font-size:16px; font-weight:700; margin-top:2px;">${monthWorkouts}일 / ${daysInMonth}일</div>
          <div style="font-size:9px; opacity:0.7; margin-top:2px;">${workoutPct}% 달성</div>
        </div>
        <div>
          <div style="font-size:10px; opacity:0.7;">✅ 할일</div>
          <div style="font-size:16px; font-weight:700; margin-top:2px;">${monthTodoDone} / ${monthTodoTotal}</div>
          ${monthTodoTotal > 0 ? `<div style="font-size:9px; opacity:0.7; margin-top:2px;">${Math.round(monthTodoDone/monthTodoTotal*100)}% 완료</div>` : ''}
        </div>
        ${activeChallenges.length > 0 ? `
        <div>
          <div style="font-size:10px; opacity:0.7;">🎯 챌린지</div>
          <div style="font-size:16px; font-weight:700; margin-top:2px;">${totalChCheck}회 성공</div>
          <div style="font-size:9px; opacity:0.7; margin-top:2px;">${activeChallenges.length}개 진행</div>
        </div>` : ''}
        ${assetChange !== null ? `
        <div>
          <div style="font-size:10px; opacity:0.7;">💎 자산 변화</div>
          <div style="font-size:16px; font-weight:700; margin-top:2px; color:${assetChange >= 0 ? '#A8E6CF' : '#FFB4B4'};">${assetChange >= 0 ? '+' : ''}${fmt(assetChange)}</div>
        </div>` : ''}
      </div>
      ${topCat ? `
        <div style="margin-top:14px; padding-top:12px; border-top:0.5px solid rgba(255,255,255,0.15); font-size:10px; opacity:0.85;">
          📊 가장 많이 쓴 카테고리: <b>${topCat[0]} ${fmt(topCat[1])}</b> (${Math.round(topCat[1]/monthSpent*100)}%)
        </div>
      ` : ''}
      ${savings > 0 ? `
        <div style="margin-top:6px; font-size:10px; opacity:0.85;">
          💰 이번 달 비상금 적립 가능: <b style="color:#FFD93D;">${fmt(savings)}</b>
        </div>
      ` : ''}
    </div>
  </div>`;

  return html;

function renderCalendar() {
  // 현재 보는 월 기준 계산
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const monthStart = new Date(viewYear, viewMonth, 1);
  const startOffset = monthStart.getDay();

  header.innerHTML = `
    <h1>홈</h1>
    <div class="header-actions">
      <button onclick="openAddModal()" aria-label="추가"><i class="ti ti-plus"></i></button>
    </div>
  `;

  // 모듈별 점 데이터 (사용자 입력 기반)
  function getDots(d) {
    const dots = [];
    const k = dayKey(d);
    if (workoutLog[k]?.done) dots.push('w');
    const dayExpenses = budget.expenses.filter(e => (e.dateKey === k) || (e.date === d && (!e.dateKey) && isViewingCurrentMonth()));
    if (dayExpenses.length > 0) dots.push('m');
    const dayTodos = todos.filter(t => t.dateKey === k);
    if (dayTodos.length > 0) dots.push('t');
    // 챌린지 점 - 시작일 ~ 종료일 사이만 표시
    const activeChs = challenges.filter(c => {
      if (!c.startDate || !c.totalDays) return false;
      if (k < c.startDate) return false; // 시작 전
      // 종료일 계산 (시작일 + totalDays - 1)
      const start = new Date(c.startDate + 'T00:00:00');
      const end = new Date(start);
      end.setDate(start.getDate() + c.totalDays - 1);
      const endK = dateKey(end.getFullYear(), end.getMonth(), end.getDate());
      return k <= endK;
    });
    if (activeChs.length > 0) dots.push('c');
    return dots;
  }

  // 적당히 진한 파스텔 (보기 편한 톤)
  const dotColor = {
    w:'#6BC495',  // 진한 민트 - 운동
    m:'#F5A852',  // 진한 살구 - 가계부
    t:'#6B9FD9',  // 진한 베이비블루 - 할일
    a:'#9C8FE0',  // 진한 라일락 - 자산
    c:'#E091A8',  // 진한 베이비핑크 - 챌린지
  };

  // 월/주 토글
  const isWeekView = window.calendarMode === 'week';

          ${dayExpenses.length > 0 ? `<div style="font-size:8px; padding:2px 4px; background:#FFEDD0; color:#A87836; border-radius:4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">💰 ${dayExpenses.length}건</div>` : ''}

    const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
    for (let i = 0; i < totalCells; i++) {

      <span><span class="ld" style="background:#E091A8"></span>챌린지</span>

  const dow = (startOffset + selectedDay - 1) % 7;

  html += `<div class="chips">

    <button class="chip ${currentFilter==='todo'?'active':''}" onclick="filter('todo')">할일</button>
    <button class="chip ${currentFilter==='workout'?'active':''}" onclick="filter('workout')">운동</button>

function getEventsForDay(d) {
  const events = [];
  const k = dayKey(d);

  // 할일
  todos.filter(t => t.dateKey === k).forEach(t => {
    events.push({
      type: 'todo',
      title: t.title,
      sub: t.tag,
      done: t.done,
      todoId: t.id,
      amount: t.money
    });
  });

  // 운동
  const w = workoutLog[k];
  if (w?.done) {
    events.push({
      type: 'workout',
      icon: 'ti-barbell',
      title: w.note || '운동 완료',
      sub: `${w.minutes || 0}분 · ${w.kcal || 0} kcal`,
    });
  }

  // 가계부 (옛날 date 호환 + 새 dateKey 둘 다 처리)
  budget.expenses.filter(e => (e.dateKey === k) || (e.date === d && !e.dateKey && currentMonth === new Date().getMonth() && currentYear === new Date().getFullYear())).forEach(e => {
    events.push({
      type: 'money',
      icon: 'ti-wallet',
      title: e.memo || e.cat,
      sub: e.cat,
      amount: `-${Number(e.amt).toLocaleString()}원`,
    });
  });

  // 챌린지 (시작일 ~ 종료일 사이, 시간대 안전)
  challenges.forEach(c => {
    if (!c.startDate || !c.totalDays) return;
    if (k < c.startDate) return; // 시작 전

    // 종료일 계산
    const start = new Date(c.startDate + 'T00:00:00');
    const end = new Date(start);
    end.setDate(start.getDate() + c.totalDays - 1);
    const endK = dateKey(end.getFullYear(), end.getMonth(), end.getDate());
    if (k > endK) return; // 종료 후

    // 일차 계산 - 문자열 비교로 정확
    const [sy, sm, sd] = c.startDate.split('-').map(Number);
    const [ky, km, kd] = k.split('-').map(Number);
    const startMs = new Date(sy, sm-1, sd).getTime();
    const kMs = new Date(ky, km-1, kd).getTime();
    const dayDiff = Math.round((kMs - startMs) / (24*60*60*1000)) + 1;

    const check = c.checks?.[k];
    let statusText = '';
    if (check === true) statusText = '✓ 성공';
    else if (check === 'fail') statusText = '✗ 실패';
    else if (k <= todayKey()) statusText = '미체크';
    else statusText = '예정';

    events.push({
      type: 'challenge',
      icon: c.type === 'forbidden' ? 'ti-ban' : 'ti-flag',
      title: c.title,
      sub: `${dayDiff}일차 / ${c.totalDays}일 · ${statusText}`,
    });
  });

  return events;
}

function selectDay(d) { selectedDay = d; renderCalendar(); }

// 월/주 토글
function setCalendarMode(mode) {
  window.calendarMode = mode;
  renderCalendar();
}

// 주간보기에서 날짜 선택
function selectDayFromWeek(dateKeyStr) {
  const [y, m, d] = dateKeyStr.split('-').map(Number);
  if (y !== viewYear || (m - 1) !== viewMonth) {
    // 다른 달이면 그 달로 이동
    viewYear = y;
    viewMonth = m - 1;
  }
  selectedDay = d;
  // 주간보기 유지하고 그 날의 자세한 내용은 아래 리스트로 표시됨
  renderCalendar();
}
function filter(f) { currentFilter = f; renderCalendar(); }

// 캘린더 월 네비게이션
function prevMonth() {
  if (viewMonth === 0) { viewMonth = 11; viewYear--; }
  else viewMonth--;
  selectedDay = 1;
  renderCalendar();
}
function nextMonth() {
  if (viewMonth === 11) { viewMonth = 0; viewYear++; }
  else viewMonth++;
  selectedDay = 1;
  renderCalendar();
}
function goToToday() {
  viewYear = currentYear;
  viewMonth = currentMonth;
  selectedDay = today;
  renderCalendar();
}

// 가계부 월 이동
let budgetViewYear, budgetViewMonth;

function prevBudgetMonth() {
  if (budgetViewMonth === 0) { budgetViewMonth = 11; budgetViewYear--; }
  else budgetViewMonth--;
  renderMoney();
}

function nextBudgetMonth() {
  if (budgetViewYear === currentYear && budgetViewMonth === currentMonth) return;
  if (budgetViewMonth === 11) { budgetViewMonth = 0; budgetViewYear++; }
  else budgetViewMonth++;
  renderMoney();
}

function openBudgetMonthPicker() {
  const monthsWithData = new Set();
  budget.expenses.forEach(e => {
    if (e.dateKey) monthsWithData.add(e.dateKey.substring(0, 7));
  });
  const currentKey = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  monthsWithData.add(currentKey);

  const sortedMonths = Array.from(monthsWithData).sort().reverse();

  let html = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-cancel" onclick="closeModal()">닫기</button>
        <h2>월 선택</h2>
        <button class="modal-save" onclick="closeModal()">완료</button>
      </div>

      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:14px;">지출 내역이 있는 달만 표시돼요</div>

      <div style="display:flex; flex-direction:column; gap:6px;">`;

  sortedMonths.forEach(monthKey => {
    const [y, m] = monthKey.split('-').map(Number);
    const isCurrent = y === currentYear && m === currentMonth + 1;
    const isViewing = y === budgetViewYear && m === budgetViewMonth + 1;

    const monthExpenses = budget.expenses.filter(e => e.dateKey?.startsWith(monthKey));
    const monthTotal = monthExpenses.reduce((s, e) => s + Number(e.amt), 0);

    html += `<button onclick="jumpToBudgetMonth(${y}, ${m-1})" style="display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border:0.5px solid ${isViewing ? 'var(--text-info)' : 'var(--border-tertiary)'}; border-radius:var(--radius-md); background:${isViewing ? 'var(--bg-info)' : 'white'}; cursor:pointer; font-family:inherit;">
      <div style="display:flex; flex-direction:column; align-items:flex-start; gap:2px;">
        <div style="font-size:14px; font-weight:600; color:${isViewing ? 'var(--text-info)' : 'var(--text-primary)'};">
          ${y}년 ${m}월 ${isCurrent ? '<span style="font-size:10px; color:var(--text-success);">(이번 달)</span>' : ''}
        </div>
        <div style="font-size:11px; color:var(--text-tertiary);">${monthExpenses.length}건 지출</div>
      </div>
      <div style="font-size:13px; font-weight:600; color:${isViewing ? 'var(--text-info)' : 'var(--text-primary)'};">
        ${monthTotal.toLocaleString()}원
      </div>
    </button>`;
  });

  html += `</div></div>`;
  modal.innerHTML = html;
  modal.classList.add('show');
}

function renderTodo() {
  // 주 이동 변수 초기화
  if (typeof window.todoWeekOffset === 'undefined') window.todoWeekOffset = 0;

  header.innerHTML = `
    <h1>할일</h1>
    <div class="header-actions">
      <button onclick="openChallengeModal()" aria-label="챌린지 추가"><i class="ti ti-flag"></i></button>
      <button onclick="openTodoModal()" aria-label="추가"><i class="ti ti-plus"></i></button>
    </div>
  `;

  let html = '';

  // ★ 챌린지 섹션
  html += renderChallengeSection();

  const total = todos.length;
  const done = todos.filter(t => t.done).length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  // 할일 통계 계산 - 세분화
  const todayK = todayKey();
  const todayTodos = todos.filter(t => t.dateKey === todayK);
  const todayDone = todayTodos.filter(t => t.done).length;

  const pastTodos = todos.filter(t => todoGroup(t.dateKey) === 'past' && !t.done);
  const pastDoneAll = todos.filter(t => t.dateKey && t.dateKey < todayK && t.done);

  // 본인이 선택한 주 (todoWeekOffset 기준)
  const baseDate = new Date();
  baseDate.setDate(baseDate.getDate() + window.todoWeekOffset * 7);
  // 일요일 시작 (일=0, 월=1, 토=6)
  const dayOfWeek = baseDate.getDay(); // 일=0
  const weekStart = new Date(baseDate);
  weekStart.setDate(baseDate.getDate() - dayOfWeek); // 이번 주 일요일
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekStart.getDate() + 6); // 이번 주 토요일
  const monday = weekStart; // 변수명 유지 (실제는 일요일)
  const sunday = weekEnd; // 변수명 유지 (실제는 토요일)
  const mondayK = dateKey(monday.getFullYear(), monday.getMonth(), monday.getDate());
  const sundayK = dateKey(sunday.getFullYear(), sunday.getMonth(), sunday.getDate());
  const weekTodos = todos.filter(t => t.dateKey && t.dateKey >= mondayK && t.dateKey <= sundayK);
  const weekDone = weekTodos.filter(t => t.done).length;
  const weekPct = weekTodos.length > 0 ? Math.round((weekDone / weekTodos.length) * 100) : 0;

  const weekLabel = window.todoWeekOffset === 0 ? '이번 주' :
    window.todoWeekOffset === 1 ? '다음 주' :
    window.todoWeekOffset === -1 ? '지난 주' :
    `${monday.getMonth()+1}/${monday.getDate()} ~ ${sunday.getMonth()+1}/${sunday.getDate()}`;

  // 연속 달성일 (사용 안함 - 곧 마감으로 대체)
  // 곧 마감 = 3일 안에 마감인 미완료 할일
  const today3D = new Date();
  const day3Later = new Date();
  day3Later.setDate(today3D.getDate() + 3);
  const todayKeyStr = dateKey(today3D.getFullYear(), today3D.getMonth(), today3D.getDate());
  const day3LaterKey = dateKey(day3Later.getFullYear(), day3Later.getMonth(), day3Later.getDate());
  const soonDueTodos = todos.filter(t => !t.done && t.dateKey && t.dateKey >= todayKeyStr && t.dateKey <= day3LaterKey);
  const flaggedTodos = todos.filter(t => !t.done && t.flag);

  html += `
    <div style="display:flex; align-items:center; gap:8px; margin: 18px 0 8px;">
      <span style="font-size:14px; font-weight:600;">📋 할일</span>
    </div>

    <!-- 4가지 카드 통계 -->
    <div style="display:grid; grid-template-columns: repeat(2, 1fr); gap:8px; margin-bottom:14px;">
      <!-- 오늘 -->
      <div style="padding:12px; border-radius:12px; background:var(--bg-info); border:0.5px solid rgba(0,122,255,0.2);">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:10px; color:var(--text-info); font-weight:600;">📅 오늘</span>
          ${todayTodos.length > 0 && todayDone === todayTodos.length ? '<span style="font-size:14px;">✨</span>' : ''}
        </div>
        <div style="font-size:20px; font-weight:700; color:var(--text-info); margin-top:4px;">
          ${todayDone}<span style="font-size:13px; opacity:0.6;">/${todayTodos.length}</span>
        </div>
        <div style="font-size:10px; color:var(--text-info); opacity:0.85; margin-top:2px;">
          ${todayTodos.length === 0 ? '할일 없음' : todayTodos.length === todayDone ? '오늘 끝!' : (todayTodos.length - todayDone) + '개 남음'}
        </div>
      </div>

      <!-- 주간 통계 -->
      <div style="padding:12px; border-radius:12px; background:var(--bg-secondary); border:0.5px solid var(--border-tertiary);">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:10px; color:var(--text-secondary); font-weight:600;">📊 ${weekLabel}</span>
          <span style="font-size:9px; color:var(--text-tertiary);">${weekPct}%</span>
        </div>
        <div style="font-size:20px; font-weight:700; margin-top:4px;">
          ${weekDone}<span style="font-size:13px; opacity:0.6;">/${weekTodos.length}</span>
        </div>
        <div style="height:4px; background:rgba(0,0,0,0.08); border-radius:2px; margin-top:6px; overflow:hidden;">
          <div style="height:100%; width:${weekPct}%; background:var(--text-success);"></div>
        </div>
      </div>

      <!-- 곧 마감 (3일 이내) -->
      <div style="padding:12px; border-radius:12px; background:${soonDueTodos.length > 0 ? 'rgba(245,168,82,0.12)' : 'var(--bg-secondary)'}; border:0.5px solid ${soonDueTodos.length > 0 ? 'rgba(245,168,82,0.3)' : 'var(--border-tertiary)'};">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:10px; color:${soonDueTodos.length > 0 ? '#C9863A' : 'var(--text-secondary)'}; font-weight:600;">⏱️ 곧 마감</span>
        </div>
        <div style="font-size:20px; font-weight:700; color:${soonDueTodos.length > 0 ? '#C9863A' : 'var(--text-tertiary)'}; margin-top:4px;">
          ${soonDueTodos.length}<span style="font-size:13px; opacity:0.6;">개</span>
        </div>
        <div style="font-size:10px; color:${soonDueTodos.length > 0 ? '#C9863A' : 'var(--text-tertiary)'}; opacity:0.85; margin-top:2px;">
          ${soonDueTodos.length === 0 ? '여유 있어요' : '3일 이내'}
        </div>
      </div>

      <!-- 지난 미완료 -->
      <div style="padding:12px; border-radius:12px; background:${pastTodos.length > 0 ? 'var(--bg-danger)' : 'var(--bg-secondary)'}; border:0.5px solid ${pastTodos.length > 0 ? 'rgba(255,59,48,0.2)' : 'var(--border-tertiary)'};">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <span style="font-size:10px; color:${pastTodos.length > 0 ? 'var(--text-danger)' : 'var(--text-secondary)'}; font-weight:600;">⏰ 밀린</span>
        </div>
        <div style="font-size:20px; font-weight:700; color:${pastTodos.length > 0 ? 'var(--text-danger)' : 'var(--text-tertiary)'}; margin-top:4px;">
          ${pastTodos.length}<span style="font-size:13px; opacity:0.6;">개</span>
        </div>
        <div style="font-size:10px; color:${pastTodos.length > 0 ? 'var(--text-danger)' : 'var(--text-tertiary)'}; opacity:0.85; margin-top:2px;">
          ${pastTodos.length === 0 ? '깨끗해요 ✨' : '처리해주세요'}
        </div>
      </div>
    </div>
  `;

  // ===== 주간 뷰 (이번 주 자세히) =====
  html += `
    <div style="margin: 18px 0 8px; display:flex; justify-content:space-between; align-items:center;">
      <button onclick="window.todoWeekOffset = (window.todoWeekOffset||0) - 1; renderTodo();" style="border:none; background:var(--bg-secondary); padding:6px 10px; border-radius:8px; cursor:pointer; font-size:11px; font-family:inherit;">◀</button>
      <span style="font-size:13px; font-weight:600;">
        ${window.todoWeekOffset === 0 ? '이번 주' : window.todoWeekOffset === 1 ? '다음 주' : window.todoWeekOffset === -1 ? '지난 주' : `${monday.getMonth()+1}/${monday.getDate()} ~ ${sunday.getMonth()+1}/${sunday.getDate()}`}
      </span>
      <button onclick="window.todoWeekOffset = (window.todoWeekOffset||0) + 1; renderTodo();" style="border:none; background:var(--bg-secondary); padding:6px 10px; border-radius:8px; cursor:pointer; font-size:11px; font-family:inherit;">▶</button>
    </div>
    ${window.todoWeekOffset !== 0 ? `<div style="text-align:center; margin-bottom:8px;"><button onclick="window.todoWeekOffset=0; renderTodo();" style="padding:3px 10px; border:none; border-radius:999px; background:var(--bg-info); color:var(--text-info); font-size:10px; cursor:pointer; font-family:inherit;">📍 오늘로</button></div>` : ''}
  `;

  // 주간 뷰: 일~토 각 날짜별 섹션
  const dayLabels = ['일', '월', '화', '수', '목', '금', '토'];
  let hasWeekItems = false;
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const dK = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
    const dayTodos = todos.filter(t => t.dateKey === dK && !t.done);
    const dayDone = todos.filter(t => t.dateKey === dK && t.done);
    const isToday = dK === todayK;
    const isWeekend = i === 0 || i === 6; // 일 또는 토
    const isPast = dK < todayK;

    // 항목 없는 평일은 표시 안 함 (오늘 제외)
    if (dayTodos.length === 0 && dayDone.length === 0 && !isToday) continue;
    hasWeekItems = true;

    const dayColor = isToday ? 'var(--text-info)' : i === 0 ? 'var(--text-danger)' : i === 6 ? 'var(--text-info)' : 'var(--text-primary)';
    const dayLabel = isToday ? '오늘' : `${d.getMonth()+1}/${d.getDate()} (${dayLabels[i]})`;

    html += `
      <div style="margin: 12px 0 6px; display:flex; align-items:center; gap:8px;">
        <span style="font-size:13px; font-weight:${isToday ? '700' : '600'}; color:${dayColor};">${dayLabel}</span>
        ${isToday ? `<span style="font-size:9px; padding:1px 6px; border-radius:999px; background:var(--bg-info); color:var(--text-info); font-weight:600;">TODAY</span>` : ''}
        <span style="font-size:10px; color:var(--text-tertiary);">${dayTodos.length > 0 ? `${dayTodos.length}개` : isPast && dayDone.length > 0 ? `완료 ${dayDone.length}` : '없음'}</span>
      </div>
    `;
    if (dayTodos.length === 0 && dayDone.length === 0) {
      html += `<div style="padding:8px 12px; color:var(--text-tertiary); font-size:11px; opacity:0.6;">${isToday ? '오늘 할일 없음 ✨' : '없음'}</div>`;
    } else {
      dayTodos.forEach(t => html += renderTodoRow(t));
      dayDone.forEach(t => html += renderTodoRow(t));
    }
  }

  // ===== 더 멀리: 다음 주 / 이번 달 / 다음 달 / 그 이후 =====
  // 다음 주 시작 = 일요일 + 1
  const nextWeekStart = new Date(sunday);
  nextWeekStart.setDate(sunday.getDate() + 1);
  const nextWeekEnd = new Date(nextWeekStart);
  nextWeekEnd.setDate(nextWeekStart.getDate() + 6);
  const nextWeekStartK = dateKey(nextWeekStart.getFullYear(), nextWeekStart.getMonth(), nextWeekStart.getDate());
  const nextWeekEndK = dateKey(nextWeekEnd.getFullYear(), nextWeekEnd.getMonth(), nextWeekEnd.getDate());

  const nextWeekTodos = todos.filter(t => t.dateKey && t.dateKey >= nextWeekStartK && t.dateKey <= nextWeekEndK);

  // 이번 달 (다음 주 이후~말일)
  const today = new Date();
  const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0);
  const monthEndK = dateKey(monthEnd.getFullYear(), monthEnd.getMonth(), monthEnd.getDate());
  const monthRestStart = new Date(nextWeekEnd);
  monthRestStart.setDate(nextWeekEnd.getDate() + 1);
  const monthRestStartK = dateKey(monthRestStart.getFullYear(), monthRestStart.getMonth(), monthRestStart.getDate());
  const monthRestTodos = todos.filter(t => t.dateKey && t.dateKey >= monthRestStartK && t.dateKey <= monthEndK);

  // 다음 달
  const nextMonthStart = new Date(today.getFullYear(), today.getMonth() + 1, 1);
  const nextMonthEnd = new Date(today.getFullYear(), today.getMonth() + 2, 0);
  const nextMonthStartK = dateKey(nextMonthStart.getFullYear(), nextMonthStart.getMonth(), nextMonthStart.getDate());
  const nextMonthEndK = dateKey(nextMonthEnd.getFullYear(), nextMonthEnd.getMonth(), nextMonthEnd.getDate());
  const nextMonthTodos = todos.filter(t => t.dateKey && t.dateKey >= nextMonthStartK && t.dateKey <= nextMonthEndK);

  // 더 미래
  const farFutureTodos = todos.filter(t => t.dateKey && t.dateKey > nextMonthEndK);

  // 날짜 미정 (dateKey 없음)
  const noDateTodos = todos.filter(t => !t.dateKey);

  // 본인이 이번 주만 보고 있을 때 (offset === 0) 미래 그룹 표시
  if (window.todoWeekOffset === 0) {
    const futureGroups = [
      { label: '📅 다음 주', items: nextWeekTodos },
      { label: '📆 이번 달', items: monthRestTodos },
      { label: '🗓️ 다음 달', items: nextMonthTodos },
      { label: '🌅 더 멀리', items: farFutureTodos },
      { label: '❓ 날짜 미정', items: noDateTodos },
    ];

    let hasFuture = futureGroups.some(g => g.items.length > 0);
    if (hasFuture) {
      html += `<div style="margin-top:24px; padding-top:14px; border-top:0.5px solid var(--border-tertiary);">
        <div style="font-size:11px; color:var(--text-tertiary); margin-bottom:6px;">📌 더 멀리</div>
      </div>`;

      futureGroups.forEach(g => {
        if (g.items.length === 0) return;
        html += `<div style="margin: 12px 0 6px; display:flex; align-items:center; gap:8px;">
          <span style="font-size:12px; font-weight:600; color:var(--text-secondary);">${g.label}</span>
          <span style="font-size:10px; color:var(--text-tertiary);">${g.items.length}개</span>
        </div>`;
        g.items.sort((a, b) => (a.dateKey || '').localeCompare(b.dateKey || ''));
        g.items.forEach(t => html += renderTodoRow(t));
      });
    }
  }

  // 빈 상태
  if (!hasWeekItems && window.todoWeekOffset === 0 && todos.filter(t => !t.done).length === 0) {
    html += `<div class="empty-state"><i class="ti ti-checks"></i>할일이 없어요<br><span style="font-size:11px; opacity:0.7;">+ 버튼으로 추가하세요</span></div>`;
  }

  // ===== 밀린 할일 (별도 강조) =====
  if (pastTodos.length > 0 && window.todoWeekOffset === 0) {
    html += `<div style="margin-top:24px; padding-top:14px; border-top:0.5px solid var(--border-tertiary);">
      <div style="margin: 0 0 8px; display:flex; align-items:center; gap:8px;">
        <span style="font-size:13px; font-weight:600; color:var(--text-danger);">⏰ 밀린 일정</span>
        <span style="font-size:10px; padding:2px 7px; border-radius:999px; background:var(--bg-danger); color:var(--text-danger);">${pastTodos.length}</span>
      </div>
    </div>`;
    pastTodos.sort((a, b) => b.dateKey.localeCompare(a.dateKey));
    pastTodos.forEach(t => html += renderTodoRow(t));
  }

  screen.innerHTML = html;
}

function renderTodoRow(t) {
  return `<div class="todo-row ${t.done?'done':''}" onclick="editTodo(${t.id})">
    <div class="todo-check ${t.done?'done':''}" onclick="event.stopPropagation(); toggleTodo(${t.id}, event)">
      ${t.done ? '<i class="ti ti-check"></i>' : ''}
    </div>
    <div style="flex:1; min-width:0;">
      <div class="todo-title">${t.title}</div>
      <div class="todo-meta">
        <span class="tag">${t.tag}</span>
        ${t.dateKey ? `<span class="meta-mini" style="font-size:10px;"><i class="ti ti-calendar" style="font-size:10px;"></i> ${dateLabel(t.dateKey)}</span>` : ''}
        ${t.due ? `<span class="meta-mini">~ ${t.due}</span>` : ''}
        ${t.money ? `<span class="meta-money"><i class="ti ti-wallet" style="font-size:11px;"></i> ${t.money}</span>` : ''}
      </div>
    </div>
    ${t.flag ? '<i class="ti ti-flag" style="font-size:14px; color:var(--text-danger);"></i>' : ''}
    <button class="todo-del" onclick="event.stopPropagation(); delTodo(${t.id}, event)" aria-label="삭제"><i class="ti ti-trash"></i></button>
  </div>`;
}

function editTodo(id) {
  const t = todos.find(x => x.id === id);
  if (!t) return;
  openTodoModal(null, t); // 수정 모드
}

function toggleTodo(id, e) {
  if (e) e.stopPropagation();
  const t = todos.find(x => x.id === id);
  if (t) {
    t.done = !t.done;
    if (t.done) {
      t.completedAt = Date.now();
    } else {
      delete t.completedAt;
    }
    saveData();
    showToast(t.done ? `"${t.title}" 완료!` : `미완료로 복구됨`);
  }
  renderTodo();
}

function delTodo(id, e) {
  if (e) e.stopPropagation();
  if (confirm('이 할일을 삭제할까요?')) {
    todos = todos.filter(x => x.id !== id);
    saveData();
    showToast('삭제됨');
    renderTodo();
  }
}

// ========== 챌린지 ==========
function renderChallengeSection() {
  let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin: 4px 0 10px;">
    <span style="font-size:14px; font-weight:600;">🎯 챌린지</span>
    <button onclick="openChallengeModal()" style="border:none; background:transparent; font-size:12px; color:var(--text-info); cursor:pointer; font-family:inherit; font-weight:500;">+ 추가</button>
  </div>`;

  const activeC = challenges.filter(c => !c.completed && !c.failed);
  const completedC = challenges.filter(c => c.completed);

  if (activeC.length === 0 && completedC.length === 0) {
    html += `<div style="padding:20px; background:linear-gradient(135deg, #1A1A1A 0%, #2D2D2D 100%); border-radius:12px; color:white; margin-bottom:14px;">
      <div style="font-size:13px; font-weight:600; margin-bottom:6px;">🚀 첫 챌린지를 시작해보세요!</div>
      <div style="font-size:11px; opacity:0.85; line-height:1.6; margin-bottom:12px;">
        매일 운동, 일주일 커피 끊기, 100일 책 읽기 등<br>목표를 정하면 매일 체크하고 진행률을 볼 수 있어요.
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        ${getChallengePresets().slice(0, 4).map(p => `
          <button onclick="quickChallenge(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="padding:6px 12px; background:rgba(255,255,255,0.15); color:white; border:none; border-radius:999px; font-size:10px; cursor:pointer; font-family:inherit;">${p.title}</button>
        `).join('')}
      </div>
    </div>`;
    return html;
  }

  activeC.forEach(c => {
    html += renderChallengeCard(c);
  });

  if (completedC.length > 0) {
    html += `<div style="margin-top:14px; padding:10px 12px; background:var(--bg-secondary); border-radius:var(--radius-md); cursor:pointer; display:flex; align-items:center; justify-content:space-between;" onclick="showCompletedChallenges()">
      <span style="font-size:11px; color:var(--text-secondary);">🏆 완료한 챌린지 ${completedC.length}개</span>
      <i class="ti ti-chevron-right" style="font-size:14px; color:var(--text-tertiary);"></i>
    </div>`;
  }

  return html;
}

function renderChallengeCard(c) {
  // 날짜 정규화 (시간 무시, 날짜만)
  const startDate = new Date(c.startDate + 'T00:00:00');
  const todayD = new Date(currentYear, currentMonth, today, 0, 0, 0, 0);

  // 일수 계산 - 오늘 포함, 최소 1일
  const msPerDay = 24 * 60 * 60 * 1000;
  let daysPassed = Math.floor((todayD - startDate) / msPerDay) + 1;
  if (daysPassed < 1) daysPassed = 1; // 시작일이 미래라도 최소 1일로 표시
  const totalDays = c.totalDays;

  const checkedDays = Object.keys(c.checks || {}).filter(k => c.checks[k] === true).length;

  const tKey = dateKey(currentYear, currentMonth, today);
  const todayChecked = c.checks?.[tKey];

  // 진행률
  let progressPct = 0;
  let progressText = '';

  if (c.type === 'daily') {
    progressPct = Math.min(100, (checkedDays / totalDays) * 100);
    progressText = `${checkedDays} / ${totalDays}일`;
  } else if (c.type === 'forbidden') {
    const violations = Object.values(c.checks || {}).filter(v => v === 'fail').length;
    const successes = Object.values(c.checks || {}).filter(v => v === true).length;
    progressPct = Math.min(100, (successes / totalDays) * 100);
    progressText = `${successes} / ${totalDays}일 성공`;
  } else if (c.type === 'count') {
    progressPct = Math.min(100, (checkedDays / c.targetCount) * 100);
    progressText = `${checkedDays} / ${c.targetCount}회`;
  }

  const isCompleted = progressPct >= 100;
  const gradient = isCompleted
    ? 'linear-gradient(135deg, #2A4D1B 0%, #3B6D11 100%)'
    : c.type === 'forbidden'
      ? 'linear-gradient(135deg, #6B3F08 0%, #854F0B 100%)'

  return `<div style="margin-bottom:12px; padding:14px; border-radius:12px; background:${gradient}; color:white;">

    </div>

    <div style="display:flex; justify-content:space-between; align-items:center; font-size:11px; margin-bottom:4px;">
      <span style="font-weight:600;">${progressText}</span>
      <span style="font-size:10px; opacity:0.7;">${Math.round(progressPct)}%</span>

    <div style="height:5px; background:rgba(255,255,255,0.2); border-radius:3px; overflow:hidden; margin-bottom:12px;">
      <div style="height:100%; width:${progressPct}%; background:rgba(255,255,255,0.95); transition:width 0.4s;"></div>
    </div>

    <!-- 날짜 그리드 -->
    <div style="display:grid; grid-template-columns: repeat(${Math.min(14, totalDays)}, 1fr); gap:3px; margin-bottom:12px;">${daysGrid}</div>

    ${isCompleted ? `

    ` : c.type === 'forbidden' ? `

      <div style="display:flex; gap:6px;">
        <button onclick="checkChallenge(${c.id}, true)" style="flex:1; padding:9px; border:none; border-radius:6px; background:${todayChecked===true?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.2)'}; color:${todayChecked===true?'#2A4D1B':'white'}; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit;">

    ` : `

      <button onclick="checkChallenge(${c.id}, ${!todayChecked})" style="width:100%; padding:10px; border:none; border-radius:6px; background:${todayChecked?'rgba(255,255,255,0.95)':'rgba(255,255,255,0.25)'}; color:${todayChecked?'#185FA5':'white'}; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;">

function checkChallenge(id, value) {
  const c = challenges.find(x => x.id === id);
  if (!c) return;
  const k = dateKey(currentYear, currentMonth, today);
  if (!c.checks) c.checks = {};

  const current = c.checks[k];

  // 같은 값 다시 누르면 해제 (토글)
  if (current === value) {
    delete c.checks[k];
    showToast('체크 해제');
  } else if (value === false || value === undefined) {
    delete c.checks[k];
    showToast('체크 해제');
  } else {
    c.checks[k] = value;
    showToast(value === true ? '성공! 💪' : value === 'fail' ? '실패 ㅠ' : '체크됨');
  }

  saveData();
  renderTodo();
}

// 챌린지 - 지난 날짜 토글 (과거 기록 수정용)
function toggleChallengeDate(id, dateKeyStr) {
  const c = challenges.find(x => x.id === id);
  if (!c) return;
  if (!c.checks) c.checks = {};

  const current = c.checks[dateKeyStr];

  if (c.type === 'forbidden') {
    // 금지형: 빈상태 → 성공 → 실패 → 빈상태 순환
    if (current === undefined) c.checks[dateKeyStr] = true;
    else if (current === true) c.checks[dateKeyStr] = 'fail';
    else delete c.checks[dateKeyStr];
  } else {
    // 일반: 토글
    if (current === true) delete c.checks[dateKeyStr];
    else c.checks[dateKeyStr] = true;
  }

  saveData();
  showToast(`${dateKeyStr} 변경됨`);
  renderTodo();
}

function fillPreset(title, type, totalDays, targetCount) {
  document.getElementById('ch-title').value = title;
  document.querySelectorAll('#ch-type .chip').forEach(x => {

  });
  document.querySelectorAll('#ch-days .chip').forEach(x => {
    x.classList.toggle('active', Number(x.dataset.d) === totalDays);
  });
  // 가장 가까운 기간 선택
  if (!document.querySelector('#ch-days .chip.active')) {
    document.querySelector('#ch-days .chip').classList.add('active');
  }
  if (type === 'count') {
    document.getElementById('ch-count-field').style.display = 'block';
    document.getElementById('ch-count').value = targetCount;
  } else {
    document.getElementById('ch-count-field').style.display = 'none';
  }
  // desc 업데이트
  document.querySelector(`#ch-type .chip[data-t="${type}"]`).click();
}

function saveChallenge() {
  const title = document.getElementById('ch-title').value.trim();
  if (!title) { showToast('챌린지 이름을 입력해주세요'); return; }
  const type = document.querySelector('#ch-type .chip.active').dataset.t;
  const targetCount = type === 'count' ? Number(document.getElementById('ch-count').value) : null;

  // 기간 모드 확인
  const mode = document.querySelector('#ch-mode .chip.active')?.dataset.m || 'preset';
  let totalDays, startDate;

  if (mode === 'custom') {
    const startV = document.getElementById('ch-start')?.value;
    const endV = document.getElementById('ch-end')?.value;
    if (!startV || !endV) {
      showToast('시작일과 종료일을 모두 선택해주세요');
      return;
    }
    const days = Math.floor((new Date(endV) - new Date(startV)) / (24*60*60*1000)) + 1;
    if (days <= 0) {
      showToast('종료일이 시작일보다 빨라요');
      return;
    }
    totalDays = days;
    startDate = startV;
  } else {
    totalDays = Number(document.querySelector('#ch-days .chip.active').dataset.d);
    startDate = dateKey(currentYear, currentMonth, today);
  }

  challenges.push({
    id: Date.now(),
    title, type, totalDays, targetCount,
    startDate,
    checks: {},
    completed: false,
  });
  saveData();
  showToast(`"${title}" 챌린지 시작! 🚀 (${totalDays}일)`);
  closeModal();
  renderTodo();
}
