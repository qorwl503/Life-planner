            }
            if (res.status === 503) { lastErr = '503: AI 서버 혼잡'; console.warn(`⚠️ 자동적립 OCR ${model} 503 → 다음 모델`); break; }
            if (!res.ok) { lastErr = `${res.status}`; console.warn(`⚠️ 자동적립 OCR ${model} ${res.status}`); break; }
            const data = await res.json();
            txt = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
            break;
          } catch (err) {
            lastErr = err.message;
            console.warn(`자동적립 OCR ${model} 에러:`, err);
            break;
          }
        }
        if (txt) break;
      }
      if (!txt) { failCount++; if (lastErr) { lastErrGlobal = lastErr; console.warn('자동적립 OCR 최종 실패:', lastErr); } continue; }

      const m = txt.match(/\{[\s\S]*\}/);
      let parsed = null;
      if (m) {
        try {
          parsed = JSON.parse(m[0]);
        } catch (pe) {
          // 🔧 JSON이 잘렸으면(토큰 부족 등) 정규식으로 종목·회차 직접 복구
          console.warn('자동적립 JSON 파싱 실패 → 복구 시도');
          try {
            const name = (txt.match(/"name"\s*:\s*"([^"]+)"/) || [])[1];
            const ticker = (txt.match(/"ticker"\s*:\s*"([^"]*)"/) || [])[1] || '';
            const isUS = /"isUS"\s*:\s*true/.test(txt);
            const lots = [];
            // 각 lot의 date/qty/price/amount 추출
            const lotRe = /\{[^{}]*?"(?:date|qty|price|amount)"[\s\S]*?\}/g;
            let lm;
            while ((lm = lotRe.exec(txt)) !== null) {
              const blk = lm[0];
              const date = (blk.match(/"date"\s*:\s*"([^"]*)"/) || [])[1] || '';
              const qty = parseFloat((blk.match(/"qty"\s*:\s*([\d.]+)/) || [])[1]) || 0;
              const price = parseFloat((blk.match(/"price"\s*:\s*([\d.]+)/) || [])[1]) || 0;
              const amount = parseFloat((blk.match(/"amount"\s*:\s*([\d.]+)/) || [])[1]) || 0;
              if (qty > 0 || amount > 0) lots.push({ date, qty, price, amount });
            }
            if (name && lots.length > 0) {
              parsed = { items: [{ name, ticker, isUS, fractional: true, amt: 0, cycle: 'weekly', lots }] };
              console.log(`🔧 복구 성공: ${name} 회차 ${lots.length}개`);
            }
          } catch (re) { /* 복구도 실패 */ }
        }
      }
      if (parsed) {
        try {
          // 🔍 진단: 이 캡처가 준 종목·회차 수
          console.log(`🔍 캡처 ${fi+1} 파싱:`, (parsed.items||[]).map(x=>`${x.name}(회차${x.lots?.length||0})`).join(', '));
          (parsed.items || []).forEach(it => {
            if (!it.name) return;
            // 🔧 같은 종목이 여러 캡처에 나오면 병합 (따로 안 잡히게)
            const norm = (s) => (s||'').replace(/\s+/g,'').toUpperCase();
            const exist = allItems.find(x => norm(x.name) === norm(it.name) ||
              (it.ticker && x.ticker && norm(x.ticker) === norm(it.ticker)));
            if (exist) {
              // 회차 병합 (같은 날짜+수량 중복 제거)
              const newLots = Array.isArray(it.lots) ? it.lots : [];
              if (!exist.lots) exist.lots = [];
              newLots.forEach(nl => {
                const dup = exist.lots.find(el =>
                  (el.date||'') === (nl.date||'') && Number(el.qty) === Number(nl.qty));
                if (dup) {
                  // 금액/단가 정보가 더 있는 쪽으로 보강
                  if (!dup.price && nl.price) dup.price = nl.price;
                  if (!dup.amount && nl.amount) dup.amount = nl.amount;
                } else {
                  exist.lots.push(nl);
                }
              });
              // 금액·티커 보강
              if (!exist.ticker && it.ticker) exist.ticker = it.ticker;
              if (!exist.amt && it.amt) exist.amt = it.amt;
            } else {
              allItems.push(it); // 금액 0이어도 회차(lots)가 있을 수 있음
            }
          });
          if (parsed.error) lastErrGlobal = parsed.error;
        } catch (pe) {
          lastErrGlobal = 'JSON 처리 실패';
          console.warn('자동적립 처리 실패:', pe);
        }
      } else {
        lastErrGlobal = '응답에서 데이터를 못 찾음';
        console.warn('자동적립 OCR 응답:', txt);
      }
    } catch (e) {
      lastErrGlobal = e.message || '알 수 없는 오류';
      console.warn('자동적립 OCR 실패', e);
      failCount++;
    }
    // 🔧 다음 이미지 전 잠깐 대기 (여러 장 한꺼번에 → 요청 한도 초과 방지)
    if (fi < files.length - 1) {
      if (statusEl) statusEl.textContent = `📸 캡처 분석 중... (${fi + 2}/${files.length})`;
      await new Promise(r => setTimeout(r, 2500));
    }
  }

  input.value = '';
  clearStatus();

  if (allItems.length === 0) {
    showToast(lastErrGlobal ? `자동적립 인식 실패: ${lastErrGlobal}` : '자동적립 설정을 찾지 못했어요');
    return;
  }
  // 🔧 고정지출 추가 모달이 열린 상태이므로, 닫고 잠시 후 검토 모달 띄움 (충돌 방지)
  closeModal();
  setTimeout(() => openAutobuyReviewModal(allItems), 120);
}

// 자동적립/체결내역 캡처 검토 모달 — 회차 수정 + 자동매수 설정 통합
function openAutobuyReviewModal(items) {
  // 각 항목 정규화: lots는 편집 가능한 배열로, 자동매수 설정 기본값
  window._autobuyReviewItems = items.map(it => {
    let lots = Array.isArray(it.lots) ? it.lots.map(l => ({
      date: l.date || '',
      qty: Number(l.qty) || 0,
      price: Number(l.price) || 0,
      amount: Number(l.amount) || 0,
    })) : [];

    // 🔧 보정: price가 0인데 amount가 있는 회차 — amount가 '단가'인지 '총액'인지 판별
    //    다른 회차들의 단가(price) 평균과 비교해서, amount가 단가에 가까우면 price로 옮김
    const knownPrices = lots.filter(l => l.price > 0).map(l => l.price);
    const avgPrice = knownPrices.length ? knownPrices.reduce((a,b)=>a+b,0)/knownPrices.length : 0;
    lots.forEach(l => {
      if (l.price === 0 && l.amount > 0 && l.qty > 0) {
        if (avgPrice > 0) {
          // 다른 회차 단가를 아는 경우: amount가 단가 범위(0.5~2배)면 단가로 간주
          if (l.amount >= avgPrice * 0.5 && l.amount <= avgPrice * 2) {
            l.price = l.amount;       // amount는 사실 단가였음
            l.amount = 0;             // 총액은 아래서 단가×수량으로 재계산
          }
        } else {
          // 비교할 단가가 없는 경우: amount/qty가 너무 작으면(총액이라기엔) 단가로 간주
          // (예: 총액 13만 / 3주 = 4.3만 단가는 비현실적 → amount가 단가)
          const impliedUnit = l.amount / l.qty;
          if (impliedUnit < l.amount * 0.6) {
            // amount를 수량으로 나눈 게 amount보다 한참 작으면, amount가 단가일 가능성
            l.price = l.amount;
            l.amount = 0;
          }
        }
      }
    });
    // 총액 확정: amount 있으면 그대로, 없으면 단가×수량
    lots = lots.map(l => ({
      date: l.date,
      qty: l.qty,
      price: l.price,
      amount: l.amount > 0 ? l.amount : Math.round(l.qty * l.price),
    }));

    // 🔧 회차가 있으면: 마지막 회차 다음 주기를 자동매수 시작일로, 그 요일을 기본 요일로 추천
    let defStart = it.startDate || todayKey();
    let defDow = it.dayOfWeek != null ? it.dayOfWeek : 3;
    const lotDates = lots.map(l => l.date).filter(Boolean).sort();
    if (lotDates.length > 0) {
      const last = new Date(lotDates[lotDates.length - 1] + 'T00:00:00');
      defDow = last.getDay(); // 마지막 회차의 요일 = 정기매수 요일
      const cyc = it.cycle || 'weekly';
      const step = cyc === 'biweekly' ? 14 : cyc === 'monthly' ? 0 : 7;
      const next = new Date(last);
      if (step > 0) next.setDate(next.getDate() + step);
      else next.setMonth(next.getMonth() + 1);
      defStart = `${next.getFullYear()}-${String(next.getMonth()+1).padStart(2,'0')}-${String(next.getDate()).padStart(2,'0')}`;
    }

    return {
      ...it,
      _checked: true,
      lots,
      _autoBuy: Number(it.amt) > 0,
      amt: Number(it.amt) || 0,
      cycle: it.cycle || 'weekly',
      dayOfWeek: defDow,
      startDate: defStart,
    };
  });

  const dowNames = ['일','월','화','수','목','금','토'];
  const render = () => {
    const list = window._autobuyReviewItems.map((it, i) => {
      const normT = (t) => (t||'').toUpperCase().replace(/\.(KS|KQ)$/,'');
      const existAsset = assets.find(a => a.name === it.name || (it.ticker && a.ticker && normT(a.ticker) === normT(it.ticker)));
      const hasLots = it.lots.length > 0;
      const lotQty = it.lots.reduce((s,l) => s + (Number(l.qty)||0), 0);
      const lotCost = it.lots.reduce((s,l) => s + (Number(l.amount)|| (Number(l.qty)||0)*(Number(l.price)||0)), 0);

      // 회차 편집 행들
      const lotRows = it.lots.map((l, li) => `
        <div style="display:flex; gap:4px; align-items:center; margin-bottom:4px;">
          <input type="date" value="${l.date || ''}" oninput="window._autobuyReviewItems[${i}].lots[${li}].date = this.value;" onchange="window._autobuyReviewItems[${i}].lots[${li}].date = this.value;"
            style="flex:1.4; padding:5px; border:0.5px solid var(--border-tertiary); border-radius:5px; font-size:10px; font-family:inherit;" />
          <input type="number" step="0.0001" value="${l.qty || ''}" placeholder="수량" oninput="window._autobuyReviewItems[${i}].lots[${li}].qty = Number(this.value)||0;"
            style="flex:1; padding:5px; border:0.5px solid var(--border-tertiary); border-radius:5px; font-size:10px; font-family:inherit;" />
          <input type="number" value="${l.amount || ''}" placeholder="금액" oninput="window._autobuyReviewItems[${i}].lots[${li}].amount = Number(this.value)||0;"
            style="flex:1.2; padding:5px; border:0.5px solid var(--border-tertiary); border-radius:5px; font-size:10px; font-family:inherit;" />
          <button onclick="window._autobuyReviewItems[${i}].lots.splice(${li},1); window._renderAutobuyReview();" style="border:none; background:transparent; color:var(--text-danger); cursor:pointer; font-size:13px; padding:2px;">🗑️</button>
        </div>`).join('');

      return `
        <div style="padding:12px; background:white; border:0.5px solid var(--border-tertiary); border-radius:10px; margin-bottom:10px;">
          <label style="display:flex; align-items:center; gap:8px; cursor:pointer; margin-bottom:8px;">
            <input type="checkbox" ${it._checked ? 'checked' : ''} onchange="window._autobuyReviewItems[${i}]._checked = this.checked;" style="width:18px; height:18px;" />
            <div style="flex:1;">
              <div style="font-size:13px; font-weight:600;">${escapeHTML(it.name)} ${it.isUS ? '🇺🇸' : '🇰🇷'}</div>
              <div style="font-size:9px; color:var(--text-tertiary);">${it.ticker ? escapeHTML(it.ticker) : '티커 없음'} ${it.fractional ? '· 소수점' : ''}${existAsset ? ' · 기존 자산에 반영' : ' · 새 자산'}</div>
            </div>
          </label>

          ${hasLots ? `
            <div style="padding-left:26px; margin-bottom:8px;">
              <div style="font-size:9px; color:var(--text-secondary); font-weight:600; margin-bottom:4px;">📊 회차 ${it.lots.length}건 · 총 ${lotQty.toFixed(4).replace(/\.?0+$/,'')}주 · ${Math.round(lotCost).toLocaleString()}원 <span style="color:var(--text-tertiary); font-weight:400;">(날짜·수량·금액 수정 가능)</span></div>
              ${lotRows}
              <div style="font-size:9px; color:var(--text-warning); margin-top:4px;">${existAsset ? '🔄 기존 보유분을 이 회차로 교체 (2배 방지)' : '✨ 새 자산 생성'}</div>
            </div>
          ` : ''}

          <div style="padding-left:26px; border-top:0.5px dashed var(--border-tertiary); padding-top:8px;">
            <label style="display:flex; align-items:center; gap:6px; cursor:pointer; margin-bottom:6px;">
              <input type="checkbox" ${it._autoBuy ? 'checked' : ''} onchange="(function(){ const it=window._autobuyReviewItems[${i}]; it._autoBuy=event.target.checked; if(it._autoBuy && !(Number(it.amt)>0) && it.lots && it.lots.length){ const amts=it.lots.map(l=>Number(l.amount)||((Number(l.qty)||0)*(Number(l.price)||0))).filter(x=>x>0); if(amts.length) it.amt=Math.round(amts.reduce((a,b)=>a+b,0)/amts.length); } window._renderAutobuyReview(); })()" style="width:16px; height:16px;" />
              <span style="font-size:11px; font-weight:600;">🤖 앞으로 자동매수 걸기</span>
            </label>
            ${it._autoBuy ? `
              <div style="display:flex; gap:5px; margin-bottom:5px;">
                <div style="flex:1.2;">
                  <div style="font-size:8px; color:var(--text-tertiary);">1회 금액</div>
                  <input type="number" value="${it.amt || ''}" placeholder="120000" oninput="window._autobuyReviewItems[${i}].amt = Number(this.value)||0;"
                    style="width:100%; padding:6px; border:0.5px solid var(--border-tertiary); border-radius:5px; font-size:11px; font-family:inherit;" />
                </div>
                <div style="flex:1;">
                  <div style="font-size:8px; color:var(--text-tertiary);">주기</div>
                  <select onchange="window._autobuyReviewItems[${i}].cycle = this.value; window._renderAutobuyReview();"
                    style="width:100%; padding:6px; border:0.5px solid var(--border-tertiary); border-radius:5px; font-size:11px; font-family:inherit; background:white;">
                    <option value="weekly" ${it.cycle==='weekly'?'selected':''}>매주</option>
                    <option value="biweekly" ${it.cycle==='biweekly'?'selected':''}>격주</option>
                    <option value="monthly" ${it.cycle==='monthly'?'selected':''}>매월</option>
                  </select>
                </div>
              </div>
              <div style="display:flex; gap:5px;">
                ${it.cycle === 'monthly' ? `
                  <div style="flex:1;">
                    <div style="font-size:8px; color:var(--text-tertiary);">결제일</div>
                    <input type="number" min="1" max="31" value="${it.day || ''}" placeholder="15" oninput="window._autobuyReviewItems[${i}].day = Number(this.value)||undefined;"
                      style="width:100%; padding:6px; border:0.5px solid var(--border-tertiary); border-radius:5px; font-size:11px; font-family:inherit;" />
                  </div>
                ` : `
                  <div style="flex:1;">
                    <div style="font-size:8px; color:var(--text-tertiary);">요일</div>
                    <select onchange="window._autobuyReviewItems[${i}].dayOfWeek = Number(this.value);"
                      style="width:100%; padding:6px; border:0.5px solid var(--border-tertiary); border-radius:5px; font-size:11px; font-family:inherit; background:white;">
                      ${dowNames.map((d,di) => `<option value="${di}" ${it.dayOfWeek===di?'selected':''}>${d}</option>`).join('')}
                    </select>
                  </div>
                `}
                <div style="flex:1.5;">
                  <div style="font-size:8px; color:var(--text-tertiary);">시작 날짜 (이 날부터 자동)</div>
                  <input type="date" value="${it.startDate}" oninput="window._autobuyReviewItems[${i}].startDate = this.value;" onchange="window._autobuyReviewItems[${i}].startDate = this.value;"
                    style="width:100%; padding:6px; border:0.5px solid var(--border-tertiary); border-radius:5px; font-size:11px; font-family:inherit;" />
                </div>
              </div>
              ${it.lots && it.lots.length ? `<div style="font-size:8px; color:var(--text-info); margin-top:4px;">💡 회차 ${it.lots.length}건은 이미 반영됐어요. 시작일은 <b>다음 매수 예정일</b>로 맞춰뒀어요(중복 안 됨).</div>` : ''}
            ` : ''}
          </div>
        </div>`;
    }).join('');
    const c = document.getElementById('autobuy-review-list');
    if (c) c.innerHTML = list;
  };
  window._renderAutobuyReview = render;

  modal.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-cancel" onclick="closeModal()">취소</button>
        <h2>📊 캡처 검토</h2>
        <button class="modal-save" onclick="saveAutobuyReview()">저장</button>
      </div>
      <div style="padding:10px 12px; background:var(--bg-info); border-radius:8px; margin-bottom:12px; font-size:11px; color:var(--text-info); line-height:1.5;">
        💡 회차(날짜·수량·금액)를 확인·수정하고, 앞으로 자동매수도 걸 수 있어요.<br>
        회차는 기존 보유분을 <b>교체</b>해서 2배가 안 돼요. 자동매수는 시작 날짜부터 적용됩니다.
      </div>
      <div id="autobuy-review-list" style="max-height:60vh; overflow-y:auto;"></div>
    </div>`;
  modal.classList.add('show');
  setTimeout(render, 50);
}

function saveAutobuyReview() {
  const selected = (window._autobuyReviewItems || []).filter(it => it._checked);
  if (selected.length === 0) { showToast('선택된 항목이 없어요'); return; }

  const guessType = (it) => it.isUS
    ? (/etf|qqq|spy|voo|schd|qqqm|spym/i.test(it.name + (it.ticker||'')) ? '해외ETF' : '미국주식')
    : (/etf|tiger|kodex|kbstar|ace|sol|plus/i.test(it.name) ? '국내ETF' : '국내주식');
  const normT = (t) => (t||'').toUpperCase().replace(/\.(KS|KQ)$/,'');

  if (!budget.fixed) budget.fixed = [];
  let addedLots = 0, addedAuto = 0;
  let autoBuyNoAmt = 0; // 자동매수 켰지만 금액 없는 항목 수

  selected.forEach(it => {
    const assetType = guessType(it);
    const hasLots = it.lots && it.lots.length > 0;

    // 1) 기존 자산 찾거나 새로 생성
    let asset = assets.find(a => a.name === it.name || (it.ticker && a.ticker && normT(a.ticker) === normT(it.ticker)));
    if (!asset && (hasLots || it._autoBuy)) {
      asset = {
        id: Date.now() + Math.random(),
        name: it.name,
        type: assetType,
        ticker: it.ticker || '',
        qty: 0, price: 0,
        priceCurrency: it.isUS ? 'USD' : 'KRW',
        lots: [],
        createdDate: todayKey(),
      };
      assets.push(asset);
    }

    // 2) 회차(lots) → 기존 lot 교체 (2배 방지). 단, 자동매수 lot은 보존하고 수동/캡처분만 교체
    if (hasLots && asset) {
      const validLots = it.lots.filter(l => Number(l.qty) > 0);
      if (validLots.length > 0) {
        // 자동매수로 생성된 lot은 남기고, 그 외(기존 캡처/수동/OCR)는 이 캡처로 교체
        const keptAuto = (asset.lots || []).filter(l => l.autoBuy);
        const newLots = validLots.map(l => {
          const q = Number(l.qty) || 0;
          const amt = Number(l.amount) || 0;
          // 🔧 금액이 있으면 단가 역산 (price 0으로 "× 0원" 표시되던 문제 해결)
          let pr = Number(l.price) || 0;
          if (!pr && amt > 0 && q > 0) pr = amt / q;
          const exact = amt > 0 ? amt : Math.round(q * pr);
          return {
            id: Date.now() + Math.random(),
            source: '📸 체결내역 캡처',
            qty: parseFloat(q.toFixed(4)),
            price: Math.round(pr),
            date: l.date || todayKey(),
            autoBuy: false,
            exactAmount: exact,
          };
        });
        asset.lots = [...newLots, ...keptAuto];
        if (!asset.ticker && it.ticker) asset.ticker = it.ticker;
        recalcAssetFromLots(asset);
        addedLots += newLots.length;
      }
    }

    // 3) 자동매수 설정 (앞으로 적용)
    if (it._autoBuy && Number(it.amt) > 0) {
      // 같은 종목 기존 자동매수 있으면 갱신, 없으면 추가
      let fixed = (budget.fixed || []).find(f => f.autoBuy && f.assetInfo &&
        (f.assetInfo.name === it.name || (it.ticker && f.assetInfo.ticker && normT(f.assetInfo.ticker) === normT(it.ticker))));
      const fixedData = {
        name: it.name,
        amt: Number(it.amt),
        cycle: it.cycle || 'weekly',
        dow: (it.cycle !== 'monthly') ? (it.dayOfWeek != null ? it.dayOfWeek : 3) : undefined,
        day: (it.cycle === 'monthly') ? (it.day || 1) : undefined,
        icon: 'ti-robot',
        cat: '투자',
        autoBuy: true,
        fractional: it.fractional === true || it.isUS,
        createdAt: (it.startDate || todayKey()) + 'T00:00:00', // 🔧 다른 자동매수 코드와 동일한 필드명
        assetInfo: { name: it.name, type: assetType, ticker: it.ticker || '' },
      };
      if (fixed) {
        Object.assign(fixed, fixedData);
        // 캡처로 과거 회차를 이미 넣었으므로, 자동매수는 캡처 마지막 날짜 이후부터
        const lastLotDate = (asset && asset.lots || []).map(l => l.date).filter(Boolean).sort().pop();
        fixed.lastBuyDate = lastLotDate ? new Date(lastLotDate).toISOString() : null;
      } else {
        const lastLotDate = (asset && asset.lots || []).map(l => l.date).filter(Boolean).sort().pop();
        budget.fixed.push({
          id: Date.now() + Math.random(),
          ...fixedData,
          lastBuyDate: lastLotDate ? new Date(lastLotDate).toISOString() : null,
        });
      }
      addedAuto++;
    } else if (it._autoBuy && !(Number(it.amt) > 0)) {
      autoBuyNoAmt++; // 토글은 켰지만 금액 없음 → 경고용
    }
  });

  if (addedLots === 0 && addedAuto === 0) {
    showToast('추가할 항목이 없어요 (회차 또는 자동매수 금액 확인)');
    return;
  }

  saveData();
  const msgs = [];
  if (addedLots > 0) msgs.push(`회차 ${addedLots}건`);
  if (addedAuto > 0) msgs.push(`자동매수 ${addedAuto}개`);
  let toastMsg = `✅ ${msgs.join(' · ')} 저장됨`;
  if (autoBuyNoAmt > 0) toastMsg = `⚠️ 자동매수 ${autoBuyNoAmt}개는 금액이 없어 안 걸렸어요. ` + (msgs.length ? `(${msgs.join(' · ')}는 저장됨)` : '');
  showToast(toastMsg);
  closeModal();
  // 🔧 현재 보고 있는 탭을 다시 그림 (가계부=money에서 캡처했으면 자산탭으로 안 넘어가게)
  render();
  // 시세는 백그라운드로만 갱신 (화면 전환 없이)
  if (typeof refreshAllAssetPrices === 'function') {
    setTimeout(() => { refreshAllAssetPrices().then(() => { if (currentTab === 'asset') renderAsset(); }).catch(()=>{}); }, 300);
  }
}

async function processFixedCapture(input) {
  const files = Array.from(input.files || []);
  if (files.length === 0) return;
  if (!window.GEMINI_API_KEY) {
    showToast('AI 키를 먼저 설정해주세요 (설정 → AI 키)');
    return;
  }

  showToast('🔄 캡처 분석 중...');
  const allItems = [];
  let failCount = 0;

  for (let idx = 0; idx < files.length; idx++) {
    const file = files[idx];
    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
      const mimeType = file.type || 'image/jpeg';

      const prompt = `은행 자동이체 내역, 구독 서비스 목록, 정기결제 명세 화면에서 '고정지출' 항목을 추출해 JSON으로 반환해.

각 항목: {name, amt, cycle, day}
- name: 항목 이름 (예: "넷플릭스", "월세", "통신비", "실손보험")
- amt: 1회 결제 금액 (숫자만, 원). 예: 17000
- cycle: 결제 주기 — "monthly"(매월) / "weekly"(매주) / "biweekly"(격주). 대부분 monthly
- day: 매월 결제일 (1~31 숫자). 화면에 보이면 넣고, 없으면 생략

📤 출력 (JSON만, 설명 없이):
{"items":[
  {"name":"넷플릭스","amt":17000,"cycle":"monthly","day":15},
  {"name":"월세","amt":500000,"cycle":"monthly","day":25},
  {"name":"통신비","amt":55000,"cycle":"monthly"}
]}

화면에 고정지출 항목이 하나도 없으면: {"items":[],"error":"이유"}

⚠️ 일회성 지출(한 번만 쓴 것)은 제외하고, 정기적으로 빠져나가는 것만 추출해.`;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${window.GEMINI_API_KEY}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{ parts: [
            { text: prompt },
            { inline_data: { mime_type: mimeType, data: base64 } },
          ]}],
          generationConfig: { temperature: 0.1, maxOutputTokens: 2000 },
        }),
      });
      const data = await res.json();
      const txt = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
      const m = txt.match(/\{[\s\S]*\}/);
      if (m) {
        const parsed = JSON.parse(m[0]);
        (parsed.items || []).forEach(it => {
          if (it.name && Number(it.amt) > 0) allItems.push(it);
        });
      }
    } catch (e) {
      console.warn('고정지출 OCR 실패', e);
      failCount++;
    }
  }

  input.value = ''; // 재선택 가능하게

  if (allItems.length === 0) {
    showToast(failCount > 0 ? '캡처 분석에 실패했어요. 다시 시도해주세요' : '캡처에서 고정지출을 찾지 못했어요');
    return;
  }
  openFixedReviewModal(allItems);
}

// 🔧 고정지출 OCR 결과 검토 모달 — 기존 항목과 겹치면 수정, 아니면 추가

    const existing = (budget.fixed || []).find(f => norm(f.name) === norm(it.name));
    return {
      ...it,
      _idx: i,
      _existingId: existing ? existing.id : null,
      _action: existing ? 'update' : 'new', // update | new | skip

    };
  });
  window._fixedReviewItems = reviewed;

  const rows = reviewed.map((it, i) => {

    return `
      <div style="padding:12px; background:var(--bg-secondary); border-radius:10px; margin-bottom:8px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">

          <span style="font-size:13px; font-weight:700;">${Number(it.amt).toLocaleString()}원</span>

          ${cycleLabel}${it.day ? ` · 매월 ${it.day}일` : ''}

        </div>
        <div style="display:flex; gap:4px;">
          ${it._existingId ? `
            <button onclick="setFixedReviewAction(${i},'update')" class="chip ${it._action==='update'?'active':''}" style="flex:1; font-size:10px;">🔄 수정</button>
          ` : `
            <button onclick="setFixedReviewAction(${i},'new')" class="chip ${it._action==='new'?'active':''}" style="flex:1; font-size:10px;">✨ 추가</button>
          `}
          <button onclick="setFixedReviewAction(${i},'skip')" class="chip ${it._action==='skip'?'active':''}" style="flex:1; font-size:10px;">🚫 건너뛰기</button>
        </div>
      </div>`;
  }).join('');

  modal.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-cancel" onclick="closeModal()">취소</button>
        <h2>고정지출 ${reviewed.length}개 인식됨</h2>
        <button class="modal-save" onclick="applyFixedReview()">적용</button>
      </div>
      <div style="padding:10px 12px; background:var(--bg-info); border-radius:10px; margin-bottom:12px; font-size:11px; color:var(--text-info); line-height:1.6;">
        캡처에서 찾은 항목이에요. 기존에 있는 건 <b>수정</b>, 없는 건 <b>추가</b>로 처리돼요. 원하지 않으면 건너뛰기를 누르세요.
      </div>
      ${rows}
    </div>
  `;
  modal.classList.add('show');
}

function setFixedReviewAction(idx, action) {
  if (!window._fixedReviewItems || !window._fixedReviewItems[idx]) return;
  window._fixedReviewItems[idx]._action = action;
  openFixedReviewModal(window._fixedReviewItems); // 다시 그리기
}

function applyFixedReview() {
  const items = window._fixedReviewItems || [];
  let added = 0, updated = 0;
  items.forEach(it => {
    if (it._action === 'skip') return;
    if (it._action === 'update' && it._existingId) {
      const f = budget.fixed.find(x => x.id === it._existingId);
      if (f) {
        f.amt = Number(it.amt);
        if (it.cycle) f.cycle = it.cycle;
        if (it.day) f.day = Number(it.day);
        updated++;
      }
    } else if (it._action === 'new') {
      budget.fixed.push({
        id: Date.now() + Math.random(),
        name: it.name,
        amt: Number(it.amt),
        cycle: it.cycle || 'monthly',
        day: it.day ? Number(it.day) : 1,
        dow: 1,
        paid: false,
        autoBuy: false,
      });
      added++;
    }
  });
  window._fixedReviewItems = null;
  saveData();
  closeModal();
  showToast(`고정지출 ${added}개 추가, ${updated}개 수정됨`);
  render(); // 🔧 현재 탭 유지
}

        💡 ${items.length}개 자산 추출됨.<br>
        🎯 <b>보정</b>: 기존 자산을 캡처값으로 교정 (자동매수 회차·연동 유지) — 가장 정확<br>
        🔗 <b>합산</b>: 기존에 더하기 · ✨ <b>신규</b>: 새 자산으로
      </div>

      <div id="asset-review-list" style="max-height:60vh; overflow-y:auto;"></div>
    </div>
  `;
  modal.classList.add('show');

  setTimeout(() => window._renderAssetReview(), 50);
}

function saveAssetReviewItems() {
  const selected = (window._assetReviewItems || []).filter(it => it._checked && it._action !== 'skip');
  if (selected.length === 0) {
    showToast('선택된 항목이 없어요');
    return;
  }

  let addedCount = 0;
  let mergedCount = 0;
  let correctedCount = 0;
  const today = todayKey(); // 🔧 UTC 밀림 방지

  // 🔧 달러 매입가가 하나라도 있으면 환율 받아둠 (원화 환산용)
  const hasUSD = selected.some(it => it.priceCurrency === 'USD');
  let usdRate = null;

  const doSave = (rate) => {
  const newlyCreated = []; // 🔧 이번 저장에서 새로 만든 자산 추적 (캡처 내 중복 합산용)
  selected.forEach(it => {
    const rawQty = Number(it.qty);
    const qty = isFinite(rawQty) ? parseFloat(rawQty.toFixed(4)) : 1;
    let price = Number(it.price) || 0;
    const type = it.type || '주식';
    const name = it.name || '이름없음';

    // 🔧 달러 매입가 → 원화 환산 (lot은 항상 원화로 저장)
    //    OCR이 화면에서 평균 매입 환율을 읽었으면 그 환율로, 못 읽었으면 오늘 환율로 폴백
    let priceNote = '';
    if (it.priceCurrency === 'USD' && rate) {
      const usdPrice = price;
      const ocrRate = Number(it.avgBuyRate) || 0;
      const useRate = ocrRate > 0 ? ocrRate : rate;
      price = Math.round(price * useRate);
      priceNote = ` ($${usdPrice} × ${Math.round(useRate)}${ocrRate > 0 ? ' 매입환율' : ' 오늘환율'})`;
    } else {
      price = Math.round(price);
    }

    if (it._action === 'correct' && it._existingId) {
      // 🎯 보정 모드: 캡처 시점의 '실제 보유'를 단일 lot으로 확정.
      //    이후 자동매수는 이 위에 자연스럽게 쌓임 (recalcAssetFromLots가 항상 정답).
      const existing = assets.find(a => a.id === it._existingId);
      if (existing) {
        if (!existing.ticker && it.ticker) existing.ticker = it.ticker;

        // 캡처에서 읽은 "실제 총 보유분" (원화 기준)
        const realQty = qty;
        let realAvg = price; // 위에서 이미 원화 환산됨 (OCR 매입단가)

        // 🔧 평단 정확도 개선 — 평가금액·수익률을 읽었으면 거기서 평단 역산.
        //    OCR이 매입단가를 직접 읽으면 부정확할 때가 많지만,
        //    평가금액·수익률은 큰 숫자라 잘 읽힘 → 평단 = (평가금액/수량) / (1+수익률)
        const evalForCalc = Number(it.evalAmount) || 0;
        const pctForCalc = (it.profitPct != null && isFinite(Number(it.profitPct))) ? Number(it.profitPct) : null;
        if (realQty > 0 && evalForCalc > 0 && pctForCalc != null && pctForCalc > -100) {
          const costBasis = evalForCalc / (1 + pctForCalc / 100); // 총 매입원금
          const calcedAvg = Math.round(costBasis / realQty);
          if (calcedAvg > 0) {
            realAvg = calcedAvg;
            priceNote = ` (평가금액·수익률에서 평단 역산)`;
          }
        }

        const realCost = Math.round(realQty * realAvg);

        // 🔧 기존 lot(자동매수 포함)을 전부 치우고, 캡처 기준 단일 lot으로 교체.
        //    "보정 시점까지의 실제 보유"를 한 줄로 확정 → 이후 자동매수가 이 위에 쌓임.
        //    이렇게 하면 나중에 자동매수가 더 들어와도 합계가 정확히 맞음.
        existing.lots = [{
          id: Date.now() + Math.random(),
          source: `🎯 캡처 보정 ${today}`,
          qty: realQty,
          price: realAvg,
          date: today,
          fxDiscount: existing.fxDiscount || null,
          buyRate: null,
          autoBuy: false,
          fixedId: null,
          exactAmount: realCost, // 증권사 실제 금액 정확 보존
          isCaptureBase: true,   // 🔧 캡처 기준점 표시 (이후 자동매수가 이 위에 쌓임)
          note: `증권사 캡처 기준 확정 (${today})` + priceNote,
        }];

        recalcAssetFromLots(existing);
        // 🔧 qty/price 강제 고정 제거 — lot 합계가 항상 정답이 되게.
        //    (예전엔 여기서 덮어쓴 뒤 자동매수 들어오면 recalc가 다시 돌며 어긋남)

        // OCR이 읽은 평가금액·수익률 → ocrSnapshot 기록 (≈추정 표시 제거용)
        //    평가금액·수익률을 못 읽었어도 ocrSnapshot은 항상 만든다(보정 날짜 기록 → ≈추정 표시 제거)
        const evalAmt = Number(it.evalAmount) || 0;
        const ocrProfitPct = (it.profitPct != null && isFinite(Number(it.profitPct)))
          ? Number(it.profitPct) : null;
        existing.ocrSnapshot = {
          date: today,
          evalAmount: evalAmt > 0 ? evalAmt : null,
          profitPct: ocrProfitPct,
          profitAmount: (it.profitAmount != null && isFinite(Number(it.profitAmount)))
            ? Number(it.profitAmount) : null,
        };
        // lot이 원화 환산 저장됐으므로 자산은 원화 기준
        if (isStockLikeType(existing.type)) {
          existing.priceCurrency = 'KRW';
          delete existing.avgBuyRate;
        }
        correctedCount++;
      }
    } else if (it._action === 'merge' && it._existingId) {
      // 기존 자산에 lot 추가 (합산)
      const existing = assets.find(a => a.id === it._existingId);
      if (existing) {
        // 🔧 청약·예적금·현금·부동산은 '납입형' — 캡처값은 현재 잔액 전체이므로
        //    합산하면 두 배가 됨. lot을 비우고 잔액을 캡처값으로 덮어쓴다.
        if (['청약','예적금','현금','부동산'].includes(existing.type)) {
          const capBalance = Math.round(qty * price > 0 ? qty * price : price);
          existing.lots = []; // 기존 자동납입 lot 제거 — 캡처 잔액에 이미 다 포함됨
          existing.qty = 1;
          existing.price = capBalance;
          existing.initialBalance = capBalance;
          mergedCount++;
        } else {
          addAssetLot(existing, {
            source: `📸 OCR ${today}`,
            qty,
            price,
            date: today,
            fxDiscount: existing.fxDiscount || null,
            autoBuy: false,
            note: '캡처 합산' + priceNote,
          });
          if (!existing.ticker && it.ticker) existing.ticker = it.ticker;
          // 🔧 lot은 모두 원화로 환산 저장됨 → 자산도 원화 기준으로 정정 (이중 환산 방지)
          if (isStockLikeType(existing.type)) {
            existing.priceCurrency = 'KRW';
            delete existing.avgBuyRate;
          }
          mergedCount++;
        }
      }
    } else {
      // 🔧 신규 처리 전: 이번 캡처에서 방금 만든 "확실히 같은 종목"이 있는지 확인
      const normT = (t) => (t || '').toUpperCase().replace(/\.(KS|KQ|KQI)$/, '').trim();
      const dupNew = newlyCreated.find(a => {
        if (it._action === 'new' && it._existingId) return false;
        const tA = normT(a.ticker);
        const tB = normT(it.ticker);
        // ⚠️ 둘 다 티커 있으면 → 완전히 같을 때만 동일 종목 (QQQ vs QQQM 오합산 방지)
        if (tA && tB) return tA === tB;
        // 한쪽이라도 티커 없으면 → 이름+종류가 완전히 같을 때만
        return a.name === name && a.type === type;
      });
      if (dupNew) {
        // 방금 만든 자산에 lot만 추가
        addAssetLot(dupNew, {
          source: `📸 OCR ${today}`,
          qty,
          price,
          date: today,
          autoBuy: false,
          note: '캡처 추가' + priceNote,
        });
        return;
      }
      // 새 자산 (신규)
      const newAsset = {
        id: Date.now() + Math.random(),
        type,
        name: it._action === 'new' && it._existingId ? `${name} (2)` : name, // 동명 다른 자산이면 (2) 붙임
        qty: 0,
        price: 0,
        ticker: it.ticker || '',
        memo: '',
        lots: [],
      };
      // 🔧 lot은 원화로 환산됐으므로 자산 자체는 원화 기준
      if (isStockLikeType(type)) newAsset.priceCurrency = 'KRW';
      assets.push(newAsset);
      newlyCreated.push(newAsset);
      addAssetLot(newAsset, {
        source: `📸 OCR ${today}`,
        qty,
        price,
        date: today,
        autoBuy: false,
        note: '캡처 추가' + priceNote,
      });
      addedCount++;
    }
  });

  saveData();

  let msg = '';
  if (addedCount > 0) msg += `✨ 신규 ${addedCount}건`;
  if (correctedCount > 0) msg += (msg ? ', ' : '') + `🎯 보정 ${correctedCount}건`;
  if (mergedCount > 0) msg += (msg ? ', ' : '') + `🔗 합산 ${mergedCount}건`;
  showToast(msg || '저장됨');

  // 🔧 보정된 자산은 시세를 다시 받아 화면 갱신
  if (correctedCount > 0 || mergedCount > 0) {
    refreshAllAssetPrices().then(() => renderAsset()).catch(() => {});
  }

  closeModal();
  renderAsset();
  delete window._assetReviewItems;
  delete window._renderAssetReview;
  };

  // 달러 항목이 있으면 환율 먼저 받고, 없으면 바로 저장
  if (hasUSD) {
    showToast('💱 환율 확인 중...');
    getUSDKRW().then(rate => {
      doSave(rate || 1380);
    }).catch(() => {
      doSave(1380); // 환율 실패 시 폴백
    });
  } else {
    doSave(null);
  }
}

// 🔧 클립보드 텍스트 파싱 — 카드 SMS/은행 알림에서 금액·가맹점·날짜 추출
function parseExpenseText(text) {
  if (!text || typeof text !== 'string') return null;
  const t = text.replace(/\s+/g, ' ').trim();

  // 금액 추출: "12,500원", "30000원", "₩12,500", "30,000 원" 등
  const amtMatch = t.match(/([0-9]{1,3}(?:,[0-9]{3})+|[0-9]{4,})\s*원/);
  if (!amtMatch) return null;
  const amount = Number(amtMatch[1].replace(/,/g, ''));
  if (!amount || amount < 100) return null;

  // 입금/출금 구분
  const isIncome = /입금|급여|월급|이체받|환급|환불/i.test(t);

  // 가맹점/메모 추출 — 흔한 패턴들
  let store = '';
  // 패턴 1: "승인 12,500원 스타벅스 ..." 또는 "12,500원 스타벅스"
  const afterAmt = t.substring(t.indexOf(amtMatch[0]) + amtMatch[0].length).trim();
  // 첫 토큰부터 한글/영문 가맹점명 (날짜·시간·잔액 등 제외)
  const storeMatch = afterAmt.match(/(?:일시불|할부\s*\d+개월|승인|체크)?\s*([가-힣A-Za-z0-9&.\s\-]+?)(?:\s+\d{1,2}[\/:\-월]|\s+잔액|\s+누적|$)/);
  if (storeMatch) {
    store = storeMatch[1].trim();
    // "BBQ 11/28 14:32" 같은 경우 뒤 날짜 제거
    store = store.replace(/\s+\d{1,2}[\/\-.:]\d{1,2}.*$/, '').trim();
  }
  // 패턴 2: store가 비어있으면 "[Web발신] 카드사명 다음 금액 앞" 부분에서 추출 시도
  if (!store) {
    const before = t.substring(0, t.indexOf(amtMatch[0])).trim();
    // 카드사명 다음의 토큰
    const m = before.match(/(?:신한|국민|KB|삼성|현대|롯데|우리|하나|NH농협|농협|BC|카카오뱅크|토스)\s*카드?\s*(?:승인|체크|일시불)?\s*(.*)$/);
    if (m && m[1]) store = m[1].trim();
  }

  // 날짜 추출 — "11/28", "11월 28일", "2026-11-28" 등 (없으면 오늘)
  let dateKey = todayKey();
  const dateMatch = t.match(/(\d{4})[\-./](\d{1,2})[\-./](\d{1,2})/)
    || t.match(/(\d{1,2})[\/.](\d{1,2})(?!\d)/)
    || t.match(/(\d{1,2})월\s*(\d{1,2})일/);
  if (dateMatch) {
    let y, m, d;
    if (dateMatch[3] !== undefined && dateMatch[1].length === 4) {
      // YYYY-MM-DD
      y = Number(dateMatch[1]); m = Number(dateMatch[2]); d = Number(dateMatch[3]);
    } else {
      // MM/DD 또는 MM월 DD일 → 올해
      y = new Date().getFullYear();
      m = Number(dateMatch[1]); d = Number(dateMatch[2]);
    }
    if (m >= 1 && m <= 12 && d >= 1 && d <= 31) {
      dateKey = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    }
  }

  // 카테고리 추측 (가맹점 키워드 기반)
  const category = guessExpenseCategoryFromText(store + ' ' + t);

  return { amount, store: store || '', dateKey, isIncome, category };
}

// 가맹점·텍스트에서 카테고리 추측
function guessExpenseCategoryFromText(text) {
  const t = (text || '').toLowerCase();
  const rules = [
    { cat:'식비', kw:['배달의민족','요기요','쿠팡이츠','맥도날드','버거킹','롯데리아','BBQ','BHC','교촌','피자','치킨','김밥','분식','한솥','국밥','족발','보쌈','한식','중식','일식','양식'] },
    { cat:'카페', kw:['스타벅스','이디야','투썸','커피','메가커피','컴포즈','파스쿠찌','할리스','폴바셋','블루보틀','카페'] },
    { cat:'편의점', kw:['gs25','cu','seven','세븐일레븐','이마트24','미니스톱'] },
    { cat:'마트', kw:['이마트','홈플러스','코스트코','롯데마트','농협하나로','트레이더스'] },
    { cat:'교통', kw:['카카오t','우버','택시','지하철','버스','t머니','therail','코레일','SRT','KTX','주유','GS칼텍스','SK에너지','S-OIL'] },
    { cat:'쇼핑', kw:['쿠팡','11번가','지마켓','옥션','네이버페이','무신사','29cm','SSG','유니클로','자라'] },
    { cat:'구독', kw:['넷플릭스','netflix','웨이브','wavve','티빙','tving','디즈니','disney','유튜브','youtube','애플','apple','spotify','챗gpt','chatgpt'] },
    { cat:'통신', kw:['kt','skt','lg유플','lg u+','알뜰폰'] },
    { cat:'의료', kw:['병원','약국','한의원','치과','내과'] },
    { cat:'생활', kw:['올리브영','다이소'] },
  ];
  for (const r of rules) {
    if (r.kw.some(k => t.includes(k.toLowerCase()))) return r.cat;
  }
  return '기타';
}

// 클립보드 텍스트 입력 모달 — 카드 SMS/은행 알림 붙여넣기

// 파싱 결과 미리보기
function previewClipboardExpense() {
  const text = document.getElementById('clip-text')?.value || '';
  const previewEl = document.getElementById('clip-preview');
  if (!previewEl) return;

  if (!text.trim()) {
    previewEl.innerHTML = '';
    return;
  }

  const parsed = parseExpenseText(text);
  if (!parsed) {
    previewEl.innerHTML = `<div style="padding:14px; text-align:center; color:var(--text-tertiary); font-size:12px; background:var(--bg-secondary); border-radius:10px;">금액이 인식 안 됐어요. 텍스트에 "12,500원" 같은 형식이 있어야 해요.</div>`;
    return;
  }

  previewEl.innerHTML = `
    <div style="padding:14px; background:var(--bg-secondary); border-radius:12px;">
      <div style="font-size:11px; color:var(--text-tertiary); margin-bottom:8px;">📋 인식 결과 (수정 가능)</div>
      <div class="field">
        <div class="field-label">${parsed.isIncome ? '입금' : '지출'} 금액</div>
        <input type="number" id="clip-amount" value="${parsed.amount}" />
      </div>
      <div class="field">

// 파싱한 결과를 가계부에 추가
function applyClipboardExpense() {
  const amount = Number(document.getElementById('clip-amount')?.value) || 0;
  const store = document.getElementById('clip-store')?.value?.trim() || '';
  const dateKey = document.getElementById('clip-date')?.value || todayKey();
  const cat = document.getElementById('clip-cat')?.value?.trim() || '기타';
  const isIncome = document.getElementById('clip-isincome')?.value === '1';

  if (amount <= 0) {
    showToast('금액을 확인해주세요');
    return;
  }

  // 중복 체크 — 같은 날짜·금액·가맹점이 이미 있으면 안내
  const norm = (s) => (s || '').replace(/\s/g, '').toLowerCase();
  const dup = (budget.expenses || []).some(e =>
    e.dateKey === dateKey &&
    Number(e.amt) === amount &&
    norm(e.memo).includes(norm(store).slice(0, 4))
  );
  if (dup && !confirm('비슷한 항목이 이미 가계부에 있어요. 그래도 추가할까요?')) {
    return;
  }

  const [y, m, d] = dateKey.split('-').map(Number);
  budget.expenses.push({
    id: Date.now() + Math.random(),
    amt: amount,
    cat: cat,
    memo: store,
    dateKey: dateKey,
    date: d,
    type: isIncome ? 'income' : 'expense',
  });
  saveData();
  closeModal();
  showToast(`${isIncome ? '입금' : '지출'} ${amount.toLocaleString()}원 추가됨`);
  render();
}

async function processCardCapture(input) {
  const files = Array.from(input.files || []);
  if (files.length === 0) return;

  if (!window.GEMINI_API_KEY) {
    showToast('AI 키 먼저 설정해주세요');
    openAIKeyModal();
    return;
  }

  const statusEl = document.getElementById('card-capture-status');
  statusEl.style.display = 'block';

  const allItems = [];
  let failCount = 0;

  for (let idx = 0; idx < files.length; idx++) {
    const file = files[idx];
    statusEl.innerHTML = `<div style="display:flex; align-items:center; justify-content:center; gap:6px;"><div class="spinner" style="width:12px; height:12px;"></div>이미지 ${idx + 1}/${files.length} 분석 중...</div>`;

    try {
      const base64 = await new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });

      const mimeType = file.type || 'image/jpeg';

      const prompt = `이 이미지는 카드 사용 내역 (또는 영수증, 결제 알림 등)이야.
거래 항목들을 모두 추출해서 JSON 배열로 반환해줘.

규칙:
1. 각 항목: {date, store, amount, category}
   - date: "YYYY-MM-DD" 형식 (연도 없으면 ${new Date().getFullYear()})
   - store: 가맹점/사용처 (예: "스타벅스", "이마트")
   - amount: 금액 (숫자만, 콤마 제거, 원화)
   - category: 다음 중 가장 가까운 것 - 식비, 카페, 교통, 쇼핑, 의료, 문화, 통신, 학습, 기타
2. 입금/입금취소는 건너뛰고 지출만 추출
3. 환불/취소 항목 제외
4. 결과는 반드시 다음 JSON 형식으로만 (다른 설명 없이):
{"items":[{"date":"2026-05-17","store":"스타벅스","amount":4500,"category":"카페"}]}

만약 분석 불가하면: {"items":[],"error":"이유"}`;

      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${window.GEMINI_API_KEY}`;

      const body = {
        contents: [{
          parts: [
            { text: prompt },
            { inline_data: { mime_type: mimeType, data: base64 } }
          ]
        }],
        generationConfig: {
          temperature: 0.1,
          maxOutputTokens: 2000,
        }
      };

      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });

      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error?.message || `HTTP ${res.status}`);

      const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
      console.log(`📸 OCR 결과 ${idx + 1}:`, text);

      let jsonStr = text.trim().replace(/```json\s*/g, '').replace(/```\s*/g, '').trim();
      let parsed;
      try { parsed = JSON.parse(jsonStr); }
      catch (e) {
        const match = jsonStr.match(/\{[\s\S]*\}/);
        if (match) parsed = JSON.parse(match[0]);
        else throw new Error('JSON 파싱 실패');
      }

      if (parsed.error || !parsed.items || parsed.items.length === 0) {
        console.warn(`이미지 ${idx + 1} 추출 실패`);
        failCount++;
        continue;
      }

      allItems.push(...parsed.items);
    } catch (e) {
      console.error(`이미지 ${idx + 1} 오류:`, e);
      failCount++;
    }
  }

  if (allItems.length === 0) {
    statusEl.innerHTML = `<span style="color:var(--text-warning);">⚠️ 추출된 항목 없음</span>`;
    input.value = '';
    return;
  }

  statusEl.style.display = 'none';
  closeModal();
  showToast(`✅ ${files.length}장에서 ${allItems.length}개 거래 추출됨`);
  openCardReviewModal(allItems);

  input.value = '';
}

// 카드 캡처 검토 모달 - 추출된 항목 확인 + 일괄 추가
function openCardReviewModal(items) {
  // 🔧 중복 감지 — 날짜+금액+가맹점이 같은 지출이 이미 가계부에 있으면 표시
  const norm = (s) => (s || '').replace(/\s/g, '').toLowerCase();
  window._cardReviewItems = items.map((it, i) => {
    const dup = (budget.expenses || []).some(e =>
      e.type !== 'income' &&
      e.dateKey === it.date &&
      Number(e.amt) === Number(it.amount) &&
      norm(e.memo).includes(norm(it.store).slice(0, 4)) // 가맹점 앞부분 일치
    );
    return { ...it, _checked: !dup, _id: i, _dup: dup }; // 중복 의심이면 기본 체크 해제
  });

  const dupCount = window._cardReviewItems.filter(it => it._dup).length;

  const renderList = () => {
    return window._cardReviewItems.map((it, i) => `
      <div style="display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:0.5px solid var(--border-tertiary);">
        <input type="checkbox" id="cr-${i}" ${it._checked ? 'checked' : ''} onchange="window._cardReviewItems[${i}]._checked = this.checked;" style="width:18px; height:18px; cursor:pointer;" />
        <div style="flex:1; min-width:0;">
          <div style="font-size:13px; font-weight:500;">${it.store}${it._dup ? ' <span style="font-size:9px; color:var(--text-warning); font-weight:600;">⚠️ 이미 있을 수 있음</span>' : ''}</div>
          <div style="font-size:10px; color:var(--text-tertiary); margin-top:2px;">${it.date} · ${it.category}</div>
        </div>
        <span style="font-weight:600; color:var(--text-primary); font-size:13px;">-${Number(it.amount).toLocaleString()}원</span>
      </div>
    `).join('');
  };

  modal.innerHTML = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-cancel" onclick="closeModal()">취소</button>
        <h2>📸 검토 후 저장</h2>
        <button class="modal-save" onclick="saveCardReviewItems()">저장</button>
      </div>

      <div style="padding:10px 12px; background:var(--bg-info); border-radius:8px; margin-bottom:12px; font-size:11px; color:var(--text-info); line-height:1.5;">
        💡 ${items.length}개 항목 추출. 체크된 것만 가계부에 추가됩니다.
        ${dupCount > 0 ? `<br>⚠️ ${dupCount}개는 이미 가계부에 있는 것 같아 체크를 꺼뒀어요. 확인 후 필요하면 체크하세요.` : ''}
      </div>

      <div style="max-height:60vh; overflow-y:auto;">
        ${renderList()}
      </div>

      <div style="display:flex; gap:6px; margin-top:12px;">
        <button onclick="cardReviewToggleAll(true)" style="flex:1; padding:9px; border:0.5px solid var(--border-tertiary); background:transparent; border-radius:8px; font-size:11px; cursor:pointer; font-family:inherit;">전체 선택</button>
        <button onclick="cardReviewToggleAll(false)" style="flex:1; padding:9px; border:0.5px solid var(--border-tertiary); background:transparent; border-radius:8px; font-size:11px; cursor:pointer; font-family:inherit;">전체 해제</button>
      </div>
    </div>
  `;
  modal.classList.add('show');
}

function cardReviewToggleAll(check) {
  window._cardReviewItems.forEach((it, i) => {
    it._checked = check;
    const cb = document.getElementById(`cr-${i}`);
    if (cb) cb.checked = check;
  });
}

function saveCardReviewItems() {
  const selected = (window._cardReviewItems || []).filter(it => it._checked);
  if (selected.length === 0) {
    showToast('선택된 항목이 없어요');
    return;
  }

  const norm = (s) => (s || '').replace(/\s/g, '').toLowerCase();
  let added = 0, skipped = 0;
  selected.forEach(it => {
    // 🔧 저장 직전 최종 중복 확인 (같은 캡처 두 번 저장 등 방지)
    const already = (budget.expenses || []).some(e =>
      e.type !== 'income' &&
      e.dateKey === it.date &&
      Number(e.amt) === Number(it.amount) &&
      norm(e.memo).includes(norm(it.store).slice(0, 4))
    );
    if (already) { skipped++; return; }
    const [y, m, d] = (it.date || todayKey()).split('-').map(Number);
    budget.expenses.push({
      id: Date.now() + Math.random(),
      amt: Number(it.amount) || 0,
      cat: it.category || '기타',
      memo: it.store || '',
      dateKey: it.date,
      date: d,
      type: 'expense',
    });
    added++;
  });

  saveData();
  showToast(skipped > 0
    ? `✨ ${added}개 추가 (중복 ${skipped}개 제외)`
    : `✨ ${added}개 항목 추가됨`);
  closeModal();
  renderMoney();
  delete window._cardReviewItems;
}

function saveExpense() {
  const amt = Number(document.getElementById('amt-input').value);
  const memo = document.getElementById('memo').value.trim();
  const dateKeyVal = document.getElementById('exp-date').value || todayKey();
  if (!amt) { showToast('금액을 입력해주세요'); return; }

  // 수입/지출 구분
  const isIncome = document.getElementById('type-income')?.classList.contains('active');

  if (isIncome) {
    // 수입 처리
    const incomeBtn = document.querySelector('#cat-grid-income .cat-btn.active');
    const cat = incomeBtn?.dataset.c || '기타수입';
    const [y, m, d] = dateKeyVal.split('-').map(Number);
    budget.expenses.push({
      id: Date.now(),
      amt, cat, memo,
      dateKey: dateKeyVal,
      date: d,
      type: 'income', // ← 수입 표시
    });
    saveData();
    showToast(`💵 입금 +${amt.toLocaleString()}원 저장됨`);
    closeModal();
    renderMoney();
    return;
  }

  // 기존 지출 처리
  // 생활비 또는 투자 카테고리 중 활성화된 것
  const activeBtn = document.querySelector('#cat-grid .cat-btn.active, #cat-grid-invest .cat-btn.active');
  const cat = activeBtn?.dataset.c || '기타';

  // dateKey 기반으로 저장
  const [y, m, d] = dateKeyVal.split('-').map(Number);
  budget.expenses.push({
    id: Date.now(),
    amt, cat, memo,
    dateKey: dateKeyVal,
    date: d,
    type: 'expense',
  });

  // 투자 카테고리면 → 자산 자동 추가/업데이트
  const investCats = ['주식', '국내주식', '미국주식', 'ETF', '국내ETF', '해외ETF', '펀드', '채권', '금', '달러', '예적금', '청약', '현금', '부동산'];
  let assetAdded = false;
  if (investCats.includes(cat)) {
    const invName = document.getElementById('inv-name')?.value?.trim() || '';
    if (invName) {
      // 메모가 비어있으면 자산 이름을 메모로 (양방향 동기화 키)
      const lastExp = budget.expenses[budget.expenses.length - 1];
      if (lastExp && !lastExp.memo) {
        lastExp.memo = invName;
      } else if (lastExp && lastExp.memo && !lastExp.memo.includes(invName)) {
        lastExp.linkedAssetName = invName;
      } else {
        lastExp.linkedAssetName = invName;
      }

      const today = dateKeyVal;
      const isDepositType = ['청약', '예적금', '현금', '부동산'].includes(cat);

      // 자산 종류에 맞게 수량/가격 처리
      let qty = 1, price = amt, ticker = '';

      if (isDepositType) {
        // 납입형: qty=1, price=납입액
        qty = 1;
        price = amt;
      } else if (isStockLikeType(cat) || cat === '채권') {
        qty = Number(document.getElementById('inv-qty')?.value) || 1;
        price = qty > 0 ? amt / qty : amt;
        ticker = document.getElementById('inv-ticker')?.value?.trim() || '';
      } else if (cat === '금') {
        qty = Number(document.getElementById('inv-gold-qty')?.value) || 1;
        price = qty > 0 ? amt / qty : amt;
      } else if (cat === '달러') {
        qty = Number(document.getElementById('inv-dollar-qty')?.value) || 1;
        price = qty > 0 ? amt / qty : amt;
      }

      // 기존 자산 찾기 (티커 우선)
      const existing = findMatchingAsset({ name: invName, type: cat, ticker });

      if (existing) {
        // lots 시스템으로 추가
        addAssetLot(existing, {
          source: `📝 가계부 ${today}`,
          qty,
          price: Math.round(price),
          date: today,
          fxDiscount: existing.fxDiscount || null,
          autoBuy: false,
          note: '가계부에서 추가',
        });
        // 🔧 청약 회차는 recalcAssetFromLots가 lot 개수로 계산 → 직접 ++ 안 함 (이중 카운트 방지)
        if (ticker && !existing.ticker) existing.ticker = ticker;
        showToast(`${cat} ${amt.toLocaleString()}원 추가 (${invName})`);
      } else {
        // 신규 자산 (lots 시스템으로)
        const newAsset = {
          id: Date.now() + 1,
          name: invName,
          ticker,
          type: cat,
          region: guessAssetRegion(invName, ticker, null),
          qty: 0,
          price: 0,
          note: memo || '가계부에서 자동 추가',
          lots: [],
        };
        if (cat === '청약') {
          newAsset.subType = '주택청약종합저축';
          newAsset.rounds = 1;
        }
        assets.push(newAsset);
        addAssetLot(newAsset, {
          source: `📝 가계부 ${today}`,
          qty,
          price: Math.round(price),
          date: today,
          autoBuy: false,
          note: '가계부 첫 입력',
        });
        showToast(`${cat} ${amt.toLocaleString()}원 저장 (${invName} 자산 추가됨)`);
      }
      assetAdded = true;
    }
  }

  if (!assetAdded) {
    showToast(`${cat} ${amt.toLocaleString()}원 저장됨`);
  }

  saveData();
  closeModal();
  render();
}

function setTodoDate(preset) {
  const input = document.getElementById('todo-date');
  const n = new Date();
  let d = new Date(n);
  if (preset === 'today') d = n;
  else if (preset === 'tomorrow') d.setDate(n.getDate() + 1);
  else if (preset === 'week') d.setDate(n.getDate() + 7);
  else if (preset === 'month') d.setMonth(n.getMonth() + 1);
  input.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function saveTodo(editId) {
  const title = document.getElementById('todo-title').value.trim();
  if (!title) { showToast('내용을 입력해주세요'); return; }
  const dateKeyVal = document.getElementById('todo-date').value || todayKey();
  const tag = document.querySelector('#tag-grid .chip.active')?.dataset.tag || '업무';
  const flag = modal.querySelector('.toggle').classList.contains('on');
  const time = document.getElementById('todo-time')?.value || '';
  const memo = document.getElementById('todo-memo')?.value.trim() || '';

  if (editId) {
    // 수정
    const t = todos.find(x => x.id === Number(editId));
    if (t) {
      t.title = title;
      t.dateKey = dateKeyVal;
      t.tag = tag;
      t.flag = flag;
      t.time = time;
      t.memo = memo;
    }
    showToast('수정됨');
  } else {
    // 새로 추가
    todos.unshift({
      id: Date.now(),
      title,
      tag,
      dateKey: dateKeyVal,
      flag,
      time,
      memo,
      done: false,
    });
    showToast(`"${title}" 추가됨`);
  }
  saveData();
  closeModal();
  render();
}
