<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    signOut, onAuthStateChanged, sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import {
    getFirestore, doc, setDoc, getDoc, enableIndexedDbPersistence
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyA3FDgECTqtI7XDo1Isg02PmCgFv01Y3sI",
    authDomain: "life-planner-a03d2.firebaseapp.com",
    projectId: "life-planner-a03d2",
    storageBucket: "life-planner-a03d2.firebasestorage.app",
    messagingSenderId: "538319814686",
    appId: "1:538319814686:web:39b16b7ef65279dcc06e0f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // YouTube Data API 키
  const YOUTUBE_API_KEY = "AIzaSyA3FDgECTqtI7XDo1Isg02PmCgFv01Y3sI";

  // Gemini AI API 키 — 사용자가 직접 입력 (localStorage + Firebase)
  // GitHub에 키 노출 방지

  // 오프라인 지원
  enableIndexedDbPersistence(db).catch(() => {});

  // 전역 노출
  window._fb = {
    auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword,
    signOut, onAuthStateChanged, sendPasswordResetEmail,
    doc, setDoc, getDoc
  };
  window.YOUTUBE_API_KEY = YOUTUBE_API_KEY;
  // GEMINI_API_KEY는 사용자가 설정에서 입력
  window.GEMINI_API_KEY = localStorage.getItem('gemini_api_key') || null;

  // Firebase 준비 완료 알림
  window.dispatchEvent(new Event('firebase-ready'));
</script>
<style>
  :root {
    --bg-page: #F4F4EE;
    --bg-primary: #FFFFFF;
    --bg-secondary: #F1EFE8;
    --bg-tertiary: #E8E6DD;
    --bg-info: #E6F1FB;
    --bg-success: #EAF3DE;
    --bg-warning: #FAEEDA;
    --bg-danger: #FCEBEB;

    --text-primary: #1A1A1A;
    --text-secondary: #5F5E5A;
    --text-tertiary: #888780;
    --text-info: #185FA5;
    --text-success: #3B6D11;
    --text-warning: #854F0B;
    --text-danger: #A32D2D;

    --border-tertiary: rgba(0,0,0,0.08);
    --border-secondary: rgba(0,0,0,0.16);

    --radius-md: 8px;
    --radius-lg: 12px;
    --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    font-family: var(--font);
    background: var(--bg-page);
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    height: 100vh;
    height: 100dvh;
  }

  body {
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg-primary);
    position: relative;
  }

  .status-bar {
    height: env(safe-area-inset-top, 0);
    flex-shrink: 0;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 18px 8px;
    flex-shrink: 0;
    background: var(--bg-primary);
  }
  .header h1 { font-size: 19px; font-weight: 600; }
  .header .subtitle { font-size: 11px; color: var(--text-tertiary); }
  .header-actions { display: flex; gap: 6px; align-items: center; }
  .header-actions button {
    border: none; background: transparent; cursor: pointer;
    color: var(--text-secondary); padding: 8px; border-radius: 8px;
    font-family: inherit;
  }
  .header-actions button:active { background: var(--bg-secondary); }
  .header-actions i { font-size: 20px; }

  .screen {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 4px 18px 16px;
    -webkit-overflow-scrolling: touch;
  }
  .screen::-webkit-scrollbar { width: 0; }

  .tab-bar {
    display: flex;
    flex-shrink: 0;
    background: var(--bg-primary);
    border-top: 0.5px solid var(--border-tertiary);
    padding: 6px 0 calc(6px + env(safe-area-inset-bottom, 0));
  }
  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    color: var(--text-tertiary);
    padding: 8px 0;
    font-family: inherit;
  }
  .tab-btn i { font-size: 22px; }
  .tab-btn span { font-size: 10px; font-weight: 500; }
  .tab-btn.active { color: var(--text-primary); }

  .card {
    border-radius: var(--radius-md);
    border: 0.5px solid var(--border-tertiary);
    padding: 12px 14px;
    background: var(--bg-primary);
  }
  .stat-card {
    padding: 10px 12px;

  }
  .stat-card .label { font-size: 10px; color: var(--text-tertiary); margin-bottom: 2px; }
  .stat-card .value { font-size: 18px; font-weight: 600; }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; }

  .chip {

  .evt {

  .evt-todo { background: var(--bg-secondary); border-left-color: var(--text-primary); }
  .evt-workout { background: var(--bg-success); border-left-color: var(--text-success); }
  .evt-money { background: var(--bg-warning); border-left-color: var(--text-warning); }
  .evt-asset { background: var(--bg-info); border-left-color: var(--text-info); }
  .evt-challenge { background: #F5EFFF; border-left-color: #9B59B6; }
  .evt-icon { font-size: 16px; flex-shrink: 0; }
  .evt-todo .evt-icon { color: var(--text-tertiary); }
  .evt-workout .evt-icon { color: var(--text-success); }
  .evt-money .evt-icon { color: var(--text-warning); }
  .evt-asset .evt-icon { color: var(--text-info); }
  .evt-challenge .evt-icon { color: #9B59B6; }
  .evt-challenge .title, .evt-challenge .sub { color: #6B3F8B; }
  .evt-body { flex: 1; min-width: 0; }
  .evt-body .title { font-size: 13px; font-weight: 500; }
  .evt-body .sub { font-size: 10px; opacity: 0.85; margin-top: 2px; }
  .evt-workout .title, .evt-workout .sub { color: var(--text-success); }
  .evt-money .title, .evt-money .sub { color: var(--text-warning); }
  .evt-asset .title, .evt-asset .sub { color: var(--text-info); }
  .evt-todo .sub { color: var(--text-tertiary); }
  .evt-amount { font-size: 11px; font-weight: 500; flex-shrink: 0; }
  .evt-money .evt-amount { color: var(--text-warning); }
  .evt-asset .evt-amount { color: var(--text-info); }
  .evt .checked { text-decoration: line-through; color: var(--text-tertiary); }

  .evt-check {
    width: 20px; height: 20px;
    border-radius: 50%;

  .evt-check.done i { color: white; font-size: 13px; }

  .cal-weekdays {
    display: grid; grid-template-columns: repeat(7, 1fr);
    font-size: 10px; color: var(--text-tertiary);
    text-align: center;
    padding: 6px 0 4px;
  }
  .cal-weekdays span:first-child { color: var(--text-danger); }
  .cal-weekdays span:last-child { color: var(--text-info); }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 12px;
  }
  .cal-day {
    aspect-ratio: 1;
    padding: 3px 0;
    border: none;
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: var(--text-primary);
    font-family: inherit;
  }
  .cal-day.today { background: var(--text-info) !important; color: white !important; }
  .cal-day.selected { background: var(--bg-info); color: var(--text-info); }
  .cal-day.sun { color: var(--text-danger); }
  .cal-day.sat { color: var(--text-info); }
  .cal-day .num { font-size: 13px; }
  .cal-day .dots { display: flex; gap: 2px; height: 4px; align-items: center; }
  .cal-day .dot { width: 4px; height: 4px; border-radius: 50%; }

  .cal-legend {
    display: flex; gap: 10px;
    align-items: center; justify-content: center;
    font-size: 9px;
    color: var(--text-tertiary);
    padding-bottom: 10px;
    border-bottom: 0.5px solid var(--border-tertiary);
    margin-bottom: 12px;
  }
  .cal-legend .ld { display: inline-block; width: 5px; height: 5px; border-radius: 50%; vertical-align: 1px; margin-right: 3px; }

  .todo-row {
    display: flex; gap: 10px;
    padding: 12px 14px;
    border: 0.5px solid var(--border-tertiary);
    border-radius: var(--radius-md);
    margin-bottom: 6px;
    align-items: center;
    background: var(--bg-primary);
    cursor: pointer;
  }
  .todo-check {
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--border-secondary);

    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
  }
  .todo-check.done { background: var(--text-success); border-color: var(--text-success); }
  .todo-check.done i { color: white; font-size: 13px; }
  .todo-row.done { opacity: 0.55; }
  .todo-row.done .todo-title { text-decoration: line-through; }
  .todo-title { font-size: 14px; font-weight: 500; }
  .todo-meta { display: flex; gap: 6px; align-items: center; margin-top: 4px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 1px 7px; border-radius: 999px; background: var(--bg-secondary); color: var(--text-secondary); }
  .meta-mini { font-size: 10px; color: var(--text-tertiary); }
  .meta-repeat { font-size: 10px; color: var(--text-info); }

  .progress { height: 6px; background: var(--bg-primary); border-radius: 3px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--text-info); }

  /* 모달 */

    font-weight: 500;
    font-family: inherit;

  }

  .modal-save { color: var(--text-info); }

  .field { margin-bottom: 14px; }
  .field-label {

    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .field input[type="text"], .field input[type="number"], .field input[type="date"] {
    width: 100%;
    padding: 12px 12px;
    border: 0.5px solid var(--border-tertiary);
    border-radius: var(--radius-md);
    font-size: 14px;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-family: inherit;
    -webkit-appearance: none;
  }
  .field input:focus { outline: none; border-color: var(--text-info); }

  .cat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cat-btn {
    padding: 11px 4px;
    border: 0.5px solid var(--border-tertiary);
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--text-secondary);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    font-family: inherit;
  }
  .cat-btn.active {
    background: var(--bg-warning);
    color: var(--text-warning);
    border: none;
    font-weight: 500;
  }
  .cat-btn i { font-size: 18px; }
  .cat-btn span { font-size: 10px; }

  .amount-display { text-align: center; margin: 10px 0 16px; }
  .amount-display .label { font-size: 11px; color: var(--text-tertiary); }
  .amount-display .num { font-size: 32px; font-weight: 600; margin-top: 4px; }

  .toggle {

    background: var(--bg-secondary);
    position: relative;
    cursor: pointer;
    flex-shrink: 0;
  }
  .toggle.on { background: var(--text-info); }
  .toggle .knob {
    position: absolute; top: 2px; left: 2px;
    width: 20px; height: 20px;
    border-radius: 50%;
    background: white;
    transition: left 0.15s;
  }
  .toggle.on .knob { left: 20px; }

  /* 예산 */
  .budget-hero {
    background: linear-gradient(135deg, #2A4D1B 0%, #3B6D11 100%);
    border-radius: 16px;
    padding: 18px;
    color: white;
    margin-bottom: 14px;
  }
  .budget-hero.warning { background: linear-gradient(135deg, #6B3F08 0%, #854F0B 100%); }
  .budget-hero.danger { background: linear-gradient(135deg, #7A1F1F 0%, #A32D2D 100%); }
  .budget-hero .label { font-size: 11px; opacity: 0.85; margin-bottom: 4px; }
  .budget-hero .big-num { font-size: 28px; font-weight: 600; letter-spacing: -0.5px; margin-bottom: 2px; }
  .budget-hero .sub { font-size: 11px; opacity: 0.9; }
  .budget-bar {
    height: 8px;
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 14px;
  }
  .budget-bar > div { height: 100%; background: rgba(255,255,255,0.95); transition: width 0.4s; }
  .budget-bar-labels { display: flex; justify-content: space-between; margin-top: 6px; font-size: 10px; opacity: 0.85; }
  .day-pace { display: flex; gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 0.5px solid rgba(255,255,255,0.2); }
  .day-pace .item { flex: 1; }
  .day-pace .pn { font-size: 16px; font-weight: 600; }
  .day-pace .pl { font-size: 10px; opacity: 0.85; margin-top: 1px; }

  .fixed-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 0.5px solid var(--border-tertiary);
  }
  .fixed-row:last-child { border-bottom: none; }
  .fixed-row .ic {
    width: 32px; height: 32px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .fixed-row .ic i { font-size: 14px; }
  .fixed-row .nm { font-size: 13px; font-weight: 500; }
  .fixed-row .meta { font-size: 10px; color: var(--text-tertiary); margin-top: 2px; }
  .fixed-row .amt { font-size: 13px; font-weight: 600; }
  .fixed-row .paid { color: var(--text-success); }
  .fixed-row .upcoming { color: var(--text-secondary); }

  /* 운동 체크 그리드 */
  .workout-month {
    background: white;
    border-radius: 12px;
    padding: 14px;
    border: 0.5px solid var(--border-tertiary);
    margin-bottom: 14px;
  }
  .workout-row {
    display: flex; align-items: center;
    gap: 6px; margin-bottom: 6px;
  }
  .workout-row:last-child { margin-bottom: 0; }
  .workout-row .wlb {
    width: 18px; font-size: 9px;
    color: var(--text-tertiary);
    text-align: right;
    flex-shrink: 0;
  }
  .workout-row .wcells {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
  }
  .wcell {
    aspect-ratio: 1;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0.5px solid var(--border-tertiary);

  .wcell.empty { background: transparent; border: none; pointer-events: none; }

  /* AI 코칭 카드 */
  .ai-card {
    background: linear-gradient(135deg, #1A1A1A 0%, #2D2D2D 100%);
    border-radius: 14px;
    padding: 16px;
    color: white;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }
  .ai-card::before {
    content: '';
    position: absolute;
    top: -40px; right: -40px;
    width: 120px; height: 120px;
    background: radial-gradient(circle, rgba(255,200,100,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .ai-badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.15);
    font-size: 10px;
    font-weight: 500;
    margin-bottom: 10px;
  }
  .ai-card h3 {
    font-size: 14px; font-weight: 600;
    margin-bottom: 8px;
  }
  .ai-card .ai-text {
    font-size: 12px;
    line-height: 1.6;
    opacity: 0.9;
  }
  .ai-card .ai-text b { color: #FFD66E; font-weight: 600; }
  .ai-plan-row {
    display: flex; align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 0.5px solid rgba(255,255,255,0.1);
  }
  .ai-plan-row:last-child { border-bottom: none; }
  .ai-plan-num {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600;
    flex-shrink: 0;
  }
  .ai-plan-text { font-size: 11px; line-height: 1.5; flex: 1; }

  .connect-card {
    display: flex; align-items: center; gap: 12px;
    padding: 14px;
    border-radius: var(--radius-md);
    border: 0.5px solid var(--border-tertiary);
    margin-bottom: 8px;
    background: white;
    cursor: pointer;
    width: 100%;

<script>
// ====== Firebase 동기화 ======
let currentUser = null;
let isSaving = false;
let saveQueue = false;
let saveTimer = null;

const STORAGE_KEY = 'life-planner-v5-local'; // 오프라인 캐시용

function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return null;
}

// Firebase에 저장 (디바운스 적용)
function saveData() {
  saveLocal();

  if (!currentUser || !window._fb) return;

  if (saveTimer) clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    if (isSaving) {
      saveQueue = true;
      return;
    }
    isSaving = true;
    try {
      const { doc, setDoc, db } = window._fb;
      await setDoc(doc(db, 'users', currentUser.uid), {
        todos, budget, workoutLog, assets, settings, userChannels, economySites, challenges,
        updatedAt: Date.now()
      });
      showSyncStatus();
    } catch (e) {
      console.error('저장 실패:', e);
    } finally {
      isSaving = false;
      if (saveQueue) {
        saveQueue = false;
        saveData();
      }
    }
  }, 800);
}

function saveLocal() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      todos, budget, workoutLog, assets, settings, userChannels, economySites, challenges
    }));
  } catch(e) {}
}

function showSyncStatus() {
  const el = document.getElementById('sync-status');
  if (!el) return;
  el.classList.add('show');
  clearTimeout(window._syncT);
  window._syncT = setTimeout(() => el.classList.remove('show'), 1500);
}

// Firebase에서 로드
async function loadFromFirebase(uid) {
  try {
    const { doc, getDoc, db } = window._fb;
    const snap = await getDoc(doc(db, 'users', uid));
    if (snap.exists()) {
      return snap.data();
    }
  } catch (e) {
    console.error('로드 실패:', e);
  }
  return null;
}

// ====== 초기 데이터 ======
const todayDate = new Date();

const dayLabels = ['일','월','화','수','목','금','토'];
const monthLabels = ['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

// 기본값 설정 후 저장된 데이터로 덮어쓰기
let todos = [

let workoutLog = {}; // { 'YYYY-MM-DD': { done: true, kcal: 320, minutes: 30, note: '러닝' } }
let assets = [

];
let settings = {

};
// 사용자가 추가한 채널 (자산 / 운동)
let userChannels = {
  asset: [
    { id:1, name:'슈카월드', q:'슈카월드' },

// 데이터 적용 함수
function applyData(data) {
  if (!data) return;

// 옛날 todo (date가 숫자) → dateKey (YYYY-MM-DD)로 마이그레이션
function migrateTodos() {
  const now = new Date();
  const y = now.getFullYear();
  const m = now.getMonth();
  todos.forEach(t => {
    if (!t.dateKey) {
      if (typeof t.date === 'number') {
        // 일자만 있던 옛날 데이터 → 현재 월로 가정
        t.dateKey = `${y}-${String(m+1).padStart(2,'0')}-${String(t.date).padStart(2,'0')}`;
      } else if (typeof t.date === 'string' && t.date.length === 10) {
        // 이미 YYYY-MM-DD 형식
        t.dateKey = t.date;
      } else {
        // 날짜 없으면 오늘
        t.dateKey = `${y}-${String(m+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
      }
    }
  });
}

// 날짜 키 → 그룹 동적 분류 (today/tomorrow/week/later/past)
function todoGroup(dateKeyStr) {
  if (!dateKeyStr) return 'today';
  const now = new Date();
  const today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const [y, m, d] = dateKeyStr.split('-').map(Number);
  const target = new Date(y, m-1, d);
  const diffDays = Math.floor((target - today0) / (24*60*60*1000));

  if (diffDays < 0) return 'past';
  if (diffDays === 0) return 'today';
  if (diffDays === 1) return 'tomorrow';
  if (diffDays <= 7) return 'week';
  return 'later';
}

// 한국식 날짜 라벨 ("5월 12일 (화)")
function dateLabel(dateKeyStr) {
  if (!dateKeyStr) return '';
  const [y, m, d] = dateKeyStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const dow = ['일','월','화','수','목','금','토'][dt.getDay()];
  return `${m}월 ${d}일 (${dow})`;
}

// 오늘 키
function todayKey() {
  const n = new Date();
  return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
}

// 일자(d) + 현재 캘린더 월 → dateKey
function makeDateKey(y, m, d) {
  return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
}

// 우선 로컬 캐시 로드 (오프라인 대비)
applyData(loadLocal());

let currentTab = 'calendar';

let currentFilter = 'all';

}

function nav(tab) {

  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === tab);
  });

  screen.scrollTop = 0;
}

document.querySelectorAll('.tab-btn').forEach(b => {

});

}
function dayKey(d) { return dateKey(viewYear, viewMonth, d); }

  const startOffset = monthStart.getDay();

    </div>
    <div class="header-actions">
      ${!isViewingCurrentMonth() ? `<button onclick="goToToday()" aria-label="오늘로" style="background:var(--bg-info); color:var(--text-info); padding:6px 12px; border-radius:999px; font-size:11px; font-weight:500;">오늘</button>` : ''}
      <button onclick="openAddModal()" aria-label="추가"><i class="ti ti-plus"></i></button>
    </div>
  `;

  // 모듈별 점 데이터 (사용자 입력 기반)
  function getDots(d) {
    const dots = [];
    const k = dayKey(d);
    if (workoutLog[k]?.done) dots.push('w');
    const dayExpenses = budget.expenses.filter(e => (e.dateKey === k) || (e.date === d && (!e.dateKey) && isViewingCurrentMonth()));
    if (dayExpenses.length > 0) dots.push('m');
    const dayTodos = todos.filter(t => t.dateKey === k);
    if (dayTodos.length > 0) dots.push('t');
    const activeChs = challenges.filter(c => !c.completed && c.startDate <= k);
    if (activeChs.length > 0) dots.push('c');
    return dots;
  }

  const dotColor = {
    w:'var(--text-success)',
    m:'var(--text-warning)',
    t:'var(--text-primary)',
    a:'var(--text-info)',
    c:'#9B59B6'
  };

  let html = `
    <div class="cal-weekdays">
      <span>일</span><span>월</span><span>화</span><span>수</span>
      <span>목</span><span>금</span><span>토</span>
    </div>
    <div class="cal-grid">`;

  const totalCells = Math.ceil((startOffset + daysInMonth) / 7) * 7;
  for (let i = 0; i < totalCells; i++) {
    const dayNum = i - startOffset + 1;
    if (i < startOffset || dayNum > daysInMonth) {
      html += `<div></div>`; continue;
    }
    const isToday = dayNum === today && isViewingCurrentMonth();
    const isSelected = dayNum === selectedDay && !isToday;
    const isSun = i % 7 === 0;
    const isSat = i % 7 === 6;
    const dots = getDots(dayNum).slice(0, 4).map(d => `<span class="dot" style="background:${dotColor[d]}"></span>`).join('');
    const cls = `cal-day ${isToday ? 'today' : ''} ${isSelected ? 'selected' : ''} ${isSun ? 'sun' : ''} ${isSat ? 'sat' : ''}`;
    html += `<button class="${cls}" onclick="selectDay(${dayNum})"><span class="num">${dayNum}</span><div class="dots">${dots}</div></button>`;
  }

  html += `</div>
    <div class="cal-legend">
      <span><span class="ld" style="background:var(--text-success)"></span>운동</span>
      <span><span class="ld" style="background:var(--text-warning)"></span>가계부</span>
      <span><span class="ld" style="background:var(--text-primary)"></span>할일</span>
      <span><span class="ld" style="background:#9B59B6"></span>챌린지</span>
    </div>`;

  const dow = (startOffset + selectedDay - 1) % 7;
  html += `
    <div style="display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background:var(--bg-secondary); border-radius:var(--radius-md); margin-bottom:10px;">
      <div>
        <div style="font-size:10px; color:var(--text-tertiary);">선택한 날</div>
        <div style="font-size:14px; font-weight:600;">${monthLabels[viewMonth]} ${selectedDay}일 (${dayLabels[dow]})</div>
      </div>
      <button onclick="quickAdd(${selectedDay})" style="border:none; background:var(--text-info); color:white; padding:6px 12px; border-radius:999px; font-size:11px; font-weight:500; cursor:pointer; font-family:inherit;">+ 추가</button>
    </div>
  `;

  // 필터
  html += `<div class="chips">
    <button class="chip ${currentFilter==='all'?'active':''}" onclick="filter('all')">전체</button>
    <button class="chip ${currentFilter==='todo'?'active':''}" onclick="filter('todo')">할일</button>
    <button class="chip ${currentFilter==='workout'?'active':''}" onclick="filter('workout')">운동</button>
    <button class="chip ${currentFilter==='money'?'active':''}" onclick="filter('money')">가계부</button>
    <button class="chip ${currentFilter==='challenge'?'active':''}" onclick="filter('challenge')">챌린지</button>
  </div>`;

  const events = getEventsForDay(selectedDay);
  if (events.length === 0) {
    html += `<div class="empty-state"><i class="ti ti-calendar-off"></i>이 날 기록이 없어요<br><span style="font-size:11px; opacity:0.7;">상단 + 버튼으로 추가하세요</span></div>`;
  } else {
    const filtered = events.filter(e => currentFilter === 'all' || e.type === currentFilter);
    if (filtered.length === 0) {
      html += `<div class="empty-state" style="padding:20px;"><span style="font-size:11px;">이 카테고리에 기록이 없어요</span></div>`;
    } else {
      filtered.forEach(e => {
        html += `<div class="evt evt-${e.type}" ${e.todoId !== undefined ? `onclick="toggleTodoFromCal(${e.todoId})"` : ''}>
          ${e.todoId !== undefined
            ? `<div class="evt-check ${e.done?'done':''}">${e.done?'<i class="ti ti-check"></i>':''}</div>`
            : `<i class="evt-icon ti ${e.icon}"></i>`}
          <div class="evt-body">
            <div class="title ${e.done ? 'checked' : ''}">${e.title}</div>
            <div class="sub">${e.sub}</div>
          </div>
          ${e.amount ? `<div class="evt-amount">${e.amount}</div>` : ''}
        </div>`;
      });
    }
  }

  screen.innerHTML = html;
}

function getEventsForDay(d) {
  const events = [];
  const k = dayKey(d);

  // 할일
  todos.filter(t => t.dateKey === k).forEach(t => {
    events.push({
      type: 'todo',
      title: t.title,
      sub: t.tag,
      done: t.done,
      todoId: t.id,
      amount: t.money
    });
  });

  // 운동
  const w = workoutLog[k];
  if (w?.done) {
    events.push({
      type: 'workout',
      icon: 'ti-barbell',
      title: w.note || '운동 완료',
      sub: `${w.minutes || 0}분 · ${w.kcal || 0} kcal`,
    });
  }

  // 가계부 (옛날 date 호환 + 새 dateKey 둘 다 처리)
  budget.expenses.filter(e => (e.dateKey === k) || (e.date === d && !e.dateKey && currentMonth === new Date().getMonth() && currentYear === new Date().getFullYear())).forEach(e => {
    events.push({
      type: 'money',
      icon: 'ti-wallet',
      title: e.memo || e.cat,
      sub: e.cat,
      amount: `-${Number(e.amt).toLocaleString()}원`,
    });
  });

  // 챌린지 (진행중인 챌린지의 그 날 상태)
  challenges.filter(c => !c.completed && c.startDate <= k).forEach(c => {
    const startDate = new Date(c.startDate);
    const dayD = new Date(viewYear, viewMonth, d);
    const dayDiff = Math.floor((dayD - startDate) / (24*60*60*1000)) + 1;
    if (dayDiff > c.totalDays) return;

    const check = c.checks?.[k];
    let statusText = '';
    if (check === true) statusText = '✓ 완료';
    else if (check === 'fail') statusText = '✗ 실패';
    else if (dayD <= new Date()) statusText = '미체크';
    else statusText = '예정';

    events.push({
      type: 'challenge',
      icon: c.type === 'forbidden' ? 'ti-ban' : 'ti-flag',
      title: c.title,
      sub: `${dayDiff}일차 / ${c.totalDays}일 · ${statusText}`,
    });
  });

  return events;
}

function selectDay(d) { selectedDay = d; renderCalendar(); }
function filter(f) { currentFilter = f; renderCalendar(); }

// 캘린더 월 네비게이션
function prevMonth() {
  if (viewMonth === 0) { viewMonth = 11; viewYear--; }
  else viewMonth--;
  selectedDay = 1;
  renderCalendar();
}
function nextMonth() {
  if (viewMonth === 11) { viewMonth = 0; viewYear++; }
  else viewMonth++;
  selectedDay = 1;
  renderCalendar();
}
function goToToday() {
  viewYear = currentYear;
  viewMonth = currentMonth;
  selectedDay = today;
  renderCalendar();
}

// 가계부 월 이동
let budgetViewYear, budgetViewMonth;

function prevBudgetMonth() {
  if (budgetViewMonth === 0) { budgetViewMonth = 11; budgetViewYear--; }
  else budgetViewMonth--;
  renderMoney();
}

function nextBudgetMonth() {
  if (budgetViewYear === currentYear && budgetViewMonth === currentMonth) return;
  if (budgetViewMonth === 11) { budgetViewMonth = 0; budgetViewYear++; }
  else budgetViewMonth++;
  renderMoney();
}

function openBudgetMonthPicker() {
  const monthsWithData = new Set();
  budget.expenses.forEach(e => {
    if (e.dateKey) monthsWithData.add(e.dateKey.substring(0, 7));
  });
  const currentKey = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}`;
  monthsWithData.add(currentKey);

  const sortedMonths = Array.from(monthsWithData).sort().reverse();

  let html = `
    <div class="modal">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <button class="modal-cancel" onclick="closeModal()">닫기</button>
        <h2>월 선택</h2>
        <button class="modal-save" onclick="closeModal()">완료</button>
      </div>

      <div style="font-size:12px; color:var(--text-secondary); margin-bottom:14px;">지출 내역이 있는 달만 표시돼요</div>

      <div style="display:flex; flex-direction:column; gap:6px;">`;

  sortedMonths.forEach(monthKey => {
    const [y, m] = monthKey.split('-').map(Number);
    const isCurrent = y === currentYear && m === currentMonth + 1;
    const isViewing = y === budgetViewYear && m === budgetViewMonth + 1;

    const monthExpenses = budget.expenses.filter(e => e.dateKey?.startsWith(monthKey));
    const monthTotal = monthExpenses.reduce((s, e) => s + Number(e.amt), 0);

    html += `<button onclick="jumpToBudgetMonth(${y}, ${m-1})" style="display:flex; justify-content:space-between; align-items:center; padding:14px 16px; border:0.5px solid ${isViewing ? 'var(--text-info)' : 'var(--border-tertiary)'}; border-radius:var(--radius-md); background:${isViewing ? 'var(--bg-info)' : 'white'}; cursor:pointer; font-family:inherit;">
      <div style="display:flex; flex-direction:column; align-items:flex-start; gap:2px;">
        <div style="font-size:14px; font-weight:600; color:${isViewing ? 'var(--text-info)' : 'var(--text-primary)'};">
          ${y}년 ${m}월 ${isCurrent ? '<span style="font-size:10px; color:var(--text-success);">(이번 달)</span>' : ''}
        </div>
        <div style="font-size:11px; color:var(--text-tertiary);">${monthExpenses.length}건 지출</div>
      </div>
      <div style="font-size:13px; font-weight:600; color:${isViewing ? 'var(--text-info)' : 'var(--text-primary)'};">
        ${monthTotal.toLocaleString()}원
      </div>
    </button>`;
  });

  html += `</div></div>`;
  modal.innerHTML = html;
  modal.classList.add('show');
}

function jumpToBudgetMonth(y, m) {
  budgetViewYear = y;
  budgetViewMonth = m;
  closeModal();
  renderMoney();
}

        <button class="modal-cancel" onclick="closeModal()">취소</button>
        <h2>년/월 선택</h2>
        <span></span>
      </div>

        <div id="picker-year" style="font-size:20px; font-weight:600;"></div>

          <i class="ti ti-chevron-right"></i>

function renderMonthPicker() {

function jumpToMonth(y, m) {

}

function toggleTodoFromCal(todoId) {

    saveData();
    showToast(t.done ? `"${t.title}" 완료!` : `"${t.title}" 되돌림`);

// ====== 할일 ======
function renderTodo() {
  header.innerHTML = `
    <h1>할일</h1>
    <div class="header-actions">
      <button onclick="openChallengeModal()" aria-label="챌린지 추가"><i class="ti ti-flag"></i></button>
      <button onclick="openTodoModal()" aria-label="추가"><i class="ti ti-plus"></i></button>
    </div>
  `;

  let html = '';

  // ★ 챌린지 섹션
  html += renderChallengeSection();

  const total = todos.length;
  const done = todos.filter(t => t.done).length;
  const pct = total > 0 ? Math.round((done / total) * 100) : 0;

  html += `
    <div style="display:flex; align-items:center; gap:8px; margin: 18px 0 8px;">
      <span style="font-size:14px; font-weight:600;">📋 할일</span>
    </div>

    <div style="margin: 6px 0 14px; padding:14px; border-radius:var(--radius-md); background:var(--bg-secondary);">
      <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
        <span style="font-size:12px; color:var(--text-tertiary);">진행률</span>
        <span style="font-size:12px; font-weight:600;">${done} / ${total}</span>
      </div>
      <div class="progress"><div style="width:${pct}%"></div></div>
    </div>
  `;

  const groups = [
    { key:'past', label:'⏰ 지난 일정', emoji:'⏰' },
    { key:'today', label:'오늘' },
    { key:'tomorrow', label:'내일' },
    { key:'week', label:'이번 주' },
    { key:'later', label:'예정' },
  ];

  let hasAny = false;
  groups.forEach(g => {
    // 날짜 기반 동적 분류 (group 필드 무시)
    const items = todos.filter(t => todoGroup(t.dateKey) === g.key && !t.done);
    if (items.length === 0 && g.key !== 'today') return;
    hasAny = hasAny || items.length > 0;
    const labelColor = g.key === 'past' ? 'var(--text-danger)' : (g.key === 'today' ? 'var(--text-info)' : 'var(--text-secondary)');
    const bgColor = g.key === 'past' ? 'var(--bg-danger)' : (g.key === 'today' ? 'var(--bg-info)' : 'var(--bg-secondary)');
    html += `<div style="display:flex; align-items:center; gap:6px; margin: 16px 0 8px;">
      <span style="font-size:14px; font-weight:600; color:${g.key==='past'?'var(--text-danger)':'inherit'};">${g.label}</span>
      <span style="font-size:10px; padding:2px 7px; border-radius:999px; background:${bgColor}; color:${labelColor};">${items.length}</span>
    </div>`;
    // 날짜 순 정렬 (과거는 최신부터, 미래는 가까운 순)
    items.sort((a, b) => g.key === 'past' ? b.dateKey.localeCompare(a.dateKey) : a.dateKey.localeCompare(b.dateKey));
    items.forEach(t => html += renderTodoRow(t));
    if (g.key === 'today') {
      todos.filter(t => todoGroup(t.dateKey) === 'today' && t.done).forEach(t => html += renderTodoRow(t));
    }
  });

  if (!hasAny && todos.filter(t=>!t.done).length === 0) {
    html += `<div class="empty-state"><i class="ti ti-checks"></i>할일이 없어요<br><span style="font-size:11px; opacity:0.7;">+ 버튼으로 추가하세요</span></div>`;
  }

  screen.innerHTML = html;
}

function renderTodoRow(t) {
  return `<div class="todo-row ${t.done?'done':''}" onclick="editTodo(${t.id})">
    <div class="todo-check ${t.done?'done':''}" onclick="event.stopPropagation(); toggleTodo(${t.id}, event)">
      ${t.done ? '<i class="ti ti-check"></i>' : ''}
    </div>
    <div style="flex:1; min-width:0;">
      <div class="todo-title">${t.title}</div>
      <div class="todo-meta">
        <span class="tag">${t.tag}</span>
        ${t.dateKey ? `<span class="meta-mini" style="font-size:10px;"><i class="ti ti-calendar" style="font-size:10px;"></i> ${dateLabel(t.dateKey)}</span>` : ''}
        ${t.due ? `<span class="meta-mini">~ ${t.due}</span>` : ''}
        ${t.money ? `<span class="meta-money"><i class="ti ti-wallet" style="font-size:11px;"></i> ${t.money}</span>` : ''}
      </div>
    </div>
    ${t.flag ? '<i class="ti ti-flag" style="font-size:14px; color:var(--text-danger);"></i>' : ''}
    <button class="todo-del" onclick="event.stopPropagation(); delTodo(${t.id}, event)" aria-label="삭제"><i class="ti ti-trash"></i></button>
  </div>`;
}

function editTodo(id) {
  const t = todos.find(x => x.id === id);
  if (!t) return;
  openTodoModal(null, t); // 수정 모드
}

function toggleTodo(id, e) {
  if (e) e.stopPropagation();
  const t = todos.find(x => x.id === id);
  if (t) {
    t.done = !t.done;
    saveData();
    showToast(t.done ? `"${t.title}" 완료!` : `되돌렸어요`);
  }
  renderTodo();
}

function delTodo(id, e) {
  if (e) e.stopPropagation();
  if (confirm('이 할일을 삭제할까요?')) {
    todos = todos.filter(x => x.id !== id);
    saveData();
    showToast('삭제됨');
    renderTodo();
  }
}

// ========== 챌린지 ==========

  let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin: 4px 0 10px;">
    <span style="font-size:14px; font-weight:600;">🎯 챌린지</span>
    <button onclick="openChallengeModal()" style="border:none; background:transparent; font-size:12px; color:var(--text-info); cursor:pointer; font-family:inherit; font-weight:500;">+ 추가</button>
  </div>`;

  const activeC = challenges.filter(c => !c.completed && !c.failed);
  const completedC = challenges.filter(c => c.completed);

  if (activeC.length === 0 && completedC.length === 0) {
    html += `<div style="padding:20px; background:linear-gradient(135deg, #1A1A1A 0%, #2D2D2D 100%); border-radius:12px; color:white; margin-bottom:14px;">
      <div style="font-size:13px; font-weight:600; margin-bottom:6px;">🚀 첫 챌린지를 시작해보세요!</div>
      <div style="font-size:11px; opacity:0.85; line-height:1.6; margin-bottom:12px;">
        매일 운동, 일주일 커피 끊기, 100일 책 읽기 등<br>목표를 정하면 매일 체크하고 진행률을 볼 수 있어요.
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:6px;">
        ${getChallengePresets().slice(0, 4).map(p => `
          <button onclick="quickChallenge(${JSON.stringify(p).replace(/"/g, '&quot;')})" style="padding:6px 12px; background:rgba(255,255,255,0.15); color:white; border:none; border-radius:999px; font-size:10px; cursor:pointer; font-family:inherit;">${p.title}</button>
        `).join('')}
      </div>
    </div>`;
    return html;
  }

  activeC.forEach(c => {
    html += renderChallengeCard(c);
  });

  if (completedC.length > 0) {
    html += `<div style="margin-top:14px; padding:10px 12px; background:var(--bg-secondary); border-radius:var(--radius-md); cursor:pointer; display:flex; align-items:center; justify-content:space-between;" onclick="showCompletedChallenges()">
      <span style="font-size:11px; color:var(--text-secondary);">🏆 완료한 챌린지 ${completedC.length}개</span>
      <i class="ti ti-chevron-right" style="font-size:14px; color:var(--text-tertiary);"></i>
    </div>`;
  }

  return html;
}

function renderChallengeCard(c) {
  const startDate = new Date(c.startDate);
  const todayD = new Date(currentYear, currentMonth, today);
  const daysPassed = Math.floor((todayD - startDate) / (24*60*60*1000)) + 1;
  const totalDays = c.totalDays;

  const checkedDays = Object.keys(c.checks || {}).filter(k => c.checks[k]).length;

  const tKey = dateKey(currentYear, currentMonth, today);
  const todayChecked = c.checks?.[tKey];

  // 진행률
  let progressPct = 0;
  let progressText = '';

  if (c.type === 'daily') {
    progressPct = Math.min(100, (checkedDays / totalDays) * 100);
    progressText = `${checkedDays} / ${totalDays}일`;
  } else if (c.type === 'forbidden') {
    // 금지형: 위반 안 한 일수
    const violations = Object.values(c.checks || {}).filter(v => v === 'fail').length;
    const cleanDays = daysPassed - violations;
    progressPct = Math.min(100, (cleanDays / totalDays) * 100);
    progressText = `${cleanDays} / ${totalDays}일 성공`;
  } else if (c.type === 'count') {
    progressPct = Math.min(100, (checkedDays / c.targetCount) * 100);
    progressText = `${checkedDays} / ${c.targetCount}회`;
  }

  // 색상
  const isCompleted = progressPct >= 100;
  const gradient = isCompleted
    ? 'linear-gradient(135deg, #2A4D1B 0%, #3B6D11 100%)'
    : c.type === 'forbidden'
      ? 'linear-gradient(135deg, #6B3F08 0%, #854F0B 100%)'
      : 'linear-gradient(135deg, #185FA5 0%, #2D7BC9 100%)';

  // 최근 7일 표시
  let last7Days = '';
  for (let i = 6; i >= 0; i--) {
    const d = new Date(todayD);
    d.setDate(d.getDate() - i);
    const k = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
    if (d < startDate) {
      last7Days += `<div style="flex:1; aspect-ratio:1; border-radius:50%; background:rgba(255,255,255,0.1);"></div>`;
    } else {
      const check = c.checks?.[k];
      let bg = 'rgba(255,255,255,0.2)';
      let icon = '';
      if (check === true) { bg = 'rgba(255,255,255,0.95)'; icon = `<i class="ti ti-check" style="font-size:10px; color:#2A4D1B;"></i>`; }
      else if (check === 'fail') { bg = 'rgba(255,100,100,0.6)'; icon = `<i class="ti ti-x" style="font-size:10px; color:white;"></i>`; }
      last7Days += `<div style="flex:1; aspect-ratio:1; border-radius:50%; background:${bg}; display:flex; align-items:center; justify-content:center;">${icon}</div>`;
    }
  }

  const todayBtnText = c.type === 'forbidden'
    ? (todayChecked === true ? '✓ 오늘도 성공' : todayChecked === 'fail' ? '✗ 오늘 위반' : '오늘 체크')
    : (todayChecked === true ? '✓ 오늘 완료' : '오늘 체크');

  return `<div style="margin-bottom:12px; padding:14px; border-radius:12px; background:${gradient}; color:white;">
    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
      <div style="flex:1; min-width:0;">
        <div style="font-size:14px; font-weight:600; margin-bottom:2px;">${c.title}</div>
        <div style="font-size:10px; opacity:0.85;">${c.type === 'forbidden' ? '🚫 금지' : c.type === 'count' ? '🔢 횟수' : '✅ 매일'} · ${daysPassed}일차 / ${totalDays}일</div>
      </div>
      <button onclick="event.stopPropagation(); editChallenge(${c.id})" style="border:none; background:rgba(255,255,255,0.15); color:white; padding:4px 8px; border-radius:6px; font-size:10px; cursor:pointer; font-family:inherit;">⋮</button>
    </div>

    <div style="display:flex; gap:4px; margin: 10px 0 6px;">${last7Days}</div>

    <div style="display:flex; justify-content:space-between; align-items:baseline; font-size:11px; margin-bottom:8px;">
      <span style="opacity:0.85;">최근 7일</span>
      <span style="font-weight:600;">${progressText}</span>
    </div>

    <div style="height:6px; background:rgba(255,255,255,0.2); border-radius:3px; overflow:hidden; margin-bottom:10px;">
      <div style="height:100%; width:${progressPct}%; background:rgba(255,255,255,0.95); transition:width 0.4s;"></div>
    </div>

    ${isCompleted ? `
      <div style="text-align:center; padding:8px; background:rgba(255,255,255,0.15); border-radius:8px; font-size:12px; font-weight:600;">
        🎉 챌린지 완료!
      </div>
    ` : c.type === 'forbidden' ? `
      <div style="display:flex; gap:6px;">
        <button onclick="checkChallenge(${c.id}, true)" style="flex:1; padding:8px; border:none; border-radius:6px; background:rgba(255,255,255,0.95); color:#2A4D1B; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit;">
          ✓ 오늘 성공
        </button>
        <button onclick="checkChallenge(${c.id}, 'fail')" style="flex:1; padding:8px; border:none; border-radius:6px; background:rgba(255,100,100,0.4); color:white; font-size:11px; font-weight:600; cursor:pointer; font-family:inherit;">
          ✗ 위반
        </button>
      </div>
    ` : `
      <button onclick="checkChallenge(${c.id}, ${!todayChecked})" style="width:100%; padding:10px; border:none; border-radius:6px; background:${todayChecked?'rgba(255,255,255,0.25)':'rgba(255,255,255,0.95)'}; color:${todayChecked?'white':'#185FA5'}; font-size:12px; font-weight:600; cursor:pointer; font-family:inherit;">
        ${todayBtnText}
      </button>
    `}
  </div>`;
}

function quickChallenge(preset) {
  const startDate = dateKey(currentYear, currentMonth, today);
  challenges.push({
    id: Date.now(),
    title: preset.title,
    type: preset.type,
    totalDays: preset.totalDays,
    targetCount: preset.targetCount || null,
    startDate,
    checks: {},
    completed: false,
  });
  saveData();
  showToast(`"${preset.title}" 챌린지 시작! 🚀`);
  renderTodo();
}

function checkChallenge(id, value) {
  const c = challenges.find(x => x.id === id);
  if (!c) return;
  const k = dateKey(currentYear, currentMonth, today);
  if (!c.checks) c.checks = {};

  if (value === false || value === undefined) {
    delete c.checks[k];
  } else {
    c.checks[k] = value;
  }

  saveData();
  showToast(value === true ? '체크 완료! 💪' : value === 'fail' ? '괜찮아요, 내일 다시!' : '체크 해제');
  renderTodo();
}

function fillPreset(title, type, totalDays, targetCount) {
  document.getElementById('ch-title').value = title;
  document.querySelectorAll('#ch-type .chip').forEach(x => {
    x.classList.toggle('active', x.dataset.t === type);
  });
  document.querySelectorAll('#ch-days .chip').forEach(x => {
    x.classList.toggle('active', Number(x.dataset.d) === totalDays);
  });
  // 가장 가까운 기간 선택
  if (!document.querySelector('#ch-days .chip.active')) {
    document.querySelector('#ch-days .chip').classList.add('active');
  }
  if (type === 'count') {
    document.getElementById('ch-count-field').style.display = 'block';
    document.getElementById('ch-count').value = targetCount;
  } else {
    document.getElementById('ch-count-field').style.display = 'none';
  }
  // desc 업데이트
  document.querySelector(`#ch-type .chip[data-t="${type}"]`).click();
}

function saveChallenge() {
  const title = document.getElementById('ch-title').value.trim();
  if (!title) { showToast('챌린지 이름을 입력해주세요'); return; }
  const type = document.querySelector('#ch-type .chip.active').dataset.t;
  const totalDays = Number(document.querySelector('#ch-days .chip.active').dataset.d);
  const targetCount = type === 'count' ? Number(document.getElementById('ch-count').value) : null;

  challenges.push({
    id: Date.now(),
    title, type, totalDays, targetCount,
    startDate: dateKey(currentYear, currentMonth, today),
    checks: {},
    completed: false,
  });
  saveData();
  showToast(`"${title}" 챌린지 시작! 🚀`);
  closeModal();
  renderTodo();
}
